# Auto-kehitys: agentti tekee yhden rajatun backlog-tehtävän haaralle ja avaa PR:n.
# Ei koskaan mergeä eikä deployta: master päivittyy vain ihmisen mergestä.
#
# Tilat (workflow_dispatch input "mode"):
#   koeajo  = ei agenttia. Avaa triviaalin PR:n GITHUB_TOKENilla ja todentaa PR-putken
#             (vaatii repoasetuksen Settings > Actions > General >
#             "Allow GitHub Actions to create and approve pull requests").
#   kehitys = Claude Code -agentti lukee docs/AUTO-BACKLOG.md:n, valitsee ylimmän avoimen
#             tehtävän, toteuttaa sen, ajaa worker-yksikkötestit ja avaa PR:n.
#             Vaatii secretin CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) tai ANTHROPIC_API_KEY.
#
# Ajastus kytketty 28.8.2026 (1. kehitysajo PR #3 hyväksytty). Tyhjä backlog = ajo lopettaa heti.

name: auto-kehitys

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'koeajo | kehitys'
        required: true
        default: 'koeajo'
  schedule:
    - cron: '17 1 * * 2-6'  # ti-la 01:17 UTC = 04:17 Suomen aikaa, ei ma (smoke/kausivalidointi); ei taystuntia, GitHub ohittaa niita

permissions:
  contents: write
  pull-requests: write
  actions: write   # CI:n kaynnistys agentin haaralle (workflow_dispatch)

concurrency:
  group: auto-kehitys
  cancel-in-progress: false

jobs:
  koeajo:
    if: ${{ github.event.inputs.mode == 'koeajo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Avaa triviaali PR (suljetaan mergaamatta)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "reittari-auto[bot]"
          git config user.email "actions@users.noreply.github.com"
          haara="auto/koeajo-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$haara"
          printf 'Actions-PR-putken koeajo %s. Tama PR suljetaan mergaamatta ja haara poistetaan.\n' "$(date -u +%FT%TZ)" > EGRESS-KOEAJO.md
          git add EGRESS-KOEAJO.md
          git commit -m "koeajo: Actions avaa PR:n (suljetaan mergaamatta)"
          git push -u origin "$haara"
          gh pr create --base master --head "$haara" \
            --title "koeajo: auto-kehitys PR-putki (ALA MERGAA)" \
            --body "Tekninen koeajo: todentaa etta auto-kehitys-workflow voi avata PR:n. Suljetaan mergaamatta, haara poistetaan. Ei koske tuotantoa."

  kehitys:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'kehitys' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Agentti tekee yhden tehtävän ja avaa PR:n
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --max-turns 80
            --allowedTools "Bash(git:*),Bash(gh pr create:*),Bash(node:*),Bash(npm test:*),Bash(npm run:*),Read,Edit,Write,Glob,Grep"
          prompt: |
            Olet Reittarin (lsl-aikataulut) auto-kehitysagentti. Teet YHDEN rajatun tehtävän ja avaat PR:n.
            Työskentelet repon juuressa, master on checkoutattuna.

            1. Lue docs/TUOTEPERIAATTEET.md ja docs/AUTO-BACKLOG.md.
               a) Jos Avoimet-listalla on rivi "- [ ]": valitse YLIN. Jos se on epäselvä tai vaatii
                  päätöstä jota et voi tehdä, älä koodaa: avaa PR joka muuttaa vain
                  docs/AUTO-BACKLOG.md:tä lisäämällä tehtävän alle rivin "  - ⚠️ EHDOTUS/KYSYMYS: ..."
                  ja lopeta.
               b) Jos Avoimet on tyhjä: IDEOI ENSIN. Lue TUOTEPERIAATTEET.md:n lähdejärjestys
                  (Signaalit-lohko ensin), README.md, docs/, testit ja git log -30. Kirjoita KOLME
                  backlog-riviä Avoimet-listaan järjestyksessä arvo per työmäärä, jokainen
                  TUOTEPERIAATTEET.md:n "Hyvän backlog-rivin muoto" mukaan ja sallittujen tiedostojen
                  sisällä. Merkitse jokaiseen "(agentin ehdotus <pvm>, lähde: <signaali/testi/koodi>)".
                  Signaalit-lohkon havainto, jonka muutit riviksi, merkitään "→ backlog <pvm>".
                  Jatka sitten toteuttamalla ylin näistä. PR-runkoon oma osio "Ehdotetut backlog-rivit"
                  perusteluineen, jotta ihminen voi hylätä ehdotuksen sulkemalla PR:n.
            2. Luo haara: git checkout -b auto/<pvm>-<lyhyt-aihe>.
            3. Toteuta tehtävä. Sallitut tiedostot: index.html, tests/**, worker/**, docs/AUTO-BACKLOG.md, README.md.
               KIELLETTY: docs/TUOTEPERIAATTEET.md (vain ihminen muuttaa periaatteita), sw.js:n cache-versio,
               uusien kaupunkien lisäys tai poisto CONFIGS-objektiin ja käytäväpresettien muutos ilman
               feedimittausta (olemassa olevan kaupungin sisäinen tekninen lippu, kuten vehicleRealtime, on
               sallittu), hinnat tai myyntitekstit, uudet npm-riippuvuudet, .github/**, secretit, mikä tahansa
               deploy-komento (wrangler).
               Max noin 300 muutettua riviä. Ei em dashia (—) tekstiin.
            4. Todenna: aja worker-yksikkötestit
               (cd worker && node webpush.test.js && node push-logic.test.js && node email-logic.test.js).
               Jos muutit tests/smoke.test.js:ää, tarkista syntaksi: node --check tests/smoke.test.js
               (selainsmoke ei ole ajettavissa täällä; CI ajaa sen PR:lle automaattisesti).
               Jos muutit index.html:n skriptiä, poimi skriptilohko ja aja sille node --check.
            5. Merkitse tehtävä backlogissa "- [x]" ja lisää perään " (PR, <pvm>)".
            6. Committaa (git config user.name "reittari-auto[bot]", user.email "actions@users.noreply.github.com"),
               pushaa haara ja avaa PR: gh pr create --base master --title "auto: <aihe>" --body jossa on
               Mitä / Miksi (backlog-rivi) / Miten todennettu / Mitä EI tehty / Riskit.
            7. ÄLÄ mergaa, älä pushaa masteriin, älä koske muihin backlog-riveihin.

      # GITHUB_TOKENilla avattu PR ei laukaise pull_request-tapahtumaa, joten CI kaynnistetaan
      # erikseen agentin haaralle. Tarkistukset nakyvat PR:ssa head-SHA:n kautta.
      - name: Käynnistä CI agentin haaralle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          haara=$(gh pr list --state open --search "head:auto/" --json headRefName,createdAt             --jq 'sort_by(.createdAt) | last | .headRefName')
          if [ -z "$haara" ] || [ "$haara" = "null" ]; then echo "Ei uutta auto/-PR:ää, CI:tä ei käynnistetä."; exit 0; fi
          gh workflow run ci.yml --ref "$haara" && echo "CI käynnistetty haaralle $haara"

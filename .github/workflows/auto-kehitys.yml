# Auto-kehitys: agentti tekee yhden rajatun backlog-tehtävän haaralle ja avaa PR:n.
# Ei koskaan mergeä eikä deployta: master päivittyy vain ihmisen mergestä.
#
# Tilat (workflow_dispatch input "mode"):
#   koeajo  = ei agenttia. Avaa triviaalin PR:n GITHUB_TOKENilla ja todentaa PR-putken
#             (vaatii repoasetuksen Settings > Actions > General >
#             "Allow GitHub Actions to create and approve pull requests").
#   kehitys = Claude Code -agentti lukee docs/AUTO-BACKLOG.md:n, valitsee lukitun tai suurimman
#             pisteen avoimen tehtävän (docs/TUOTEPERIAATTEET.md, Pisteet ja mittari), toteuttaa sen,
#             ajaa worker-yksikkötestit ja avaa PR:n, jonka kuvaus alkaa riskiluokalla ja mittarilla.
#             Vaatii secretin CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) tai ANTHROPIC_API_KEY.
#
# Ajastus kytketty 28.8.2026 (1. kehitysajo PR #3 hyväksytty). Tyhjä backlog = ajo lopettaa heti.

name: auto-kehitys

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'koeajo | kehitys'
        required: true
        default: 'koeajo'
  schedule:
    - cron: '17 1 * * 2-6'  # ti-la 01:17 UTC = 04:17 Suomen aikaa, ei ma (smoke/kausivalidointi); ei taystuntia, GitHub ohittaa niita

permissions:
  contents: write
  pull-requests: write
  actions: write   # CI:n kaynnistys agentin haaralle (workflow_dispatch)

concurrency:
  group: auto-kehitys
  cancel-in-progress: false

jobs:
  koeajo:
    if: ${{ github.event.inputs.mode == 'koeajo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Avaa triviaali PR (suljetaan mergaamatta)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "reittari-auto[bot]"
          git config user.email "actions@users.noreply.github.com"
          haara="auto/koeajo-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$haara"
          printf 'Actions-PR-putken koeajo %s. Tama PR suljetaan mergaamatta ja haara poistetaan.\n' "$(date -u +%FT%TZ)" > EGRESS-KOEAJO.md
          git add EGRESS-KOEAJO.md
          git commit -m "koeajo: Actions avaa PR:n (suljetaan mergaamatta)"
          git push -u origin "$haara"
          gh pr create --base master --head "$haara" \
            --title "koeajo: auto-kehitys PR-putki (ALA MERGAA)" \
            --body "Tekninen koeajo: todentaa etta auto-kehitys-workflow voi avata PR:n. Suljetaan mergaamatta, haara poistetaan. Ei koske tuotantoa."

  kehitys:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'kehitys' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # ENINTÄÄN KAKSI AVOINTA AUTO-PR:ÄÄ (7.10.2026). Yhden PR:n portti esti toiston, mutta pysäytti
      # silmukan aina katselmoinnin ajaksi: 6.-7.10. agentti ajoi joka aamu ja lopetti tekemättä mitään.
      # Toisto estetään nyt rivitasolla: avoimien auto-PR:ien haaroilla rastitetut backlog-rivit luetaan
      # tässä ja annetaan agentille varattuina. Rinnakkaisena (yksi PR jo auki) agentti tekee vain valmiin
      # rivin eikä ideoi, koska ideointi lisää rivejä Avoimet-listan alkuun ja törmäisi toisen PR:n muutokseen.
      # Historia: yksi avoin auto-PR kerrallaan. Ilman sitä agentti valitsi joka ajolla saman
      # AUTO-BACKLOG.md:n ylimmän avoimen rivin: rivi rastitetaan vain PR:n haaralla, joten
      # masterissa se on yhä auki kunnes ihminen mergeää. Tulos 1.-3.9.2026 oli kolme
      # identtistä PR:ää samasta README-tehtävästä, yksi per ajopäivä, ja tahti oli yksi
      # turha PR joka arkipäivä. Portti pysäyttää sen: kasautunut työ käsitellään ensin.
      - name: Avoimet auto-PR:t ja niiden varaamat backlog-rivit
        id: avoin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Listaus + suodatus, EI --search: haku nojaa GitHubin indeksiin joka laahaa.
          haarat=$(gh pr list --state open --limit 100 --json headRefName \
            --jq '.[] | select(.headRefName | startswith("auto/")) | .headRefName')
          maara=$(printf '%s\n' "$haarat" | grep -c . || true)
          # Rivit, jotka avoin haara rastittaa ("- [ ]" masterissa -> "- [x]" haaralla), ovat varattuja.
          varatut=""
          for h in $haarat; do
            git fetch -q --depth 1 origin "$h"
            r=$(git diff HEAD FETCH_HEAD -- docs/AUTO-BACKLOG.md | sed -n 's/^+- \[x\] //p' | tr -d '\r' | cut -c1-160)
            if [ -n "$r" ]; then varatut="$varatut$r"$'\n'; fi
          done
          if [ "$maara" -lt 2 ]; then saa=true; else saa=false; fi
          # Tuplan esto (9.10.2026): savikurki-ajastin (Cloudflare Worker) käynnistää tämän työnkulun ti-la ajallaan
          # workflow_dispatchilla. GitHubin oma schedule jää varalle, mutta myöhästyessään (5-7 h) se tulisi samana
          # päivänä perään ja agentti tekisi toisen PR:n. Schedule-ajo ohitetaan, jos saman UTC-päivän dispatch-ajo on jo.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            tanaan=$(date -u +%F)
            jo=$(gh run list --workflow auto-kehitys.yml --event workflow_dispatch --limit 20 --json createdAt \
              --jq "[.[] | select(.createdAt | startswith(\"$tanaan\"))] | length")
            if [ "${jo:-0}" -gt 0 ]; then
              saa=false
              echo "Ajastin käynnisti tämän päivän ajon jo ($jo kpl), GitHubin myöhästynyt schedule-ajo ohitetaan."
            fi
          fi
          {
            echo "maara=$maara"
            echo "saa=$saa"
            echo "varatut<<VARATUT_EOF"
            printf '%s' "$varatut"
            echo "VARATUT_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Avoimia auto-PR:iä $maara, uusi tehtävä sallittu: $saa"
          printf 'Varatut rivit:\n%s' "$varatut"

      - name: Agentti tekee yhden tehtävän ja avaa PR:n
        if: steps.avoin.outputs.saa == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --max-turns 80
            --allowedTools "Bash(git:*),Bash(gh pr create:*),Bash(node:*),Bash(npm test:*),Bash(npm run:*),Read,Edit,Write,Glob,Grep"
          prompt: |
            Olet Reittarin (lsl-aikataulut) auto-kehitysagentti. Teet YHDEN rajatun tehtävän ja avaat PR:n.
            Työskentelet repon juuressa, master on checkoutattuna.

            0. Avoimia auto-PR:iä on nyt ${{ steps.avoin.outputs.maara }}. Rivit, joita ne jo toteuttavat
               (VARATUT: älä valitse, älä muokkaa):
               ${{ steps.avoin.outputs.varatut || '(ei varattuja rivejä)' }}
               Jos avoimia auto-PR:iä on 1: valitse kohdan 1 b järjestyksellä rivi, joka ei ole VARATUT-listalla.
               Jos sellaista ei ole, ÄLÄ ideoi äläkä luo haaraa tai PR:ää: lopeta ja kerro syy lokiin.
            1. Lue docs/TUOTEPERIAATTEET.md ja docs/AUTO-BACKLOG.md.
               a) JATKUVA IDEOINTI (ylläpitäjän linjaus 2026-10-08: tuotekehitys on itsekin automaatiota): jos avoimia
                  auto-PR:iä on 0 ja Avoimet-listalla on alle KOLME avointa "- [ ]"-riviä, IDEOI ENSIN. Lue
                  TUOTEPERIAATTEET.md:n luku "Tuotekehityksen suunta" ja lähdejärjestys (Signaalit-lohko ensin),
                  README.md, docs/, testit ja git log -30. Kirjoita KOLME backlog-riviä Avoimet-listan LOPPUUN
                  (avointen rivien jälkeen, ennen otsikkoa "## Tehdyt"), jokainen TUOTEPERIAATTEET.md:n "Hyvän
                  backlog-rivin muoto" mukaan ja sallittujen tiedostojen sisällä. Jokaisen rivin loppuun Pisteet- ja
                  Mittari-kenttä saman luvun "Pisteet ja mittari" mukaan: pisteet konservatiivisesti, myynti 3 vain
                  Signaalit-lohkon kunnan tai ostajan kysymyksestä ja 2 vain HILMA- tai markkinavuoropuhelusignaalista,
                  mittarin lähde jo olemassa ja tarkistuspäivä noin 30 päivän päähän. Älä merkitse riviä (lukittu).
                  Vähintään yksi kolmesta osuu "Tuotekehityksen suunta" -luvun teemaan. Merkitse jokaiseen
                  "(agentin ehdotus <pvm>, lähde: <teema/signaali/testi/koodi>)". Signaalit-lohkon havainto, jonka
                  muutit riviksi, merkitään "→ backlog <pvm>". PR-runkoon oma osio "Ehdotetut backlog-rivit"
                  perusteluineen, jotta ihminen voi hylätä ehdotuksen sulkemalla PR:n.
               b) Valitse sitten tehtävä Avoimet-listan "- [ ]"-riveistä, jotka eivät ole VARATUT, tässä järjestyksessä:
                  (1) rivit, joiden Pisteet-kentässä on "(lukittu)", listan järjestyksessä; (2) muuten suurin piste
                  2 × arvo + kiire + myynti - työ (S 0, M 1, L 2), laskettuna Pisteet-kentän osista; (3) tasapelissä
                  ylempi rivi. Rivi, joka edellyttää toista avointa riviä, odottaa sitä. Jos riviltä puuttuu
                  Pisteet-kenttä, pisteytä se vain valintaa varten (älä kirjoita riviin) ja kerro arvio PR:n rungossa.
                  Älä muuta muiden rivien pisteitä etkä mittareita. Jos valittu rivi on epäselvä tai vaatii
                  päätöstä jota et voi tehdä, älä koodaa: avaa PR joka muuttaa vain
                  docs/AUTO-BACKLOG.md:tä lisäämällä tehtävän alle rivin "  - ⚠️ EHDOTUS/KYSYMYS: ..."
                  ja lopeta.
            2. Luo haara: git checkout -b auto/<pvm>-<lyhyt-aihe>.
            3. Toteuta tehtävä. Sallitut tiedostot: index.html, tests/**, worker/**, docs/AUTO-BACKLOG.md, README.md.
               KIELLETTY: docs/TUOTEPERIAATTEET.md (vain ihminen muuttaa periaatteita), sw.js:n cache-versio,
               uusien kaupunkien lisäys tai poisto CONFIGS-objektiin ja käytäväpresettien muutos ilman
               feedimittausta (olemassa olevan kaupungin sisäinen tekninen lippu, kuten vehicleRealtime, on
               sallittu), hinnat tai myyntitekstit, uudet npm-riippuvuudet, .github/**, secretit, mikä tahansa
               deploy-komento (wrangler).
               Max noin 300 muutettua riviä. Ei em dashia (—) tekstiin.
            4. Todenna: aja worker-yksikkötestit
               (cd worker && node webpush.test.js && node push-logic.test.js && node email-logic.test.js).
               Jos muutit tests/smoke.test.js:ää, tarkista syntaksi: node --check tests/smoke.test.js
               (selainsmoke ei ole ajettavissa täällä; CI ajaa sen PR:lle automaattisesti).
               Jos muutit index.html:n skriptiä, poimi skriptilohko ja aja sille node --check.
            5. Merkitse tehtävä backlogissa "- [x]" ja lisää perään " (PR, <pvm>)".
            6. Committaa (git config user.name "reittari-auto[bot]", user.email "actions@users.noreply.github.com"),
               pushaa haara ja avaa PR: gh pr create --base master --title "auto: <aihe>" --body, jonka
               ENSIMMÄINEN rivi on täsmälleen "Riskiluokka: docs", "Riskiluokka: testi", "Riskiluokka: koodi" tai
               "Riskiluokka: julkaiseva" ja TOINEN rivi tehdyn backlog-rivin Mittari-kenttä sellaisenaan yhdelle
               riville ("Mittari: ... · tarkistus <pvm>", tai "Mittari: puuttuu rivistä"). Sen jälkeen tyhjä rivi ja
               Mitä / Miksi (backlog-rivi ja sen piste) / Miten todennettu / Mitä EI tehty / Riskit.
               Riskiluokka määräytyy PR:n kaikista muutetuista tiedostoista (git diff --name-only origin/master...HEAD):
               docs = vain docs/** ja README.md; testi = vain tests/** (ja docs); koodi = mikä tahansa muu tiedosto;
               julkaiseva = PR muuttaa tiedostoa, jonka GitHub Pages julkaisee sovelluksena heti mergen jälkeen, eli
               mitä tahansa muuta kuin tests/**, worker/**, tools/**, README.md tai docs/** (docs/muutosvahti/** on
               sovelluksen dataa ja siis julkaiseva). index.html on aina julkaiseva. worker/** on koodi, koska worker
               julkaistaan käsin. Julkaiseva PR on aina myös koodia; epävarmassa tapauksessa valitse korkeampi luokka.
            7. ÄLÄ mergaa, älä pushaa masteriin, älä koske muihin backlog-riveihin.

      # GITHUB_TOKENilla avattu PR ei laukaise pull_request-tapahtumaa, joten CI kaynnistetaan
      # erikseen agentin haaralle. Tarkistukset nakyvat PR:ssa head-SHA:n kautta.
      - name: Käynnistä CI agentin haaralle
        if: steps.avoin.outputs.saa == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Haaran nimi luetaan TYÖPUUSTA, ei hausta. Vanha versio käytti
          # "gh pr list --search head:auto/" ja poimi uusimman createdAt:n mukaan, mutta
          # hakuindeksi laahaa sekunteja: 3.9.2026 se palautti edellisen päivän haaran,
          # jolloin CI ajettiin väärälle haaralle ja uusin PR jäi kokonaan ilman
          # tarkistuksia (ajo 33720438804 vs. PR #17 action_required, 0 s).
          haara=$(git rev-parse --abbrev-ref HEAD)
          case "$haara" in
            auto/*) ;;
            *) echo "HEAD ei ole auto/-haaralla ($haara): agentti ei luonut haaraa, CI:tä ei käynnistetä."; exit 0 ;;
          esac
          if ! git ls-remote --exit-code --heads origin "$haara" >/dev/null 2>&1; then
            echo "Haaraa $haara ei ole originissa: agentti ei pushannut, CI:tä ei käynnistetä."; exit 0
          fi
          gh workflow run ci.yml --ref "$haara" && echo "CI käynnistetty haaralle $haara"

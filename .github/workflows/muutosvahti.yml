# Muutosvahti: viikoittainen ajo joka laskee jokaiselle kaupungin pysäkille julisteen
# sisällön tunnisteen ja kertoo mitkä julisteet ovat vanhentuneet tai vanhenemassa
# (tests/muutosvahti.js). Tulos committoidaan docs/muutosvahti/*.json, josta sovellus
# lukee sen tulostekeskuksen Muutosvahti-välilehdelle ja etusivun nostoon.
#
# KIINTIÖKURI: pelkkiä GraphQL-kutsuja aliasnipuissa, tauot kyselyjen välissä. Ajastus eri
# päivälle kuin Tuotanto-smoke (ma/to) ja Kausivalidointi (ti): sunnuntaiaamu.
# Datacommit ei laukaise CI:tä (ci.yml paths-ignore), koska koodi ei muutu.
# 3.10.2026: master on suojattu (vain PR:llä, auditointi R-12), joten tulos viedään data-haarana PR:ksi ja
# yhdistetään heti. GITHUB_TOKENilla ei ole ohitusoikeutta, jottei auto-kehitysagentti voi pushata masteriin.
name: Muutosvahti

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0" # su 03:00 UTC = 06:00 Suomen kesäaikaa

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: muutosvahti
  cancel-in-progress: false

jobs:
  muutosvahti:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Aja muutosvahti (kaikki CONFIGS-kaupungit)
        run: |
          set -o pipefail
          node tests/muutosvahti.js 2>&1 | tee muutosvahti-loki.txt || true
      - name: Yhteenveto
        if: always()
        run: |
          echo '## Muutosvahti' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(OK|INFO|FAIL|YHTEENVETO)" muutosvahti-loki.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Committaa tulos PR:nä ja yhdistä (vain docs/muutosvahti)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "muutosvahti"
          git config user.email "muutosvahti@users.noreply.github.com"
          git add docs/muutosvahti
          if git diff --cached --quiet; then echo "ei muutoksia"; exit 0; fi
          paiva="$(date -u +%Y-%m-%d)"
          haara="data/muutosvahti-${paiva}-${GITHUB_RUN_ID}"
          git switch -c "$haara"
          git commit -m "data(muutosvahti): viikkoajo ${paiva}"
          git push -u origin "$haara"
          gh pr create --base master --head "$haara" --title "data(muutosvahti): viikkoajo ${paiva}" --body "Muutosvahdin viikkoajo ${GITHUB_RUN_ID}: vain docs/muutosvahti. Yhdistetään automaattisesti."
          gh pr merge "$haara" --squash --delete-branch
      - name: Arkistoi loki
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muutosvahti-loki
          path: muutosvahti-loki.txt
          retention-days: 90

      # Healthchecks.io (14.10.2026): ping ajon lopussa, /fail jos jokin askel epäonnistui. Vain ajastettu ajo pingaa: käsiajo muuna päivänä voi päättyä punaiseen ilman löydöstä.
      # Valvonnan aikataulu ja hälytys ovat Healthchecksissä (strategiarepo tools/healthchecks/). Puuttuva secret ei kaada ajoa.
      - name: Healthchecks-ping
        if: always() && github.event_name == 'schedule'
        env:
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
          TILA: ${{ job.status }}
        run: |
          if [ -z "$HC_PING_KEY" ]; then echo "::warning::HC_PING_KEY puuttuu, ping ohitetaan."; exit 0; fi
          polku=""; [ "$TILA" = "success" ] || polku="/fail"
          curl -fsS -m 10 --retry 3 -o /dev/null "https://hc-ping.com/$HC_PING_KEY/lsl-aikataulut-muutosvahti$polku" || echo "::warning::Healthchecks-ping epäonnistui."

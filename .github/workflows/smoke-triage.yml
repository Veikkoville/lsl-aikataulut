# Smoke-triage: punainen Tuotanto-smoke luetaan automaattisesti ja luokitellaan.
#
# MIKSI: 31.8.2026 punainen ajo (11 FAILia, kaikki Mikkelissa) oli kokonaan
# Digitransitin kiintiota (429), mutta raportti nimesi juurisyiksi sisaltovikoja.
# Punainen ajo jai lisaksi odottamaan etta ihminen avaa lokin. Tama workflow lukee
# raportin heti ja tekee yhden asian: joko toteaa kuormaksi (ei tikettia) tai avaa
# YHDEN issuen juurisyysta.
#
# 3.9.2026 (issue #18): kuorma nakyi pelkkina AIKAKATKAISUINA ilman yhtaan 429:aa, koska
# prod-smoke ja CI ajoivat samaan aikaan samaa Digitransit-rajapintaa vasten. Pelkka
# 429-saanto luokitteli sen aidoksi viaksi. Siksi aikakatkaisu on kuormaa, jos smoke-ajon
# aikana oli rinnakkainen ajo ja edellinen smoke oli vihrea (kohta 2b).
#
# EI KOSKAAN: ei koodimuutosta, ei PR:aa, ei mergea, ei deployta. Token saa vain
# lukea repon ja kirjoittaa issueita.
#
# Kustannus: julkinen repo = ilmaiset Actions-minuutit. Agentti ajaa
# CLAUDE_CODE_OAUTH_TOKENilla eli Max-tilauksen kiintiosta, ei API-laskutuksesta.

name: smoke-triage

on:
  workflow_run:
    workflows: ["Tuotanto-smoke"]
    types: [completed]
  # Kasin: luokittele annettu (mennyt) Tuotanto-smoke-ajo uudelleen, esim. saannon muutoksen jalkeen.
  workflow_dispatch:
    inputs:
      run_id:
        description: "Tuotanto-smoke-ajon id"
        required: true

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: smoke-triage-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  triage:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMOKE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
    steps:
      # Kaatuneen ajon OMA commit, ei repon nykyista masteria (25.9.2026: kasiajossa 24.9. ajolle
      # agentti luki jo korjatun testin ja paatteli sen perusteella vaarin, mita ajossa tapahtui).
      - name: Selvita kaatuneen ajon commit
        id: ajo
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh run view "$SMOKE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.ajo.outputs.sha }}

      # Raportit tulevat siita ajosta joka kaatui, eivat tasta ajosta.
      # if-no-files-found ei riita: jos smoke kaatui ennen arkistointia, jatketaan
      # ilman tiedostoja ja agentti lukee lokin.
      - name: Hae kaatuneen ajon raportit
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.SMOKE_RUN_ID }}
          github-token: ${{ github.token }}
          pattern: prod-smoke-report-*
          path: raportit
          merge-multiple: true

      - name: Luokittele ja avaa tarvittaessa issue
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 50
            --allowedTools "Read,Grep,Glob,Bash(ls:*),Bash(cat:*),Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh issue comment:*),Bash(gh run view:*),Bash(gh run list:*)"
          prompt: |
            Tuotanto-smoke kaatui. Luokittele syy ja tee KORKEINTAAN yksi asia: avaa issue tai ala avaa.
            Ajo: https://github.com/${{ github.repository }}/actions/runs/${{ env.SMOKE_RUN_ID }} (id ${{ env.SMOKE_RUN_ID }}). Tyohakemisto on kaatuneen ajon commitissa ${{ steps.ajo.outputs.sha }}, eli testikoodi on sama kuin ajossa; nykyinen master voi olla muuttunut. Raportit ovat kansiossa raportit/ (prod-smoke-report-era*.txt ja .json).
            Jos kansio on tyhja, lue loki: gh run view ${{ env.SMOKE_RUN_ID }} --log-failed.

            ET saa muuttaa yhtaan tiedostoa, avata PR:aa, mergata mitaan etka ajaa mitaan deployta.
            Ainoa sallittu kirjoitustoimi on GitHub-issue.

            0. Tarkista ensin MIKA job kaatui: gh run view ${{ env.SMOKE_RUN_ID }}.
               Tuotanto-smoke sisaltaa kaksi eri vahtia: prod-smoke (erat, JSON-raportit) ja
               full-smoke-prod (koko smoke-sarja tuotantoa vasten, EI JSON-raporttia).
               Jos full-smoke-prod kaatui, lue sen FAIL-rivit lokista:
               gh run view ${{ env.SMOKE_RUN_ID }} --log-failed (rivit muotoa "FAIL <tarkistus>: <detail>",
               konsolivirheet sisennettyina riveina "FAIL konsolivirheita:"-rivin alla).
               Luokittele ne SAMOILLA saannoilla kuin kohdassa 2 ja kasittele kuten eran FAILit
               (kohdat 2c-4). Issuen otsikon kaupungiksi "full-smoke", ellei FAIL-rivi nimea kaupunkia.
               MIKSI (25.9.2026): ennen tama kohta ohitti kaikki pelkan full-smoke-prodin kaatumiset
               ajoituskohinana, eika kukaan ajanut niita uudelleen: 24.9. "kayttoehdot (fi): nakyma vajaa"
               oli testin ajoitusvika ja jai huomaamatta. full-smoke-prod ajetaan nyt erien jalkeen,
               ei rinnakkain, joten sen punainen ilman 429:aa on ehdokas aidoksi viaksi.
            1. Lue jokaisen eran JSON. Kentta quotaCollapsed kertoo mitka kaupungit tiivistettiin
               kiintion (429) takia, retriedCities kertoo uusinnat.
            2. LUOKITTELU. FAIL on kuormaa jos sen check on "kiintio (429)" tai sen detail sisaltaa
               luvun 429. Kaikki muut FAILit ovat ehdokkaita aidoksi viaksi.
               a) 429 on aina kuormaa. Kiintioloppu ei ole vika koodissa.
               b) AIKAKATKAISU voi olla kuormaa ilman 429:aa (3.9.2026, issue #18: prod-smoke ja CI
                  ajoivat samaan aikaan, vika nakyi vain aikakatkaisuina). Aikakatkaisu-FAIL tunnistetaan
                  detailista: "N s kuluessa", "ei latautunut", "ei muodostunut", "ei syntynyt",
                  "ei renderoitynyt", "ei tullut", "printed:false", "ei valmistunut". Sisaltovirhe
                  ("taulukko pielessa", "kaavio vajaa", "ilman selitetta", vaarat arvot, konsolivirhe)
                  EI ole aikakatkaisu vaan ehdokas aidoksi viaksi.
                  Aikakatkaisu on kuormaa vain jos MOLEMMAT ehdot toteutuvat:
                  - rinnakkainen ajo: gh run view <smoke-id> --json createdAt,updatedAt antaa smoke-ajon
                    ikkunan, ja gh run list --limit 30 --json name,status,conclusion,createdAt,updatedAt
                    nayttaa toisen ajon (CI, auto-kehitys, Muutosvahti, Uusintapainatusvahti tai toinen
                    Tuotanto-smoke) joka oli kaynnissa samassa ikkunassa
                  - edellinen Tuotanto-smoke oli vihrea: gh run list --workflow prod-smoke.yml --limit 5
                    nayttaa edellisen valmistuneen ajon conclusion=success
                  Jos jompikumpi ehto ei tayty, aikakatkaisu on ehdokas aidoksi viaksi.
               c) Jos KAIKKI FAILit ovat kuormaa (429 tai b-kohdan aikakatkaisu): ALA avaa issuea.
                  Tulosta lokiin yksi rivi "KUORMA (<429|aikakatkaisu rinnakkain: ajon nimi>): <kaupungit>, ei tikettia"
                  ja lopeta.
               d) Jos yksikin FAIL ei ole kuormaa: jatka kohtaan 3.
            3. Tarkista onko sama vika jo tiedossa:
               gh issue list --state open --search "smoke:" --json number,title
               Jos avoin issue kasittelee samaa tarkistusta samassa kaupungissa, lisaa siihen
               kommentti (ajon linkki + mika muuttui) ALAKA avaa uutta.
            4. Muuten avaa YKSI issue:
               otsikko: "smoke: <kaupunki> <tarkistus> (<pvm>)"
               runko: Mika kaatui (tarkistus- ja kaupunkikohtaisesti) / Onko regressio vai kuormaa
               ja mihin paattelet sen / Milloin sama tarkistus oli viimeksi vihrea jos loydat sen
               lokeista / Ehdotettu backlog-rivi docs/AUTO-BACKLOG.md:n Avoimet-listalle
               TUOTEPERIAATTEET.md:n muodossa / Ajon linkki.
               Ala arvaa juurisyyta. Jos et pysty erottamaan kuormaa sisaltovirheesta, sano se
               issuessa suoraan ja ehdota yhden kaupungin kasiajoa
               (SMOKE_CITIES=<kaupunki> BASE=https://demo.reittari.fi node prod-smoke.test.js).
            5. Ala kayta em dashia. Kirjoita suomeksi ja lyhyesti.

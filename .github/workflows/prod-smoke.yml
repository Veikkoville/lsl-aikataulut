# Tuotanto-smoke-vahti: read-only regressiovahti demo.reittari.fi:tä vasten.
# Failaava ajo = punainen run → GitHub lähettää sähköposti-ilmoituksen automaattisesti.
# Ei salaisuuksia: julkinen tuotanto-URL, data kulkee samaa worker-proxyä kuin selaimessa.

name: Tuotanto-smoke

on:
  workflow_dispatch:
  schedule:
    # Viikoittainen vahti: maanantaisin 04:00 UTC (07:00 Suomen kesäaikaa)
    - cron: "0 4 * * 1"
    # ⚠️ TALVIFEED-IKKUNA: päivittäin 8.–15.8. klo 04:00 UTC. LSL:n talvifeed vaihtuu
    # 10.8.2026 ja KOUL/LOMA-validointi on 12.8.2026 — tihennetty ajo vahtii vaihtoa.
    # POISTA TÄMÄ RIVI ikkunan jälkeen (elokuun 2026 lopussa): cron ei tunne vuotta,
    # joten rivi laukeaisi uudelleen joka elokuu (2027, 2028, ...).
    - cron: "0 4 8-15 8 *"

permissions:
  contents: read

jobs:
  # Ydinvahti: per-kaupunki-invariantit (16 kaupunkia), oma kevyt skripti.
  #
  # ERAAJO (10.8.2026): Digitransitin kiintio ei kanna 16 kaupunkia yhdella istumalla.
  # Mitattu samana paivana: tauko 4 s -> 23 FAILia, tauko 20 s + 90 s uusintajaahdytys
  # -> 8 FAILia, ja kaatuvat kaupungit vaihtuivat joka ajolla listan loppupaassa eli
  # kiintio kuluu kumulatiivisesti. Siksi ajo on jaettu kahteen 8 kaupungin eraan.
  # max-parallel: 1 on OLENNAINEN - rinnakkain ajettuna erat kuluttaisivat saman
  # kiintion yhta aikaa eika mikaan olisi muuttunut. Era 2 odottaa lisaksi 4 min.
  # fail-fast: false, jotta eran 1 punainen ei estaisi eraa 2 ajautumasta.
  #
  # Aikaraja 45 min: era kestaa noin 13 min + eran 2 alkuviive.
  prod-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - era: 1
            cities: "lahti,kuopio,salo,kajaani,vaasa,kotka,raasepori,kouvola"
            delay: "0"
          - era: 2
            cities: "mikkeli,hameenlinna,joensuu,jyvaskyla,lappeenranta,oulu,pori,rovaniemi"
            delay: "240000"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Asenna testiriippuvuudet
        run: npm ci
        working-directory: tests

      - name: Aja tuotanto-smoke (erä ${{ matrix.era }}/2, 8 kaupunkia, read-only)
        run: node prod-smoke.test.js
        working-directory: tests
        env:
          BASE: https://demo.reittari.fi
          SMOKE_CITIES: ${{ matrix.cities }}
          SMOKE_START_DELAY_MS: ${{ matrix.delay }}
          SMOKE_REPORT_SUFFIX: -era${{ matrix.era }}

      - name: Arkistoi raportti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-report-era${{ matrix.era }}
          path: |
            tests/prod-smoke-report-era${{ matrix.era }}.txt
            tests/prod-smoke-report-era${{ matrix.era }}.json

  # Syvä kattavuus: koko olemassa oleva smoke-sarja ajetaan tuotantoa vasten
  # (BASE-parametrisoitu). Erillinen job, jotta mahdollinen flake ei sotke
  # ydinvahdin signaalia — punainen prod-smoke on aina tutkittava, punainen
  # full-smoke voi olla ajoituskohinaa (re-run ensin).
  full-smoke-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Asenna testiriippuvuudet
        run: npm ci
        working-directory: tests

      - name: Aja koko smoke-sarja tuotantoa vasten
        run: npm test
        working-directory: tests
        env:
          BASE: https://demo.reittari.fi

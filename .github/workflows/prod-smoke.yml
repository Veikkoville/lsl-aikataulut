# Tuotanto-smoke-vahti: read-only regressiovahti demo.reittari.fi:tä vasten.
# Failaava ajo = punainen run → GitHub lähettää sähköposti-ilmoituksen automaattisesti.
# Ei salaisuuksia: julkinen tuotanto-URL, data kulkee samaa worker-proxyä kuin selaimessa.

name: Tuotanto-smoke

on:
  workflow_dispatch:
  schedule:
    # Erä 1 (tiivis seuranta) maanantaisin 04:00 UTC (07:00 Suomen kesäaikaa)
    - cron: "0 4 * * 1"
    # Erä 2 (laaja kattavuus) torstaisin 18:00 UTC (21:00 Suomen kesäaikaa).
    # ILTA ON TARKOITUKSELLINEN: 10.8. klo 17:43 UTC ajo oli täysin vihreä samalla
    # kuormalla joka kaatui aamulla, ja 04:00 UTC on sama minuutti kuin eran 1
    # ajo → aamuun sijoitettuna erät kuluttaisivat kiintiötä yhtä aikaa kahdessa
    # rinnakkaisessa RUNissa, mitä max-parallel EI estä (se koskee vain saman runin matriisia).
    - cron: "0 18 * * 4"

permissions:
  contents: read

jobs:
  # Valitsee ajettavat erat laukaisimen mukaan. Ilman tata jokainen ajastus ajaisi
  # kaikki 16 kaupunkia, mika on juuri se kuorma joka ei mahdu kiintioon (ks. alla).
  valitse-erat:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.valinta.outputs.matrix }}
    steps:
      - name: Valitse erät laukaisimen mukaan
        id: valinta
        env:
          LAUKAISIN: ${{ github.event.schedule }}
        run: |
          # Era 1 = tiiviin seurannan kaupungit, era 2 = loput. Jasenyys ei noudata
          # CONFIG-jarjestysta vaan seurantatarvetta, ja se paivitetaan kasin tarpeen
          # mukaan. Tekninen ehto: kumpikin erä pysyy alle kiintiörajan yksin ajettuna.
          era1='{"era":1,"cities":"lahti,kuopio,vaasa,raasepori,kouvola,mikkeli","delay":"0"}'
          era2='{"era":2,"cities":"salo,kajaani,kotka,hameenlinna,joensuu,jyvaskyla,lappeenranta,oulu,pori,rovaniemi,turku,inkoo","delay":"0"}'
          era2_viiveella='{"era":2,"cities":"salo,kajaani,kotka,hameenlinna,joensuu,jyvaskyla,lappeenranta,oulu,pori,rovaniemi,turku,inkoo","delay":"600000"}'
          case "$LAUKAISIN" in
            # Torstai-ilta: era 2 yksin.
            "0 18 * * 4") mukaan="[$era2]" ;;
            # Tyhja = workflow_dispatch: molemmat erat sarjassa, 10 min valissa
            # (kasiajo halutaan taydelliseksi kattavuudeksi, ja se ajetaan valvotusti).
            "")           mukaan="[$era1,$era2_viiveella]" ;;
            # Maanantai: era 1.
            *)            mukaan="[$era1]" ;;
          esac
          echo "matrix={\"include\":$mukaan}" >> "$GITHUB_OUTPUT"
          echo "Laukaisin '${LAUKAISIN:-workflow_dispatch}' → erät: $mukaan"

  # Ydinvahti: per-kaupunki-invariantit (16 kaupunkia), oma kevyt skripti.
  #
  # ERAAJO (10.8.2026): Digitransitin kiintio ei kanna 16 kaupunkia yhdella istumalla.
  # Mitattu samana paivana: tauko 4 s -> 23 FAILia, tauko 20 s + 90 s uusintajaahdytys
  # -> 8 FAILia, ja kaatuvat kaupungit vaihtuivat joka ajolla listan loppupaassa eli
  # kiintio kuluu kumulatiivisesti. Siksi ajo on jaettu kahteen eraan.
  # max-parallel: 1 on OLENNAINEN - rinnakkain ajettuna erat kuluttaisivat saman
  # kiintion yhta aikaa eika mikaan olisi muuttunut.
  # fail-fast: false, jotta eran 1 punainen ei estaisi eraa 2 ajautumasta.
  #
  # AIKATAULUJAKO (11.8.2026): erittely yksin EI riittanyt - 11.8. klo 05:02 ajo oli
  # punainen omalla, jakamattomalla avaimella (Oulu 429, 2/2 yritysta). Mitattu samana
  # aamuna: SMOKE_CITIES=oulu yksin -> KAIKKI OK, 0 konsolivirhetta. Oulu ei siis ole
  # raskautensa takia rikki vaan kiintio kuluu kumulatiivisesti, eli oikea ruuvi on
  # AJON KOKONAISKULUTUS. Siksi erat ajetaan nyt eri paivina eika perakkain:
  # era 1 usein, era 2 kerran viikossa iltaan.
  # Uusinnan jaahdytys 90 s -> 5 min: 11.8. lokista naki etta Oulun uusinta ammuttiin
  # 90 s:n jalkeen liian aikaisin (Pori ja Rovaniemi palautuivat 1,5 min myohemmin).
  #
  # Aikaraja 45 min: era kestaa noin 13 min + mahdollinen alkuviive ja uusinnat.
  prod-smoke:
    needs: valitse-erat
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.valitse-erat.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Asenna testiriippuvuudet
        run: npm ci
        working-directory: tests

      - name: Aja tuotanto-smoke (erä ${{ matrix.era }}/2, read-only)
        run: node prod-smoke.test.js
        working-directory: tests
        env:
          BASE: https://demo.reittari.fi
          SMOKE_CITIES: ${{ matrix.cities }}
          SMOKE_START_DELAY_MS: ${{ matrix.delay }}
          SMOKE_REPORT_SUFFIX: -era${{ matrix.era }}
          # 90 s oli liian lyhyt kun kiintio on pohjassa (ks. 11.8. perustelu ylla).
          SMOKE_RETRY_COOLDOWN_MS: "300000"

      - name: Arkistoi raportti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-report-era${{ matrix.era }}
          path: |
            tests/prod-smoke-report-era${{ matrix.era }}.txt
            tests/prod-smoke-report-era${{ matrix.era }}.json

  # Syvä kattavuus: koko olemassa oleva smoke-sarja ajetaan tuotantoa vasten
  # (BASE-parametrisoitu). Erillinen job, jotta mahdollinen flake ei sotke
  # ydinvahdin signaalia — punainen prod-smoke on aina tutkittava, punainen
  # full-smoke voi olla ajoituskohinaa (re-run ensin).
  full-smoke-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Asenna testiriippuvuudet
        run: npm ci
        working-directory: tests

      - name: Aja koko smoke-sarja tuotantoa vasten
        run: npm test
        working-directory: tests
        env:
          BASE: https://demo.reittari.fi

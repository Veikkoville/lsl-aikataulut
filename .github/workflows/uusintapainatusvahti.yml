# Uusintapainatusvahti: kerran vuorokaudessa, ei viiden minuutin cronilla.
# Vertaa kunnan painamien tulosteiden perustasoa nykydataan ja lähettää ilmoituksen vain
# kun tila muuttuu. Vertailu ajaa saman sovelluksen headless-Chromella, jotta sormenjälkilogiikkaa
# ei ole kahta kappaletta (ks. tests/uusintapainatusvahti.js).
#
# Punainen ajo = vähintään yksi kaupunki jäi vertailematta. Sitä EI saa hyväksyä hiljaisesti:
# vajaa vertailu näyttäisi siltä että puuttuva tuloste on ajan tasalla.

name: Uusintapainatusvahti

on:
  workflow_dispatch:
    inputs:
      ajastin:
        description: 'savikurki-ajastin asettaa true: ajo pingaa Healthchecksiin kuten ajastettu ajo (käsiajo jättää tyhjäksi)'
        required: false
        default: 'false'
  schedule:
    # 03:20 UTC (06:20 Suomen kesäaikaa). Aamulla ennen virka-aikaa, ja eri minuutilla kuin
    # muut ajastukset, jotta Digitransit-kiintiö ei kulu kahdessa ajossa yhtä aikaa.
    - cron: "20 3 * * *"

permissions:
  contents: read

jobs:
  # Savikurki-ajastin käynnistää tämän ajallaan workflow_dispatchilla (joka päivä 03:23 UTC); GitHubin schedule on varalla
  # ja myöhästyy usein tunteja. Myöhästynyt schedule-ajo ohitetaan, jos saman UTC-päivän ajastinajo meni jo läpi
  # (sama tuplavahti kuin datavahdeissa, 18.10.2026). Punaisen ajastinajon jälkeen schedule-ajo ajaa uudelleen.
  tuplavahti:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      ohita: ${{ steps.tupla.outputs.ohita }}
    steps:
      - name: Tuplavahti
        id: tupla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ohita=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            tanaan=$(date -u +%F)
            jo=$(gh run list -R "$GITHUB_REPOSITORY" --workflow uusintapainatusvahti.yml --event workflow_dispatch --status success \
              --limit 10 --json createdAt --jq "[.[] | select(.createdAt | startswith(\"$tanaan\"))] | length")
            if [ "${jo:-0}" -gt 0 ]; then
              ohita=true
              echo "Ajastimen ajo meni tänään jo läpi ($jo kpl), GitHubin schedule-ajo ohitetaan."
            fi
          fi
          echo "ohita=$ohita" >> "$GITHUB_OUTPUT"

  vahti:
    needs: tuplavahti
    if: needs.tuplavahti.outputs.ohita != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Asenna riippuvuudet
        run: npm ci
        working-directory: tests

      - name: Vertaa painetut tulosteet nykydataan
        run: node uusintapainatusvahti.js
        working-directory: tests
        env:
          REPRINT_SERVICE_TOKEN: ${{ secrets.REPRINT_SERVICE_TOKEN }}

      # Healthchecks.io (14.10.2026): ping ajon lopussa, /fail jos jokin askel epäonnistui. Vain ajastettu ajo pingaa: käsiajo muuna päivänä voi päättyä punaiseen ilman löydöstä.
      # Valvonnan aikataulu ja hälytys ovat Healthchecksissä (strategiarepo tools/healthchecks/). Puuttuva secret ei kaada ajoa.
      # Pingaa ajastettu ajo: GitHubin schedule tai savikurki-ajastimen dispatch (input ajastin=true, 18.10.2026).
      - name: Healthchecks-ping
        if: always() && (github.event_name == 'schedule' || inputs.ajastin == 'true')
        env:
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
          TILA: ${{ job.status }}
        run: |
          if [ -z "$HC_PING_KEY" ]; then echo "::warning::HC_PING_KEY puuttuu, ping ohitetaan."; exit 0; fi
          polku=""; [ "$TILA" = "success" ] || polku="/fail"
          curl -fsS -m 10 --retry 3 -o /dev/null "https://hc-ping.com/$HC_PING_KEY/lsl-aikataulut-uusintapainatusvahti$polku" || echo "::warning::Healthchecks-ping epäonnistui."

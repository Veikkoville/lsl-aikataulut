name: CI

on:
  push:
    branches: [master]
    # Muutosvahdin datacommit (docs/muutosvahti/*.json) ei muuta koodia eikä tarvitse smokea
    paths-ignore:
      - "docs/muutosvahti/**"
  pull_request:
  # auto-kehitys kaynnistaa taman GITHUB_TOKENilla avatulle PR:lle (se ei laukaise pull_request-tapahtumaa)
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # KAIKKI worker-testit yhdellä askeleella (worker/package.json:n npm test).
      # Aiemmin tässä lueteltiin kolme tiedostoa nimeltä, jolloin uusi testitiedosto ei ajautunut
      # CI:ssä lainkaan vaikka se oli lisätty npm test -ketjuun (todettu 4.9.2026: cms-dates,
      # router ja reprint-logic olivat kaikki CI:n ulkopuolella). Yksi askel = ei voi unohtua.
      - name: Worker-yksikkötestit (webpush, push, sähköposti, cms-dates, router, uusintapainatus)
        run: npm test
        working-directory: worker

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Asenna testiriippuvuudet
        run: npm ci
        working-directory: tests

      - name: Käynnistä paikallinen palvelin
        run: python3 -m http.server 8000 &

      - name: Aja savutestit (oikeaa Digitransit-dataa vasten)
        run: npm test
        working-directory: tests

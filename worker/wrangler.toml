name = "lsl-aikataulut-proxy"
main = "main.js"
compatibility_date = "2026-06-01"

# Ylläpidon oma osoite (30.9.2026): reittari.fi:n DNS on Cloudflaressa, joten worker saa custom domainin.
# workers.dev pysyy päällä: sovelluksen PROXY_URL, sähköpostilinkit (EMAIL_LINK_BASE) ja Inkoon vanhat
# ylläpitolinkit käyttävät sitä.
workers_dev = true
routes = [
  { pattern = "yllapito.reittari.fi", custom_domain = true },
]

# Web Push: VAPID-julkinen avain ja yhteyshenkilö (ei-salaisia).
# Yksityinen avain on salaisuus: npx wrangler secret put VAPID_PRIVATE_JWK
[vars]
VAPID_PUBLIC = "BL0Ah2TowfE75fO8V6b8hncoh4Au-br_ycKHLGD1C6ohfXZV3Jpr863PHFWWd3qpU4wASUdJsuBLwhufuZMKx74"
VAPID_SUBJECT = "mailto:vvsaarinen@gmail.com"

# Sähköpostipohjainen häiriötilaus (Resend). Nämä ovat SALAISUUKSIA (wrangler secret),
# EIVÄT [vars]:issa (vältetään secret/var-nimikläshi):
#   npx wrangler secret put RESEND_API_KEY     (Resendin API-avain)
#   npx wrangler secret put EMAIL_FROM          (lähettäjäosoite, esim. hairiotiedote@aikataulut.reittari.fi;
#                                                domain todennetaan Resendiin OMANA domaininaan, ei juuri-reittari.fi
#                                                (juuressa on ville@reittari.fi -postin MX+SPF, jota ei saa hairita).
#                                                Tuotantokaupan yhteydessä vaihdetaan kaupungin domainiin tällä, ei koodiin.)
# EMAIL_LINK_BASE: workerin julkinen URL confirm/unsubscribe-linkkeihin (cronissa ei ole request-URLia).
EMAIL_LINK_BASE = "https://lsl-aikataulut-proxy.veikkoville.workers.dev"
# APP_BASE: frontendin osoite sähköpostien linkeissä (häiriötiedote, uusintapainatusvahti).
# Ilman tätä käytetään koodin oletusvakiota veikkoville.github.io, joka toimii mutta näyttää
# kunnalle väärältä palvelulta. Todettu 4.9.2026 vastaanotetusta ilmoitusviestistä.
APP_BASE = "https://demo.reittari.fi"

# Uusintapainatusvahdin huoltoavain (SALAISUUS, wrangler secret put REPRINT_SERVICE_TOKEN).
# Ajastettu vertailu (.github/workflows/uusintapainatusvahti.yml) lukee sillä seuratut tulosteet ja
# palauttaa vertailun tuloksen. EI oikeutta kirjoittaa perustasoa: se vaatii kaupungin oman avaimen.
# Sama arvo GitHubin repo-salaisuuteen REPRINT_SERVICE_TOKEN.
#   npx wrangler secret put REPRINT_SERVICE_TOKEN

# Tilausten ja nähtyjen häiriöiden tallennus (luotu: wrangler kv namespace create PUSH_KV)
[[kv_namespaces]]
binding = "PUSH_KV"
id = "d05f6c569d4a49339114fedf5764f4cc"

# Anonyymi käyttöanalytiikka (#2): kevyt tapahtumaseuranta ilman henkilötietoja.
# Kirjoitus ei kuormita KV:tä; dashboard-luku vaatii secretit CF_ACCOUNT_ID + CF_API_TOKEN.
[[analytics_engine_datasets]]
binding = "AE"
dataset = "lsl_events"

# Nopeusrajat Cloudflaren Rate Limiting -sidonnalla (3.10.2026, auditointi R-01, R-06, R-07).
# VALMISTELTU, POIS PÄÄLTÄ. Koodi käyttää sidontoja vain jos ne ovat olemassa (bindingAllows), joten
# ilman niitä isolaattikohtaiset rajat kantavat yksin. Sidonta laskee IP:n pyynnöt koko Cloudflaren
# sijainnissa (ei vain yhdessä isolaatissa) ja toimii myös workers.dev-osoitteessa, jota zone-tason
# säännöt eivät koske. Vaatii wrangler >= 4.36.0. period on 10 tai 60 sekuntia. namespace_id on
# tilikohtainen: tarkista ennen käyttöönottoa, ettei saman tilin muu worker käytä samaa numeroa.
# Käyttöönotto on erillinen julkaisuaskel (deploy).
# [[ratelimits]]
# name = "RL_PROXY"          # GraphQL- ja geokoodausproxy, avain = IP
# namespace_id = "7301"
#   [ratelimits.simple]
#   limit = 1200
#   period = 60
#
# [[ratelimits]]
# name = "RL_WRITE"          # julkiset kirjoittavat reitit, avain = reitti + IP
# namespace_id = "7302"
#   [ratelimits.simple]
#   limit = 10
#   period = 60

# Häiriötarkistus 5 min välein; lähtömuistutukset minuutin välein
[triggers]
crons = ["*/5 * * * *", "* * * * *"]

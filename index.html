// Asettaa tulostussivun suunnan (@page). Vaaka tarvitaan koko pysäkkimatriisille
// (kaikki vuorot eivät mahdu pystyarkin leveyteen). Nollataan pystyyn printin jälkeen.
function setPageOrientation(orient) {
  let s = document.getElementById("pageOrient");
  if (!s) { s = document.createElement("style"); s.id = "pageOrient"; document.head.appendChild(s); }
  s.textContent = orient === "landscape"
    ? "@page { size: A4 landscape; margin: 8mm; }"
    : "@page { size: A4 portrait; margin: 12mm; }";
}

// Rinnakkaisajo rajatulla samanaikaisuudella (proxyn ~10 req/s suoja)
async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (i < items.length) { const idx = i++; out[idx] = await fn(items[idx], idx); }
  }));
  return out;
}

// Vihkotaulukko yhdelle suunnalle: sarakkeina isot pysäkit (timepoint +
// aina lähtö & pääte), riveinä päivän lähdöt. Rivi = yksi vuoro avainpysäkkien
// läpi (esim. Pilkekatu 13:05 · Matkakeskus 13:13 · …).
function bookletTableHtml(trips) {
  const valid = (trips || []).filter(tr => (tr.stoptimes || []).length);
  if (!valid.length) return `<p class="muted">${t("bookletNoData")}</p>`;
  const seq = valid[0].stoptimes;
  const last = seq.length - 1;
  const keyStops = seq
    .map((st, i) => (st.timepoint || i === 0 || i === last) ? st.stop : null)
    .filter(Boolean);
  const rows = valid.map(tr => {
    const m = {};
    for (const st of tr.stoptimes) if (m[st.stop.gtfsId] == null) m[st.stop.gtfsId] = st.scheduledDeparture;
    return m;
  }).sort((a, b) => (a[keyStops[0].gtfsId] ?? 1e9) - (b[keyStops[0].gtfsId] ?? 1e9));
  const head = keyStops.map(s => `<th scope="col">${esc(s.name)}</th>`).join("");
  const body = rows.map(m =>
    `<tr>${keyStops.map(s => `<td>${m[s.gtfsId] == null ? "·" : fmtSec(m[s.gtfsId])}</td>`).join("")}</tr>`).join("");
  return `<div class="matrix-wrap"><table class="stoptable booklet">
      <thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

// Monen linjan tulostusvihko: valitse linjat → aikataulut isoilla pysäkillä
async function viewPrint() {
  if (!PROXY_URL && !apiKey) { location.hash = "#/asetukset"; return; }
  setView(`<p class="muted">${t("loadingRoutes")}</p>`);
  const routes = await loadRoutes();
  const today = todayISO();
  setView(`
    <nav class="crumb"><a href="#/">← ${t("allRoutes")}</a></nav>
    <div class="card no-print" id="printForm">
      <h2>${icon("print")} ${t("printPageTitle")}</h2>
      <p class="muted">${t("printPageIntro")}</p>
      <div class="field">
        <label for="bookletDate">${t("bookletDateLabel")}</label>
        <input type="date" id="bookletDate" value="${esc(today)}" aria-describedby="bookletDateHint">
        <p class="muted" id="bookletDateHint" style="margin:0.3rem 0 0;font-size:0.85em">${t("bookletDateHint")}</p>
      </div>
      <div class="field">
        <label for="dirSel">${t("directionsLabel")}</label>
        <select id="dirSel">
          <option value="both">${t("dirsBoth")}</option>
          <option value="0">${t("dirsOne1")}</option>
          <option value="1">${t("dirsOne2")}</option>
        </select>
      </div>
      <div class="field">
        <span class="muted" id="dtLbl">${t("dayTypesLabel")}</span>
        <div class="row" role="group" aria-labelledby="dtLbl" style="flex-wrap:wrap;gap:0.4rem 1rem">
          <label class="dtopt"><input type="checkbox" class="dtCb" value="weekday" checked> ${t("dayWeekday")}</label>
          <label class="dtopt"><input type="checkbox" class="dtCb" value="sat" checked> ${t("daySat")}</label>
          <label class="dtopt"><input type="checkbox" class="dtCb" value="sun" checked> ${t("daySun")}</label>
        </div>
      </div>
      <div class="row" style="flex-wrap:wrap;gap:0.4rem;margin:0.5rem 0">
        <input type="search" id="lineFilter" placeholder="${t("routeFilterPlaceholder")}" aria-label="${t("routeFilterAria")}">
        <button type="button" id="selAll" class="linkish">${t("selectAllLines")}</button>
        ${CONFIG.centerStopNames ? `<button type="button" id="selCenter" class="linkish">${t("centerLines")}</button>` : ""}
        <button type="button" id="selNone" class="linkish">${t("clearLines")}</button>
      </div>
      <p class="buildbar"><button type="button" id="buildBtn">${t("generateBooklet")}</button>
         <span id="buildStatus" class="muted" role="status"></span></p>
      <ul class="plain" id="lineChecks">
        ${routes.map(r => `<li><label class="item" style="cursor:pointer;align-items:center">
            <input type="checkbox" class="lineCb" value="${esc(r.gtfsId)}"
                   style="width:1.4rem;height:1.4rem;flex:none">
            ${badgeHtml(r)} <span>${esc(r.longName)}</span></label></li>`).join("")}
      </ul>
    </div>
    <div id="bookletOut"></div>`);

  const cbs = () => [...document.querySelectorAll(".lineCb")];
  document.getElementById("lineFilter").addEventListener("input", e => {
    const f = e.target.value.toLowerCase();
    document.querySelectorAll("#lineChecks li").forEach(li => {
      li.hidden = f && !li.textContent.toLowerCase().includes(f);
    });
  });
  document.getElementById("selAll").addEventListener("click", () =>
    cbs().forEach(c => { if (!c.closest("li").hidden) c.checked = true; }));
  document.getElementById("selNone").addEventListener("click", () =>
    cbs().forEach(c => { c.checked = false; }));

  // "Keskustan linjat": valitse linjat jotka kulkevat ydinkeskustan
  // solmupysäkkien (CONFIG.centerStopNames) kautta. Haetaan pysäkkien
  // linjat ja rajataan oman feedin BUS-linjoihin.
  const centerBtn = document.getElementById("selCenter");
  if (centerBtn) centerBtn.addEventListener("click", async () => {
    const status = document.getElementById("buildStatus");
    status.textContent = t("loadingCenter");
    centerBtn.disabled = true;
    try {
      const feedId = (routes[0]?.gtfsId || "").split(":")[0];
      const inFeed = id => !feedId || (id || "").startsWith(feedId + ":");
      const sets = await Promise.all((CONFIG.centerStopNames || []).map(n =>
        gql(`query ($n: String) { stops(name: $n) { gtfsId routes { gtfsId mode } } }`, { n })
          .then(d => d.stops || []).catch(() => [])));
      const ids = new Set();
      for (const stops of sets)
        for (const st of stops) {
          if (!inFeed(st.gtfsId)) continue;
          for (const r of st.routes || [])
            if (r.mode === "BUS" && inFeed(r.gtfsId)) ids.add(r.gtfsId);
        }
      cbs().forEach(c => { c.checked = ids.has(c.value); });
      status.textContent = t("selectedCount", { n: ids.size });
    } catch (e) {
      status.textContent = "";
    } finally { centerBtn.disabled = false; }
  });

  document.getElementById("buildBtn").addEventListener("click", async () => {
    const mySeq = viewSeq;
    const status = document.getElementById("buildStatus");
    const selected = cbs().filter(c => c.checked).map(c => c.value);
    if (!selected.length) { status.textContent = t("noLinesSelected"); return; }
    const date = document.getElementById("bookletDate").value || today;
    const dirChoice = document.getElementById("dirSel").value;
    let dayKeys = [...document.querySelectorAll(".dtCb:checked")].map(c => c.value);
    if (!dayKeys.length) dayKeys = ["weekday"];
    const dts = dayTypeDates(date).filter(d => dayKeys.includes(d.key));
    let done = 0;
    const setStatus = () => { status.textContent = t("buildingBooklet", { done, total: selected.length }); };
    setStatus();

    // Pää-pattern per suunta TULEVIEN vuorojen mukaan (ei kaikkien aikojen) —
    // muuten vanha kausivariantti voisi tuottaa tyhjän vihon.
    const probe = activeProbeDates();
    const probeAliases = probe.map((d, i) => `p${i}: tripsForDate(serviceDate: "${d}") { gtfsId }`).join(" ");
    const upcoming = p => probe.reduce((n, _, i) => n + ((p["p" + i] || []).length), 0);

    const sections = await mapLimit(selected, 4, async (routeId) => {
      try {
        const { data } = await cachedGql("proute:" + routeId,
          `query ($id: String!) {
             route(id: $id) {
               shortName longName color textColor
               patterns { code name directionId ${probeAliases} stops { gtfsId name } }
             }
           }`, { id: routeId });
        const route = data.route;
        if (!route) return null;
        const byDir = new Map();
        for (const p of route.patterns || []) {
          const k = p.directionId ?? 0;
          if (!byDir.has(k)) byDir.set(k, []);
          byDir.get(k).push(p);
        }
        let primaries = [...byDir.values()]
          .map(list => list.sort((a, b) => upcoming(b) - upcoming(a))[0]);
        if (dirChoice !== "both")
          primaries = primaries.filter(p => String(p.directionId ?? 0) === dirChoice);
        if (!primaries.length) return null;
        const dirs = await Promise.all(primaries.map(async p => {
          const stops = p.stops || [];
          const label = stops.length
            ? `${stops[0].name} → ${stops[stops.length - 1].name}` : (p.name || "");
          const dayTables = await Promise.all(dts.map(async dt => {
            const { data: md } = await cachedGql(`btt:${p.code}:${dt.date}`,
              `query ($code: String!, $date: String!) {
                 pattern(id: $code) {
                   tripsForDate(serviceDate: $date) {
                     stoptimes { timepoint scheduledDeparture stop { gtfsId name } }
                   }
                 }
               }`, { code: p.code, date: dt.date.replace(/-/g, "") });
            return `<h4 class="daytype">${esc(dt.label)}</h4>${bookletTableHtml(md.pattern?.tripsForDate || [])}`;
          }));
          return `<h3>${esc(label)}</h3>${dayTables.join("")}`;
        }));
        return {
          label: `${route.shortName || ""} ${route.longName}`.trim(),
          html: `<section class="card booklet-line">
            <h2>${badgeHtml(route)} ${esc(route.longName)}</h2>
            ${dirs.join("")}
          </section>`,
        };
      } catch (e) {
        return null;
      } finally {
        done++;
        if (mySeq === viewSeq) setStatus();
      }
    });
    if (mySeq !== viewSeq) return;
    const ok = sections.filter(Boolean);
    const toc = ok.map(s => `<li>${esc(s.label)}</li>`).join("");
    const out = document.getElementById("bookletOut");
    out.innerHTML = `
      <div class="card booklet-head">
        <h2>${esc(CONFIG.operator)} — ${t("printPageTitle")}</h2>
        <p>${dts.map(d => esc(d.label)).join(" · ")}. ${t("bookletKeyStopsNote")}</p>
        <p class="muted">${t("bookletPeriodNote", { date: fmtDateLong(date) })}</p>
        ${dayKeys.includes("weekday") ? `<p class="muted">${t("dayTypeNote")}</p>` : ""}
        <p class="no-print"><button type="button" id="bookletPrint">${icon("print")} ${t("bookletPrintBtn")}</button></p>
        ${toc ? `<nav class="booklet-toc"><h3>${t("bookletToc")}</h3><ul>${toc}</ul></nav>` : ""}
      </div>
      ${ok.map(s => s.html).join("")}`;
    status.textContent = "";
    document.getElementById("bookletPrint")?.addEventListener("click", () => {
      setPageOrientation("portrait");
      window.print();
    });
    out.scrollIntoView({ behavior: "smooth", block: "start" });
  });
}

async function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  if (parts[0] !== "monitori") exitMonitorMode(); // poistuttaessa kioskista palauta normaali ulkoasu
  if (parts[0] !== "palvelutiski") exitDeskMode(); // poistuttaessa palvelutiskistä palauta normaali ulkoasu
  const stripFeed = s => String(s || "").replace(/^[^:]+:/, ""); // "Lahti:3" → "3"
  track("view", parts[0] || "home");
  try {
    if (parts[0] === "asetukset") viewSettings();
    else if (parts[0] === "sahkoposti") viewEmailSub();
    else if (parts[0] === "palvelutiski") await viewServiceDesk();
    else if (parts[0] === "saavutettavuus") viewAccessibilityStatement();
    else if (parts[0] === "tulosta") await viewPrint();
    else if (parts[0] === "tulosteet") await viewPrintHub();
    else if (parts[0] === "reitti") await viewPlan(parts);
    else if (parts[0] === "linja" && parts[1]) { track("line", stripFeed(parts[1])); await viewRoute(parts[1], parts[2], parts[3]); }
    else if (parts[0] === "linjakartta" && parts[1]) { track("line", stripFeed(parts[1])); await viewRouteMap(parts[1]); }
    else if (parts[0] === "monitori" && parts[1]) await viewMonitor(parts[1]);
    else if (parts[0] === "kartta") await viewLiveMap();
    else if (parts[0] === "linjasto") await viewNetworkMap();
    else if (parts[0] === "laiturit") await viewHubs(parts);
    else if (parts[0] === "poikkeukset") viewExceptions();
    else if (parts[0] === "palaute") viewFeedback();
    else if (parts[0] === "liput") viewFares();
    else if (parts[0] === "pysakki" && parts[1]) { track("stop", stripFeed(parts[1])); await viewStop(parts[1]); }
    else await viewRoutes();
  } catch (err) {
    showError(err);
  }
}

window.addEventListener("hashchange", route);
updateChrome();
route();

// Ilmoitukset käytössä: ensisijaisesti varmistetaan taustapush-tilaus (ja
// päivitetään seuratut linjat); jos selain ei tue pushia, käytetään etualapollausta.
if (localStorage.getItem("notifyAlerts") === "1" &&
    typeof Notification !== "undefined" && Notification.permission === "granted") {
  // Lykätään ensimaalauksen jälkeen, ettei kilpaile etusivun LCP:stä
  onIdle(() => {
    if (pushSupported()) syncPushSubscription();
    else { pollFavAlerts(false, false); startAlertPolling(); }
  });
}

// Taustalta palatessa lähtöajat päivittyvät heti, ei vasta 30 s ajastimella
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  try { refreshNow?.(); } catch (e) {}
  pollFavAlerts(false);
  // Kioskinäkymässä näytön valvelukko vapautuu taustalla → pyydä uudelleen
  if (document.body.classList.contains("monitor-mode") && !monitorWakeLock) requestWakeLock();
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

// Tulostuksen jälkeen sivun suunta takaisin pystyyn (vaaka on vain
// koko pysäkkimatriisin tulostusta varten)
window.addEventListener("afterprint", () => setPageOrientation("portrait"));
</script>

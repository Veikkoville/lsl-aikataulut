let apiKey = localStorage.getItem("digitransitKey") || "";
// "feedId" on nykyinen avain; "lslFeedId" luetaan migraationa vanhoilta kävijöiltä
let feedId = localStorage.getItem(ns("feedId")) || (NS ? "" : localStorage.getItem("lslFeedId")) || "";
let routesCache = null;
let refreshTimer = null;

/* ---------- API ---------- */

// Kielitietoinen data: @L-sentinel kyselyssä (esim. name@L, longName@L, headsign@L)
// laajenee valitun kielen mukaan. Feedin natiivikieli (oletus FI; ruotsienemmistöinen
// kunta voi asettaa CONFIG.feedLang = "sv", esim. Raasepori) → sentinel poistetaan
// kokonaan (kysely identtinen vanhaan → natiivinäkymä ja -välimuisti muuttumattomia).
// Muut kielet → (language: "fi"/"sv"/"en"); OTP palauttaa natiivinimen jos käännöstä
// ei ole (fallback). Vain @L-merkityt kentät lokalisoidaan → stops(name:$name)-argumentti
// ja publisher{name} eivät muutu. Laajennus tehdään lähetyshetkellä → toimii myös
// moduulitason vakiokyselyille.
const FEED_LANG = CONFIG.feedLang || "fi";
function localizeQuery(query) {
  return query.replace(/@L\b/g, lang === FEED_LANG ? "" : `(language: "${lang}")`);
}

async function gql(query, variables) {
  const headers = { "Content-Type": "application/json" };
  if (!PROXY_URL) headers["digitransit-subscription-key"] = apiKey;
  const res = await fetch(API_URL, {
    method: "POST",
    headers,
    body: JSON.stringify({ query: localizeQuery(query), variables }),
  });
  if (res.status === 401 || res.status === 403) {
    throw new Error(t("errApiKey"));
  }
  if (!res.ok) throw new Error(t("errApi") + "HTTP " + res.status);
  const json = await res.json();
  if (json.errors) throw new Error(t("errApi") + json.errors.map(e => e.message).join("; "));
  return json.data;
}

/* ---------- Offline-välimuisti: viimeksi nähty data ---------- */

function cachePut(key, data) {
  const write = () =>
    localStorage.setItem(ns("cache:" + key), JSON.stringify({ ts: Date.now(), data }));
  try { write(); } catch (e) {
    // localStorage täynnä: tyhjennä välimuisti ja yritä kerran uudelleen
    try {
      for (const k of Object.keys(localStorage)) {
        if (k.includes("cache:")) localStorage.removeItem(k);
      }
      write();
    } catch (e2) { /* ilman välimuistia pärjätään */ }
  }
}

function cacheGet(key) {
  try {
    const hit = JSON.parse(localStorage.getItem(ns("cache:" + key)) || "null");
    return hit && hit.data ? hit : null;
  } catch (e) { return null; }
}

// Onnistunut haku tallennetaan; virheen sattuessa palautetaan viimeksi
// nähty versio. cachedAt != null kertoo näkymälle, että data on vanhaa.
async function cachedGql(key, query, variables) {
  // Kieli mukaan avaimeen, ettei eri kielten data vuoda ristiin (SV-haku ei saa palauttaa
  // FI-cachea). FI = natiivikieli + identtinen kysely → avain ennallaan (ei mitätöi vanhaa
  // FI-välimuistia eikä muuta muiden kaupunkien FI-näkymää).
  const k = lang === "fi" ? key : key + "@" + lang;
  try {
    const data = await gql(query, variables);
    cachePut(k, data);
    return { data, cachedAt: null };
  } catch (err) {
    const hit = cacheGet(k);
    if (hit) return { data: hit.data, cachedAt: hit.ts };
    throw err;
  }
}

function staleNoteHtml(ts) {
  const d = new Date(ts);
  const time = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const sameDay = d.toDateString() === new Date().toDateString();
  const when = sameDay ? time
    : t("dateAt", { date: d.toLocaleDateString(lang === "fi" ? "fi-FI" : lang === "sv" ? "sv-FI" : "en-GB"), time });
  return `<p class="muted">${icon("warning")} ${t("staleNote", { when })}</p>`;
}

// Käynnistyssiivous: vanhentuneet ja ylimääräiset cache-avaimet pois
(function cleanCache() {
  try {
    const entries = [];
    for (const k of Object.keys(localStorage)) {
      if (!k.includes("cache:")) continue;
      try {
        const v = JSON.parse(localStorage.getItem(k));
        if (!v?.ts || Date.now() - v.ts > 7 * 24 * 3600 * 1000) localStorage.removeItem(k);
        else entries.push([k, v.ts]);
      } catch (e) { localStorage.removeItem(k); }
    }
    entries.sort((a, b) => a[1] - b[1]);
    while (entries.length > 30) localStorage.removeItem(entries.shift()[0]);
  } catch (e) { /* localStorage estetty: ohitetaan */ }
})();

async function findFeed() {
  if (feedId) return feedId;
  const data = await gql(`{ feeds { feedId publisher { name } } }`);
  const hit = data.feeds.find(f =>
    CONFIG.feedMatch.test(f.feedId) || CONFIG.feedMatch.test(f.publisher?.name || ""));
  if (!hit) throw new Error(t("errFeedNotFound"));
  feedId = hit.feedId;
  localStorage.setItem(ns("feedId"), feedId);
  return feedId;
}

// Edustavat tulevat päivät (Ti/To/La/Su seuraavan viikon sisällä). Riittää
// erottamaan liikennöivät linjat kausi-/koululinjoista joilla ei ole vuoroja nyt.
function activeProbeDates() {
  const want = new Set([2, 4, 6, 0]); // getDay: Ti=2, To=4, La=6, Su=0
  const out = [], base = new Date();
  for (let i = 0; i < 8 && want.size; i++) {
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    if (want.has(d.getDay())) {
      out.push(`${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`);
      want.delete(d.getDay());
    }
  }
  return out;
}

// Linjalista on kielitietoinen (longName lokalisoitu) → välimuistiavain per kieli,
// ettei SV-lista palauta FI-longNameja. FI = oletus → avain ennallaan.
function routesCacheKey() { return "routesCache4" + (lang === "fi" ? "" : ":" + lang); }

async function loadRoutes() {
  if (routesCache) return routesCache;
  try {
    const cached = JSON.parse(localStorage.getItem(ns(routesCacheKey())) || "null");
    if (cached && Date.now() - cached.ts < 24 * 3600 * 1000 && cached.routes?.length) {
      routesCache = cached.routes;
      return routesCache;
    }
  } catch (e) { /* rikkinäinen välimuisti ohitetaan */ }
  const feed = await findFeed();
  // Haetaan linjat + tarkistetaan vuorojen olemassaolo edustavina päivinä samalla
  // kyselyllä, jotta linjalista vastaa LSL:ää: ei näytetä linjoja joilla ei ole
  // tulevia lähtöjä (esim. talvi-/koululinjat kesällä).
  const dates = activeProbeDates();
  const aliases = dates.map((d, i) => `d${i}: tripsForDate(serviceDate: "${d}") { gtfsId }`).join(" ");
  const data = await gql(
    `query ($feeds: [String]) {
       routes(feeds: $feeds) { gtfsId shortName longName@L mode color textColor patterns { ${aliases} } }
     }`, { feeds: [feed] });
  const tripCount = r => (r.patterns || []).reduce((n, p) => n + dates.reduce((m, _, i) => m + (p["d" + i] || []).length, 0), 0);
  const isActive = r => tripCount(r) > 0;
  // varakeino: jos jostain syystä mikään linja ei näytä aktiiviselta, näytetään kaikki
  const anyActive = (data.routes || []).some(r => r.mode === "BUS" && isActive(r));
  const buses = (data.routes || []).filter(r => r.mode === "BUS").filter(r => !anyActive || isActive(r));
  // Dedup: sama linja voi olla feedissä kahdesti eri liikennöitsijällä (esim. 23
  // Koiviston Auto + Vekka, identtiset vuorot = liikennöitsijävaihdoksen duplikaatti).
  // Pidetään samannimisistä (shortName+longName) eniten vuoroja sisältävä → ei tuplaa.
  const byKey = new Map();
  for (const r of buses) {
    const k = (r.shortName || "") + "|" + (r.longName || "");
    const prev = byKey.get(k);
    if (!prev || tripCount(r) > tripCount(prev)) byKey.set(k, r);
  }
  // Ryhmittele saman shortNamen route-objektit yhdeksi "linjaksi": osa feedeistä (esim.
  // Vaasa) julkaisee suunnat/variantit erillisinä objekteina samalla numerolla → muuten
  // sama numero näkyisi listoissa useasti ja linjasivu vain yhden suunnan. Eri shortNamet
  // (1 vs 1K) pysyvät erillisinä. gtfsIds = ryhmän kaikki route-ID:t; linjasivu/vihko/
  // juliste/kartta kokoavat patternit niiden unionista (ks. lineIds). Lahdessa ryhmä = 1.
  const byShort = new Map();
  for (const r of byKey.values()) {
    const k = r.shortName || "";
    if (!byShort.has(k)) byShort.set(k, []);
    byShort.get(k).push(r);
  }
  routesCache = [...byShort.values()]
    .map(group => {
      group.sort((a, b) => tripCount(b) - tripCount(a)); // primary = nyt eniten liikennöivä
      const primary = group[0];
      return { gtfsId: primary.gtfsId, gtfsIds: group.map(r => r.gtfsId),
        shortName: primary.shortName, longName: primary.longName, mode: primary.mode,
        color: primary.color, textColor: primary.textColor };
    })
    .sort((a, b) => (a.shortName || "").localeCompare(b.shortName || "", "fi", { numeric: true }));
  try {
    localStorage.setItem(ns(routesCacheKey()), JSON.stringify({ ts: Date.now(), routes: routesCache }));
  } catch (e) { /* täysi localStorage ei ole este */ }
  return routesCache;
}

// Linjan kaikki route-ID:t (sama shortName) loadRoutes-ryhmästä. Vaasan kaltaiset feedit
// julkaisevat suunnat erillisinä route-objekteina; Lahdessa ryhmä = 1 ID. Kun linjan
// patternit kootaan kaikista suunnista (linjasivu, vihko, juliste, linjakartta), haetaan
// routes(ids: lineIds) ja yhdistetään patternit → byDir/suunnanvaihto toimii unionin yli.
async function lineIds(routeId) {
  const list = await loadRoutes().catch(() => []);
  const g = list.find(r => (r.gtfsIds || []).includes(routeId));
  return (g && g.gtfsIds && g.gtfsIds.length) ? g.gtfsIds : [routeId];
}

/* ---------- Helpers ---------- */

function fmtSec(sec) {
  const h = Math.floor(sec / 3600) % 24;
  const m = Math.floor((sec % 3600) / 60);
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}

// Lähtöajan esitys: "nyt" / "5 min" / "14:32"; rt = reaaliaikainen arvio
function depInfo(st) {
  const dep = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
  const epoch = (st.serviceDay + dep) * 1000;
  const mins = Math.round((epoch - Date.now()) / 60000);
  const when = mins <= 0 ? t("depNow") : mins < 60 ? t("depMin", { n: mins }) : fmtSec(dep);
  return { when, rt: !!st.realtime };
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function isoOf(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

// "2026-06-14" -> luettava päivämäärä valitulla kielellä (paikallinen
// aika, ei UTC-siirtymää: komponentit puretaan käsin)
function fmtDateLong(iso) {
  const [y, m, d] = (iso || "").split("-").map(Number);
  if (!y || !m || !d) return iso || "";
  const loc = lang === "fi" ? "fi-FI" : lang === "sv" ? "sv-FI" : "en-GB";
  return new Date(y, m - 1, d).toLocaleDateString(loc, {
    day: "numeric", month: "long", year: "numeric" });
}

// Suomen arkipyhät vuodelle (kiinteät + pääsiäispohjaiset + juhannus +
// pyhäinpäivä). Näinä päivinä joukkoliikenne ajaa usein poikkeusaikataulua,
// joten ne ohitetaan kun valitaan tulosteen "normaali" edustava päivä.
const _holCache = {};
function fiHolidays(year) {
  if (_holCache[year]) return _holCache[year];
  const set = new Set();
  const add = (m, d) => set.add(`${year}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
  [[1, 1], [1, 6], [5, 1], [12, 6], [12, 24], [12, 25], [12, 26], [12, 31]].forEach(([m, d]) => add(m, d));
  // Pääsiäinen (gregoriaaninen computus)
  const a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, mm = Math.floor((a + 11 * h + 22 * l) / 451),
    month = Math.floor((h + l - 7 * mm + 114) / 31), day = ((h + l - 7 * mm + 114) % 31) + 1;
  const easter = new Date(year, month - 1, day);
  const addD = n => { const x = new Date(easter); x.setDate(easter.getDate() + n); set.add(isoOf(x)); };
  [-2, 0, 1, 39, 49].forEach(addD); // pitkäperjantai, pääsiäissunnuntai, 2. pp, helatorstai, helluntai
  // Juhannus: lauantai 20.–26.6. + aatto (pe)
  for (let dd = 20; dd <= 26; dd++) { const dt = new Date(year, 5, dd); if (dt.getDay() === 6) { set.add(isoOf(dt)); const fr = new Date(dt); fr.setDate(dd - 1); set.add(isoOf(fr)); break; } }
  // Pyhäinpäivä: lauantai 31.10.–6.11.
  for (let dd = 31; dd <= 37; dd++) { const dt = new Date(year, 9, dd); if (dt.getDay() === 6) { set.add(isoOf(dt)); break; } }
  _holCache[year] = set;
  return set;
}
function isFiHoliday(iso) {
  return fiHolidays(+iso.slice(0, 4)).has(iso);
}

// Normaali edustava päivä annetusta päivästä eteenpäin: tyyppi (ma–pe/la/su)
// täsmää eikä päivä ole arkipyhä → tuloste näyttää normaalin kausivuoron,
// ei esim. juhannuslauantain "ei lähtöjä".
function normalDateForType(fromISO, key) {
  const d = new Date((fromISO || todayISO()) + "T12:00:00");
  for (let i = 0; i < 90; i++) {
    const dow = (d.getDay() + 6) % 7;
    const iso = isoOf(d);
    const match = key === "weekday" ? dow <= 4 : key === "sat" ? dow === 5 : dow === 6;
    if (match && !isFiHoliday(iso)) return iso;
    d.setDate(d.getDate() + 1);
  }
  return fromISO || todayISO();
}

// Edustavat päivät tulosteeseen (ma–pe/la/su): normaali kausivuoro
// viitepäivästä eteenpäin, arkipyhät ohittaen.
function dayTypeDates(refISO) {
  const base = refISO || todayISO();
  return [
    { key: "weekday", label: t("dayWeekday"), date: normalDateForType(base, "weekday") },
    { key: "sat", label: t("daySat"), date: normalDateForType(base, "sat") },
    { key: "sun", label: t("daySun"), date: normalDateForType(base, "sun") },
  ];
}

// Päivän tyyppi (ma–pe / la / su) ISO-päivästä
function dayTypeOf(iso) {
  const dow = (new Date(iso + "T12:00:00").getDay() + 6) % 7;
  return dow <= 4 ? "weekday" : dow === 5 ? "sat" : "sun";
}

// Linjasivun päivätyyppivälilehdet (Ma–Pe / La / Su): kullekin tyypille
// lähin päivä (tänään jos osuu tyyppiin → reaaliaika näkyy, muuten seuraava
// kyseinen viikonpäivä). active = nykyisen näytetyn päivän tyyppi.
function lineDayTabs(currentISO) {
  const today = todayISO();
  const todayType = dayTypeOf(today);
  const cur = dayTypeOf(currentISO);
  // Tämän päivän tyyppi käyttää tätä päivää (reaaliaika näkyy); muut tyypit
  // seuraavan normaalin (arkipyhät ohittavan) kyseisen päivän.
  return ["weekday", "sat", "sun"].map(key => ({
    key,
    label: t(key === "weekday" ? "dayWeekday" : key === "sat" ? "daySat" : "daySun"),
    date: key === todayType ? today : normalDateForType(today, key),
    active: key === cur,
  }));
}

// --- Tulosteiden PÄIVÄTYYPPI-RYHMITTELY (todelliset ajopäivät GTFS:stä) -------
// Aiemmin tulosteet pakottivat vuorot karkeisiin Ma–Pe/La/Su-kaistoihin + yhteen
// "edustavaan arkipäivään" → (A) vain ti–to ajava vuoro leimattiin "Ma–Pe" ja
// (B) vain perjantaisin ajavat (esim. pe-yövuorot) katosivat kokonaan. Korjaus:
// johda vuoron TODELLISET viikonpäivät trip.activeDates-kentästä (OTP2) ja
// ryhmittele sen mukaan. Ruutunäkymä (linjasivun taulu) käyttää yhä yhtä päivää.

// Viikonpäivälyhenteet per kieli, indeksi 0=Ma..6=Su. Otsikoihin (Ma–To/Pe/...).
const DOW_ABBR = {
  fi: ["Ma", "Ti", "Ke", "To", "Pe", "La", "Su"],
  en: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
  sv: ["Mån", "Tis", "Ons", "Tors", "Fre", "Lör", "Sön"],
};
function dowAbbr() { return DOW_ABBR[lang] || DOW_ABBR.fi; }

// "yyyyMMdd" (activeDates-muoto) -> viikonpäiväindeksi 0=Ma..6=Su (paikallinen)
function dowOfCompact(s) {
  return (new Date(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8)).getDay() + 6) % 7;
}

// Viikonpäiväjoukko (Set<0..6>) -> luettava otsikko: yhtenäinen jakso "Ma–To",
// yksittäinen "Pe", hajanainen "Ma, Ke, Pe", koko viikko "Joka päivä".
function dowLabel(dowSet) {
  const a = dowAbbr();
  const days = [...dowSet].sort((x, y) => x - y);
  if (!days.length) return "";
  if (days.length === 7) return t("dayEveryDay");
  const contiguous = days.every((d, i) => i === 0 || d === days[i - 1] + 1);
  if (contiguous && days.length > 1) return `${a[days[0]]}–${a[days[days.length - 1]]}`;
  return days.map(d => a[d]).join(", ");
}

// Kausi-ikkuna: kuinka monta päivää viitepäivästä eteenpäin katsotaan "nykyistä
// aikataulua". Vuoro joka toistuu viikoittain tässä ikkunassa on kausivuoro;
// kertaluontoiset festivaalilisät (occ < 2 samana viikonpäivänä) jätetään pois.
const PRINT_HORIZON_DAYS = 42;

// Ryhmittele patternin vuorot TODELLISEN ajopäivä-patternin mukaan (activeDates).
// Palauttaa lohkot { dows:Set, school:"koul"|"loma"|"", trips:[], label } otsikko-
// järjestyksessä. KOUL/LOMA erottuvat omiksi lohkoiksi kun serviceId ne koodaa.
// EI koskaan pudota toistuvaa vuoroa (pe-yövuorot mukaan); kertaluontoiset festi-
// vaalilisät suodattuvat (ne eivät kuulu kausitauluun väärään päivään toistettuna).
function groupTripsByDays(trips, refISO) {
  const start = new Date((refISO || todayISO()) + "T12:00:00");
  const startNum = +isoOf(start).replace(/-/g, "");
  const end = new Date(start); end.setDate(start.getDate() + PRINT_HORIZON_DAYS);
  const endNum = +isoOf(end).replace(/-/g, "");
  const build = (minOcc) => {
    const groups = new Map();
    for (const tr of (trips || [])) {
      if (!(tr.stoptimes || []).length) continue;
      const perDow = {};
      const inWin = [];
      for (const x of (tr.activeDates || [])) {
        const n = +x;
        if (n < startNum || n > endNum) continue;
        inWin.push(n);
        const w = dowOfCompact(x); perDow[w] = (perDow[w] || 0) + 1;
      }
      /* Kauden katkeaminen kesken viikon EI ole vuoron viikonpäiväjoukko.
         Lahden syötteessä "Ma-To KP 20260831 asti" päättyy maanantaihin: ikkunassa
         ma osuu kahdesti mutta ti/ke/to kerran, joten pelkkä ≥ minOcc jätti otsikoksi
         "Ma" (todennettu 24.8.2026: 61 vuoroa, linjat 10/10K/11/11B/11V, ne joilla
         aikataulu ei ole merkki merkiltä sama kuin jatkuvalla palvelulla, eli joita
         alempi lohkojen yhdistäminen ei korjaa).
         Sääntö: jos vuoro toistuu jonain viikonpäivänä (ankkuri), otetaan mukaan myös
         ne viikonpäivät jotka se ajaa JOKA kerta kun ne mahtuvat sen omaan jaksoon.
         Festivaalisuodatus säilyy: kertaluontoisella lisällä ei ole ankkuria, ja
         viikoittaisen vuoron yksi ylimääräinen lauantai osuu jaksoon monta kertaa
         (avail ≥ 2) → se ei tule mukaan. */
      const anchored = Object.values(perDow).some(c => c >= minOcc);
      const availInSpan = {};
      if (anchored && inWin.length > 1) {
        inWin.sort((a, b) => a - b);
        const cut = s => new Date(+String(s).slice(0, 4), +String(s).slice(4, 6) - 1, +String(s).slice(6, 8), 12);
        const last = cut(inWin[inWin.length - 1]);
        for (const d = cut(inWin[0]); d <= last; d.setDate(d.getDate() + 1)) {
          const w = (d.getDay() + 6) % 7; availInSpan[w] = (availInSpan[w] || 0) + 1;
        }
      }
      // viikonpäivät joina vuoro toistuu ≥ minOcc kertaa ikkunassa, sekä kauden
      // katkeamisen takia vain kerran mahtuvat (ks. yllä)
      const dows = Object.keys(perDow).map(Number)
        .filter(w => perDow[w] >= minOcc || (anchored && perDow[w] === 1 && availInSpan[w] === 1))
        .sort((a, b) => a - b);
      if (!dows.length) continue;
      const sid = tr.serviceId || "";
      // Waltti-feedit kirjoittavat "koul"/"loma" auki serviceId:hin; Lahden talvifeed
      // käyttää token-lyhenteitä KP/LP (todennettu 12.8.2026: koko feedissä 0 koul/loma-
      // osumaa, 7 KP- ja 5 LP-serviceId:tä; LP aktiivinen 10.–11.8. + syysloma 19.–23.10.
      // → KP = koulupäivä, LP = loma-aika). Lyhenteet vain isoina token-osumina, ettei
      // osuta muiden feedien sanansisäisiin kirjainpareihin.
      const school = (/koul/i.test(sid) || /\bKP\b/.test(sid)) ? "koul"
                   : (/loma/i.test(sid) || /\bLP\b/.test(sid)) ? "loma" : "";
      const key = dows.join(",") + "|" + school;
      if (!groups.has(key)) groups.set(key, { dows: new Set(dows), school, trips: [] });
      groups.get(key).trips.push(tr);
    }
    return groups;
  };
  // Oletuskynnys 2: viikonpäivä mukaan vain jos vuoro TOISTUU ikkunassa → kerta-
  // luontoiset festivaalilisät pois. Kausivaihdon siirtymäikkunassa sääntö söisi
  // KOKO linjan (kausilinjan viimeinen ajoviikko: jokainen viikonpäivä esiintyy
  // horisontissa enää kerran → 0 lohkoa → tyhjä tuloste vaikka linja ajaa yhä;
  // todennettu Raasepori 101/201/261 6.8.2026, kesäfeedin viimeinen päivä 11.8.).
  // Fallback yhden esiintymän kynnykseen laukeaa vain kun tiukka pass on tyhjä,
  // joten festivaalisuodatus säilyy aina kun säännöllisiäkin vuoroja on.
  let groups = build(2);
  if (!groups.size) groups = build(1);
  const arr = [...groups.values()].map(g => {
    // dedup: sama aikataulurivi toistuu monena päivänä → yksi edustava per aikataulu
    const seen = new Set(), uniq = [];
    for (const tr of g.trips) {
      const sig = (tr.stoptimes || []).map(s => s.scheduledDeparture).join(",");
      if (seen.has(sig)) continue;
      seen.add(sig); uniq.push(tr);
    }
    g.trips = uniq;
    // Lohkon aikataulu merkkijonona: yhdistämisen ainoa peruste (ks. alla).
    g._sig = g.school + "|" + uniq
      .map(tr => (tr.stoptimes || []).map(s => s.scheduledDeparture).join(","))
      .sort().join(";");
    return g;
  });
  /* Yhdistä lohkot joiden aikataulu on MERKKI MERKILTÄ sama ja koulu/loma-merkintä sama.
     Kaupungit koodaavat saman aikataulun moneksi serviceId:ksi, ja ilman yhdistämistä
     sama taulukko tulostuu monta kertaa eri otsikolla. Kaksi todennettua tapausta
     Lahden syötteessä 23.8.2026, linjat 4/14/24/34K, molemmat suunnat:
     1) "Ma-To KP 20260831 asti" ja "Ma-To KP 20261101 asti" ovat sama aikataulu, vain
        kausi katkeaa 31.8. Päättyvästä palvelusta tuli lohko "Ma · koulupäivinä",
        koska 42 vrk ikkunassa maanantai osui kahdesti (24.8. ja 31.8.) mutta ti/ke/to
        vain kerran → ne putosivat toistumiskynnykseen ja otsikko jäi maanantaiksi.
        Kynnys on oikea (se suodattaa festivaalilisät); virhe oli että kauden katkeaminen
        kesken viikon luki sen viikonpäiväjoukoksi.
     2) "Pe KP" on oma serviceId, mutta lähtöajat ovat identtiset Ma-To:n kanssa → oikea
        otsikko on "Ma–Pe · koulupäivinä", ei kaksi erillistä taulukkoa.
     Mitään ei piiloteta: jos yksikin lähtöaika eroaa, allekirjoitus eroaa eikä
     yhdistämistä tapahdu. Eri koulu/loma-merkintä ei yhdisty koskaan. */
  const byTimetable = new Map();
  for (const g of arr) {
    const prev = byTimetable.get(g._sig);
    if (prev) { g.dows.forEach(d => prev.dows.add(d)); continue; }
    byTimetable.set(g._sig, g);
  }
  const outGroups = [...byTimetable.values()];
  outGroups.forEach(g => {
    delete g._sig;
    g.label = dowLabel(g.dows) + (g.school ? ` · ${t(g.school === "koul" ? "schoolTerm" : "schoolBreak")}` : "");
  });
  // järjestä: viikonpäiväspan alku nousevasti, sitten laajempi (Ma–Pe) ennen kapeampaa (Pe)
  outGroups.sort((a, b) => {
    const am = Math.min(...a.dows), bm = Math.min(...b.dows);
    return am !== bm ? am - bm : b.dows.size - a.dows.size;
  });
  return outGroups;
}

// Patternin vuorot + todelliset ajopäivät yhdellä haulla (ei per-päivä-hakua).
// activeDates listaa KAIKKI ajopäivät; stoptimes ilman serviceDatea = aikatauluajat.
// tripHeadsign + pickupType: pysäkkijuliste tarvitsee määränpään ja tiedon siitä,
// saako käynniltä nousta kyytiin (pelkkä jättöpysäkki ei ole lähtö). Muut kutsujat
// (linjatuloste/lehtiteline/vihko) eivät lue kenttiä → ei vaikutusta niihin.
async function patternTripsWithDays(code) {
  const { data } = await cachedGql(`ptd:${code}`,
    `query ($code: String!) {
       pattern(id: $code) {
         trips { serviceId tripHeadsign@L activeDates
           stoptimes { timepoint scheduledDeparture pickupType headsign@L stop { gtfsId name@L } } }
       }
     }`, { code });
  return data.pattern?.trips || [];
}

// Monen patternin vuorohaku yhdellä kyselyllä. Digitransit EI tue patterns(ids:)
// (todennettu 14.8.2026: "Unknown field argument 'ids'"), mutta GraphQL-aliakset
// kelpaavat: p0: pattern(id:$c0) … pN. Näin julisteiden erätulostus ei tee enää
// kutsua per pattern — se oli 13.8.2026 purskerajavian (304 kutsua) suurin erä.
// Erä on 5: yhden patternin vuorot stoptimeineen ovat iso vastaus, ja liian suuri
// nippu kaataisi koko erän yhteen virheeseen. Epäonnistunut erä EI heitä vaan jättää
// koodit memoon hakematta → kutsuja hakee ne yksitellen (hitaampi mutta oikea).
const PTD_ALIAS_CHUNK = 5;
const PTD_ALIAS_FIELDS = `trips { serviceId tripHeadsign@L activeDates
  stoptimes { timepoint scheduledDeparture pickupType headsign@L stop { gtfsId name@L } } }`;
async function patternTripsMany(codes, memo) {
  const missing = [...new Set(codes)].filter(c => c && !memo.has(c));
  const chunks = [];
  for (let i = 0; i < missing.length; i += PTD_ALIAS_CHUNK)
    chunks.push(missing.slice(i, i + PTD_ALIAS_CHUNK));
  await mapLimit(chunks, 3, async chunk => {
    const decl = chunk.map((_, i) => `$c${i}: String!`).join(", ");
    const body = chunk.map((_, i) => `p${i}: pattern(id: $c${i}) { ${PTD_ALIAS_FIELDS} }`).join("\n");
    const vars = Object.fromEntries(chunk.map((code, i) => ["c" + i, code]));
    let data;
    try { data = await gql(`query (${decl}) { ${body} }`, vars); }
    catch (e) { return; }   // erä epäonnistui → jätetään yksittäishaulle
    chunk.forEach((code, i) => {
      const trips = data["p" + i]?.trips;
      // Ei cachePutia: erä on kymmeniä patterneja stoptimeineen, ja niiden kirjoitus
      // localStorageen täyttäisi välimuistin (cachePut joutuisi tyhjennyskierrokseen).
      if (trips) memo.set(code, Promise.resolve(trips));
    });
  });
}

// Vuorot suunnan KAIKISTA patterneista (variantit) yhteen → ei pudoteta service-
// id:tä joka on eri pattern-koodissa (esim. 23S: MA,KE&PE oma kuvionsa, jota
// tuleva-vuoro-probe ei valitse). Jokaiseen vuoroon lähdepatternin stops (matriisi).
async function dirTripsWithDays(patterns) {
  const lists = await Promise.all((patterns || []).map(async p => {
    try {
      const trips = await patternTripsWithDays(p.code);
      return trips.map(tr => ({ ...tr, _stops: p.stops || [] }));
    } catch (e) { return []; }
  }));
  return lists.flat();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Inline-SVG-ikonit (ei ulkoista ikonifonttia → PWA-offline + 0 €/kk säilyy). Yhtenäinen
// transit-grade-viiva-ilme. Kokoa em:nä → skaalautuu tekstikoko-asetuksen mukaan.
const ICONS = {

// Ylätunnisteen brändiväritausta: pidä valkoinen teksti AA-luettavana (kontrasti ≥ 4.5)
// tummentamalla väriä tarvittaessa. Oletus vahva sininen; CONFIG.brandColor voi ylikirjoittaa
// (otetaan käyttöön vain varmennetulla värillä). Valkoisen (L=1) kontrasti = 1.05/(L+0.05).
function headerBgColor() {
  let hex = String(CONFIG.brandColor || "#0a4ea3").replace(/^#/, "");
  if (!/^[0-9a-fA-F]{6}$/.test(hex)) hex = "0a4ea3";
  let r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
  const toHex = () => [r, g, b].map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, "0")).join("");
  for (let i = 0; i < 40 && (1.05 / (relLum(toHex()) + 0.05)) < 4.5; i++) {
    r = Math.round(r * 0.9); g = Math.round(g * 0.9); b = Math.round(b * 0.9);
  }
  return "#" + toHex();
}

/* ---------- QR-koodit (vendoroitu qrcode.js, MIT — ladataan laiskasti) ---------- */

// Tämän näkymän jaettava absoluuttinen URL (säilyttää origin/polun/?city-parametrin)
function appUrl(hash) {
  return location.href.split("#")[0] + hash;
}

let qrLibPromise = null;
function loadQrLib() {
  if (window.qrcode) return Promise.resolve();
  if (!qrLibPromise) {
    qrLibPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "qrcode.js"; s.async = true;
      s.onload = () => resolve();
      s.onerror = () => { qrLibPromise = null; reject(new Error("qr")); };
      document.head.appendChild(s);
    });
  }
  return qrLibPromise;
}

// Piirtää QR:n canvasille (terävä, valittu pikselikoko). Hiljainen reuna 4 moduulia.
async function qrCanvas(text, px) {
  await loadQrLib();
  const qr = window.qrcode(0, "M");
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount();
  const margin = 4;
  const total = n + margin * 2;
  const scale = Math.max(2, Math.floor(px / total));
  const size = total * scale;
  const cv = document.createElement("canvas");
  cv.width = cv.height = size;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = "#000";
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++)
      if (qr.isDark(r, c)) ctx.fillRect((c + margin) * scale, (r + margin) * scale, scale, scale);
  return cv;
}

// QR PNG-data-URL:na (tulosteisiin upotettavaksi <img src>)
async function qrDataUrl(text, px) {
  return (await qrCanvas(text, px)).toDataURL("image/png");
}

// Liittää QR:n säiliöön + lataa PNG -linkin. caption = ohjeteksti, fileBase = tiedostonimi.
async function showQrInto(box, url, caption, fileBase) {
  box.innerHTML = `<p class="muted">${t("qrLoading")}</p>`;
  try {
    const cv = await qrCanvas(url, 320);
    box.innerHTML = "";
    cv.className = "qrimg";
    cv.setAttribute("role", "img");
    cv.setAttribute("aria-label", caption);
    box.appendChild(cv);
    const dl = document.createElement("a");
    dl.href = cv.toDataURL("image/png");
    dl.download = fileBase + ".png";
    dl.className = "btnlink";
    dl.style.marginTop = "0.5rem";
    dl.innerHTML = icon("download") + " " + esc(t("qrDownload"));
    const cap = document.createElement("p");
    cap.className = "muted";
    cap.textContent = caption;
    box.append(cap, dl);
  } catch (e) {
    box.innerHTML = `<div class="error">${esc(t("qrFail"))}</div>`;
  }
}

// Google encoded polyline, precision 1e-5 (OTP:n patternGeometry-muoto)
function decodePolyline(str) {
  let index = 0, lat = 0, lng = 0;
  const coords = [];
  while (index < str.length) {
    for (const which of [0, 1]) {
      let result = 0, shift = 0, b;
      do {
        b = str.charCodeAt(index++) - 63;
        result |= (b & 0x1f) << shift;
        shift += 5;
      } while (b >= 0x20);
      const delta = (result & 1) ? ~(result >> 1) : (result >> 1);
      if (which === 0) lat += delta; else lng += delta;
    }
    coords.push([lat / 1e5, lng / 1e5]);
  }
  return coords;
}

// Rajaa kartta AINA reitin/pysäkkien bboxiin (ei oletuszoomiin). Jos bbox puuttuu tai on
// virheellinen, fall back kaupungin keskipisteeseen — ei koskaan maailmanlaajuista näkymää.
function fitMap(map, bounds, fallbackLatLon) {
  try { map.invalidateSize(false); } catch (e) {}
  if (bounds && bounds.isValid && bounds.isValid()) {
    map.fitBounds(bounds, { padding: [20, 20], maxZoom: 16 });
    return;
  }
  // bbox puuttuu: aseta fallback-näkymä vain jos karttaa ei ole vielä keskitetty (makeMap ilman keskipistettä)
  try { map.getCenter(); } catch (e) { map.setView(fallbackLatLon || [AREA.focus.lat, AREA.focus.lon], 13); }
}

/* ---------- Live vehicle positions (Waltti GTFS-RT via MQTT) ---------- */

// Minimaalinen protobuf-kävelijä: riittää GTFS-RT VehiclePositionin
// koordinaattien poimintaan ilman riippuvuuksia
function pbParse(buf) {
  const out = [];
  let i = 0;
  while (i < buf.length) {
    let key = 0, shift = 0, b;
    do { b = buf[i++]; key |= (b & 0x7f) << shift; shift += 7; } while (b & 0x80);
    const field = key >>> 3, wire = key & 7;
    if (wire === 0) {
      do { b = buf[i++]; } while (b & 0x80);
      out.push({ field, wire });
    } else if (wire === 2) {
      let len = 0; shift = 0;
      do { b = buf[i++]; len |= (b & 0x7f) << shift; shift += 7; } while (b & 0x80);
      out.push({ field, wire, bytes: buf.subarray(i, i + len) }); i += len;
    } else if (wire === 5) { out.push({ field, wire, bytes: buf.subarray(i, i + 4) }); i += 4; }
    else if (wire === 1) { out.push({ field, wire, bytes: buf.subarray(i, i + 8) }); i += 8; }
    else return out; // tuntematon wire-tyyppi: lopetetaan siististi
  }
  return out;
}

function pbFloat(b) {
  return new DataView(b.buffer, b.byteOffset, 4).getFloat32(0, true);
}

// FeedMessage(2: entity) -> FeedEntity(4: vehicle) -> VehiclePosition(2: position)
function decodeVehiclePosition(buf) {
  for (const fm of pbParse(buf)) {
    if (fm.field !== 2 || fm.wire !== 2) continue;
    for (const ent of pbParse(fm.bytes)) {
      if (ent.field !== 4 || ent.wire !== 2) continue;
      for (const vp of pbParse(ent.bytes)) {
        if (vp.field === 2 && vp.wire === 2) {
          const pos = {};
          for (const p of pbParse(vp.bytes)) {
            if (p.field === 1 && p.bytes) pos.lat = pbFloat(p.bytes);
            if (p.field === 2 && p.bytes) pos.lon = pbFloat(p.bytes);
          }
          return pos;
        }
      }
    }
  }
  return null;
}

let mqttClient = null;
let vehicleSweep = null;

// Bussin klikkauspopup: linja, määränpää, aikataulupoikkeama ja seuraavat
// pysäkit GraphQL:n trip-haulla (topicin tripId + seuraava pysäkki)
const tripInfoCache = new Map();

async function vehiclePopupHtml(tripId, nextStopId) {
  const cached = tripInfoCache.get(tripId);
  if (cached && Date.now() - cached.ts < 20000) return cached.html;
  const data = await gql(
    `query ($id: String!, $date: String!) {
       trip(id: $id) {
         tripHeadsign@L route { shortName }
         stoptimesForDate(serviceDate: $date) {
           scheduledDeparture realtimeDeparture realtime departureDelay serviceDay
           stop { gtfsId name@L }
         }
       }
     }`, { id: feedId + ":" + tripId, date: todayISO().replace(/-/g, "") });
  const trip = data.trip;
  if (!trip) return t("vehNoTrip");
  const sts = trip.stoptimesForDate || [];
  let idx = sts.findIndex(st => st.stop.gtfsId === feedId + ":" + nextStopId);
  if (idx < 0) {
    const now = Date.now();
    idx = sts.findIndex(st =>
      (st.serviceDay + (st.realtime ? st.realtimeDeparture : st.scheduledDeparture)) * 1000 > now);
  }
  const cur = idx >= 0 ? sts[idx] : null;
  let delayText = "";
  if (cur && cur.realtime) {
    const d = cur.departureDelay;
    delayText = d >= 60 ? t("vehLate", { n: Math.round(d / 60) })
      : d <= -60 ? t("vehEarly", { n: Math.round(-d / 60) })
      : t("vehOnTime");
  }
  const nexts = idx >= 0 ? sts.slice(idx, idx + 4) : [];
  const html = `<strong>${t("vehLine", { line: esc(trip.route.shortName), dest: esc(trip.tripHeadsign || "") })}</strong>
    ${delayText ? `<br>${delayText}` : ""}
    ${nexts.length ? `<br><span class="muted">${t("vehNextStops")}</span><br>`
      + nexts.map(st => {
          const dep = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
          return `${fmtSec(dep)} <a href="#/pysakki/${encodeURIComponent(st.stop.gtfsId)}">${esc(st.stop.name)}</a>`;
        }).join("<br>") : ""}`;
  tripInfoCache.set(tripId, { ts: Date.now(), html });
  return html;
}

// Näyttää listan linjoista live-busseina kartalla. Kerrallaan aktiivisena on
// yksi tilaus: uusi kutsu (esim. toisen reittiehdotuksen avaus) siirtää bussit
// uudelle kartalle.
async function startVehicles(map, routeList, onMessage) {
  const mySeq = viewSeq;
  try {
    await ensureMqtt();
    await findFeed(); // MQTT-topic ja trip-haut tarvitsevat feedId:n
  } catch (e) { return; }
  if (mySeq !== viewSeq) return; // näkymä ehti vaihtua latauksen aikana
  stopVehicles();
  const byNum = new Map(routeList.map(r => [r.gtfsId.split(":")[1], r]));
  const markers = new Map(); // vehicleId -> { marker, ts }
  mqttClient = mqtt.connect(CONFIG.mqttUrl, { reconnectPeriod: 5000 });
  mqttClient.on("connect", () => {
    if (!mqttClient) return;
    for (const num of byNum.keys()) {
      mqttClient.subscribe(`/gtfsrt/vp/${feedId}/+/+/+/${num}/#`);
    }
  });
  mqttClient.on("message", (topic, payload) => {
    const seg = topic.split("/");
    const route = byNum.get(seg[7]);
    if (!route) return;
    const vehId = seg[13] || topic;
    const headsign = seg[9] || "";
    const pos = decodeVehiclePosition(payload);
    if (!pos || pos.lat == null || pos.lon == null) return;
    let m = markers.get(vehId);
    if (!m) {
      const icon = L.divIcon({ className: "bus-marker", html: esc(route.shortName), iconSize: [26, 26] });
      m = { marker: L.marker([pos.lat, pos.lon], { icon, zIndexOffset: 1000 })
        .addTo(map).bindTooltip("").bindPopup(t("vehLoading"), { maxWidth: 280 }) };
      m.marker.on("popupopen", async () => {
        try {
          m.marker.setPopupContent(await vehiclePopupHtml(m.tripId, m.nextStop));
        } catch (err) {
          m.marker.setPopupContent(t("vehLoadFail"));
        }
      });
      markers.set(vehId, m);
    }
    m.tripId = seg[10] || "";
    m.nextStop = seg[11] || "";
    m.marker.setLatLng([pos.lat, pos.lon]);
    m.marker.setTooltipContent(t("vehLine", { line: esc(route.shortName), dest: esc(headsign) }));
    m.ts = Date.now();
    if (onMessage) try { onMessage(seg, route, pos); } catch (e) { /* hälytyslogiikka ei saa kaataa karttaa */ }
  });
  // siivoa bussit, joista ei ole kuulunut 90 sekuntiin (esim. päätepysäkillä)
  vehicleSweep = setInterval(() => {
    const cutoff = Date.now() - 90000;
    for (const [id, m] of markers) {
      if ((m.ts || 0) < cutoff) { map.removeLayer(m.marker); markers.delete(id); }
    }
  }, 15000);
}

function stopVehicles() {
  if (vehicleSweep) { clearInterval(vehicleSweep); vehicleSweep = null; }
  if (mqttClient) { try { mqttClient.end(true); } catch (e) {} mqttClient = null; }
}

// Koko verkon bussit kartalla: tilaa feedin KAIKKI ajoneuvot (/gtfsrt/vp/<feed>/#).
// byNum: linjanumero -> route (väritystä ja nimeä varten). onCount: bussimäärän takaisinkutsu.
async function startLiveMap(map, byNum, onCount) {
  const mySeq = viewSeq;
  try { await ensureMqtt(); await findFeed(); }
  catch (e) { if (onCount) onCount(0); return; }
  if (mySeq !== viewSeq) return;
  stopVehicles();
  const markers = new Map(); // vehicleId -> { marker, ts, tripId, nextStop }
  mqttClient = mqtt.connect(CONFIG.mqttUrl, { reconnectPeriod: 5000 });
  mqttClient.on("connect", () => {
    if (mqttClient) mqttClient.subscribe(`/gtfsrt/vp/${feedId}/#`);
  });
  mqttClient.on("message", (topic, payload) => {
    const seg = topic.split("/");
    const pos = decodeVehiclePosition(payload);
    if (!pos || pos.lat == null || pos.lon == null) return;
    const routeNum = seg[7] || "";
    const route = byNum.get(routeNum);
    if (!route) return;   // resolvoitumaton route_id → ei merkkiä lainkaan (EI näytetä raakaa id:tä)
    const label = route.shortName;
    const vehId = seg[13] || topic;
    const headsign = seg[9] || "";
    let m = markers.get(vehId);
    if (!m) {
      const bg = route?.color ? "#" + route.color : "#b34700";
      const fg = route?.color ? badgeText(route.color, route.textColor) : "#fff";
      const icon = L.divIcon({ className: "bus-live-wrap",
        html: `<span class="bus-live" style="background:${bg};color:${fg}">${esc(label)}</span>`, iconSize: [28, 28] });
      m = { marker: L.marker([pos.lat, pos.lon], { icon, zIndexOffset: 1000 })
        .addTo(map).bindTooltip("").bindPopup(t("vehLoading"), { maxWidth: 280 }) };
      m.marker.on("popupopen", async () => {
        try { m.marker.setPopupContent(await vehiclePopupHtml(m.tripId, m.nextStop)); }
        catch (err) { m.marker.setPopupContent(t("vehLoadFail")); }
      });
      markers.set(vehId, m);
      if (onCount) onCount(markers.size);
    }
    m.tripId = seg[10] || "";
    m.nextStop = seg[11] || "";
    m.marker.setLatLng([pos.lat, pos.lon]);
    m.marker.setTooltipContent(t("vehLine", { line: esc(label), dest: esc(headsign) }));
    m.ts = Date.now();
  });
  vehicleSweep = setInterval(() => {
    const cutoff = Date.now() - 90000;
    let changed = false;
    for (const [id, m] of markers) {
      if ((m.ts || 0) < cutoff) { map.removeLayer(m.marker); markers.delete(id); changed = true; }
    }
    if (changed && onCount) onCount(markers.size);
  }, 15000);
}

// Näkymän oma päivitysfunktio, jota kutsutaan heti kun sovellus palaa

let refreshNow = null;

// Lykkää ei-kriittisen työn ensimaalauksen jälkeen (TBT pienemmäksi).
// Safari ei tue requestIdleCallbackia → setTimeout-fallback.
const onIdle = window.requestIdleCallback

function setView(html) {

const TEXT_SIZE_OPTIONS = [["normal", "sizeNormal"], ["large", "sizeLarge"], ["larger", "sizeLarger"]];
const TEXT_SIZE_ORDER = TEXT_SIZE_OPTIONS.map(o => o[0]); // normal → large → larger

/* ---------- Globaalit esteettömyys-/kielikontrollit ----------
   YKSI totuus: sekä ylätunnisteen kontrollit että Asetukset-paneeli kutsuvat näitä.
   Tila on localStorage (textSize/contrast) + lang. syncControls päivittää aria-tilat
   KAIKKIIN data-*-opt-painikkeisiin (header + paneeli) → ei rinnakkaista tilaa. */
function setTextSize(size) {
  localStorage.setItem("textSize", size);
  window.applyTextSize();
  syncControls();
}
function stepTextSize(dir) {
  const cur = localStorage.getItem("textSize") || "normal";
  let i = TEXT_SIZE_ORDER.indexOf(cur);
  if (i < 0) i = 0;
  i = Math.max(0, Math.min(TEXT_SIZE_ORDER.length - 1, i + dir));
  setTextSize(TEXT_SIZE_ORDER[i]);
}
function setContrast(v) {
  localStorage.setItem("contrast", v);
  window.applyContrast();
  syncControls();
}
function toggleContrast() {
  setContrast((localStorage.getItem("contrast") || "normal") === "high" ? "normal" : "high");
}
function setLanguage(v) {
  if (!STRINGS[v]) return;
  lang = v;
  localStorage.setItem("lang", lang);
  routesCache = null;   // muistissa olevat linjalistat ovat kielikohtaisia (longName) → tyhjennä
  networkCache = null;
  alertsPromise = null; // häiriötekstit haetaan kielikohtaisesti (@L) → istuntovälimuisti tyhjäksi
  updateChrome();       // päivittää ylätunnisteen + footerin + meta-tagit
  syncControls();       // header-kontrollien aria + kielisegmentti
  route();              // piirrä nykyinen näkymä uudella kielellä

// Heijastaa nykyisen tilan kaikkiin kontrolleihin (header + Asetukset-paneeli).
function syncControls() {
  const ts = localStorage.getItem("textSize") || "normal";
  const ct = localStorage.getItem("contrast") || "normal";
  document.querySelectorAll("[data-text-opt]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.textOpt === ts)));
  document.querySelectorAll("[data-contrast-opt]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.contrastOpt === ct)));
  document.querySelectorAll("[data-lang-opt]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.langOpt === lang)));
  // Header: tekstikoko-stepperin reuna-arvot disabloidaan, kontrastikytkimen painallustila
  const i = TEXT_SIZE_ORDER.indexOf(ts);
  const down = document.getElementById("hdrTextDown");
  const up = document.getElementById("hdrTextUp");
  if (down) down.disabled = i <= 0;
  if (up) up.disabled = i >= TEXT_SIZE_ORDER.length - 1;
  const hc = document.getElementById("hdrContrast");
  if (hc) hc.setAttribute("aria-pressed", String(ct === "high"));
}

const SEVERITY_ORDER = { SEVERE: 0, WARNING: 1, INFO: 2, UNKNOWN_SEVERITY: 3 };

let alertsPromise = null;

// Voimassa olevat tiedotteet, haetaan kerran per istunto.
// force=true ohittaa istuntokohtaisen välimuistin (häiriöpollaus).
function loadAlerts(force) {
  if (force) alertsPromise = null;
  if (!alertsPromise) {
    alertsPromise = (async () => {
      const feed = await findFeed();
      const data = await gql(
        `query ($feeds: [String!]) {
           alerts(feeds: $feeds) {
             alertHeaderText@L alertDescriptionText@L alertSeverityLevel alertEffect alertUrl
             effectiveStartDate effectiveEndDate
             route { gtfsId } stop { gtfsId }
           }
         }`, { feeds: [feed] });
      const now = Date.now() / 1000;
      return (data.alerts || []).filter(a =>
        !(a.effectiveStartDate && a.effectiveStartDate > now) &&
        !(a.effectiveEndDate && a.effectiveEndDate < now));
    })().catch(err => { alertsPromise = null; throw err; });
  }
  return alertsPromise;
}

function dedupAlerts(alerts) {
  const seen = new Map();
  for (const a of alerts) {
    seen.set((a.alertHeaderText || "") + "|" + (a.alertDescriptionText || ""), a);
  }
  return [...seen.values()].sort((a, b) =>
    (SEVERITY_ORDER[a.alertSeverityLevel] ?? 9) - (SEVERITY_ORDER[b.alertSeverityLevel] ?? 9));
}

/* ---------- Häiriöt vs. tiedotteet -luokittelu (effect-pohjainen, sääntö B) ----------
   HÄIRIÖ = liikenne oikeasti häiriintynyt: GTFS-RT alertEffect ∈ häiriöjoukko TAI CMS jolla
   aktiivinen validUntil / linjat TAI admin SEVERE/WARNING. Muut = TIEDOTE (vaimennettu).
   Tämä estää LSL:n pysyväis-SEVERE-infoja ("Linjasto uudistui", "palvelubussi") laimentamasta
   kiireellisiä häiriöitä. */
const DISRUPTION_EFFECTS = new Set(
  ["DETOUR", "NO_SERVICE", "REDUCED_SERVICE", "SIGNIFICANT_DELAYS", "MODIFIED_SERVICE", "STOP_MOVED"]);

function isDisruption(a) {
  if (a._admin) return a.alertSeverityLevel === "SEVERE" || a.alertSeverityLevel === "WARNING";
  if (a._cms) return !!a.validUntil || (Array.isArray(a.lines) && a.lines.length > 0);
  return DISRUPTION_EFFECTS.has(a.alertEffect);   // GTFS-RT: effect ratkaisee (severity epäluotettava)
}

// Tiedotteen demotus: päivätön (ei validUntil) yleisluontoinen tiedote jonka julkaisusta on
// yli 30 pv → "stale" (pidetään silti vaimennetussa lohkossa, ei häiriölaskurissa).
function isStaleInfo(a) {
  if (a.validUntil) return false;
  const ts = Date.parse(a.date || "");
  return Number.isFinite(ts) && (Date.now() - ts) > 30 * 86400 * 1000;
}

// Alertin linjajoukko: valmiit lines[] + tekstistä poimitut linjanumerot (versaaleina).
function alertLineSet(a) {
  const s = new Set();
  for (const l of (a.lines || [])) s.add(String(l).toUpperCase());
  for (const tok of lineTokensFromText((a.alertHeaderText || "") + " " + (a.alertDescriptionText || "")))
    s.add(String(tok).toUpperCase());
  return s;
}

// Sijaintisanat otsikosta dedupia varten: tunnistetaan PAIKANNIMET suomen paikallissijasta
// (inessiivi/adessiivi -ssa/-ssä/-lla/-llä → "Kytölässä", "Hollolassa", "Myllyojalla"). Tämä
// erottaa paikannimet liikenne-yleissanoista luotettavammin kuin pelkkä sanapituus/stoplista.
// Yleiset paikallissijaiset yleissanat (reiteillä, pysäkillä…) suodatetaan silti pois.
const ALERT_LOCATIVE = /(ssa|ssä|lla|llä)$/;
const ALERT_PLACE_STOP = new Set([
  "reiteillä", "reitillä", "poikkeusreiteillä", "poikkeusreitillä", "pysäkeillä", "pysäkillä",
  "linjoilla", "linjalla", "asemalla", "alueella", "väleillä", "osuudella", "kaduilla"]);
function alertPlaceTokens(a) {
  return new Set(((a.alertHeaderText || "").toLowerCase().match(/[a-zäöå]{6,}/g) || [])
    .filter(w => ALERT_LOCATIVE.test(w) && !ALERT_PLACE_STOP.has(w)));
}

// Konservatiivinen lähilähde-dedup: yhdistä kahden eri lähteen "sama tapahtuma" vain jos
//  (1) jaettu paikannimi (lokatiivi), (2) jaetut linjat menevät päällekkäin, JA
//  (3) toisen linjat ⊆ toisen → pudota vähemmän yksityiskohtainen (enemmän linjoja voittaa;
//  tasapeli → CMS). Ehto (3) takaa: EI koskaan pudoteta häiriötä jolla on uniikkeja linjoja.
function mergeNearDuplicates(alerts) {
  const arr = alerts.slice();
  const dropped = new Set();
  for (let i = 0; i < arr.length; i++) {
    if (dropped.has(i)) continue;
    for (let j = i + 1; j < arr.length; j++) {
      if (dropped.has(j)) continue;
      const placeI = alertPlaceTokens(arr[i]), placeJ = alertPlaceTokens(arr[j]);
      if (![...placeI].some(w => placeJ.has(w))) continue;   // (1) ei jaettua paikannimeä
      const linesI = alertLineSet(arr[i]), linesJ = alertLineSet(arr[j]);
      if (![...linesI].some(l => linesJ.has(l))) continue;   // (2) ei jaettuja linjoja
      const iWins = linesI.size > linesJ.size ||
        (linesI.size === linesJ.size && arr[i]._cms && !arr[j]._cms);
      const keepLines = iWins ? linesI : linesJ, dropLines = iWins ? linesJ : linesI;
      if (![...dropLines].every(l => keepLines.has(l))) continue;   // (3) pudotettavalla uniikkeja linjoja → säilytä molemmat
      if (iWins) { dropped.add(j); }
      else { dropped.add(i); break; }
    }
  }
  return arr.filter((_, idx) => !dropped.has(idx));
}

// Raakalistasta → { disruptions, infos } (dedup + lähilähde-merge + luokittelu).
function classifyAlerts(rawAlerts) {
  const merged = mergeNearDuplicates(dedupAlerts(rawAlerts));
  const disruptions = [], infos = [];
  for (const a of merged) (isDisruption(a) ? disruptions : infos).push(a);
  // Vanhentuneet päivättömät tiedotteet (>30 pv) vaimennetun lohkon loppuun (demotus).
  infos.sort((a, b) => (isStaleInfo(a) ? 1 : 0) - (isStaleInfo(b) ? 1 : 0));
  return { disruptions, infos };
}

/* ---------- Toimitukselliset häiriötiedotteet (lsl.fi WordPress, CONFIG.cmsAlerts) ----------
   Digitransitin GTFS-RT-alerts kattaa vain osan lsl.fi:n julkaisemista
   häiriötiedotteista. Täydennetään etusivun banneri WordPressistä haetuilla
   tiedotteilla (workerin /cms-alerts kautta), jotta sovellus näyttää saman
   tiedon kuin lsl.fi:n häiriötiedotesivu. */
let cmsAlertsPromise = null;
function loadCmsAlerts(force) {
  if (!CONFIG.cmsAlerts || !PROXY_URL) return Promise.resolve([]);
  if (force) cmsAlertsPromise = null;
  if (!cmsAlertsPromise) {
    const { host, categoryId } = CONFIG.cmsAlerts;
    const u = PROXY_URL.replace(/\/$/, "") +
      `/cms-alerts?host=${encodeURIComponent(host)}&cat=${encodeURIComponent(categoryId)}`;
    cmsAlertsPromise = fetch(u)
      .then(r => (r.ok ? r.json() : { items: [] }))
      .then(d => (d && d.items) || [])
      .catch(() => []);   // degradoidu: ilman CMS-tiedotteita näytetään pelkät GTFS-RT
  }
  return cmsAlertsPromise;
}

/* ---------- Kaupungin itse julkaisemat tiedotteet (ylläpitonäkymä → worker /published) ----------
   Kaupungin henkilöstö julkaisee häiriötiedotteita admin-näkymässä; ne haetaan
   tässä ja yhdistetään etusivun banneriin GTFS-RT:n ja CMS:n rinnalle. */
let publishedPromise = null;
function loadPublished(force) {
  if (!PROXY_URL) return Promise.resolve({ alerts: [], fares: null });
  if (force) publishedPromise = null;
  if (!publishedPromise) {
    const u = PROXY_URL.replace(/\/$/, "") + "/published?city=" + encodeURIComponent(cityKey);
    publishedPromise = fetch(u)
      .then(r => (r.ok ? r.json() : {}))
      .then(d => ({ alerts: (d && d.alerts) || [], fares: (d && d.fares) || null, a11y: (d && d.a11y) || null }))
      .catch(() => ({ alerts: [], fares: null, a11y: null }));   // degradoidu: näytetään muut lähteet / CONFIG-oletukset
  }
  return publishedPromise;
}
function loadAdminAlerts(force) { return loadPublished(force).then(d => d.alerts); }

/* ---------- Anonyymi käyttöanalytiikka (kaupungin dashboardia varten) ----------
   Ei käyttäjätunnuksia, ei evästeitä, ei IP-tallennusta; kunnioittaa Do Not
   Track -asetusta. Lähetetään sendBeaconilla (fire-and-forget) workerin /track-
   päätepisteeseen, joka kirjaa anonyymin tapahtuman Analytics Engineen. */
function track(type, value) {
  try {
    if (!PROXY_URL) return;
    if (navigator.doNotTrack === "1" || window.doNotTrack === "1") return;
    const body = JSON.stringify({ type, value: String(value == null ? "" : value).slice(0, 80), city: cityKey });
    const u = PROXY_URL.replace(/\/$/, "") + "/track";
    if (navigator.sendBeacon) navigator.sendBeacon(u, body);
    else fetch(u, { method: "POST", body, keepalive: true }).catch(() => {});
  } catch (e) { /* analytiikka ei saa koskaan rikkoa sovellusta */ }
}
function adminToAlerts(items) {
  return (items || []).map(a => ({
    alertHeaderText: a.title,
    alertDescriptionText: a.body || "",
    alertSeverityLevel: a.severity || "WARNING",
    alertUrl: a.url || "",
    _admin: true,
    lines: (a.lines || []).map(x => String(x).toUpperCase()),   // ylläpitäjän valitsemat linjat
  }));
}

const normAlertUrl = u => (u || "").toLowerCase().replace(/^https?:\/\//, "").replace(/\/+$/, "");
const normAlertTitle = s => (s || "").toLowerCase()
  .replace(/­/g, "").replace(/[^a-z0-9äöå]+/gi, " ").trim();

// Muuntaa WordPress-tiedotteet alert-muotoisiksi ja suodattaa:
// liian vanhat pois, "Tilanne ohi" pois, ja jo GTFS-RT:ssä olevat pois (dedup).
function cmsToAlerts(items, gtfsAlerts) {
  const maxAge = ((CONFIG.cmsAlerts && CONFIG.cmsAlerts.maxAgeDays) || 45) * 86400 * 1000;
  const now = Date.now();
  const gUrls = new Set((gtfsAlerts || []).map(a => normAlertUrl(a.alertUrl)).filter(Boolean));
  const gTitles = new Set((gtfsAlerts || []).map(a => normAlertTitle(a.alertHeaderText)).filter(Boolean));
  const out = [];
  for (const it of items || []) {
    const ts = Date.parse(it.date || "");
    if (Number.isFinite(ts) && now - ts > maxAge) continue;          // liian vanha
    if (/^\s*(tilanne ohi|p[äa]ivitys:.*(palaa|peruttu|ohi))/i.test(it.title || "")) continue;
    if (gUrls.has(normAlertUrl(it.link))) continue;                  // jo GTFS-RT:ssä (URL)
    if (gTitles.has(normAlertTitle(it.title))) continue;             // jo GTFS-RT:ssä (otsikko)
    // Päättynyt poikkeus pois: workerin jäsentämä loppupvm menneisyydessä (inklusiivinen).
    // validUntil null/puuttuu (vanha worker, ei loppuvihjettä) → fallback yllä olevaan ikä-/ohi-suotimeen.
    if (it.validUntil && it.validUntil < todayISO()) continue;
    out.push({
      alertHeaderText: it.title,
      alertDescriptionText: it.excerpt || "",
      alertSeverityLevel: "WARNING",
      alertUrl: it.link || "",
      _cms: true,
      lines: it.lines || [],   // workerin rungosta poimimat linjanumerot (linjasivun täsmäys)
      validUntil: it.validUntil || null,   // aktiivinen voimassaoloaika (menneet jo suodatettu yllä)
      date: it.date || null,               // julkaisupäivä (tiedotteiden demotus >30 pv)
    });
  }
  return out;
}

// LSL ei kiinnitä tiedotteita linjaobjekteihin, joten linjat poimitaan myös
// tiedotetekstin maininnoista: "linjoja 3, 6, 8(K)" -> 3, 6, 8, 8K
function lineTokensFromText(text) {
  const out = new Set();
  // BUGIKORJAUS (alert-line-matching): poista paivamaara-/kellonaika-/vuosikuviot ENNEN poimintaa.
  // Linja-kaappaus on i-lipun takia ahne (nielaisee lauseen loppuun), joten "1.6." / "29.6.-31.7.2026"
  // / "9:40" tuottaisivat virheellisia linjatokeneita (esim. 1 ja 6). Linjasuffiksit (10K, 11B) sailyvat.
  const cleaned = String(text || "")
    .replace(/\d{1,2}[.:]\d{2}\b/g, " ")                // kellonaika 9:40 / 9.40
    .replace(/\d{1,2}\.\d{1,2}\.(?:\d{2,4})?/g, " ")    // paivamaara 1.6. / 29.6.2026 / 31.7.
    .replace(/\b\d{4}\b/g, " ");                        // irrallinen vuosiluku 2026
  for (const seg of cleaned.matchAll(/linj\w*\s+([0-9][0-9A-ZÅÄÖ()\s,.ja-]*)/gi)) {
    // suffiksikirjain (10K) sidotaan SUORAAN numeroon -> ei napata seuraavan ISON sanan
    // alkukirjainta ("31 Hollola" -> 31, ei 31H). Sulkusuffiksi (10(K)) kasitellaan erikseen.
    for (const tok of seg[1].matchAll(/(\d+)([A-ZÅÄÖ]?)\s*(?:\(([A-ZÅÄÖ,\s]+)\))?/g)) {
      out.add(tok[1]);
      if (tok[2]) out.add(tok[1] + tok[2]);
      if (tok[3]) for (const l of tok[3].split(/[,\s]+/)) if (l) out.add(tok[1] + l);
    }
  }
  return out;
}

function alertMatchesRoute(a, routeGtfsId, shortName, stopIds) {
  if (a.route && a.route.gtfsId === routeGtfsId) return true;
  if (a.stop && stopIds.has(a.stop.gtfsId)) return true;
  const sn = (shortName || "").toUpperCase();
  // CMS/ylläpito-tiedotteiden valmiiksi poimitut linjat (otsikossa ei aina numeroita)
  if (Array.isArray(a.lines) && a.lines.includes(sn)) return true;
  const tokens = lineTokensFromText((a.alertHeaderText || "") + " " + (a.alertDescriptionText || ""));
  return tokens.has(sn);
}

// Kaikki häiriölähteet yhdistettynä (GTFS-RT + lsl.fi-CMS + kaupungin ylläpito).
// Jaettu etusivun bannerin ja linjasivun kesken, jotta linjasivu näyttää SAMAT
// tiedotteet (esim. CMS:n "Kytölässä poikkeusreitti") eikä vain GTFS-RT:tä.
async function loadAllAlerts() {
  const [gtfs, cmsItems, adminItems] = await Promise.all([
    loadAlerts(),
    CONFIG.cmsAlerts ? loadCmsAlerts() : Promise.resolve([]),
    loadAdminAlerts(),
  ]);
  return [...adminToAlerts(adminItems), ...gtfs, ...cmsToAlerts(cmsItems, gtfs)];
}

async function loadAlertsInto(box) {
  try {
    const { disruptions, infos } = classifyAlerts(await loadAllAlerts());
    if (!disruptions.length && !infos.length) { box.innerHTML = ""; return; }
    // Kiireelliset häiriöt: korostettu lohko, oletus AUKI (suodatettu aitoihin häiriöihin →
    // ei enää viikkojen SEVERE-infoja jotka veisivät koko etusivun).
    const dLabel = disruptions.length === 1 ? t("alertsCount1") : t("alertsCountN", { n: disruptions.length });
    const dHtml = disruptions.length ? `
      <details class="card alertsum" open>
        <summary>${icon("warning")} <strong>${dLabel}</strong></summary>
        ${disruptions.map(a => alertHtml(a, false)).join("")}
      </details>` : "";
    // Informatiiviset tiedotteet: vaimennettu lohko, oletus KIINNI.
    const iHtml = infos.length ? `
      <details class="card infosum">
        <summary>${icon("info")} <strong>${t("infoCount", { n: infos.length })}</strong></summary>
        ${infos.map(a => alertHtml(a, false)).join("")}
      </details>` : "";
    box.innerHTML = dHtml + iHtml;
  } catch (err) {
    box.innerHTML = `<div class="error">${t("alertsFail")}${esc(err.message)}</div>`;
  }
}

/* ---------- Häiriöilmoitukset suosikkilinjoille (sovelluksen ollessa auki) ---------- */

const alertKey = a =>
  (a.alertHeaderText || "") + "|" + (a.alertDescriptionText || "") + "|" + (a.effectiveStartDate || "");

function getSeenAlerts() {
  try { return JSON.parse(localStorage.getItem(ns("seenAlerts")) || "{}"); }
  catch (e) { return {}; }
}

function markAlertsSeen(alerts) {
  const seen = getSeenAlerts();
  const cutoff = Date.now() - 30 * 24 * 3600 * 1000;
  for (const k of Object.keys(seen)) if (seen[k] < cutoff) delete seen[k];
  for (const a of alerts) seen[alertKey(a)] = Date.now();
  try { localStorage.setItem(ns("seenAlerts"), JSON.stringify(seen)); } catch (e) {}
}

function favRouteAlerts(alerts) {
  const favRoutes = getFavs().filter(f => f.type === "route");
  if (!favRoutes.length) return [];
  const noStops = new Set();
  return dedupAlerts(alerts).filter(a =>
    favRoutes.some(f => alertMatchesRoute(a, f.id, f.shortName, noStops)));
}

async function showAlertNotification(a) {
  const title = a.alertHeaderText || t("alertDefault");
  const opts = { body: (a.alertDescriptionText || "").slice(0, 180), tag: alertKey(a), icon: "icon.svg" };
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg && reg.showNotification) { reg.showNotification(title, opts); return; }
  } catch (e) { /* kokeillaan suoraa konstruktoria */ }
  try { new Notification(title, opts); } catch (e) {}
}

// seedOnly: merkitse nykyiset nähdyiksi ilmoittamatta (käyttöönotto)
async function pollFavAlerts(seedOnly, force = true) {
  if (localStorage.getItem("notifyAlerts") !== "1") return;
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  // Taustapush hoitaa ilmoitukset palvelimelta → ei etualailmoituksia (ei tuplia)
  if (pushActive) return;
  try {
    const matched = favRouteAlerts(await loadAlerts(force));
    if (seedOnly) { markAlertsSeen(matched); return; }
    const seen = getSeenAlerts();
    const fresh = matched.filter(a => !(alertKey(a) in seen));
    markAlertsSeen(matched);
    for (const a of fresh.slice(0, 3)) showAlertNotification(a);
  } catch (e) { /* seuraava kierros yrittää uudelleen */ }
}

// Globaali ajastin — EI kytkeydy refreshTimeriin, jonka näkymänvaihto tyhjentää
let alertPollTimer = null;
function startAlertPolling() {
  if (alertPollTimer) return;
  alertPollTimer = setInterval(() => pollFavAlerts(false), 5 * 60 * 1000);
}

/* ---------- Taustapush (Web Push): ilmoitukset myös sovellus kiinni ---------- */

// Tosi kun taustapush-tilaus on voimassa → etualapollaus pysyy pois päältä
let pushActive = false;

function pushSupported() {
  return !!(PROXY_URL && VAPID_PUBLIC_KEY &&
    "serviceWorker" in navigator && "PushManager" in window &&
    typeof Notification !== "undefined");
}

function urlBase64ToUint8Array(base64) {
  const pad = "=".repeat((4 - base64.length % 4) % 4);
  const b64 = (base64 + pad).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(b64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

// Tilaa push (jos ei vielä tilattu) ja synkronoi seuratut suosikkilinjat
// palvelimelle. Palauttaa true jos taustapush on käytössä.
async function syncPushSubscription() {
  if (!pushSupported() || Notification.permission !== "granted") return false;
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }
    await findFeed().catch(() => {});
    const favRoutes = getFavs().filter(f => f.type === "route");
    const res = await fetch(PROXY_URL.replace(/\/$/, "") + "/push/subscribe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        subscription: sub.toJSON(),
        routes: favRoutes.map(f => (f.shortName || "").toUpperCase()).filter(Boolean),
        gtfsRoutes: favRoutes.map(f => f.id),
        feed: feedId,
        city: CONFIG.city,
        lang,
      }),
    });
    pushActive = res.ok;
    return res.ok;
  } catch (e) {
    return false;
  }
}

async function unsubscribePush() {
  if (!("serviceWorker" in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (!sub) return;
    const endpoint = sub.endpoint;
    pushActive = false;
    await sub.unsubscribe().catch(() => {});
    if (PROXY_URL) await fetch(PROXY_URL.replace(/\/$/, "") + "/push/unsubscribe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ endpoint }),
    }).catch(() => {});
  } catch (e) { /* ohita */ }
}

// Suosikkien muuttuessa: pidä palvelimen seurattu linjalista ajan tasalla
function resyncPushIfEnabled() {
  if (localStorage.getItem("notifyAlerts") === "1" && pushSupported() &&
      typeof Notification !== "undefined" && Notification.permission === "granted") {
    syncPushSubscription();
  }
}

// Varmistaa push-luvan + tilauksen lähtömuistutusta varten (ei rekisteröi
// häiriötilausta, vain palauttaa tilauksen viestin lähetystä varten)
async function getPushSubscription() {
  if (!pushSupported()) return null;
  if (Notification.permission !== "granted") {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") return null;
  }
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
  });
  return sub;
}

function fmtClockLocal(epochMs) {
  return new Date(epochMs).toLocaleTimeString(
    lang === "fi" ? "fi-FI" : lang === "sv" ? "sv-FI" : "en-GB",
    { hour: "2-digit", minute: "2-digit" });
}

// Lähtömuistutus: ajastaa palvelimelle push-viestin lead-minuuttia ennen lähtöä
async function setDepartureReminder(epochMs, line, dest) {
  const msg = document.getElementById("remindMsg");
  if (!epochMs || !PROXY_URL) return;
  const lead = Number(document.getElementById("remindLead")?.value || 10);
  const fireAt = Math.floor(epochMs / 1000) - lead * 60;
  if (fireAt <= Date.now() / 1000 + 20) {
    if (msg) msg.innerHTML = `<span class="error">${t("remindTooSoon")}</span>`;
    return;
  }
  if (msg) msg.textContent = t("remindWorking");
  const sub = await getPushSubscription();
  if (!sub) { if (msg) msg.innerHTML = `<div class="error">${t("notifyDenied")}</div>`; return; }
  const time = fmtClockLocal(epochMs);
  try {
    const res = await fetch(PROXY_URL.replace(/\/$/, "") + "/push/reminder", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        subscription: sub.toJSON(),
        fireAt,
        title: t("remindTitle", { line }),
        body: t("remindBody", { line, dest, time }),
        tag: `rem-${line}-${fireAt}`,
      }),
    });
    if (msg) msg.textContent = res.ok ? t("remindDone", { time, min: lead }) : t("connFail");
  } catch (e) {
    if (msg) msg.textContent = t("connFail");
  }
}

function bindStopSearch(input, results) {
  let timer = null, seq = 0;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 3) { results.innerHTML = ""; return; }
    timer = setTimeout(async () => {
      const mySeq = ++seq;
      try {
        const data = await gql(
          `query ($name: String) { stops(name: $name) { gtfsId name@L code } }`, { name: q });
        if (mySeq !== seq) return;
        const hits = (data.stops || [])
          .filter(s => s.gtfsId.startsWith(feedId + ":"))
          .slice(0, 20);
        results.innerHTML = hits.length
          ? hits.map(s => `<li><a class="item" href="#/pysakki/${encodeURIComponent(s.gtfsId)}">
              <span>${esc(s.name)}</span> <span class="muted">${esc(s.code || "")}</span></a></li>`).join("")
          : `<li><p class="muted">${t("noStopsFor", { q: esc(q) })}</p></li>`;
      } catch (err) {
        if (mySeq === seq) results.innerHTML = `<li><div class="error">${esc(err.message)}</div></li>`;
      }
    }, 300);
  });
}

// Yhdistetty etusivun haku: linjat (cached), pysäkit (gql) ja osoitteet
// (geokoodaus) yhdessä, kategorioituina. Osoite avaa reittioppaan määränpääksi.
function bindUnifiedSearch(input, results) {
  let timer = null, seq = 0;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const q = input.value.trim();
    const digits = /^\d+$/.test(q);
    if (q.length < 2 && !(digits && q.length >= 1)) { results.innerHTML = ""; return; }
    timer = setTimeout(async () => {
      const mySeq = ++seq;
      results.innerHTML = `<li><p class="muted">${t("searching")}</p></li>`;
      try {
        await findFeed();
        const ql = q.toLowerCase();
        const routes = await loadRoutes().catch(() => []);
        const lineHits = routes.filter(r =>
          (r.shortName || "").toLowerCase().includes(ql) ||
          (r.longName || "").toLowerCase().includes(ql)).slice(0, 6);

        // Pysäkit ja osoitteet vain ≥2 merkillä (lyhyt numero = linjahaku)
        let stopHits = [], placeHits = [];
        if (q.length >= 2) {
          const [stopsRes, geoRes] = await Promise.allSettled([
            gql(`query ($name: String) { stops(name: $name) { gtfsId name@L code } }`, { name: q }),
            geocode(q),
          ]);
          if (mySeq !== seq) return;
          stopHits = stopsRes.status === "fulfilled"
            ? (stopsRes.value.stops || []).filter(s => s.gtfsId.startsWith(feedId + ":")).slice(0, 6) : [];
          placeHits = (geoRes.status === "fulfilled" ? geoRes.value : [])
            .filter(p => p.layer !== "stop").slice(0, 5);
        }
        if (mySeq !== seq) return;

        let html = "";
        if (lineHits.length) {
          html += `<li class="search-cat">${t("catLines")}</li>` +
            lineHits.map(r => `<li><a class="item" href="#/linja/${encodeURIComponent(r.gtfsId)}">
              ${badgeHtml(r)} <span>${esc(r.longName)}</span></a></li>`).join("");
        }
        if (stopHits.length) {
          html += `<li class="search-cat">${t("catStops")}</li>` +
            stopHits.map(s => `<li><a class="item" href="#/pysakki/${encodeURIComponent(s.gtfsId)}">
              <span>${icon("pin")} ${esc(s.name)}</span>
              <span class="muted">${esc(s.code || "")}</span></a></li>`).join("");
        }
        if (placeHits.length) {
          html += `<li class="search-cat">${t("catPlaces")}</li>` +
            placeHits.map((p, i) => `<li><button class="item" type="button" data-place="${i}">
              <span>${icon(PLACE_ICONS[p.layer] || "pin")} ${esc(p.name)}</span></button></li>`).join("");
        }
        if (!html) track("search_fail", q);   // haku ilman osumia = suunnittelijoille arvokas signaali
        results.innerHTML = html || `<li><p class="muted">${t("noMatches")}</p></li>`;

        // Osoiteklikkaus: aseta reittioppaan määränpää ja avaa reittihaku
        results.querySelectorAll("button[data-place]").forEach(btn =>
          btn.addEventListener("click", () => {
            const p = placeHits[+btn.dataset.place];
            if (!p) return;
            addRecent(p);
            planState.to = { name: p.name, lat: p.lat, lon: p.lon };
            planState.from = null;
            location.hash = "#/reitti";
          }));
      } catch (err) {
        if (mySeq === seq) results.innerHTML = `<li><div class="error">${esc(err.message)}</div></li>`;
      }
    }, 250);
  });
}

/* ---------- Suosikit (localStorage) ---------- */

function getFavs() {
  try { return JSON.parse(localStorage.getItem(ns("favorites")) || "[]"); }
  catch (e) { return []; }
}

function saveFavs(favs) {
  try { localStorage.setItem(ns("favorites"), JSON.stringify(favs)); } catch (e) {}
}

function isFav(id) { return getFavs().some(f => f.id === id); }

// Palauttaa true jos kohde lisättiin, false jos poistettiin
function toggleFav(item) {
  const favs = getFavs();
  const i = favs.findIndex(f => f.id === item.id);
  if (i >= 0) favs.splice(i, 1); else favs.push(item);
  saveFavs(favs);
  // Linjasuosikin muuttuessa: päivitä palvelimen seurattu linjalista taustapushia varten
  if (item.type === "route") resyncPushIfEnabled();
  return i < 0;
}

function favButtonHtml(id) {
  const fav = isFav(id);
  return `<button class="star no-print" id="favBtn" aria-pressed="${fav}"
    aria-label="${fav ? t("favRemove") : t("favAdd")}" title="${t("favTitle")}">${icon("star")}</button>`;
}

function bindFavButton(item) {
  const btn = document.getElementById("favBtn");
  if (!btn) return;
  btn.addEventListener("click", () => {
    const added = toggleFav(item);
    btn.setAttribute("aria-pressed", String(added));
    btn.setAttribute("aria-label", added ? t("favRemove") : t("favAdd"));
  });
}

function renderFavorites() {

  if (!card) return;
  const favs = getFavs();
  if (!favs.length) { card.hidden = true; return; }
  card.hidden = false;
  const routes = favs.filter(f => f.type === "route");
  document.getElementById("favBody").innerHTML = `
    ${routes.length ? `<div class="legchips">${routes.map(r =>
        `<a class="badge" href="#/linja/${encodeURIComponent(r.id)}"
            ${r.color ? `style="background:#${esc(r.color)};color:${badgeText(r.color, r.textColor)}"` : ""}
            title="${esc(r.name)}">${esc(r.shortName)}</a>`).join("")}</div>` : ""}
    <div id="favStops"><p class="muted">${t("favLoading")}</p></div>`;
  if (!favs.some(f => f.type === "stop")) document.getElementById("favStops").innerHTML = "";
  renderFavStops();
}

/* ---------- Etusivun lähimmät lähdöt ---------- */

const NEARBY_QUERY = `
  query ($lat: Float!, $lon: Float!) {
    stopsByRadius(lat: $lat, lon: $lon, radius: 800, first: 25) {
      edges { node { distance stop {
        gtfsId name@L code wheelchairBoarding
        stoptimesWithoutPatterns(numberOfDepartures: 3, omitNonPickups: true) {
          scheduledDeparture realtimeDeparture realtime serviceDay headsign@L
          trip { wheelchairAccessible occupancy { occupancyStatus } route { gtfsId shortName color textColor } }
        }
      } } }
    }
  }`;

let lastCoords = null;
let nearbyAccessibleOnly = localStorage.getItem(ns("accOnly")) === "1";

// Täyttöaste näytetään vain kun syöte kertoo sen; LSL:n GTFS-RT antaa nyt
// NO_DATA_AVAILABLE, jolloin ikonia ei näytetä lainkaan (degrade gracefully)
const OCCUPANCY_LABELS = {
  EMPTY: ["low", "occEmpty"],
  MANY_SEATS_AVAILABLE: ["low", "occMany"],
  FEW_SEATS_AVAILABLE: ["mid", "occFew"],
  STANDING_ROOM_ONLY: ["high", "occStanding"],
  CRUSHED_STANDING_ROOM_ONLY: ["full", "occCrushed"],
  FULL: ["full", "occFull"],
};

function occupancyHtml(trip) {
  const o = OCCUPANCY_LABELS[trip?.occupancy?.occupancyStatus];
  return o ? ` <span class="occ-dot occ-${o[0]}" role="img" aria-label="${t(o[1])}" title="${t(o[1])}"></span>` : "";
}

// WCAG-kontrasti: syötteen tekstiväriä käytetään vain jos se täyttää 4.5:1,
// muuten valitaan musta tai valkoinen luminanssin mukaan
function relLum(hex) {
  const v = [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}

function badgeText(bgHex, prefHex) {
  const L = relLum(bgHex);
  const ratio = fg => (Math.max(L, fg) + 0.05) / (Math.min(L, fg) + 0.05);
  if (prefHex && ratio(relLum(prefHex)) >= 4.5) return "#" + prefHex;
  return ratio(1) >= ratio(0) ? "#ffffff" : "#10141c";
}

// Feedin geneerinen oletusväri linjalistaa varten: jos yksi väri esiintyy vähintään puolella
// linjoista, se on "sininen seinä" (esim. Lahti #005EBB 101/105) → ne saavat neutraalin
// rondellin. Aidosti erottuva vähemmistöväri (erikoisreitit, esim. 81B/81C, Kotkan vihreät
// P-linjat) ei ylitä kynnystä → säilyttää täytetyn värinsä. Värittömät linjat ovat aina neutraaleja.
function dominantRouteColor(routes) {
  const counts = {};
  for (const r of routes) if (r.color) {
    const c = r.color.toUpperCase(); counts[c] = (counts[c] || 0) + 1;
  }
  let top = null, topN = 0;
  for (const c in counts) if (counts[c] > topN) { topN = counts[c]; top = c; }
  return (top && topN >= routes.length * 0.5) ? top : null;
}

// Linjan virallinen brändiväri badgessa, kun syöte sen kertoo
function badgeHtml(route, fallback) {
  const style = route?.color
    ? ` style="background:#${route.color};color:${badgeText(route.color, route.textColor)}"` : "";
  return `<span class="badge"${style}>${esc(route?.shortName || fallback || "")}</span>`;
}

function depTableRows(stoptimes) {
  // Poista feed-duplikaatit (sama linja kahdesti eri liikennöitsijällä → tuplalähdöt)
  const seen = new Set();
  return (stoptimes || []).filter(st => {
    const r = st.trip && st.trip.route;
    const k = ((r && r.shortName) || "") + "|" + (st.headsign || "") + "|" + ((st.serviceDay || 0) + (st.scheduledDeparture || 0));
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  }).map(st => {
    const d = depInfo(st);
    const acc = st.trip?.wheelchairAccessible === "POSSIBLE"
      ? ` <span role="img" aria-label="${t("accVehicle")}" title="${t("accVehicle")}">${icon("wheelchair")}</span>` : "";
    const rid = st.trip && st.trip.route && st.trip.route.gtfsId;
    const badge = rid
      ? `<a class="badgelink" href="#/linjakartta/${encodeURIComponent(rid)}" title="${t("lineMapLink")}">${badgeHtml(st.trip.route)}</a>`
      : badgeHtml(st.trip.route);
    return `<tr>
      <td>${badge}</td>
      <td>${esc(st.headsign || "")}${acc}${occupancyHtml(st.trip)}</td>
      <td class="${d.rt ? "rt" : ""}">${d.when}${d.rt ? " ●" : ""}</td>
    </tr>`;
  }).join("");
}

function stopDepGroupHtml(stop, extra) {
  const rows = depTableRows(stop.stoptimesWithoutPatterns);
  if (!rows) return "";
  const acc = stop.wheelchairBoarding === "POSSIBLE"
    ? ` <span class="acc-mark" role="img" aria-label="${t("accStop")}" title="${t("accStop")}">${icon("wheelchair")}</span>` : "";
  return `<h3 class="stophead"><a href="#/pysakki/${encodeURIComponent(stop.gtfsId)}">${esc(stop.name)}</a>${acc}
      ${extra ? `<span class="dist">${extra}</span>` : ""}</h3>
    <table class="deps"><tbody>${rows}</tbody></table>`;
}

async function renderNearby() {
  const el = document.getElementById("nearbyBody");
  if (!el || !lastCoords) return;
  try {
    await findFeed();
    const { data, cachedAt } = await cachedGql("nearby", NEARBY_QUERY, lastCoords);
    if (!document.getElementById("nearbyBody")) return;
    const all = (data.stopsByRadius?.edges || [])
      .map(e => e.node)
      .filter(n => n.stop && n.stop.gtfsId.startsWith(feedId + ":")
                && (n.stop.stoptimesWithoutPatterns || []).length)
      .sort((a, b) => a.distance - b.distance);
    const groups = (nearbyAccessibleOnly
      ? all.filter(n => n.stop.wheelchairBoarding === "POSSIBLE") : all).slice(0, 5);
    const toggle = `<label class="acc-toggle no-print"><input type="checkbox" id="accOnly"${nearbyAccessibleOnly ? " checked" : ""}> <span>${icon("wheelchair")} ${t("accOnlyToggle")}</span></label>`;
    const list = groups.length
      ? (cachedAt ? staleNoteHtml(cachedAt) : "")
        + groups.map(n => stopDepGroupHtml(n.stop, n.distance + " m")).join("")
        + `<p class="muted"><span class="rt">●</span> ${t("rtLegend")}</p>`
      : `<p class="muted">${nearbyAccessibleOnly ? t("accNearbyNone") : t("noDepsRadius")}</p>`;
    const box = document.getElementById("nearbyBody");
    box.innerHTML = toggle + list;
    const cb = document.getElementById("accOnly");
    if (cb) cb.addEventListener("change", () => {
      nearbyAccessibleOnly = cb.checked;
      localStorage.setItem(ns("accOnly"), nearbyAccessibleOnly ? "1" : "0");
      renderNearby();
    });
  } catch (err) {
    const box = document.getElementById("nearbyBody");
    if (box && !box.querySelector("table")) {
      box.innerHTML = `<div class="error">${esc(err.message)}</div>`;
    } // jos vanhat lähdöt näkyvät, verkkohikka ei pyyhi niitä pois
  }
}

// Lähimmät lähdöt -paikannuksen käynnistin (etusivun yhtenäisen haun viereinen nappi
// kutsuu tätä). null jos selain ei tue paikannusta.
let nearbyLocate = null;
function initNearby(body) {
  if (!navigator.geolocation) {
    body.innerHTML = `<p class="muted">${t("geoUnsupportedHint")}</p>`;
    nearbyLocate = null;
    return;
  }
  const locate = () => {
    body.innerHTML = `<p class="muted">${t("gettingLocation")}</p>`;
    navigator.geolocation.getCurrentPosition(pos => {
      localStorage.setItem("geoAllowed", "1");
      lastCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      renderNearby();
    }, err => {
      localStorage.removeItem("geoAllowed");
      body.innerHTML = `<div class="error">${t("geoFail")}${esc(err.message)}</div>
        <p class="muted">${t("searchByNameHint")}</p>`;
    }, { timeout: 10000, maximumAge: 60000 });
  };
  nearbyLocate = locate;
  // Luvan kanssa: paikannetaan heti. Ilman lupaa: hero-nappi käynnistää (prompt pyytää luvan).
  if (localStorage.getItem("geoAllowed")) locate();
}

        .filter(r => !f || (r.shortName || "").toLowerCase().includes(f)
                        || (r.longName || "").toLowerCase().includes(f))

          const special = r.color && r.color.toUpperCase() !== generic;
          const style = special
            ? ` style="--rc:#${r.color};--rt:${badgeText(r.color, r.textColor)}"` : "";
          return `<li><a class="route-tile" href="#/linja/${encodeURIComponent(r.gtfsId)}"${style}

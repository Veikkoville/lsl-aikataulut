<script>
// Teema ratkaistaan ennen ensimmäistä maalausta välähdyksen välttämiseksi
(function () {
  function apply() {
    var pref = localStorage.getItem("theme") || "auto";
    var dark = pref === "dark" ||
      (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = dark ? "#102a4d" : "#0a4ea3";
  }
  apply();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", apply);
  window.applyTheme = apply;
})();
</script>

    --sev-warning: #d68910;

  html[data-theme="dark"] {

    --btn-bg: #155bb5;

    --bg: #0f1522;
    --card: #19202f;
    --text: #e6ebf5;
    --muted: #9aa6bd;
    --green: #5ecf96;
    --border: #323c52;
    --hover: #222c42;
    --chip: #243049;
    --rt-bg: #14301f;
    --rt-text: #7fd6a4;

    --error-border: #7a2e2e;

    color: var(--text);

  * { box-sizing: border-box; }
  a { color: var(--blue); }
  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, summary:focus-visible {
    outline: 3px solid var(--blue);
    outline-offset: 2px;
  }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    background: linear-gradient(120deg, var(--header-bg), var(--header-bg2));
    color: #fff;
    padding: 0.85rem 1rem;
  }
  .brand {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    max-width: 760px;
    margin: 0 auto;
  }
  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.6rem;
    height: 2.6rem;
    background: rgba(255, 255, 255, 0.16);
    border-radius: 14px;
    font-size: 1.35rem;
    flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 1.2rem; letter-spacing: 0.01em; }
  header p { margin: 0.1rem 0 0; font-size: 0.78rem; opacity: 0.88; }
  main { max-width: 760px; margin: 0 auto; padding: 1rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.05rem;
    margin-bottom: 1rem;
    box-shadow: 0 1px 3px var(--shadow);
  }
  h2 { font-size: 1.05rem; margin: 0 0 0.5rem; }
  input[type="search"], input[type="password"], input[type="date"],
  input[type="datetime-local"], input[type="text"], select {
    font: inherit;
    padding: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 100%;
    background: var(--card);
    color: var(--text);
  }
  select, input[type="datetime-local"] { width: auto; }
  .field { margin: 0.5rem 0; }
  .field > label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.15rem; }
  .suggest { position: relative; }
  .suggest-list {
    position: absolute;
    left: 0; right: 0; top: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0 0 6px 6px;
    box-shadow: 0 4px 12px var(--shadow);
    max-height: 15rem;
    overflow: auto;
    z-index: 500;
  }
  button {
    font: inherit;
    padding: 0.5rem 0.9rem;
    border: none;
    border-radius: 8px;
    background: var(--btn-bg);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s;

  button:hover { background: var(--btn-hover); }

    background: none;
    color: var(--blue);
    padding: 0.2rem 0.4rem;

  .row { display: flex; gap: 0.5rem; align-items: center; }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { border-top: 1px solid var(--border); }

    display: flex;
    gap: 0.75rem;
    align-items: baseline;
    width: 100%;
    text-align: left;
    padding: 0.55rem 0.25rem;
    background: none;
    border: none;
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
    font: inherit;

  a.item:hover, button.item:hover { background: var(--hover); }
  .badge {
    display: inline-block;
    min-width: 2.4em;
    text-align: center;
    background: var(--btn-bg);
    color: #fff;
    border-radius: 5px;
    padding: 0.05rem 0.4rem;
    font-weight: 600;
    font-size: 0.95rem;
    flex-shrink: 0;

  .muted { color: var(--muted); font-size: 0.85rem; }
  a.badge { text-decoration: none; }
  button.star {
    background: none;
    color: var(--star);

    color: var(--text);

  table.deps th:last-child, table.deps td:last-child {

  .timegrid { display: flex; flex-wrap: wrap; gap: 0.35rem; }

    background: var(--chip);

  .error { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); padding: 0.6rem; border-radius: 6px; }

    border-radius: 4px;
    padding: 0.45rem 0.6rem;
    margin: 0.4rem 0;

    font-size: 0.68rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  details.itin {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.6rem 0.8rem;
    margin: 0.55rem 0;
    background: var(--card);

  }

  details.itin summary::after {
    content: "▾";
    position: absolute;
    right: 0.1rem;
    top: 0.1rem;
    color: var(--muted);
    transition: transform 0.15s;
  }

    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: 700;
    color: #fff;
    min-width: 0.9rem;
    overflow: hidden;
    white-space: nowrap;

  .legbar .seg.walk {
    background: repeating-linear-gradient(45deg, var(--chip) 0 5px, var(--border) 5px 10px);
    color: var(--text);
  }

  .tl { margin: 0.7rem 0 0.2rem; }
  .tl-row {
    display: grid;
    grid-template-columns: 3.3rem 1.1rem 1fr;
    column-gap: 0.6rem;
  }
  .tl-time {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 0.9rem;
    padding-top: 0.05rem;
  }
  .tl-mid { position: relative; }
  .tl-row.pt .tl-mid::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 0.3rem;
    width: 0.66rem;
    height: 0.66rem;
    border-radius: 50%;
    background: var(--card);
    border: 3px solid var(--blue);
    transform: translateX(-50%);
    z-index: 1;
    box-sizing: border-box;
  }
  .tl-row.pt.start .tl-mid::after { border-color: var(--green); }
  .tl-row.pt.end .tl-mid::after { border-color: var(--sev-severe); }
  .tl-row.leg .tl-mid::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -0.5rem;
    bottom: -0.5rem;
    width: 5px;
    transform: translateX(-50%);
    background: var(--rail, var(--blue));
    border-radius: 3px;
  }
  .tl-row.leg.dashed .tl-mid::before {
    width: 0;
    border-left: 4px dotted var(--rail, var(--muted));
    background: none;
    border-radius: 0;
  }
  .tl-body { padding: 0.05rem 0 0.7rem; min-width: 0; }
  .tl-row.leg .tl-body { padding: 0.35rem 0 0.9rem; font-size: 0.92rem; }
  details.tl-stops { margin-top: 0.15rem; }
  details.tl-stops summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }
  details.tl-stops ul { list-style: none; margin: 0.25rem 0 0; padding: 0 0 0 0.2rem; }
  details.tl-stops li { font-size: 0.85rem; color: var(--muted); padding: 0.1rem 0; }
  nav.crumb { margin-bottom: 0.75rem; font-size: 0.9rem; }
  nav.crumb a { color: var(--blue); }
  footer { max-width: 760px; margin: 0 auto; padding: 0 1rem 2rem; font-size: 0.78rem; color: var(--muted); }
  @media print {
    html, html[data-theme="dark"] {
      --bg: #fff; --card: #fff; --text: #000; --muted: #444;
      --border: #ccc; --chip: #fff; --hover: #fff;
      --rt-bg: #fff; --rt-text: #000;
    }
    body { background: #fff; }
    header { background: none; color: #000; padding: 0 0 0.5rem; }
    header p, .logo, nav.crumb, .tabs, .map, .map-small, .no-print, #routeAlerts, button { display: none !important; }
    .card { border: none; padding: 0.25rem 0; margin: 0; break-inside: avoid; }
    .badge { border: 1px solid #000; background: none; color: #000; }
    .timegrid span { background: none; border: 1px solid #ccc; }
  }
</style>
</head>

let lang = localStorage.getItem("lang") || "fi";
if (!STRINGS[lang]) lang = "fi";

function t(key, params) {
  let s = STRINGS[lang][key] ?? STRINGS.fi[key] ?? key;
  const all = { city: CONFIG.city, cityGen: CONFIG.cityGenitive,
                operator: CONFIG.operator, operatorShort: CONFIG.operatorShort, ...params };
  return s.replace(/\{(\w+)\}/g, (_, k) => all[k] ?? "");
}

function updateChrome() {
  document.documentElement.lang = lang;
  document.title = t("appTitleTag");
  document.getElementById("appTitle").textContent = t("appTitle");
  document.getElementById("appSub").textContent = t("headerSub");
  document.getElementById("appFooter").textContent = t("footerNote");
}

let apiKey = localStorage.getItem("digitransitKey") || "";
// "feedId" on nykyinen avain; "lslFeedId" luetaan migraationa vanhoilta kävijöiltä
let feedId = localStorage.getItem("feedId") || localStorage.getItem("lslFeedId") || "";
let routesCache = null;
let refreshTimer = null;

/* ---------- API ---------- */

async function gql(query, variables) {
  const headers = { "Content-Type": "application/json" };
  if (!PROXY_URL) headers["digitransit-subscription-key"] = apiKey;
  const res = await fetch(API_URL, {
    method: "POST",
    headers,
    body: JSON.stringify({ query, variables }),
  });
  if (res.status === 401 || res.status === 403) {
    throw new Error(t("errApiKey"));
  }
  if (!res.ok) throw new Error(t("errApi") + "HTTP " + res.status);
  const json = await res.json();
  if (json.errors) throw new Error(t("errApi") + json.errors.map(e => e.message).join("; "));
  return json.data;
}

/* ---------- Offline-välimuisti: viimeksi nähty data ---------- */

function cachePut(key, data) {
  const write = () =>
    localStorage.setItem("cache:" + key, JSON.stringify({ ts: Date.now(), data }));
  try { write(); } catch (e) {
    // localStorage täynnä: tyhjennä välimuisti ja yritä kerran uudelleen
    try {
      for (const k of Object.keys(localStorage)) {
        if (k.startsWith("cache:")) localStorage.removeItem(k);
      }
      write();
    } catch (e2) { /* ilman välimuistia pärjätään */ }
  }
}

function cacheGet(key) {
  try {
    const hit = JSON.parse(localStorage.getItem("cache:" + key) || "null");
    return hit && hit.data ? hit : null;
  } catch (e) { return null; }
}

// Onnistunut haku tallennetaan; virheen sattuessa palautetaan viimeksi
// nähty versio. cachedAt != null kertoo näkymälle, että data on vanhaa.
async function cachedGql(key, query, variables) {
  try {
    const data = await gql(query, variables);
    cachePut(key, data);
    return { data, cachedAt: null };
  } catch (err) {
    const hit = cacheGet(key);
    if (hit) return { data: hit.data, cachedAt: hit.ts };
    throw err;
  }
}

function staleNoteHtml(ts) {
  const d = new Date(ts);
  const time = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const sameDay = d.toDateString() === new Date().toDateString();
  const when = sameDay ? time
    : t("dateAt", { date: d.toLocaleDateString(lang === "fi" ? "fi-FI" : lang === "sv" ? "sv-FI" : "en-GB"), time });
  return `<p class="muted">${t("staleNote", { when })}</p>`;
}

// Käynnistyssiivous: vanhentuneet ja ylimääräiset cache-avaimet pois
(function cleanCache() {
  try {
    const entries = [];
    for (const k of Object.keys(localStorage)) {
      if (!k.startsWith("cache:")) continue;
      try {
        const v = JSON.parse(localStorage.getItem(k));
        if (!v?.ts || Date.now() - v.ts > 7 * 24 * 3600 * 1000) localStorage.removeItem(k);
        else entries.push([k, v.ts]);
      } catch (e) { localStorage.removeItem(k); }
    }
    entries.sort((a, b) => a[1] - b[1]);
    while (entries.length > 30) localStorage.removeItem(entries.shift()[0]);
  } catch (e) { /* localStorage estetty: ohitetaan */ }
})();

async function findFeed() {
  if (feedId) return feedId;
  const data = await gql(`{ feeds { feedId publisher { name } } }`);
  const hit = data.feeds.find(f =>
    CONFIG.feedMatch.test(f.feedId) || CONFIG.feedMatch.test(f.publisher?.name || ""));
  if (!hit) throw new Error(t("errFeedNotFound"));
  feedId = hit.feedId;
  localStorage.setItem("feedId", feedId);
  return feedId;
}

async function loadRoutes() {
  if (routesCache) return routesCache;
  try {
    const cached = JSON.parse(localStorage.getItem("routesCache2") || "null");
    if (cached && Date.now() - cached.ts < 24 * 3600 * 1000 && cached.routes?.length) {
      routesCache = cached.routes;
      return routesCache;
    }
  } catch (e) { /* rikkinäinen välimuisti ohitetaan */ }
  const feed = await findFeed();
  const data = await gql(
    `query ($feeds: [String]) {
       routes(feeds: $feeds) { gtfsId shortName longName mode color textColor }
     }`, { feeds: [feed] });
  routesCache = data.routes
    .filter(r => r.mode === "BUS")
    .sort((a, b) => (a.shortName || "").localeCompare(b.shortName || "", "fi", { numeric: true }));
  try {
    localStorage.setItem("routesCache2", JSON.stringify({ ts: Date.now(), routes: routesCache }));
  } catch (e) { /* täysi localStorage ei ole este */ }
  return routesCache;
}

/* ---------- Helpers ---------- */

function fmtSec(sec) {
  const h = Math.floor(sec / 3600) % 24;
  const m = Math.floor((sec % 3600) / 60);
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}

// Lähtöajan esitys: "nyt" / "5 min" / "14:32"; rt = reaaliaikainen arvio
function depInfo(st) {
  const dep = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
  const epoch = (st.serviceDay + dep) * 1000;
  const mins = Math.round((epoch - Date.now()) / 60000);
  const when = mins <= 0 ? t("depNow") : mins < 60 ? t("depMin", { n: mins }) : fmtSec(dep);
  return { when, rt: !!st.realtime };
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Google encoded polyline, precision 1e-5 (OTP:n patternGeometry-muoto)
function decodePolyline(str) {
  let index = 0, lat = 0, lng = 0;
  const coords = [];
  while (index < str.length) {
    for (const which of [0, 1]) {
      let result = 0, shift = 0, b;
      do {
        b = str.charCodeAt(index++) - 63;
        result |= (b & 0x1f) << shift;
        shift += 5;
      } while (b >= 0x20);
      const delta = (result & 1) ? ~(result >> 1) : (result >> 1);
      if (which === 0) lat += delta; else lng += delta;
    }
    coords.push([lat / 1e5, lng / 1e5]);
  }
  return coords;
}

    s.onload = resolve;
    s.onerror = () => reject(new Error(t("errLibLoad") + src));

    l.href = href;
    l.onload = resolve;
    l.onerror = () => reject(new Error(t("errLibLoad") + href));
    document.head.appendChild(l);

}

/* ---------- Live vehicle positions (Waltti GTFS-RT via MQTT) ---------- */

// Minimaalinen protobuf-kävelijä: riittää GTFS-RT VehiclePositionin
// koordinaattien poimintaan ilman riippuvuuksia
function pbParse(buf) {
  const out = [];
  let i = 0;
  while (i < buf.length) {
    let key = 0, shift = 0, b;
    do { b = buf[i++]; key |= (b & 0x7f) << shift; shift += 7; } while (b & 0x80);
    const field = key >>> 3, wire = key & 7;
    if (wire === 0) {
      do { b = buf[i++]; } while (b & 0x80);
      out.push({ field, wire });
    } else if (wire === 2) {
      let len = 0; shift = 0;
      do { b = buf[i++]; len |= (b & 0x7f) << shift; shift += 7; } while (b & 0x80);
      out.push({ field, wire, bytes: buf.subarray(i, i + len) }); i += len;
    } else if (wire === 5) { out.push({ field, wire, bytes: buf.subarray(i, i + 4) }); i += 4; }
    else if (wire === 1) { out.push({ field, wire, bytes: buf.subarray(i, i + 8) }); i += 8; }
    else return out; // tuntematon wire-tyyppi: lopetetaan siististi
  }
  return out;
}

function pbFloat(b) {
  return new DataView(b.buffer, b.byteOffset, 4).getFloat32(0, true);
}

// FeedMessage(2: entity) -> FeedEntity(4: vehicle) -> VehiclePosition(2: position)
function decodeVehiclePosition(buf) {
  for (const fm of pbParse(buf)) {
    if (fm.field !== 2 || fm.wire !== 2) continue;
    for (const ent of pbParse(fm.bytes)) {
      if (ent.field !== 4 || ent.wire !== 2) continue;
      for (const vp of pbParse(ent.bytes)) {
        if (vp.field === 2 && vp.wire === 2) {
          const pos = {};
          for (const p of pbParse(vp.bytes)) {
            if (p.field === 1 && p.bytes) pos.lat = pbFloat(p.bytes);
            if (p.field === 2 && p.bytes) pos.lon = pbFloat(p.bytes);
          }
          return pos;
        }
      }
    }
  }
  return null;
}

let mqttClient = null;
let vehicleSweep = null;

// Bussin klikkauspopup: linja, määränpää, aikataulupoikkeama ja seuraavat
// pysäkit GraphQL:n trip-haulla (topicin tripId + seuraava pysäkki)
const tripInfoCache = new Map();

async function vehiclePopupHtml(tripId, nextStopId) {
  const cached = tripInfoCache.get(tripId);
  if (cached && Date.now() - cached.ts < 20000) return cached.html;
  const data = await gql(
    `query ($id: String!, $date: String!) {
       trip(id: $id) {
         tripHeadsign route { shortName }
         stoptimesForDate(serviceDate: $date) {
           scheduledDeparture realtimeDeparture realtime departureDelay serviceDay
           stop { gtfsId name }
         }
       }
     }`, { id: feedId + ":" + tripId, date: todayISO().replace(/-/g, "") });
  const trip = data.trip;
  if (!trip) return t("vehNoTrip");
  const sts = trip.stoptimesForDate || [];
  let idx = sts.findIndex(st => st.stop.gtfsId === feedId + ":" + nextStopId);
  if (idx < 0) {
    const now = Date.now();
    idx = sts.findIndex(st =>
      (st.serviceDay + (st.realtime ? st.realtimeDeparture : st.scheduledDeparture)) * 1000 > now);
  }
  const cur = idx >= 0 ? sts[idx] : null;
  let delayText = "";
  if (cur && cur.realtime) {
    const d = cur.departureDelay;
    delayText = d >= 60 ? t("vehLate", { n: Math.round(d / 60) })
      : d <= -60 ? t("vehEarly", { n: Math.round(-d / 60) })
      : t("vehOnTime");
  }
  const nexts = idx >= 0 ? sts.slice(idx, idx + 4) : [];
  const html = `<strong>${t("vehLine", { line: esc(trip.route.shortName), dest: esc(trip.tripHeadsign || "") })}</strong>
    ${delayText ? `<br>${delayText}` : ""}
    ${nexts.length ? `<br><span class="muted">${t("vehNextStops")}</span><br>`
      + nexts.map(st => {
          const dep = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
          return `${fmtSec(dep)} <a href="#/pysakki/${encodeURIComponent(st.stop.gtfsId)}">${esc(st.stop.name)}</a>`;
        }).join("<br>") : ""}`;
  tripInfoCache.set(tripId, { ts: Date.now(), html });
  return html;
}

// Näyttää listan linjoista live-busseina kartalla. Kerrallaan aktiivisena on
// yksi tilaus: uusi kutsu (esim. toisen reittiehdotuksen avaus) siirtää bussit
// uudelle kartalle.
async function startVehicles(map, routeList) {
  const mySeq = viewSeq;
  try {
    await ensureMqtt();
    await findFeed(); // MQTT-topic ja trip-haut tarvitsevat feedId:n
  } catch (e) { return; }
  if (mySeq !== viewSeq) return; // näkymä ehti vaihtua latauksen aikana
  stopVehicles();
  const byNum = new Map(routeList.map(r => [r.gtfsId.split(":")[1], r]));
  const markers = new Map(); // vehicleId -> { marker, ts }
  mqttClient = mqtt.connect(CONFIG.mqttUrl, { reconnectPeriod: 5000 });
  mqttClient.on("connect", () => {
    if (!mqttClient) return;
    for (const num of byNum.keys()) {
      mqttClient.subscribe(`/gtfsrt/vp/${feedId}/+/+/+/${num}/#`);
    }
  });
  mqttClient.on("message", (topic, payload) => {
    const seg = topic.split("/");
    const route = byNum.get(seg[7]);
    if (!route) return;
    const vehId = seg[13] || topic;
    const headsign = seg[9] || "";
    const pos = decodeVehiclePosition(payload);
    if (!pos || pos.lat == null || pos.lon == null) return;
    let m = markers.get(vehId);
    if (!m) {
      const icon = L.divIcon({ className: "bus-marker", html: esc(route.shortName), iconSize: [26, 26] });
      m = { marker: L.marker([pos.lat, pos.lon], { icon, zIndexOffset: 1000 })
        .addTo(map).bindTooltip("").bindPopup(t("vehLoading"), { maxWidth: 280 }) };
      m.marker.on("popupopen", async () => {
        try {
          m.marker.setPopupContent(await vehiclePopupHtml(m.tripId, m.nextStop));
        } catch (err) {
          m.marker.setPopupContent(t("vehLoadFail"));
        }
      });
      markers.set(vehId, m);
    }
    m.tripId = seg[10] || "";
    m.nextStop = seg[11] || "";
    m.marker.setLatLng([pos.lat, pos.lon]);
    m.marker.setTooltipContent(t("vehLine", { line: esc(route.shortName), dest: esc(headsign) }));
    m.ts = Date.now();
  });
  // siivoa bussit, joista ei ole kuulunut 90 sekuntiin (esim. päätepysäkillä)
  vehicleSweep = setInterval(() => {
    const cutoff = Date.now() - 90000;
    for (const [id, m] of markers) {
      if ((m.ts || 0) < cutoff) { map.removeLayer(m.marker); markers.delete(id); }
    }
  }, 15000);
}

function stopVehicles() {
  if (vehicleSweep) { clearInterval(vehicleSweep); vehicleSweep = null; }
  if (mqttClient) { try { mqttClient.end(true); } catch (e) {} mqttClient = null; }
}

function stopRefresh() {
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  stopVehicles();
}

const SEVERITY_ORDER = { SEVERE: 0, WARNING: 1, INFO: 2, UNKNOWN_SEVERITY: 3 };

let alertsPromise = null;

// Voimassa olevat tiedotteet, haetaan kerran per istunto.
// force=true ohittaa istuntokohtaisen välimuistin (häiriöpollaus).
function loadAlerts(force) {
  if (force) alertsPromise = null;
  if (!alertsPromise) {
    alertsPromise = (async () => {
      const feed = await findFeed();
      const data = await gql(
        `query ($feeds: [String!]) {
           alerts(feeds: $feeds) {
             alertHeaderText alertDescriptionText alertSeverityLevel alertUrl
             effectiveStartDate effectiveEndDate
             route { gtfsId } stop { gtfsId }
           }
         }`, { feeds: [feed] });
      const now = Date.now() / 1000;
      return (data.alerts || []).filter(a =>
        !(a.effectiveStartDate && a.effectiveStartDate > now) &&
        !(a.effectiveEndDate && a.effectiveEndDate < now));
    })().catch(err => { alertsPromise = null; throw err; });
  }
  return alertsPromise;
}

function dedupAlerts(alerts) {
  const seen = new Map();
  for (const a of alerts) {
    seen.set((a.alertHeaderText || "") + "|" + (a.alertDescriptionText || ""), a);
  }
  return [...seen.values()].sort((a, b) =>
    (SEVERITY_ORDER[a.alertSeverityLevel] ?? 9) - (SEVERITY_ORDER[b.alertSeverityLevel] ?? 9));
}

function alertHtml(a) {
  return `<details class="alert sev-${esc(a.alertSeverityLevel)}">
    <summary>${esc(a.alertHeaderText || t("alertDefault"))}</summary>
    <p>${esc(a.alertDescriptionText || "")}</p>
    ${a.alertUrl ? `<p><a href="${esc(a.alertUrl)}" target="_blank" rel="noopener">${t("readMore")}</a></p>` : ""}
  </details>`;
}

// LSL ei kiinnitä tiedotteita linjaobjekteihin, joten linjat poimitaan myös
// tiedotetekstin maininnoista: "linjoja 3, 6, 8(K)" -> 3, 6, 8, 8K
function lineTokensFromText(text) {
  const out = new Set();
  for (const seg of text.matchAll(/linj\w*\s+([0-9][0-9A-ZÅÄÖ()\s,.ja-]*)/gi)) {
    for (const tok of seg[1].matchAll(/(\d+)\s*(?:\(([A-ZÅÄÖ,\s]+)\))?([A-ZÅÄÖ]?)/g)) {
      out.add(tok[1]);
      if (tok[3]) out.add(tok[1] + tok[3]);
      if (tok[2]) for (const l of tok[2].split(/[,\s]+/)) if (l) out.add(tok[1] + l);
    }
  }
  return out;
}

function alertMatchesRoute(a, routeGtfsId, shortName, stopIds) {
  if (a.route && a.route.gtfsId === routeGtfsId) return true;
  if (a.stop && stopIds.has(a.stop.gtfsId)) return true;
  const tokens = lineTokensFromText((a.alertHeaderText || "") + " " + (a.alertDescriptionText || ""));
  return tokens.has((shortName || "").toUpperCase());
}

async function loadAlertsInto(box) {
  try {
    const alerts = dedupAlerts(await loadAlerts());
    if (!alerts.length) { box.innerHTML = ""; return; }
    // tiivis banneri: lista aukeaa pyynnöstä (LSL pitää osaa tiedotteista
    // SEVERE-tasolla viikkoja, joten auto-avaus veisi koko etusivun)
    const label = alerts.length === 1 ? t("alertsCount1") : t("alertsCountN", { n: alerts.length });
    box.innerHTML = `
      <details class="card alertsum">
        <summary><span aria-hidden="true">⚠</span> <strong>${label}</strong></summary>
        ${alerts.map(alertHtml).join("")}
      </details>`;
  } catch (err) {
    box.innerHTML = `<div class="error">${t("alertsFail")}${esc(err.message)}</div>`;
  }
}

/* ---------- Häiriöilmoitukset suosikkilinjoille (sovelluksen ollessa auki) ---------- */

const alertKey = a =>
  (a.alertHeaderText || "") + "|" + (a.alertDescriptionText || "") + "|" + (a.effectiveStartDate || "");

function getSeenAlerts() {
  try { return JSON.parse(localStorage.getItem("seenAlerts") || "{}"); }
  catch (e) { return {}; }
}

function markAlertsSeen(alerts) {
  const seen = getSeenAlerts();
  const cutoff = Date.now() - 30 * 24 * 3600 * 1000;
  for (const k of Object.keys(seen)) if (seen[k] < cutoff) delete seen[k];
  for (const a of alerts) seen[alertKey(a)] = Date.now();
  try { localStorage.setItem("seenAlerts", JSON.stringify(seen)); } catch (e) {}
}

function favRouteAlerts(alerts) {
  const favRoutes = getFavs().filter(f => f.type === "route");
  if (!favRoutes.length) return [];
  const noStops = new Set();
  return dedupAlerts(alerts).filter(a =>
    favRoutes.some(f => alertMatchesRoute(a, f.id, f.shortName, noStops)));
}

async function showAlertNotification(a) {
  const title = a.alertHeaderText || t("alertDefault");
  const opts = { body: (a.alertDescriptionText || "").slice(0, 180), tag: alertKey(a), icon: "icon.svg" };
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg && reg.showNotification) { reg.showNotification(title, opts); return; }
  } catch (e) { /* kokeillaan suoraa konstruktoria */ }
  try { new Notification(title, opts); } catch (e) {}
}

// seedOnly: merkitse nykyiset nähdyiksi ilmoittamatta (käyttöönotto)
async function pollFavAlerts(seedOnly, force = true) {
  if (localStorage.getItem("notifyAlerts") !== "1") return;
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  try {
    const matched = favRouteAlerts(await loadAlerts(force));
    if (seedOnly) { markAlertsSeen(matched); return; }
    const seen = getSeenAlerts();
    const fresh = matched.filter(a => !(alertKey(a) in seen));
    markAlertsSeen(matched);
    for (const a of fresh.slice(0, 3)) showAlertNotification(a);
  } catch (e) { /* seuraava kierros yrittää uudelleen */ }
}

// Globaali ajastin — EI kytkeydy refreshTimeriin, jonka näkymänvaihto tyhjentää
let alertPollTimer = null;

function bindNearbyButton(btn, results) {

    navigator.geolocation.getCurrentPosition(async pos => {

        const data = await gql(
          `query ($lat: Float!, $lon: Float!) {
             stopsByRadius(lat: $lat, lon: $lon, radius: 800, first: 15) {
               edges { node { distance stop { gtfsId name code } } }
             }
           }`, { lat: pos.coords.latitude, lon: pos.coords.longitude });
        const nodes = (data.stopsByRadius?.edges || [])
          .map(e => e.node)
          .filter(n => n.stop && n.stop.gtfsId.startsWith(feedId + ":"))
          .sort((a, b) => a.distance - b.distance);
        results.innerHTML = nodes.length
          ? nodes.map(n => `<li><a class="item" href="#/pysakki/${encodeURIComponent(n.stop.gtfsId)}">
              <span>${esc(n.stop.name)}</span>
              <span class="muted">${n.distance} m</span></a></li>`).join("")
          : `<li><p class="muted">${t("noStopsRadius")}</p></li>`;
      } catch (err) {
        results.innerHTML = `<li><div class="error">${esc(err.message)}</div></li>`;
      }
    }, geoErr => {
      results.innerHTML = `<li><div class="error">${t("geoFail")}${esc(geoErr.message)}</div></li>`;
    }, { timeout: 10000 });
  });
}

/* ---------- Suosikit (localStorage) ---------- */

function getFavs() {
  try { return JSON.parse(localStorage.getItem("favorites") || "[]"); }
  catch (e) { return []; }
}

function saveFavs(favs) {
  try { localStorage.setItem("favorites", JSON.stringify(favs)); } catch (e) {}
}

function isFav(id) { return getFavs().some(f => f.id === id); }

// Palauttaa true jos kohde lisättiin, false jos poistettiin
function toggleFav(item) {
  const favs = getFavs();
  const i = favs.findIndex(f => f.id === item.id);
  if (i >= 0) favs.splice(i, 1); else favs.push(item);
  saveFavs(favs);
  return i < 0;
}

function favButtonHtml(id) {
  const fav = isFav(id);
  return `<button class="star no-print" id="favBtn" aria-pressed="${fav}"
    aria-label="${fav ? t("favRemove") : t("favAdd")}" title="${t("favTitle")}">★</button>`;
}

function bindFavButton(item) {
  const btn = document.getElementById("favBtn");
  if (!btn) return;
  btn.addEventListener("click", () => {
    const added = toggleFav(item);
    btn.setAttribute("aria-pressed", String(added));
    btn.setAttribute("aria-label", added ? t("favRemove") : t("favAdd"));
  });
}

const NEARBY_QUERY = `
  query ($lat: Float!, $lon: Float!) {
    stopsByRadius(lat: $lat, lon: $lon, radius: 800, first: 25) {
      edges { node { distance stop {
        gtfsId name code
        stoptimesWithoutPatterns(numberOfDepartures: 3, omitNonPickups: true) {
          scheduledDeparture realtimeDeparture realtime serviceDay headsign
          trip { wheelchairAccessible occupancy { occupancyStatus } route { gtfsId shortName color textColor } }
        }
      } } }
    }
  }`;

let lastCoords = null;

// Täyttöaste näytetään vain kun syöte kertoo sen; LSL:n GTFS-RT antaa nyt
// NO_DATA_AVAILABLE, jolloin ikonia ei näytetä lainkaan (degrade gracefully)
const OCCUPANCY_LABELS = {
  EMPTY: ["🟢", "occEmpty"],
  MANY_SEATS_AVAILABLE: ["🟢", "occMany"],
  FEW_SEATS_AVAILABLE: ["🟡", "occFew"],
  STANDING_ROOM_ONLY: ["🟠", "occStanding"],
  CRUSHED_STANDING_ROOM_ONLY: ["🔴", "occCrushed"],
  FULL: ["🔴", "occFull"],
};

function occupancyHtml(trip) {
  const o = OCCUPANCY_LABELS[trip?.occupancy?.occupancyStatus];
  return o ? ` <span role="img" aria-label="${t(o[1])}" title="${t(o[1])}">${o[0]}</span>` : "";
}

// WCAG-kontrasti: syötteen tekstiväriä käytetään vain jos se täyttää 4.5:1,
// muuten valitaan musta tai valkoinen luminanssin mukaan
function relLum(hex) {
  const v = [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}

function badgeText(bgHex, prefHex) {
  const L = relLum(bgHex);
  const ratio = fg => (Math.max(L, fg) + 0.05) / (Math.min(L, fg) + 0.05);
  if (prefHex && ratio(relLum(prefHex)) >= 4.5) return "#" + prefHex;
  return ratio(1) >= ratio(0) ? "#ffffff" : "#10141c";
}

// Linjan virallinen brändiväri badgessa, kun syöte sen kertoo
function badgeHtml(route, fallback) {
  const style = route?.color
    ? ` style="background:#${route.color};color:${badgeText(route.color, route.textColor)}"` : "";
  return `<span class="badge"${style}>${esc(route?.shortName || fallback || "")}</span>`;
}

function depTableRows(stoptimes) {
  return (stoptimes || []).map(st => {
    const d = depInfo(st);
    const acc = st.trip?.wheelchairAccessible === "POSSIBLE"
      ? ` <span role="img" aria-label="${t("accVehicle")}" title="${t("accVehicle")}">♿</span>` : "";
    return `<tr>
      <td>${badgeHtml(st.trip.route)}</td>
      <td>${esc(st.headsign || "")}${acc}${occupancyHtml(st.trip)}</td>
      <td class="${d.rt ? "rt" : ""}">${d.when}${d.rt ? " ●" : ""}</td>
    </tr>`;
  }).join("");
}

function stopDepGroupHtml(stop, extra) {
  const rows = depTableRows(stop.stoptimesWithoutPatterns);
  if (!rows) return "";
  return `<h3 class="stophead"><a href="#/pysakki/${encodeURIComponent(stop.gtfsId)}">${esc(stop.name)}</a>
      ${extra ? `<span class="dist">${extra}</span>` : ""}</h3>
    <table class="deps"><tbody>${rows}</tbody></table>`;
}

    await findFeed();
    const { data, cachedAt } = await cachedGql("nearby", NEARBY_QUERY, lastCoords);
    if (!document.getElementById("nearbyBody")) return;
    const groups = (data.stopsByRadius?.edges || [])
      .map(e => e.node)

      .slice(0, 5);
    document.getElementById("nearbyBody").innerHTML = groups.length
      ? (cachedAt ? staleNoteHtml(cachedAt) : "")

      box.innerHTML = `<div class="error">${esc(err.message)}</div>`;
    } // jos vanhat lähdöt näkyvät, verkkohikka ei pyyhi niitä pois

function initNearby(body) {
  if (!navigator.geolocation) {
    body.innerHTML = `<p class="muted">${t("geoUnsupportedHint")}</p>`;
    return;
  }
  const locate = () => {
    body.innerHTML = `<p class="muted">${t("gettingLocation")}</p>`;
    navigator.geolocation.getCurrentPosition(pos => {
      localStorage.setItem("geoAllowed", "1");
      lastCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      renderNearby();
    }, err => {
      localStorage.removeItem("geoAllowed");
      body.innerHTML = `<div class="error">${t("geoFail")}${esc(err.message)}</div>
        <p class="muted">${t("searchByNameHint")}</p>`;
    }, { timeout: 10000, maximumAge: 60000 });
  };
  if (localStorage.getItem("geoAllowed")) {
    locate();
  } else {
    body.innerHTML = `
      <button id="nearbyStart">📍 ${t("showNearby")}</button>
      <p class="muted">${t("geoPrivacy")}</p>`;
    document.getElementById("nearbyStart").addEventListener("click", locate);
  }
}

async function viewRoute(routeId, patternCode, date) {
  if (!PROXY_URL && !apiKey) { location.hash = "#/asetukset"; return; }
  setView(`<p class="muted">${t("loadingRoute")}</p>`);
  date = date || todayISO();

  const { data, cachedAt: routeCachedAt } = await cachedGql("route:" + routeId,
    `query ($id: String!) {
       route(id: $id) {
         shortName longName color textColor
         patterns {
           code name directionId
           trips { gtfsId }
           stops { gtfsId name lat lon }
         }
       }
     }`, { id: routeId });
  const route = data.route;
  if (!route) throw new Error(t("errRouteNotFound") + routeId);

  const patterns = route.patterns || [];
  const current = patterns.find(p => p.code === patternCode) || patterns[0];

  // Selkokielinen suunta: "lähtöpysäkki → päätepysäkki" pattern-koodien sijaan
  const patternLabel = p => {
    const stops = p.stops || [];
    return stops.length
      ? `${stops[0].name} → ${stops[stops.length - 1].name}`
      : (p.name || "");
  };
  // Suunnittain yleisin variantti (eniten vuoroja) välilehdeksi, harvinaiset
  // variaatiot pudotusvalikon taakse
  const byDir = new Map();
  for (const p of patterns) {
    const k = p.directionId ?? 0;
    if (!byDir.has(k)) byDir.set(k, []);
    byDir.get(k).push(p);
  }
  const primaries = [], variants = [];
  for (const list of byDir.values()) {
    list.sort((a, b) => (b.trips?.length || 0) - (a.trips?.length || 0));
    primaries.push(list[0]);
    variants.push(...list.slice(1));
  }

  setView(`
    <nav class="crumb"><a href="#/">← ${t("allRoutes")}</a></nav>
    <div class="card">
      <h2>${favButtonHtml(routeId)}${badgeHtml(route)} ${esc(route.longName)}</h2>
      <div id="routeAlerts"></div>
      <div class="tabs" role="group" aria-label="${t("directionAria")}">
        ${primaries.map(p => `
          <button data-pattern="${esc(p.code)}" aria-pressed="${p === current}">
            ${esc(patternLabel(p))}
          </button>`).join("")}
      </div>
      ${variants.length ? `
        <div class="row no-print" style="margin:0.3rem 0">
          <label class="muted" for="variantSel">${t("moreVariants")}</label>
          <select id="variantSel">
            <option value="">${t("chooseVariant")}</option>
            ${variants.map(p => `
              <option value="${esc(p.code)}"${p === current ? " selected" : ""}>
                ${esc(patternLabel(p))} (${t("nStops", { n: (p.stops || []).length })})
              </option>`).join("")}
          </select>
        </div>` : ""}
      <div class="row no-print">
        <label for="dateInput" class="muted">${t("day")}</label>
        <input type="date" id="dateInput" value="${esc(date)}">
        <button id="printBtn" title="${t("printTitle")}">🖨 ${t("printBtn")}</button>
      </div>
      <div id="timetable"><p class="muted">${t("loadingDeps")}</p></div>
    </div>
    <div class="card">
      <h2>${t("mapStopsTitle")}</h2>
      <div id="routeMap" class="map" aria-label="${t("mapAria")}"></div>
      <p class="muted">${t("busesHint")}</p>
      <ul class="plain">
        ${(current?.stops || []).map(s => `
          <li><a class="item" href="#/pysakki/${encodeURIComponent(s.gtfsId)}">${esc(s.name)}</a></li>`).join("")}
      </ul>
    </div>`);

  bindFavButton({ type: "route", id: routeId, name: route.longName, shortName: route.shortName,
                  color: route.color, textColor: route.textColor });
  document.querySelectorAll("[data-pattern]").forEach(btn =>
    btn.addEventListener("click", () => {
      location.hash = `#/linja/${encodeURIComponent(routeId)}/${encodeURIComponent(btn.dataset.pattern)}/${date}`;
    }));
  document.getElementById("variantSel")?.addEventListener("change", e => {
    if (e.target.value) {
      location.hash = `#/linja/${encodeURIComponent(routeId)}/${encodeURIComponent(e.target.value)}/${date}`;
    }
  });
  document.getElementById("dateInput").addEventListener("change", e => {
    location.hash = `#/linja/${encodeURIComponent(routeId)}/${encodeURIComponent(current.code)}/${e.target.value}`;
  });
  document.getElementById("printBtn").addEventListener("click", () => window.print());

  // Linjaa koskevat poikkeustiedotteet (ei estä muun sivun latausta)
  (async () => {
    try {
      const stopIds = new Set(patterns.flatMap(p => p.stops.map(s => s.gtfsId)));
      const matched = dedupAlerts((await loadAlerts())
        .filter(a => alertMatchesRoute(a, routeId, route.shortName, stopIds)));
      const el = document.getElementById("routeAlerts");
      if (el && matched.length) el.innerHTML = matched.map(alertHtml).join("");
    } catch (err) { /* tiedotteiden puuttuminen ei kaada linjasivua */ }
  })();

  // Map is drawn concurrently with the timetable fetch below
  (async () => {
    const mapEl = document.getElementById("routeMap");
    if (!mapEl || !current) return;
    const mySeq = viewSeq;
    try {
      const [geo] = await Promise.all([
        gql(`query ($code: String!) { pattern(id: $code) { patternGeometry { points } } }`,
          { code: current.code }),
        ensureLeaflet(),
      ]);
      if (mySeq !== viewSeq || !document.getElementById("routeMap")) return;
      const map = makeMap("routeMap");
      const pts = decodePolyline(geo.pattern?.patternGeometry?.points || "");
      let bounds = null;
      if (pts.length) {
        const line = L.polyline(pts, { color: "#0a4ea3", weight: 4, opacity: 0.85 }).addTo(map);
        bounds = line.getBounds();
      }
      const located = current.stops.filter(s => s.lat != null);
      for (const s of located) {
        L.circleMarker([s.lat, s.lon], STOP_MARKER).addTo(map)
          .bindPopup(`<a href="#/pysakki/${encodeURIComponent(s.gtfsId)}">${esc(s.name)}</a>`);
      }
      if (!bounds && located.length) bounds = L.latLngBounds(located.map(s => [s.lat, s.lon]));
      if (bounds) map.fitBounds(bounds, { padding: [15, 15] });
      startVehicles(map, [{ gtfsId: routeId, shortName: route.shortName }]);
    } catch (err) {
      mapEl.outerHTML = `<div class="error">${t("mapFail")}${esc(err.message)}</div>`;
    }
  })();

  // Departure times from the pattern's first stop = classic line timetable
  const box = document.getElementById("timetable");
  if (!current || !current.stops.length) {
    box.innerHTML = `<p class="muted">${t("noStopsDirection")}</p>`;
    return;
  }
  const isToday = date === todayISO();
  const loadTimetable = async () => {
    const dateCompact = date.replace(/-/g, "");
    const { data: tt, cachedAt } = await cachedGql(
      `tt:${routeId}:${current.code}:${date}`,
      `query ($stopId: String!, $date: String!) {
         stop(id: $stopId) {
           stoptimesForServiceDate(date: $date, omitNonPickups: true) {
             pattern { code }
             stoptimes { scheduledDeparture realtimeDeparture realtime serviceDay }
           }
         }
       }`, { stopId: current.stops[0].gtfsId, date: dateCompact });
    const stale = cachedAt || routeCachedAt;
    const sts = (tt.stop?.stoptimesForServiceDate || [])
      .filter(g => g.pattern.code === current.code)
      .flatMap(g => g.stoptimes)
      .sort((a, b) => a.scheduledDeparture - b.scheduledDeparture);
    const el = document.getElementById("timetable");
    if (!el) return;
    if (!sts.length) {
      el.innerHTML = `<p class="muted">${t("noDepsDay")}</p>`;
      return;
    }
    const now = Date.now();
    const depEpoch = st =>
      (st.serviceDay + (st.realtime ? st.realtimeDeparture : st.scheduledDeparture)) * 1000;
    let nextHtml = "";
    if (isToday) {
      const upcoming = sts.filter(st => depEpoch(st) >= now - 30000).slice(0, 3);
      if (upcoming.length) {
        nextHtml = `<p>${t("nextDeps")} ${upcoming.map(st => {
          const d = depInfo(st);
          return `<strong class="${d.rt ? "rt" : ""}">${d.when}${d.rt ? " ●" : ""}</strong>`;
        }).join(" · ")}</p>`;
      }
    }
    const grid = sts.map(st => {
      const dep = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
      const past = isToday && depEpoch(st) < now;
      const cls = (past ? "past" : "") + (st.realtime && !past ? " rt" : "");
      return `<span class="${cls.trim()}"${st.realtime && !past ? ` title="${t("rtTitleAttr")}"` : ""}>
        ${fmtSec(dep)}${st.realtime && !past ? " ●" : ""}</span>`;
    }).join("");
    el.innerHTML = `
      ${stale ? staleNoteHtml(stale) : ""}
      <p class="muted">${t("depsFromStop", { stop: esc(current.stops[0].name) })}</p>
      ${nextHtml}
      <div class="timegrid">${grid}</div>
      ${isToday ? `<p class="muted"><span class="rt">●</span> ${t("rtLegend")}</p>` : ""}`;
  };
  try {
    await loadTimetable();
  } catch (err) {
    box.innerHTML = `<div class="error">${esc(err.message)}</div>`;
  }
  if (isToday) {
    refreshTimer = setInterval(() => loadTimetable().catch(() => {}), 30000);
  }
}

async function viewStop(stopId) {
  if (!PROXY_URL && !apiKey) { location.hash = "#/asetukset"; return; }
  setView(`<p class="muted">${t("loadingStopDeps")}</p>`);

  const fetchStop = async () => {
    const { data, cachedAt } = await cachedGql("stop:" + stopId,
      `query ($id: String!) {
         stop(id: $id) {
           name code lat lon wheelchairBoarding
           routes { gtfsId shortName color textColor }
           stoptimesWithoutPatterns(numberOfDepartures: 30, omitNonPickups: true) {
             scheduledDeparture realtimeDeparture realtime serviceDay headsign
             trip { wheelchairAccessible occupancy { occupancyStatus } route { gtfsId shortName color textColor } }
           }
         }
       }`, { id: stopId });
    if (!data.stop) throw new Error(t("errStopNotFound") + stopId);
    return { stop: data.stop, cachedAt };
  };

  let routeFilter = null;
  let lastStopData = null;

  const renderRows = stop => {
    const sts = (stop.stoptimesWithoutPatterns || []).filter(st =>
      !routeFilter || st.trip?.route?.gtfsId === routeFilter);
    return depTableRows(routeFilter ? sts : sts.slice(0, 15))
      || `<tr><td colspan="3" class="muted">${t("noUpcoming")}</td></tr>`;
  };

  // Pysäkkiä liikennöivät linjat suodatinnappeina (brändiväreissä)
  const stopRoutesHtml = stop => {
    const routes = (stop.routes || []).slice()
      .sort((a, b) => (a.shortName || "").localeCompare(b.shortName || "", "fi", { numeric: true }));
    if (routes.length < 2) return "";
    return `<div class="legchips no-print" id="stopRoutes">${routes.map(r => {
      const style = r.color ? ` style="background:#${esc(r.color)};color:${badgeText(r.color, r.textColor)}"` : "";
      return `<button class="badge" data-route="${esc(r.gtfsId)}" aria-pressed="false"${style}
        title="${t("filterByRoute", { line: esc(r.shortName) })}">${esc(r.shortName)}</button>`;
    }).join("")}</div>`;
  };

  const { stop, cachedAt } = await fetchStop();
  lastStopData = stop;
  const accNote = stop.wheelchairBoarding === "POSSIBLE"
    ? `<p class="muted">♿ ${t("accStop")}</p>`
    : stop.wheelchairBoarding === "NOT_POSSIBLE"
      ? `<p class="muted">⚠ ${t("accStopNo")}</p>` : "";
  setView(`
    <nav class="crumb"><button class="linkish" id="backBtn">← ${t("back")}</button> · <a href="#/">${t("home")}</a></nav>
    <div class="card">
      <h2>${favButtonHtml(stopId)}${esc(stop.name)} <span class="muted">${esc(stop.code || "")}</span></h2>
      ${accNote}
      ${stopRoutesHtml(stop)}
      <div id="staleNote">${cachedAt ? staleNoteHtml(cachedAt) : ""}</div>
      <table class="deps">
        <thead><tr><th>${t("thLine")}</th><th>${t("thDest")}</th><th>${t("thDeparts")}</th></tr></thead>
        <tbody id="depRows">${renderRows(stop)}</tbody>
      </table>
      <p class="muted"><span class="rt">●</span> ${t("rtLegendStop")}</p>
      <div id="stopMap" class="map map-small" aria-label="${t("stopMapAria")}"></div>
      <p class="muted" id="stopMapHint" hidden>${t("stopBusesHint")}</p>
    </div>`);

  bindFavButton({ type: "stop", id: stopId, name: stop.name });
  document.getElementById("backBtn").addEventListener("click", () => history.back());

  document.querySelectorAll("#stopRoutes button[data-route]").forEach(btn =>
    btn.addEventListener("click", () => {
      routeFilter = routeFilter === btn.dataset.route ? null : btn.dataset.route;
      document.getElementById("stopRoutes").classList.toggle("filtered", !!routeFilter);
      document.querySelectorAll("#stopRoutes button[data-route]").forEach(b =>
        b.setAttribute("aria-pressed", String(b.dataset.route === routeFilter)));
      const tbody = document.getElementById("depRows");
      if (tbody && lastStopData) tbody.innerHTML = renderRows(lastStopData);
    }));

  if (stop.lat != null) {
    const mySeq = viewSeq;
    ensureLeaflet().then(() => {
      if (mySeq !== viewSeq || !document.getElementById("stopMap")) return;
      const map = makeMap("stopMap", [stop.lat, stop.lon], 16);
      L.circleMarker([stop.lat, stop.lon], STOP_MARKER).addTo(map)
        .bindPopup(esc(stop.name));
      // pysäkkiä liikennöivien linjojen bussit lähestymässä
      const routes = (stop.routes || []).slice(0, 15);
      if (routes.length) {
        startVehicles(map, routes);
        const hint = document.getElementById("stopMapHint");
        if (hint) hint.hidden = false;
      }
    }).catch(() => { document.getElementById("stopMap")?.remove(); });
  } else {
    const el = document.getElementById("stopMap");
    if (el) el.remove();
  }

  refreshTimer = setInterval(async () => {
    try {
      const fresh = await fetchStop();
      lastStopData = fresh.stop;
      const tbody = document.getElementById("depRows");
      if (tbody) tbody.innerHTML = renderRows(fresh.stop);
      const note = document.getElementById("staleNote");
      if (note) note.innerHTML = fresh.cachedAt ? staleNoteHtml(fresh.cachedAt) : "";
    } catch (err) {
      // verkkohikka: jätetään edelliset lähdöt näkyviin ja yritetään taas 30 s päästä
    }
  }, 30000);
}

/* ---------- Paikkahaku: pysäkit (GraphQL) + osoitteet/POI:t (Pelias) ---------- */

async function geocode(text) {
  const params = new URLSearchParams({
    text, size: "6", lang,
    "focus.point.lat": String(AREA.focus.lat),
    "focus.point.lon": String(AREA.focus.lon),
    "boundary.rect.min_lat": String(AREA.rect.minLat),
    "boundary.rect.max_lat": String(AREA.rect.maxLat),
    "boundary.rect.min_lon": String(AREA.rect.minLon),
    "boundary.rect.max_lon": String(AREA.rect.maxLon),
  });
  if (!PROXY_URL) params.set("digitransit-subscription-key", apiKey);
  const res = await fetch(`${GEOCODING_URL}/search?${params}`);
  if (!res.ok) throw new Error(t("errGeocode") + res.status);
  const json = await res.json();
  return (json.features || [])
    .filter(f => f.geometry?.coordinates)
    .map(f => ({
      name: f.properties.label || f.properties.name,
      lat: f.geometry.coordinates[1],
      lon: f.geometry.coordinates[0],
      layer: f.properties.layer || "address",
    }));
}

async function searchPlaces(q) {
  await findFeed();
  const [stopsRes, geoRes] = await Promise.allSettled([
    gql(`query ($name: String) { stops(name: $name) { gtfsId name code lat lon } }`, { name: q }),
    geocode(q),
  ]);
  const stops = stopsRes.status === "fulfilled"
    ? (stopsRes.value.stops || [])
        .filter(s => s.gtfsId.startsWith(feedId + ":") && s.lat != null)
        .slice(0, 4)
        .map(s => ({ name: s.name + (s.code ? ` (${s.code})` : ""), lat: s.lat, lon: s.lon, layer: "stop" }))
    : [];
  const places = geoRes.status === "fulfilled" ? geoRes.value : [];
  if (!stops.length && !places.length &&
      stopsRes.status === "rejected" && geoRes.status === "rejected") {
    throw stopsRes.reason;
  }
  return [...stops, ...places].slice(0, 9);
}

const PLACE_ICONS = { stop: "🚏", address: "🏠", street: "🏠", venue: "📍" };

/* Viimeksi haetut paikat nopeuttavat toistuvia hakuja */
function getRecents() {
  try { return JSON.parse(localStorage.getItem("recentPlaces") || "[]"); }
  catch (e) { return []; }
}

function addRecent(p) {
  if (!p || !p.name || p.name === t("myLocation")) return;
  const r = getRecents().filter(x => x.name !== p.name);
  r.unshift({ name: p.name, lat: p.lat, lon: p.lon, layer: p.layer || "address" });
  try { localStorage.setItem("recentPlaces", JSON.stringify(r.slice(0, 6))); } catch (e) {}
}

// Yhdistetty osoite-/pysäkkihaku: kirjoitus hakee ehdotukset, valinta antaa
// koordinaatit onPick-kutsulla. Tekstin muokkaus mitätöi aiemman valinnan.
function bindPlaceInput(input, listEl, onPick) {
  let timer = null, seq = 0;
  const close = () => { listEl.innerHTML = ""; listEl.hidden = true; };
  const pick = p => {
    input.value = p.name;
    close();
    addRecent(p);
    onPick(p);
  };
  input.addEventListener("focus", () => {
    if (input.value.trim().length >= 3) return;
    const recents = getRecents();
    if (!recents.length) return;
    listEl.innerHTML = `<li><p class="muted" style="padding:0.3rem 0.45rem;margin:0">${t("recent")}</p></li>`
      + recents.map((p, i) => `<li><button type="button" class="item" data-r="${i}">
          <span aria-hidden="true">🕓</span><span>${esc(p.name)}</span></button></li>`).join("");
    listEl.hidden = false;
    listEl.querySelectorAll("button[data-r]").forEach(btn =>
      btn.addEventListener("click", () => pick(recents[Number(btn.dataset.r)])));
  });
  input.addEventListener("input", () => {
    onPick(null);
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 3) { close(); return; }
    timer = setTimeout(async () => {
      const my = ++seq;
      try {
        const places = await searchPlaces(q);
        if (my !== seq) return;
        listEl.innerHTML = places.length
          ? places.map((p, i) => `<li><button type="button" class="item" data-i="${i}">
              <span aria-hidden="true">${PLACE_ICONS[p.layer] || "📍"}</span>
              <span>${esc(p.name)}</span></button></li>`).join("")
          : `<li><p class="muted" style="padding:0.4rem">${t("noPlacesFor", { q: esc(q) })}</p></li>`;
        listEl.hidden = false;
        listEl.querySelectorAll("button[data-i]").forEach(btn =>
          btn.addEventListener("click", () => pick(places[Number(btn.dataset.i)])));
      } catch (err) {
        if (my !== seq) return;
        listEl.innerHTML = `<li><div class="error">${esc(err.message)}</div></li>`;
        listEl.hidden = false;
      }
    }, 300);
  });
  // suljetaan vasta kun fokus poistuu koko hakukomponentista, jotta
  // nuolinäppäimillä liikkuminen ehdotuksiin ei sulje listaa
  const wrap = input.closest(".suggest") || input.parentElement;
  wrap.addEventListener("focusout", e => {
    if (!wrap.contains(e.relatedTarget)) setTimeout(close, 150);
  });
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") {
      const first = listEl.querySelector("button");
      if (first) { e.preventDefault(); first.focus(); }
    } else if (e.key === "Escape") {
      close();
    }
  });
  listEl.addEventListener("keydown", e => {
    const btns = [...listEl.querySelectorAll("button")];
    const i = btns.indexOf(document.activeElement);
    if (e.key === "ArrowDown" && i >= 0 && i < btns.length - 1) {
      e.preventDefault(); btns[i + 1].focus();
    } else if (e.key === "ArrowUp" && i >= 0) {
      e.preventDefault();
      if (i > 0) btns[i - 1].focus(); else input.focus();
    } else if (e.key === "Escape") {
      close(); input.focus();
    }
  });
}

/* ---------- A→B-reitinhaku (planConnection) ---------- */

// Säilyy istunnon ajan, jotta paluu näkymään ei tyhjennä kenttiä
const planState = { from: null, to: null, timeMode: "dep", time: "", wheelchair: false, lessWalk: false };

function fmtClock(iso) {
  const d = new Date(iso);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function fmtDur(sec) {
  const m = Math.round(sec / 60);
  return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`;
}

function nowLocalInput() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}

/* Jaettava reittilinkki: hakuehdot talteen URL:iin (replaceState ei laukaise
   hashchangea, joten näkymä ei piirry turhaan uudelleen) */
function planHash(includeTime = true) {
  const enc = p => encodeURIComponent(`${p.lat.toFixed(5)},${p.lon.toFixed(5)},${p.name}`);
  const opts = new URLSearchParams();
  if (includeTime && planState.time) opts.set("t", planState.time);
  if (includeTime && planState.timeMode === "arr") opts.set("m", "arr");
  if (planState.wheelchair) opts.set("wc", "1");
  if (planState.lessWalk) opts.set("lw", "1");
  const o = opts.toString();
  return `#/reitti/${enc(planState.from)}/${enc(planState.to)}${o ? "/" + encodeURIComponent(o) : ""}`;
}

function parsePlanParams(parts) {
  const dec = s => {
    const i1 = s.indexOf(","), i2 = s.indexOf(",", i1 + 1);
    if (i1 < 0 || i2 < 0) return null;
    const lat = parseFloat(s.slice(0, i1)), lon = parseFloat(s.slice(i1 + 1, i2));
    const name = s.slice(i2 + 1);
    return Number.isFinite(lat) && Number.isFinite(lon) && name ? { name, lat, lon } : null;
  };
  const from = dec(parts[1] || ""), to = dec(parts[2] || "");
  if (!from || !to) return false;
  planState.from = from;
  planState.to = to;
  const opts = new URLSearchParams(parts[3] || "");
  if (opts.get("t")) planState.time = opts.get("t");
  planState.timeMode = opts.get("m") === "arr" ? "arr" : "dep";
  planState.wheelchair = opts.get("wc") === "1";
  planState.lessWalk = opts.get("lw") === "1";
  return true;
}

// "2026-06-12T18:30" -> "2026-06-12T18:30:00+03:00"
function isoWithOffset(local) {
  const off = -new Date(local).getTimezoneOffset();
  const sign = off >= 0 ? "+" : "-";
  const pad = n => String(Math.floor(Math.abs(n))).padStart(2, "0");
  return `${local}:00${sign}${pad(off / 60)}:${pad(off % 60)}`;
}

const PLAN_QUERY = `
  query ($origin: PlanLabeledLocationInput!, $destination: PlanLabeledLocationInput!,
         $first: Int, $after: String, $last: Int, $before: String,
         $dateTime: PlanDateTimeInput, $preferences: PlanPreferencesInput) {
    planConnection(origin: $origin, destination: $destination,
                   first: $first, after: $after, last: $last, before: $before,
                   searchWindow: "PT2H", dateTime: $dateTime,
                   preferences: $preferences) {
      pageInfo { startCursor endCursor hasNextPage hasPreviousPage }
      edges { node {
        start end numberOfTransfers walkDistance
        legs {
          mode duration distance realtimeState
          start { scheduledTime estimated { time } }
          end { scheduledTime estimated { time } }
          from { name lat lon stop { code platformCode } }
          to { name lat lon stop { code } }
          route { gtfsId shortName color textColor }
          trip { tripHeadsign occupancy { occupancyStatus } }
          intermediateStops { name }
          legGeometry { points }
          alerts { alertHeaderText alertSeverityLevel }
        }
      } }
    }
  }`;

// Suorat kävely- ja pyöräilyreitit vaihtoehdoiksi joukkoliikenteen rinnalle
const DIRECT_QUERY = `
  query ($origin: PlanLabeledLocationInput!, $destination: PlanLabeledLocationInput!,
         $direct: [PlanDirectMode!]) {
    planConnection(origin: $origin, destination: $destination, first: 1,
                   modes: { directOnly: true, direct: $direct }) {
      edges { node {
        start end
        legs { mode duration distance legGeometry { points } from { name lat lon } to { name lat lon } }
      } }
    }
  }`;

const MODE_ICONS = { WALK: "🚶", BICYCLE: "🚴" };

function fmtKm(m) {
  const km = (m / 1000).toFixed(1);
  return (lang === "en" ? km : km.replace(".", ",")) + " km";
}

function legTime(lt) { return lt.estimated?.time || lt.scheduledTime; }

// Yhteenvedon osuuspalkki: segmentin leveys = legin kesto, väri = linjan väri
function legBarHtml(node) {
  const total = node.legs.reduce((s, l) => s + l.duration, 0) || 1;
  return `<span class="legbar" aria-hidden="true">${node.legs.map(leg => {
    const grow = Math.max(leg.duration / total, 0.04);
    if (leg.mode === "WALK" || leg.mode === "BICYCLE") {
      return `<span class="seg walk" style="flex-grow:${grow.toFixed(3)}">${MODE_ICONS[leg.mode] || ""}</span>`;
    }
    const bg = leg.route?.color ? "#" + leg.route.color : "var(--btn-bg)";
    const fg = leg.route?.color ? badgeText(leg.route.color, leg.route.textColor) : "#fff";
    return `<span class="seg" style="flex-grow:${grow.toFixed(3)};background:${bg};color:${fg}">
      ${esc(leg.route?.shortName || "")}</span>`;
  }).join("")}</span>`;
}

// Pystyaikajana: lähtöpaikka → kävely → pysäkki (laituri) → linja välipysäkkeineen → … → perille
function timelineHtml(node) {
  const rows = [];
  const pointRow = (timeIso, name, sub, cls) => `
    <div class="tl-row pt ${cls || ""}">
      <span class="tl-time">${timeIso ? fmtClock(timeIso) : ""}</span>
      <span class="tl-mid" aria-hidden="true"></span>
      <div class="tl-body"><strong>${name}</strong>${sub ? ` <span class="muted">${sub}</span>` : ""}</div>
    </div>`;

  const legs = node.legs;
  const originName = legs[0].from.name === "Origin"
    ? esc(planState.from?.name || t("origin")) : esc(legs[0].from.name);
  rows.push(pointRow(legTime(legs[0].start), originName, "", "start"));

  legs.forEach((leg, i) => {
    if (leg.mode === "WALK" || leg.mode === "BICYCLE") {
      rows.push(`
        <div class="tl-row leg dashed">
          <span class="tl-time"></span>
          <span class="tl-mid" aria-hidden="true"></span>
          <div class="tl-body">${MODE_ICONS[leg.mode]} ${t(leg.mode === "WALK" ? "walkVerb" : "bikeVerb")}
            ${Math.round(leg.distance)} m
            <span class="muted">(${fmtDur(leg.duration)})</span></div>
        </div>`);
    } else {
      const rt = leg.realtimeState && leg.realtimeState !== "SCHEDULED";
      const rail = leg.route?.color ? "#" + leg.route.color : "var(--blue)";
      const mids = leg.intermediateStops || [];
      const midLabel = mids.length === 0 ? t("intermediate0")
        : mids.length === 1 ? t("intermediate1") : t("intermediateN", { n: mids.length });
      const alerts = (leg.alerts || []).map(a =>
        `<p class="muted">⚠ ${esc(a.alertHeaderText || t("legAlertDefault"))}</p>`).join("");
      rows.push(`
        <div class="tl-row leg" style="--rail:${rail}">
          <span class="tl-time"></span>
          <span class="tl-mid" aria-hidden="true"></span>
          <div class="tl-body">
            ${badgeHtml(leg.route, leg.mode)}
            ${esc(leg.trip?.tripHeadsign ? "→ " + leg.trip.tripHeadsign : "")}${occupancyHtml(leg.trip)}
            ${rt ? `<span class="rt"> ●</span>` : ""}
            <details class="tl-stops">
              <summary>${midLabel} · ${fmtDur(leg.duration)}</summary>
              ${mids.length ? `<ul>${mids.map(s => `<li>${esc(s.name)}</li>`).join("")}</ul>` : ""}
            </details>
            ${alerts}
          </div>
        </div>`);
    }
    // legin päätepiste: vaihtopysäkki tai määränpää
    const isLast = i === legs.length - 1;
    const next = legs[i + 1];
    if (isLast) {
      const destName = leg.to.name === "Destination"
        ? esc(planState.to?.name || t("destination")) : esc(leg.to.name);
      rows.push(pointRow(legTime(leg.end), destName, "", "end"));
    } else {
      // vaihtoaika näkyviin, kun seuraava osuus on joukkoliikennettä
      let wait = "";
      if (next && next.mode !== "WALK" && next.mode !== "BICYCLE") {
        const mins = Math.round((new Date(legTime(next.start)) - new Date(legTime(leg.end))) / 60000);
        if (mins >= 1) wait = t("transferWait", { n: mins });
      }
      const sub = [
        leg.to.stop?.code ? esc(leg.to.stop.code) : "",
        next?.from.stop?.platformCode ? t("platform", { p: esc(next.from.stop.platformCode) }) : "",
        wait,
      ].filter(Boolean).join(" · ");
      rows.push(pointRow(legTime(leg.end), esc(leg.to.name), sub));
    }
  });
  return `<div class="tl">${rows.join("")}</div>`;
}

function itinSummaryHtml(node) {
  const walk = Math.round(node.walkDistance);
  const transfers = node.numberOfTransfers === 0 ? t("transfers0")
    : node.numberOfTransfers === 1 ? t("transfers1") : t("transfersN", { n: node.numberOfTransfers });
  const durSec = (new Date(node.end) - new Date(node.start)) / 1000;
  // ensimmäisen bussin lähtölaskenta tuo tärkeimmän tiedon heti otsikkoriviin
  const firstTransit = node.legs.find(l => l.mode !== "WALK" && l.mode !== "BICYCLE");
  let departs = "";
  if (firstTransit) {
    const mins = Math.round((new Date(legTime(firstTransit.start)) - Date.now()) / 60000);
    if (mins >= 0 && mins <= 90) {
      departs = `<span class="rt">${mins === 0 ? t("departsNow") : t("departsIn", { n: mins })}</span>`;
    }
  }
  return `
    <span class="itin-head">
      <span class="times">${fmtClock(node.start)}–${fmtClock(node.end)}</span>
      <span>${fmtDur(durSec)}</span>
      <span class="muted">${transfers} · ${t("walkAmount", { n: walk })}</span>
      ${departs}
    </span>
    ${legBarHtml(node)}`;
}

function itinHtml(node, idx) {
  return `<details class="itin" data-itin="${idx}">
    <summary>${itinSummaryHtml(node)}</summary>
    ${timelineHtml(node)}
    <div id="itinMap${idx}" class="map map-small" aria-label="${t("mapAria")}"></div>
  </details>`;
}

// Kompakti kävellen/pyörällä-vaihtoehto reittilistan kärkeen
function directHtml(node, key) {
  const leg = node.legs[0];
  const label = key === "walk" ? t("directWalk") : t("directBike");
  return `<details class="itin direct" data-direct="${key}">
    <summary>
      <span class="itin-head">
        <span>${MODE_ICONS[leg.mode]} <strong>${label}</strong></span>
        <span>${fmtDur(node.legs.reduce((s, l) => s + l.duration, 0))}</span>
        <span class="muted">${fmtKm(node.legs.reduce((s, l) => s + l.distance, 0))}</span>
      </span>
    </summary>
    <div id="directMap${key}" class="map map-small" aria-label="${t("mapAria")}"></div>
  </details>`;
}

async function drawItineraryMap(elId, node) {
  await ensureLeaflet();
  const el = document.getElementById(elId);
  if (!el || el.dataset.drawn) return;
  el.dataset.drawn = "1";
  const map = makeMap(elId);
  let bounds = null;
  for (const leg of node.legs) {
    const pts = decodePolyline(leg.legGeometry?.points || "");
    if (!pts.length) continue;
    const style = leg.mode === "WALK"
      ? { color: "#5a6478", weight: 4, dashArray: "2 8" }
      : leg.mode === "BICYCLE"
        ? { color: "#1a7f4b", weight: 5, dashArray: "8 6", opacity: 0.9 }
        : { color: leg.route?.color ? "#" + leg.route.color : "#0a4ea3", weight: 5, opacity: 0.85 };
    const line = L.polyline(pts, style).addTo(map);
    bounds = bounds ? bounds.extend(line.getBounds()) : line.getBounds();
    if (leg.mode !== "WALK" && leg.mode !== "BICYCLE") {
      L.circleMarker(pts[0], STOP_MARKER).addTo(map).bindPopup(esc(leg.from.name));
    }
  }
  const first = node.legs[0], last = node.legs[node.legs.length - 1];
  L.circleMarker([first.from.lat, first.from.lon], { ...STOP_MARKER, fillColor: "#1a7f4b" })
    .addTo(map).bindPopup(t("origin"));
  L.circleMarker([last.to.lat, last.to.lon], { ...STOP_MARKER, fillColor: "#c0392b" })
    .addTo(map).bindPopup(t("destination"));
  if (bounds) map.fitBounds(bounds, { padding: [15, 15] });
  // reitin linjojen bussit liikkuvat kartalla reaaliajassa
  const transitRoutes = [...new Map(node.legs
    .filter(l => l.route?.gtfsId)
    .map(l => [l.route.gtfsId, { gtfsId: l.route.gtfsId, shortName: l.route.shortName }])).values()];
  if (transitRoutes.length) startVehicles(map, transitRoutes);
}

async function viewPlan(parts) {
  if (!PROXY_URL && !apiKey) { location.hash = "#/asetukset"; return; }
  const fromUrl = parts && parts[1] ? parsePlanParams(parts) : false;
  setView(`
    <nav class="crumb"><a href="#/">← ${t("home")}</a></nav>
    <div class="card">
      <h2>${t("planTitle")}</h2>
      <form id="planForm">
        <div class="field">
          <label for="fromInput">${t("from")}</label>
          <div class="suggest">
            <input type="text" id="fromInput" placeholder="${t("placePlaceholder")}"
                   autocomplete="off" value="${esc(planState.from?.name || "")}">
            <ul class="plain suggest-list" id="fromList" hidden></ul>
          </div>
          <button type="button" id="fromGeo" class="linkish">📍 ${t("useMyLocation")}</button>
          <button type="button" id="swapBtn" class="linkish" title="${t("swap")}"
                  aria-label="${t("swap")}">⇅ ${t("swap")}</button>
        </div>
        <div class="field">
          <label for="toInput">${t("to")}</label>
          <div class="suggest">
            <input type="text" id="toInput" placeholder="${t("placePlaceholder")}"
                   autocomplete="off" value="${esc(planState.to?.name || "")}">
            <ul class="plain suggest-list" id="toList" hidden></ul>
          </div>
        </div>
        <div class="row" style="flex-wrap:wrap">
          <select id="timeMode" aria-label="${t("timeModeAria")}">
            <option value="dep"${planState.timeMode === "dep" ? " selected" : ""}>${t("departAt")}</option>
            <option value="arr"${planState.timeMode === "arr" ? " selected" : ""}>${t("arriveBy")}</option>
          </select>
          <input type="datetime-local" id="timeInput" aria-label="${t("timeAria")}"
                 value="${esc(planState.time || nowLocalInput())}">
          <button type="button" id="nowBtn" class="linkish">${t("now")}</button>
          <button type="submit">${t("searchRoutes")}</button>
        </div>
        <div class="row" style="flex-wrap:wrap; margin-top:0.4rem">
          <label><input type="checkbox" id="wheelchairBox"${planState.wheelchair ? " checked" : ""}>
            ♿ ${t("wheelchairRoute")}</label>
          <label><input type="checkbox" id="lessWalkBox"${planState.lessWalk ? " checked" : ""}>
            ${t("lessWalk")}</label>
        </div>
      </form>
      <div id="planMsg" role="status"></div>
    </div>
    <div id="planResults"></div>`);

  const fromInput = document.getElementById("fromInput");
  const toInput = document.getElementById("toInput");
  bindPlaceInput(fromInput, document.getElementById("fromList"), p => { planState.from = p; });
  bindPlaceInput(toInput, document.getElementById("toList"), p => { planState.to = p; });

  document.getElementById("swapBtn").addEventListener("click", () => {
    [planState.from, planState.to] = [planState.to, planState.from];
    fromInput.value = planState.from?.name || "";
    toInput.value = planState.to?.name || "";
    if (planState.from && planState.to) search(false);
  });
  document.getElementById("nowBtn").addEventListener("click", () => {
    document.getElementById("timeInput").value = nowLocalInput();
    document.getElementById("timeMode").value = "dep";
    if (planState.from && planState.to) search(false);
  });

  document.getElementById("fromGeo").addEventListener("click", () => {
    const msg = document.getElementById("planMsg");
    if (!navigator.geolocation) { msg.innerHTML = `<div class="error">${t("geoUnsupported")}</div>`; return; }
    msg.innerHTML = `<p class="muted">${t("gettingLocation")}</p>`;
    navigator.geolocation.getCurrentPosition(pos => {
      planState.from = { name: t("myLocation"), lat: pos.coords.latitude, lon: pos.coords.longitude };
      fromInput.value = t("myLocation");
      msg.innerHTML = "";
    }, err => {
      msg.innerHTML = `<div class="error">${t("geoFail")}${esc(err.message)}</div>`;
    }, { timeout: 10000 });
  });

  const results = document.getElementById("planResults");
  let nodes = [], cursor = null, prevCursor = null, directNodes = {};
  let lastHasNext = false, lastHasPrev = false, mainDone = false;

  const renderResults = () => {
    const directRow = ["walk", "bike"]
      .filter(k => directNodes[k])
      .map(k => directHtml(directNodes[k], k))
      .join("");
    results.innerHTML = nodes.length || directRow
      ? `<div class="card">
           <h2>${t("itinerariesTitle")}
             <button id="shareBtn" class="linkish no-print" style="float:right">🔗 ${t("share")}</button></h2>
           ${directRow}
           ${lastHasPrev && nodes.length ? `<button id="earlierBtn" class="linkish no-print">↑ ${t("showEarlier")}</button>` : ""}
           ${nodes.map((n, i) => itinHtml(n, i)).join("")}
           ${lastHasNext ? `<button id="moreBtn" class="no-print">${t("showLater")}</button>` : ""}
         </div>`
      : `<div class="card"><p class="muted">${t("noItineraries")}</p></div>`;
    results.querySelectorAll("details.itin[data-itin]").forEach(d =>
      d.addEventListener("toggle", () => {
        if (d.open) drawItineraryMap("itinMap" + d.dataset.itin, nodes[Number(d.dataset.itin)]).catch(() => {});
      }));
    results.querySelectorAll("details.itin[data-direct]").forEach(d =>
      d.addEventListener("toggle", () => {
        if (d.open) drawItineraryMap("directMap" + d.dataset.direct, directNodes[d.dataset.direct]).catch(() => {});
      }));
    document.getElementById("moreBtn")?.addEventListener("click", () => search("more"));
    document.getElementById("earlierBtn")?.addEventListener("click", () => search("earlier"));
    document.getElementById("shareBtn")?.addEventListener("click", async e => {
      const url = location.origin + location.pathname + planHash();
      try {
        if (navigator.share) { await navigator.share({ url }); return; }
        await navigator.clipboard.writeText(url);
        e.target.textContent = "✓ " + t("linkCopied");
        setTimeout(() => { e.target.textContent = "🔗 " + t("share"); }, 2500);
      } catch (err) { /* käyttäjä perui jaon */ }
    });
  };

  // Kävely- ja pyörävaihtoehdot haetaan pääkyselyn rinnalla; lista täydentyy
  // vasta kun varsinaiset reittiehdotukset on jo piirretty
  const fetchDirects = async () => {
    const origin = { location: { coordinate: { latitude: planState.from.lat, longitude: planState.from.lon } } };
    const destination = { location: { coordinate: { latitude: planState.to.lat, longitude: planState.to.lon } } };
    const [walk, bike] = await Promise.allSettled([
      gql(DIRECT_QUERY, { origin, destination, direct: ["WALK"] }),
      gql(DIRECT_QUERY, { origin, destination, direct: ["BICYCLE"] }),
    ]);
    directNodes = {};
    if (walk.status === "fulfilled") directNodes.walk = walk.value.planConnection?.edges?.[0]?.node || null;
    if (bike.status === "fulfilled") directNodes.bike = bike.value.planConnection?.edges?.[0]?.node || null;
    // järjettömän pitkä kävely (yli 2 h) ei ole mielekäs vaihtoehto
    if (directNodes.walk && directNodes.walk.legs.reduce((s, l) => s + l.duration, 0) > 7200) {
      directNodes.walk = null;
    }
    if (mainDone && document.getElementById("planResults") === results) renderResults();
  };

  // mode: false/"new" = uusi haku, "more" = myöhemmät, "earlier" = aikaisemmat
  const search = async mode => {
    const msg = document.getElementById("planMsg");
    if (!planState.from || !planState.to) {
      msg.innerHTML = `<div class="error">${t("choosePlaces")}</div>`;
      return;
    }
    const append = mode === "more" || mode === "earlier";
    if (!append) {
      cursor = null; prevCursor = null; nodes = []; directNodes = {}; mainDone = false;
      results.innerHTML = `<p class="muted">${t("searchingRoutes")}</p>`;
      fetchDirects().catch(() => {});
    }
    msg.innerHTML = "";
    planState.timeMode = document.getElementById("timeMode").value;
    planState.time = document.getElementById("timeInput").value;
    planState.wheelchair = document.getElementById("wheelchairBox").checked;
    planState.lessWalk = document.getElementById("lessWalkBox").checked;
    const preferences = { accessibility: { wheelchair: { enabled: planState.wheelchair } } };
    if (planState.lessWalk) preferences.street = { walk: { reluctance: 3.5 } };
    const dateTime = planState.time
      ? (planState.timeMode === "arr"
          ? { latestArrival: isoWithOffset(planState.time) }
          : { earliestDeparture: isoWithOffset(planState.time) })
      : null;
    history.replaceState(null, "", planHash());
    addRecent(planState.from);
    addRecent(planState.to);
    // etusivun "viimeisin haku" -pikalinkki (ilman aikaa → haetaan avattaessa nyt-ajalla)
    try {
      localStorage.setItem("lastPlan", JSON.stringify({
        from: planState.from.name, to: planState.to.name, hash: planHash(false),
      }));
    } catch (e) {}
    try {
      const vars = {
        origin: { location: { coordinate: { latitude: planState.from.lat, longitude: planState.from.lon } } },
        destination: { location: { coordinate: { latitude: planState.to.lat, longitude: planState.to.lon } } },
        dateTime,
        preferences,
      };
      if (mode === "earlier") {
        vars.last = 5;
        vars.before = prevCursor;
      } else {
        vars.first = 5;
        vars.after = mode === "more" ? cursor : null;
      }
      const data = await gql(PLAN_QUERY, vars);
      const conn = data.planConnection;
      const newNodes = (conn.edges || []).map(e => e.node);
      if (mode === "earlier") {
        nodes = newNodes.concat(nodes);
        prevCursor = conn.pageInfo.startCursor;
        lastHasPrev = conn.pageInfo.hasPreviousPage;
      } else {
        nodes = nodes.concat(newNodes);
        cursor = conn.pageInfo.endCursor;
        lastHasNext = conn.pageInfo.hasNextPage;
        if (!append) {
          prevCursor = conn.pageInfo.startCursor;
          lastHasPrev = conn.pageInfo.hasPreviousPage;
        }
      }
      mainDone = true;
      renderResults();
    } catch (err) {
      results.innerHTML = `<div class="error">${esc(err.message)}</div>`;
    }
  };

  document.getElementById("planForm").addEventListener("submit", e => { e.preventDefault(); search(false); });
  // URL:sta tultaessa (jaettu linkki) tai paluunavigoinnissa haku käynnistyy heti
  if (planState.from && planState.to) search(false);
}

/* ---------- Router ---------- */

async function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  try {
    if (parts[0] === "asetukset") viewSettings();
    else if (parts[0] === "reitti") await viewPlan(parts);
    else if (parts[0] === "linja" && parts[1]) await viewRoute(parts[1], parts[2], parts[3]);
    else if (parts[0] === "pysakki" && parts[1]) await viewStop(parts[1]);
    else await viewRoutes();
  } catch (err) {
    showError(err);
  }
}

window.addEventListener("hashchange", route);
updateChrome();
route();

// Häiriöpollaus käynnistyy heti, jos ilmoitukset on otettu käyttöön;
// ensimmäinen kierros ilmoittaa poissaolon aikana tulleet uudet häiriöt
if (localStorage.getItem("notifyAlerts") === "1" &&
    typeof Notification !== "undefined" && Notification.permission === "granted") {
  pollFavAlerts(false, false);
  startAlertPolling();
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>

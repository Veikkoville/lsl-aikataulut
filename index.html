/* ---------- Linjaston yleiskartta (#/linjasto): kaikki linjat kartalla ---------- */

let networkCache = null;
async function loadNetwork() {
  if (networkCache) return networkCache;
  const feed = await findFeed();
  const data = await gql(
    `query ($feeds: [String]) {
       routes(feeds: $feeds) {
         gtfsId shortName longName mode color
         patterns { patternGeometry { length points } }
       }
     }`, { feeds: [feed] });
  // Suodata samaan aktiivijoukkoon kuin linjalista (ei piirretä kausi-/koululinjoja
  // joilla ei ole tulevia lähtöjä). loadRoutes on välimuistitettu → halpa.
  let activeIds = null;
  try { const ar = await loadRoutes(); if (ar && ar.length) activeIds = new Set(ar.map(r => r.gtfsId)); } catch (e) { /* näytä kaikki jos epäonnistuu */ }
  networkCache = (data.routes || [])
    .filter(r => r.mode === "BUS")
    .filter(r => !activeIds || activeIds.has(r.gtfsId));
  return networkCache;
}

async function viewNetworkMap() {
  if (!PROXY_URL && !apiKey) { location.hash = "#/asetukset"; return; }
  setView(`
    <nav class="crumb"><a href="#/">← ${t("home")}</a></nav>
    <div class="card">
      <h2>${icon("network")} ${t("netMapTitle")}</h2>
      <p class="muted" id="netCount" role="status">${t("netMapLoading")}</p>
      <div id="netMap" class="map bigmap" aria-label="${esc(t("netMapAria"))}"></div>
      <p class="muted">${t("netMapHint")}</p>
    </div>`);
  const mySeq = viewSeq;
  try {
    const [routes] = await Promise.all([loadNetwork(), ensureLeaflet()]);
    if (mySeq !== viewSeq || !document.getElementById("netMap")) return;
    const map = makeMap("netMap", [AREA.focus.lat, AREA.focus.lon], 12);
    let bounds = null, drawn = 0;
    for (const r of routes) {
      // piirrä linjan pisin reittikuvio (yksi viiva/linja pitää kartan luettavana)
      const pat = (r.patterns || [])
        .filter(p => p.patternGeometry && p.patternGeometry.points)
        .sort((a, b) => (b.patternGeometry.length || 0) - (a.patternGeometry.length || 0))[0];
      if (!pat) continue;
      const pts = decodePolyline(pat.patternGeometry.points);
      if (!pts.length) continue;
      const color = r.color ? "#" + r.color : "#0a4ea3";
      const line = L.polyline(pts, { color, weight: 3, opacity: 0.55 }).addTo(map);
      const label = (r.shortName || "") + (r.longName ? " " + r.longName : "");
      line.bindTooltip(label.trim() || t("alertDefault"), { sticky: true });
      line.on("mouseover", () => line.setStyle({ weight: 6, opacity: 0.95 }));
      line.on("mouseout", () => line.setStyle({ weight: 3, opacity: 0.55 }));
      line.on("click", () => { location.hash = "#/linja/" + encodeURIComponent(r.gtfsId); });
      bounds = bounds ? bounds.extend(line.getBounds()) : line.getBounds();
      drawn++;
    }
    fitMap(map, bounds);
    const el = document.getElementById("netCount");
    if (el) el.textContent = t("netMapCount", { n: drawn });
  } catch (e) {
    const el = document.getElementById("netMap");
    if (el) el.outerHTML = `<div class="error">${t("netMapFail")}${esc(e.message)}</div>`;
  }
}

/* ---------- Keskusterminaalien laiturit (#/laiturit) ----------
   Matkakeskus / Kauppatori / Trio: kunkin laiturit piirretään avoimesta
   GTFS-datasta (stops nimellä) kartalle laiturikirjaimin + linjoineen ja
   linkitetään LSL:n viralliseen PDF-laiturikarttaan (kuvia ei upoteta —
   ne ovat LSL:n tekijänoikeutta; oma kartta päivittyy avoimesta datasta). */

// Pysäkin tunnus (kartan merkki) + näyttönimi LSL:n termein: numeropysäkki on
// "Laituri N" (esim. Matkakeskus 3/4), kirjainpysäkki "Pysäkki X" (A–F; Trion
// kirjaimet tulevat nimestä "Trio A"). Jos kumpaakaan ei ole, näytetään pysäkin
// nimi sellaisenaan — koodia EI esitetä laiturinumerona.
function boardingInfo(stop, hubName) {
  const pc = stop.platformCode;
  if (pc) {
    const word = /^\d+$/.test(pc) ? t("termPlatform") : t("termStop");
    return { tag: pc, full: word + " " + pc };
  }
  const n = (stop.name || "").trim();
  if (hubName && n.toLowerCase().startsWith(hubName.toLowerCase())) {
    const rest = n.slice(hubName.length).replace(/^[\s,–-]+/, "").trim();
    if (rest && rest.length <= 4) return { tag: rest, full: t("termStop") + " " + rest };
  }
  return { tag: "•", full: n || stop.code || "?" };
}

async function loadHubStops(name) {
  const feed = await findFeed();
  const data = await gql(
    `query ($name: String!) {
       stops(name: $name) {
         gtfsId code platformCode name lat lon
         routes { gtfsId shortName color textColor }
       }
     }`, { name });
  // stops(name:) EI ole feed-rajattu (hakee kaikki Waltti-kaupungit) → suodata oma feed
  const pref = feed + ":";
  return (data.stops || []).filter(s => s.gtfsId.startsWith(pref) && s.lat != null && s.lon != null);
}

async function viewHubs(parts) {
  if (!CONFIG.hubs || !CONFIG.hubs.length) { location.hash = "#/"; return; }
  if (!PROXY_URL && !apiKey) { location.hash = "#/asetukset"; return; }
  const hub = CONFIG.hubs.find(h => h.key === parts[1]) || CONFIG.hubs[0];
  const tabs = CONFIG.hubs.map(h =>
    `<button data-hub-tab="${esc(h.key)}" aria-pressed="${h.key === hub.key}">${esc(h.name)}</button>`).join("");
  setView(`
    <nav class="crumb"><a href="#/">← ${t("home")}</a></nav>
    <div class="card">
      <h2>${icon("pin")} ${t("hubTitle")}</h2>
      <p class="muted">${t("hubIntro")}</p>
      <div class="tabs plat-tabs" role="group" aria-label="${esc(t("hubTitle"))}">${tabs}</div>
      <div id="hubMap" class="map bigmap" aria-label="${esc(t("hubMapAria", { hub: hub.name }))}"></div>
      <p class="muted">${icon("doc")} <a href="${esc(hub.pdf)}" target="_blank" rel="noopener">${t("hubOfficialMap")}</a><br><span class="muted">${t("hubOfficialNote")}</span></p>
      <div id="hubList"><p class="muted">${t("hubLoading")}</p></div>
    </div>`);
  document.querySelectorAll("[data-hub-tab]").forEach(btn =>
    btn.addEventListener("click", () => { location.hash = "#/laiturit/" + btn.dataset.hubTab; }));
  const mySeq = viewSeq;
  try {
    let [stops] = await Promise.all([loadHubStops(hub.name), ensureLeaflet()]);
    if (mySeq !== viewSeq || !document.getElementById("hubMap")) return;
    // Hygienia: piilota pysäkit joilla ei ole yhtään linjaa (ei lähtöjä → pelkkää kohinaa).
    stops = stops.filter(s => (s.routes || []).length > 0);
    // Jos hubilla on LSL:n virallinen lähtöpaikkalista (allow), näytä vain ne
    // (suodattaa GTFS:n tekniset/vanhentuneet pysäkit, esim. Matkakeskuksen Laituri 2/7).
    if (hub.allow) stops = stops.filter(s => hub.allow.includes(boardingInfo(s, hub.name).tag));
    // järjestä tunnuksen mukaan (numerot ja kirjaimet luonnollisesti, nimi-pysäkit viimeiseksi)
    const sortKey = s => { const tg = boardingInfo(s, hub.name).tag; return tg === "•" ? "￿" : tg; };
    stops.sort((a, b) => sortKey(a).localeCompare(sortKey(b), "fi", { numeric: true }));
    const map = makeMap("hubMap", [hub.center.lat, hub.center.lon], 16);
    let bounds = null;
    const listHtml = [];
    for (const s of stops) {
      const { tag: label, full } = boardingInfo(s, hub.name);
      // uniikit linjat (sama linja voi toistua) brändiväreissä
      const lines = [...new Map((s.routes || []).map(r => [r.shortName, r])).values()]
        .sort((a, b) => (a.shortName || "").localeCompare(b.shortName || "", "fi", { numeric: true }));
      const badges = lines.map(r => {
        const style = r.color ? ` style="background:#${esc(r.color)};color:${badgeText(r.color, r.textColor)}"` : "";
        return `<a class="badge" href="#/linja/${encodeURIComponent(r.gtfsId)}"${style}>${esc(r.shortName || "")}</a>`;
      }).join("");
      const stopUrl = "#/pysakki/" + encodeURIComponent(s.gtfsId);
      const linesShort = lines.slice(0, 16).map(r => esc(r.shortName)).join(", ");
      const icon = L.divIcon({ className: "plat-marker-wrap",
        html: `<span class="plat-marker">${esc(label)}</span>`, iconSize: [30, 30] });
      const marker = L.marker([s.lat, s.lon], { icon }).addTo(map).bindPopup(
        `<strong>${esc(hub.name)} — ${esc(full)}</strong><br>${linesShort || t("hubNoLines")}<br><a href="${stopUrl}">${t("hubDepartures")}</a>`,
        { maxWidth: 260 });
      bounds = bounds ? bounds.extend(marker.getLatLng()) : L.latLngBounds(marker.getLatLng(), marker.getLatLng());
      listHtml.push(
        `<li class="plat-item"><div class="plat-head"><span class="plat-tag">${esc(label)}</span>` +
        `<strong class="plat-name">${esc(full)}</strong>` +
        `<a href="${stopUrl}" aria-label="${esc(full)}: ${t("hubDepartures")}">${t("hubDepartures")}</a></div>` +
        (badges ? `<div class="plat-lines">${badges}</div>` : `<p class="muted">${t("hubNoLines")}</p>`) +
        `</li>`);
    }
    fitMap(map, bounds);
    const listEl = document.getElementById("hubList");
    if (listEl) listEl.innerHTML = stops.length
      ? `<ul class="plat-list">${listHtml.join("")}</ul>`
      : `<p class="muted">${t("hubNone")}</p>`;
  } catch (e) {
    const el = document.getElementById("hubList");
    if (el) el.innerHTML = `<div class="error">${t("hubFail")}${esc(e.message)}</div>`;
  }
}

/* ---------- Poikkeuspäivät (#/poikkeukset): tulevat pyhä- ja juhlapäivät ----------
   Suomen arkipyhät ovat deterministisiä (sama computus kuin fiHolidays), joten
   kalenteri rakennetaan ilman rajapintaa. Sisältö on faktuaalinen päivälista;
   palvelutason tarkka muutos kehotetaan tarkistamaan linjasivulta (rehellisyys
   — avoin data ei anna luotettavaa "sunnuntaiaikataulu"-merkintää per päivä). */
const HOLIDAY_NAMES = {
  fi: { newyear: "Uudenvuodenpäivä", epiphany: "Loppiainen", goodfri: "Pitkäperjantai", easter: "Pääsiäispäivä", easter2: "2. pääsiäispäivä", mayday: "Vappu", ascension: "Helatorstai", pentecost: "Helluntai", midsummereve: "Juhannusaatto", midsummer: "Juhannuspäivä", allsaints: "Pyhäinpäivä", independence: "Itsenäisyyspäivä", xmaseve: "Jouluaatto", xmas: "Joulupäivä", boxing: "Tapaninpäivä", newyeareve: "Uudenvuodenaatto" },
  en: { newyear: "New Year's Day", epiphany: "Epiphany", goodfri: "Good Friday", easter: "Easter Sunday", easter2: "Easter Monday", mayday: "May Day", ascension: "Ascension Day", pentecost: "Whitsun", midsummereve: "Midsummer Eve", midsummer: "Midsummer Day", allsaints: "All Saints' Day", independence: "Independence Day", xmaseve: "Christmas Eve", xmas: "Christmas Day", boxing: "St. Stephen's Day", newyeareve: "New Year's Eve" },
  sv: { newyear: "Nyårsdagen", epiphany: "Trettondedag jul", goodfri: "Långfredagen", easter: "Påskdagen", easter2: "Annandag påsk", mayday: "Första maj", ascension: "Kristi himmelsfärdsdag", pentecost: "Pingst", midsummereve: "Midsommarafton", midsummer: "Midsommardagen", allsaints: "Alla helgons dag", independence: "Självständighetsdagen", xmaseve: "Julafton", xmas: "Juldagen", boxing: "Annandag jul", newyeareve: "Nyårsafton" },
};
const HOLIDAY_EVES = new Set(["xmaseve", "midsummereve", "newyeareve"]);

// Nimetyt pyhäpäivät vuodelle: [{iso, key}] (sama laskenta kuin fiHolidays)
function namedHolidays(year) {
  const out = [];
  const iso = (m, d) => `${year}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  out.push({ iso: iso(1, 1), key: "newyear" }, { iso: iso(1, 6), key: "epiphany" },
    { iso: iso(5, 1), key: "mayday" }, { iso: iso(12, 6), key: "independence" },
    { iso: iso(12, 24), key: "xmaseve" }, { iso: iso(12, 25), key: "xmas" },
    { iso: iso(12, 26), key: "boxing" }, { iso: iso(12, 31), key: "newyeareve" });
  const a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, mm = Math.floor((a + 11 * h + 22 * l) / 451),
    month = Math.floor((h + l - 7 * mm + 114) / 31), day = ((h + l - 7 * mm + 114) % 31) + 1;
  const easter = new Date(year, month - 1, day);
  const off = (n, key) => { const x = new Date(easter); x.setDate(easter.getDate() + n); out.push({ iso: isoOf(x), key }); };
  off(-2, "goodfri"); off(0, "easter"); off(1, "easter2"); off(39, "ascension"); off(49, "pentecost");
  for (let dd = 20; dd <= 26; dd++) { const dt = new Date(year, 5, dd); if (dt.getDay() === 6) { out.push({ iso: isoOf(dt), key: "midsummer" }); const fr = new Date(dt); fr.setDate(dd - 1); out.push({ iso: isoOf(fr), key: "midsummereve" }); break; } }
  for (let dd = 31; dd <= 37; dd++) { const dt = new Date(year, 9, dd); if (dt.getDay() === 6) { out.push({ iso: isoOf(dt), key: "allsaints" }); break; } }
  return out;
}

function fmtWeekday(iso) {
  const [y, m, d] = (iso || "").split("-").map(Number);
  if (!y) return "";
  const loc = lang === "fi" ? "fi-FI" : lang === "sv" ? "sv-FI" : "en-GB";
  return new Date(y, m - 1, d).toLocaleDateString(loc, { weekday: "long" });
}

function viewExceptions() {
  const today = todayISO();
  const yr = +today.slice(0, 4);
  const names = HOLIDAY_NAMES[lang] || HOLIDAY_NAMES.fi;
  const all = [...namedHolidays(yr), ...namedHolidays(yr + 1)]
    .filter(h => h.iso >= today)
    .sort((a, b) => a.iso.localeCompare(b.iso))
    .slice(0, 16);
  const rows = all.map(h => {
    const eve = HOLIDAY_EVES.has(h.key);
    const tag = eve ? t("exTagEve") : t("exTagHoliday");
    return `<li class="ex-row">
      <span class="ex-date"><strong>${esc(fmtDateLong(h.iso))}</strong><br><span class="muted">${esc(fmtWeekday(h.iso))}</span></span>
      <span class="ex-name">${esc(names[h.key] || "")}</span>
      <span class="ex-tag ${eve ? "ex-eve" : ""}">${esc(tag)}</span>
    </li>`;
  }).join("");
  setView(`
    <nav class="crumb"><a href="#/">← ${t("home")}</a></nav>
    <div class="card">
      <h2>${icon("calendar")} ${t("exTitle")}</h2>
      <p class="muted">${t("exIntro")}</p>
      <p class="muted">${t("exNote")}</p>
      ${all.length ? `<ul class="ex-list">${rows}</ul>` : `<p>${t("exNone")}</p>`}
      <p style="margin-top:0.8rem"><a class="item" href="#/">${icon("bus")} <span>${t("exCheckCta")}</span></a></p>

}

/* ---------- Näytöt ja tulosteet (#4): näyttöverkosto + linjan pysäkkijulisteet ----------
   Näyttöverkosto: hae pysäkki → valmis kioski-URL + upotuskoodi seinänäytölle.
   Erätulostus: valitse linja + päivätyyppi → kaikkien linjan pysäkkien julisteet
   yhteen tulosteeseen (client-puolella, ilmainen; eräajo edistymisnäytöllä). */
async function viewPrintHub() {
  if (!PROXY_URL && !apiKey) { location.hash = "#/asetukset"; return; }
  setView(`
    <nav class="crumb"><a href="#/">← ${t("home")}</a></nav>
    <div class="card">
      <h2>${icon("monitor")} ${t("screenNetTitle")}</h2>
      <p class="muted">${t("screenNetIntro")}</p>
      <input type="search" id="hubStopSearch" placeholder="${t("screenNetSearch")}" aria-label="${t("screenNetSearch")}" autocomplete="off">
      <ul class="plain" id="hubStopResults"></ul>
      <div id="hubEmbed" class="embedbox" hidden></div>
    </div>
    <div class="card no-print">
      <h2>${icon("print")} ${t("batchPosterTitle")}</h2>
      <p class="muted">${t("batchPosterIntro")}</p>
      <label class="embed-field">${t("batchChooseLine")}
        <select id="batchLine"><option value="">—</option></select></label>
      <label class="embed-field">${t("batchChooseDay")}
        <select id="batchDay"></select></label>
      <p><button type="button" id="batchGo">${t("batchGenerate")}</button>
        <span id="batchStatus" class="muted" role="status"></span></p>
    </div>
    <div id="batchOut"></div>`);

  // Näyttöverkosto: pysäkkihaku → kioski-URL + upotuskoodi (showEmbedInto)
  const si = document.getElementById("hubStopSearch");
  const sr = document.getElementById("hubStopResults");
  let stimer = null, sseq = 0;
  si.addEventListener("input", () => {
    clearTimeout(stimer);
    const q = si.value.trim();
    if (q.length < 2) { sr.innerHTML = ""; return; }
    stimer = setTimeout(async () => {
      const my = ++sseq;
      sr.innerHTML = `<li><p class="muted">${t("searching")}</p></li>`;
      try {
        await findFeed();
        const res = await gql(`query ($name: String) { stops(name: $name) { gtfsId name code } }`, { name: q });
        if (my !== sseq) return;
        const stops = (res.stops || []).filter(s => s.gtfsId.startsWith(feedId + ":")).slice(0, 8);
        sr.innerHTML = stops.length
          ? stops.map(s => `<li><button class="item" type="button" data-stop="${esc(s.gtfsId)}">
              <span>${icon("pin")} ${esc(s.name)}</span>
              <span class="muted">${esc(s.code || "")}</span></button></li>`).join("")
          : `<li><p class="muted">${t("noMatches")}</p></li>`;
        sr.querySelectorAll("button[data-stop]").forEach(b => b.addEventListener("click", () => {
          const box = document.getElementById("hubEmbed");
          box.hidden = false;
          showEmbedInto(box, b.dataset.stop);
          box.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }));
      } catch (e) { if (my === sseq) sr.innerHTML = `<li><div class="error">${esc(e.message)}</div></li>`; }
    }, 250);
  });

  // Erätulostus: täytä päivätyyppi- ja linjavalinnat
  const daySel = document.getElementById("batchDay");
  const dts = dayTypeDates(todayISO());
  daySel.innerHTML = dts.map((dt, i) => `<option value="${i}">${esc(dt.label)}</option>`).join("");
  try {
    const routes = await loadRoutes();
    document.getElementById("batchLine").innerHTML = `<option value="">—</option>` + routes
      .slice().sort((a, b) => (a.shortName || "").localeCompare(b.shortName || "", "fi", { numeric: true }))
      .map(r => `<option value="${esc(r.gtfsId)}">${esc(r.shortName || "")} ${esc(r.longName || "")}</option>`).join("");
  } catch (e) { /* lista jää tyhjäksi */ }

  document.getElementById("batchGo").addEventListener("click", async () => {
    const routeId = document.getElementById("batchLine").value;
    const st = document.getElementById("batchStatus");
    const out = document.getElementById("batchOut");
    if (!routeId) { st.textContent = t("batchNoLine"); return; }
    const dt = dts[+daySel.value] || dts[0];
    st.textContent = t("preparingPrint");
    try {
      const { data } = await cachedGql("routestops:" + routeId,
        `query ($id: String!) { route(id: $id) { shortName patterns { stops { gtfsId name code } } } }`, { id: routeId });
      const route = data.route;
      const seen = new Set(), stops = [];
      for (const p of (route?.patterns || [])) for (const s of (p.stops || []))
        if (!seen.has(s.gtfsId)) { seen.add(s.gtfsId); stops.push(s); }
      if (!stops.length) { st.textContent = t("batchNoStops"); return; }
      let done = 0;
      const sections = await mapLimit(stops, 4, async (s) => {
        const r = await cachedGql(`poster:${s.gtfsId}:${dt.date}`,
          `query ($id: String!, $date: String!) {
             stop(id: $id) { stoptimesForServiceDate(date: $date, omitNonPickups: true) {
               pattern { headsign route { shortName longName color textColor } }
               stoptimes { scheduledDeparture headsign } } } }`,
          { id: s.gtfsId, date: dt.date.replace(/-/g, "") }).catch(() => ({ data: null }));
        const groups = r.data?.stop?.stoptimesForServiceDate || [];
        st.textContent = t("batchProgress", { done: ++done, total: stops.length });
        return `<section class="card poster-day">
          <div class="poster-head"><div>
            <h2>${esc(s.name)} <span class="muted">${esc(s.code || "")}</span></h2>
            <p class="poster-sub">${esc(route.shortName || "")} · ${esc(dt.label)} · ${esc(fmtDateLong(dt.date))}</p>
          </div></div>
          ${stopPosterHtml(groups)}</section>`;
      });
      out.innerHTML = `<div class="print-only">${sections.join("")}
        <p class="muted">${t("bookletPeriodNote", { date: fmtDateLong(dt.date) })}</p></div>`;
      setPageOrientation("portrait");
      st.textContent = "";
      window.print();
    } catch (e) { st.textContent = esc(e.message); }
  });
}

/* ---------- Paikkahaku: pysäkit (GraphQL) + osoitteet/POI:t (Pelias) ---------- */

async function geocode(text) {
  const params = new URLSearchParams({
    text, size: "6", lang,
    "focus.point.lat": String(AREA.focus.lat),
    "focus.point.lon": String(AREA.focus.lon),
    "boundary.rect.min_lat": String(AREA.rect.minLat),
    "boundary.rect.max_lat": String(AREA.rect.maxLat),
    "boundary.rect.min_lon": String(AREA.rect.minLon),
    "boundary.rect.max_lon": String(AREA.rect.maxLon),
  });
  if (!PROXY_URL) params.set("digitransit-subscription-key", apiKey);
  const res = await fetch(`${GEOCODING_URL}/search?${params}`);
  if (!res.ok) throw new Error(t("errGeocode") + res.status);
  const json = await res.json();
  return (json.features || [])
    .filter(f => f.geometry?.coordinates)
    .map(f => ({
      name: f.properties.label || f.properties.name,
      lat: f.geometry.coordinates[1],
      lon: f.geometry.coordinates[0],
      layer: f.properties.layer || "address",
    }));
}

async function searchPlaces(q) {
  await findFeed();
  const [stopsRes, geoRes] = await Promise.allSettled([
    gql(`query ($name: String) { stops(name: $name) { gtfsId name code lat lon } }`, { name: q }),
    geocode(q),
  ]);
  const stops = stopsRes.status === "fulfilled"
    ? (stopsRes.value.stops || [])
        .filter(s => s.gtfsId.startsWith(feedId + ":") && s.lat != null)
        .slice(0, 4)
        .map(s => ({ name: s.name + (s.code ? ` (${s.code})` : ""), lat: s.lat, lon: s.lon, layer: "stop" }))
    : [];
  const places = geoRes.status === "fulfilled" ? geoRes.value : [];
  if (!stops.length && !places.length &&
      stopsRes.status === "rejected" && geoRes.status === "rejected") {
    throw stopsRes.reason;
  }
  return [...stops, ...places].slice(0, 9);
}

const PLACE_ICONS = { stop: "pin", address: "home", street: "home", venue: "pin" };

/* Viimeksi haetut paikat nopeuttavat toistuvia hakuja */
function getRecents() {
  try { return JSON.parse(localStorage.getItem(ns("recentPlaces")) || "[]"); }
  catch (e) { return []; }
}

function addRecent(p) {
  if (!p || !p.name || p.name === t("myLocation")) return;
  const r = getRecents().filter(x => x.name !== p.name);
  r.unshift({ name: p.name, lat: p.lat, lon: p.lon, layer: p.layer || "address" });
  try { localStorage.setItem(ns("recentPlaces"), JSON.stringify(r.slice(0, 6))); } catch (e) {}
}

/* ---------- Tallennetut matkat (Koti↔Työ): A→B + seuraavat yhteydet etusivulla ---------- */

function getSavedTrips() {
  try { return JSON.parse(localStorage.getItem(ns("savedTrips")) || "[]"); }
  catch (e) { return []; }
}
function setSavedTrips(a) {
  try { localStorage.setItem(ns("savedTrips"), JSON.stringify(a)); } catch (e) {}
}
function tripId(from, to) {
  return `${from.lat.toFixed(5)},${from.lon.toFixed(5)}>${to.lat.toFixed(5)},${to.lon.toFixed(5)}`;
}
function isTripSaved(from, to) {
  return !!(from && to) && getSavedTrips().some(x => x.id === tripId(from, to));
}
function addSavedTrip(name, from, to) {
  const id = tripId(from, to);
  const keep = p => ({ name: p.name, lat: p.lat, lon: p.lon });
  const trips = getSavedTrips().filter(x => x.id !== id);
  trips.unshift({ id, name, from: keep(from), to: keep(to) });
  setSavedTrips(trips.slice(0, 8));
}
function removeSavedTrip(id) {
  setSavedTrips(getSavedTrips().filter(x => x.id !== id));
}
function tripHash(from, to) {
  const enc = p => encodeURIComponent(`${p.lat.toFixed(5)},${p.lon.toFixed(5)},${p.name}`);
  return `#/reitti/${enc(from)}/${enc(to)}`;
}

// Kevyt seuraavien yhteyksien kysely etusivun korttiin (vain ensimmäinen bussi)
const SAVED_CONN_QUERY = `
  query ($origin: PlanLabeledLocationInput!, $destination: PlanLabeledLocationInput!) {
    planConnection(origin: $origin, destination: $destination, first: 2, searchWindow: "PT3H") {
      edges { node { legs {
        mode start { scheduledTime estimated { time } } route { shortName color textColor }
      } } }
    }
  }`;

function connBrief(node) {
  const ft = node.legs.find(l => l.mode !== "WALK" && l.mode !== "BICYCLE");
  if (!ft) return `<span class="muted">${t("directWalk")}</span>`;
  const mins = Math.round((new Date(legTime(ft.start)) - Date.now()) / 60000);
  const r = ft.route || {};
  const style = r.color ? ` style="background:#${esc(r.color)};color:${badgeText(r.color, r.textColor)}"` : "";
  const when = mins <= 0 ? t("depNow") : mins < 60 ? t("depMin", { n: mins }) : fmtClock(legTime(ft.start));
  return `<span class="badge"${style}>${esc(r.shortName || "")}</span> ${when}`;
}

async function renderSavedTrips() {
  const card = document.getElementById("savedCard");
  const body = document.getElementById("savedBody");
  if (!card || !body) return;
  const trips = getSavedTrips();
  card.hidden = !trips.length;
  if (!trips.length) return;
  body.innerHTML = trips.map((tr, i) => `
    <div class="saved-trip">
      <div class="saved-row">
        <a class="item" href="${esc(tripHash(tr.from, tr.to))}">
          <span>${icon("star")} <span>${esc(tr.name)}</span></span>
        </a>
        <button class="star" data-del="${esc(tr.id)}" aria-label="${t("tripRemove")}" title="${t("tripRemove")}">✕</button>
      </div>
      <p class="muted saved-next" id="savedNext${i}">${t("loadingConns")}</p>
    </div>`).join("");
  body.querySelectorAll("button[data-del]").forEach(b =>
    b.addEventListener("click", () => { removeSavedTrip(b.dataset.del); renderSavedTrips(); }));
  await findFeed().catch(() => {});
  const mySeq = viewSeq;
  trips.forEach(async (tr, i) => {
    try {
      const data = await gql(SAVED_CONN_QUERY, {
        origin: { location: { coordinate: { latitude: tr.from.lat, longitude: tr.from.lon } } },
        destination: { location: { coordinate: { latitude: tr.to.lat, longitude: tr.to.lon } } },
      });
      if (mySeq !== viewSeq) return;
      const el = document.getElementById("savedNext" + i);
      if (!el) return;
      const nodes = (data.planConnection?.edges || []).map(e => e.node);
      el.innerHTML = nodes.length ? nodes.slice(0, 2).map(connBrief).join(" · ") : t("noConns");
    } catch (e) {
      const el = document.getElementById("savedNext" + i);
      if (el) el.textContent = t("connFail");
    }
  });
}

// Yhdistetty osoite-/pysäkkihaku: kirjoitus hakee ehdotukset, valinta antaa
// koordinaatit onPick-kutsulla. Tekstin muokkaus mitätöi aiemman valinnan.
function bindPlaceInput(input, listEl, onPick) {
  let timer = null, seq = 0;
  const close = () => { listEl.innerHTML = ""; listEl.hidden = true; };
  const pick = p => {
    input.value = p.name;
    close();
    addRecent(p);
    onPick(p);
  };
  input.addEventListener("focus", () => {
    if (input.value.trim().length >= 3) return;
    const recents = getRecents();
    if (!recents.length) return;
    listEl.innerHTML = `<li><p class="muted" style="padding:0.3rem 0.45rem;margin:0">${t("recent")}</p></li>`
      + recents.map((p, i) => `<li><button type="button" class="item" data-r="${i}">
          ${icon("clock")}<span>${esc(p.name)}</span></button></li>`).join("");
    listEl.hidden = false;
    listEl.querySelectorAll("button[data-r]").forEach(btn =>
      btn.addEventListener("click", () => pick(recents[Number(btn.dataset.r)])));
  });
  input.addEventListener("input", () => {
    onPick(null);
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 3) { close(); return; }
    timer = setTimeout(async () => {
      const my = ++seq;
      try {
        const places = await searchPlaces(q);
        if (my !== seq) return;
        listEl.innerHTML = places.length
          ? places.map((p, i) => `<li><button type="button" class="item" data-i="${i}">
              ${icon(PLACE_ICONS[p.layer] || "pin")}
              <span>${esc(p.name)}</span></button></li>`).join("")
          : `<li><p class="muted" style="padding:0.4rem">${t("noPlacesFor", { q: esc(q) })}</p></li>`;
        listEl.hidden = false;
        listEl.querySelectorAll("button[data-i]").forEach(btn =>
          btn.addEventListener("click", () => pick(places[Number(btn.dataset.i)])));
      } catch (err) {
        if (my !== seq) return;
        listEl.innerHTML = `<li><div class="error">${esc(err.message)}</div></li>`;
        listEl.hidden = false;
      }
    }, 300);
  });
  // suljetaan vasta kun fokus poistuu koko hakukomponentista, jotta
  // nuolinäppäimillä liikkuminen ehdotuksiin ei sulje listaa
  const wrap = input.closest(".suggest") || input.parentElement;
  wrap.addEventListener("focusout", e => {
    if (!wrap.contains(e.relatedTarget)) setTimeout(close, 150);
  });
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") {
      const first = listEl.querySelector("button");
      if (first) { e.preventDefault(); first.focus(); }
    } else if (e.key === "Escape") {
      close();
    }
  });
  listEl.addEventListener("keydown", e => {
    const btns = [...listEl.querySelectorAll("button")];
    const i = btns.indexOf(document.activeElement);
    if (e.key === "ArrowDown" && i >= 0 && i < btns.length - 1) {
      e.preventDefault(); btns[i + 1].focus();
    } else if (e.key === "ArrowUp" && i >= 0) {
      e.preventDefault();
      if (i > 0) btns[i - 1].focus(); else input.focus();
    } else if (e.key === "Escape") {
      close(); input.focus();
    }
  });
}

/* ---------- Luonnollisen kielen matkasyöttö (paikallinen jäsennys) + puhe ---------- */
// TEKSTIJÄSENNYS on 100 % selaimessa (ei rajapintaa → ilmainen + offline, säilyttää ~0 €/kk).
// PUHE käyttää selaimen SpeechRecognitionia, joka VOI lähettää äänen selainvalmistajan
// pilveen (esim. Chrome → Google) → puhe EI ole täysin paikallinen, toisin kuin tekstijäsennys.
// Tästä syystä UI-teksteissä ei väitetä puhetta paikalliseksi.

// Suomen lähtö-/määränpääsijapäätteen trimmaus (best-effort; täydellinen lemmaus vaatisi
// kirjaston, joten epäonnistuessa geocoderin sumeus + graceful fallback paikkaavat).
function trimFiOrig(w) { return w.replace(/:?(sta|stä|lta|ltä)$/i, ""); }
function trimFiDest(w) {
  return w
    .replace(/:?(lle|seen)$/i, "")
    .replace(/:?([aeiouyåäö])\1n$/i, "$1")   // illatiivi vokaalinpidennyksellä: Turkuun→Turku, Helsinkiin→Helsinki
    .replace(/:?h([aeiouyåäö])n$/i, "");      // illatiivi -hVn: maahan→maa
}
const isFiOrig = w => /:?(sta|stä|lta|ltä)$/i.test(w);
const isFiDest = w => /:?(lle|seen)$/i.test(w) || /:?([aeiouyåäö])\1n$/i.test(w) || /:?h([aeiouyåäö])n$/i.test(w);

// Jäsentää matkalauseen → { from, to, time } (merkkijonoina; paikat resolvoidaan geocodella).
function parseNlTrip(raw) {
  const out = { from: null, to: null, time: null };
  let s = String(raw || "").trim().replace(/\s+/g, " ");
  if (!s) return out;
  // Aika: klo/kello/kl./at HH(.MM/:MM); nyt/now/nu poistetaan (oletus = nyt)
  const tm = s.match(/\b(?:klo|kello|kl\.?|at)\s*(\d{1,2})(?:[.:](\d{2}))?\b/i);
  if (tm) {
    out.time = String(Math.min(23, parseInt(tm[1], 10))).padStart(2, "0") + ":" + (tm[2] || "00");
    s = s.replace(tm[0], " ");
  }
  s = s.replace(/\b(nyt|now|nu)\b/gi, " ").replace(/\s+/g, " ").trim();
  // Intent-/verbietuliitteet pois
  s = s.replace(/^(?:haluan|haluaisin|asiakas haluaa|menen|miten p[aä][aä]sen|kuinka p[aä][aä]sen|i want to go|i would like to go|how (?:do|can) i get|jag vill (?:åka|resa))\b/i, "").trim();
  // Matkaverbi heti alusta (intent-etuliitteen jälkeen); \b ei toimi suomen ä/ö-päätteissä → ^-ankkuri
  s = s.replace(/^(?:menn[äa]|menen|to go|åka|resa)\s+/i, "").replace(/\s+/g, " ").trim();
  const clean = v => v.replace(/^[\s,;:.\-]+|[\s,;:.\-]+$/g, "").trim();
  // 1) Nuoli
  let m = s.match(/^(.+?)\s*(?:->|→|=>|–>)\s*(.+)$/);
  if (m) { out.from = clean(m[1]); out.to = clean(m[2]); return out; }
  // 2) Eksplisiittiset liittimet (from/to, från/till, paikasta/paikkaan…)
  m = s.match(/\b(?:from|från)\s+(.+?)\s+\b(?:to|till)\s+(.+)$/i)
    || s.match(/\b(?:paikasta|pys[aä]kilt[äa]|osoitteesta|kohteesta)\s+(.+?)\s+\b(?:paikkaan|pys[aä]kille|osoitteeseen|kohteeseen)\s+(.+)$/i);
  if (m) { out.from = clean(m[1]); out.to = clean(m[2]); return out; }
  // 3) Pelkkä to/till -jako
  m = s.match(/^(.+?)\s+\b(?:to|till)\s+(.+)$/i);
  if (m) { out.from = clean(m[1]); out.to = clean(m[2]); return out; }
  // 4) FI sijapääte-jako (lähtö = elatiivi/ablatiivi, määränpää = illatiivi/allatiivi)
  const words = s.split(" ");
  const oi = words.findIndex(isFiOrig);
  if (oi >= 0) {
    const di = words.findIndex((w, k) => k > oi && isFiDest(w));
    if (di >= 0) {
      const o = words.slice(0, oi + 1); o[o.length - 1] = trimFiOrig(o[o.length - 1]);
      const d = words.slice(oi + 1, di + 1); d[d.length - 1] = trimFiDest(d[d.length - 1]);
      out.from = clean(o.join(" ")); out.to = clean(d.join(" ")); return out;
    }
    const o = words.slice(0, oi + 1); o[o.length - 1] = trimFiOrig(o[o.length - 1]);
    out.from = clean(o.join(" ")); return out;   // vain lähtö saatiin
  }
  // 5) Pelkkä määränpää
  const di = words.findIndex(isFiDest);
  if (di >= 0) {
    const d = words.slice(0, di + 1); d[d.length - 1] = trimFiDest(d[d.length - 1]);
    out.to = clean(d.join(" ")); return out;
  }
  return out;
}

// Jäsennä → geocode (ylin ehdotus) → täytä kentät → jos MOLEMMAT paikat saatiin: aja haku;
// muuten täytä saatu, kohdista puuttuvaan kenttään + lempeä vihje (ei kovaa virhettä).
async function runNlTrip(text, c) {
  const p = parseNlTrip(text);
  const hint = msg => { c.msg.innerHTML = msg ? `<p class="muted">${esc(msg)}</p>` : ""; };
  if (!p.from && !p.to) { hint(t("nlNeedBoth")); c.focus(c.fromInput); return; }
  hint(t("searchingRoutes"));
  const top = async q => { try { const r = await searchPlaces(q); return r[0] || null; } catch (e) { return null; } };
  const [fp, tp] = await Promise.all([p.from ? top(p.from) : Promise.resolve(null), p.to ? top(p.to) : Promise.resolve(null)]);
  if (fp) { c.setFrom(fp); c.fromInput.value = fp.name; }
  if (tp) { c.setTo(tp); c.toInput.value = tp.name; }
  if (p.time && c.setTime) c.setTime(p.time);
  if (fp && tp) { hint(""); c.run(); }                                   // molemmat varmasti → aja heti
  else if (fp && !tp) { hint(t("nlNeedDest")); c.focus(c.toInput); }
  else if (!fp && tp) { hint(t("nlNeedOrigin")); c.focus(c.fromInput); }
  else { hint(t("nlNeedBoth")); c.focus(c.fromInput); }
}

function nlSpeechCtor() { return window.SpeechRecognition || window.webkitSpeechRecognition || null; }

// Kytkee älykentän: Enter ajaa runNlTrip; mikrofoni (jos tuettu) puhuttaa lauseen. Jos
// SpeechRecognition puuttuu, mikrofonipainike poistetaan siististi (ei virhettä).
function bindNlField(input, micBtn, c) {
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); const v = input.value.trim(); if (v) runNlTrip(v, c); }
  });
  const SR = nlSpeechCtor();
  if (!SR || !micBtn) { if (micBtn) micBtn.remove(); return; }
  let rec = null, listening = false;
  const setState = on => {
    listening = on;
    micBtn.classList.toggle("listening", on);
    micBtn.setAttribute("aria-pressed", on ? "true" : "false");
    micBtn.setAttribute("aria-label", on ? t("nlMicStop") : t("nlMicStart"));
    micBtn.title = on ? t("nlMicStop") : t("nlMicStart");
    if (on) c.msg.innerHTML = `<p class="muted">${esc(t("nlListening"))}</p>`;
  };
  micBtn.addEventListener("click", () => {
    if (listening && rec) { try { rec.stop(); } catch (e) {} return; }
    try {
      rec = new SR();
      rec.lang = lang === "sv" ? "sv-SE" : lang === "en" ? "en-GB" : "fi-FI";
      rec.interimResults = false; rec.maxAlternatives = 1;
      rec.onresult = ev => { const txt = ev.results?.[0]?.[0]?.transcript || ""; if (txt) { input.value = txt; runNlTrip(txt, c); } };
      rec.onerror = () => { setState(false); c.msg.innerHTML = `<p class="muted">${esc(t("nlMicError"))}</p>`; };
      rec.onend = () => setState(false);
      setState(true); rec.start();
    } catch (e) { setState(false); }
  });
}

/* ---------- Palvelutiski-tila (#/palvelutiski) ---------- */
// Koko ruudun, näppäimistövetoinen A→B-haku + "pysäkin linjat" kaupungin työntekijän
// näytölle. Pakotettu kirkas korkea kontrasti (.desk ylikirjoittaa tokenit, ei riipu
// teemasta). Uudelleenkäyttää reittihaun koneiston (searchPlaces, PLAN_QUERY, badgeHtml…).

function exitDeskMode() { document.body.classList.remove("desk-mode"); }

// Pysäkkihaku linjoineen (feed-rajattu): stops(name:) palauttaa pysäkit + linjat yhdellä kyselyllä.
const DESK_STOP_QUERY = `query ($name: String!) {
  stops(name: $name) { gtfsId name code routes { shortName longName } }
}`;

function dedupeRoutesByShort(routes) {
  const seen = new Set(), out = [];
  for (const r of routes || []) {
    const k = (r.shortName || "").toUpperCase();
    if (k && !seen.has(k)) { seen.add(k); out.push(r); }
  }
  out.sort((a, b) => String(a.shortName || "").localeCompare(String(b.shortName || ""), undefined, { numeric: true }));
  return out;
}

// Näppäinvetoinen paikkakenttä: Enter hyväksyy ylimmän ehdotuksen ja etenee (onAdvance).
function bindDeskPlace(input, listEl, onPick, onAdvance) {
  let timer = null, seq = 0, places = [], picked = null;
  const close = () => { listEl.innerHTML = ""; listEl.hidden = true; };
  const pick = p => { picked = p; input.value = p.name; close(); addRecent(p); onPick(p); };
  const pickTop = async () => {
    if (picked && picked.name === input.value.trim()) return true;
    if (places.length) { pick(places[0]); return true; }
    const q = input.value.trim();
    if (q.length >= 3) { try { const r = await searchPlaces(q); if (r.length) { pick(r[0]); return true; } } catch (e) {} }
    return false;
  };
  input.addEventListener("input", () => {
    picked = null; onPick(null); clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 3) { close(); places = []; return; }
    timer = setTimeout(async () => {
      const my = ++seq;
      try {
        const r = await searchPlaces(q);
        if (my !== seq) return;
        places = r;
        listEl.innerHTML = r.length
          ? r.map((p, i) => `<li><button type="button" class="item" data-i="${i}">
              ${icon(PLACE_ICONS[p.layer] || "pin")}<span>${esc(p.name)}</span></button></li>`).join("")
          : `<li><p class="muted" style="padding:0.4rem">${t("noPlacesFor", { q: esc(q) })}</p></li>`;
        listEl.hidden = false;
        listEl.querySelectorAll("button[data-i]").forEach(btn =>
          btn.addEventListener("click", () => { pick(r[Number(btn.dataset.i)]); onAdvance(); }));
      } catch (err) {
        if (my === seq) { listEl.innerHTML = `<li><div class="error">${esc(err.message)}</div></li>`; listEl.hidden = false; }
      }
    }, 250);
  });
  input.addEventListener("keydown", async e => {
    if (e.key === "Enter") { e.preventDefault(); await pickTop(); onAdvance(); }
    else if (e.key === "Tab" && !e.shiftKey) { if (places.length) pick(places[0]); }
    else if (e.key === "Escape") { close(); }
  });
  const wrap = input.closest(".suggest") || input.parentElement;
  wrap.addEventListener("focusout", e => { if (!wrap.contains(e.relatedTarget)) setTimeout(close, 150); });
}

// "Kerro asiakkaalle" -yhteenveto: nopein yhteys + saman linjan/pysäkin seuraava lähtö.
// Ensimmäinen joukkoliikenne-leg (ei kävely/pyöräily) tai null.
function firstTransitLeg(node) { return node?.legs?.find(l => l.mode !== "WALK" && l.mode !== "BICYCLE") || null; }
// Aikaisin node jossa on bussileg (ensimmäisen joukkoliikenne-legin lähtöajan mukaan), tai null.
function soonestBusNode(nodes) {
  const withBus = (nodes || []).filter(firstTransitLeg);
  if (!withBus.length) return null;
  return withBus.reduce((a, b) =>
    new Date(legTime(firstTransitLeg(a).start)) <= new Date(legTime(firstTransitLeg(b).start)) ? a : b);
}
// Vaihdot-teksti nodelle (jaettu tell + kortti).
function deskTransfersTxt(node) {
  const tr = node.numberOfTransfers;
  if (!tr) return "";
  const tStops = node.legs.filter((l, i) => i > 0 && l.mode !== "WALK" && l.mode !== "BICYCLE").map(l => l.from.name);
  return tr === 1 ? t("deskTransfer1", { stop: esc(tStops[0] || "") }) : t("deskTransferN", { n: tr, stop: esc(tStops.join(", ")) });
}
// "Bussi: linja Y pysäkiltä Z klo HH:MM, perillä HH:MM." (+ vaihdot) — luettavaksi ääneen tellissä.
function deskBusSentence(node) {
  const ft = firstTransitLeg(node);
  const s = t("deskNextBusLine", { line: esc(ft.route?.shortName || ""), stop: esc(ft.from.name),
    dep: fmtClock(legTime(ft.start)), arr: fmtClock(node.end) });
  const tr = deskTransfersTxt(node);
  return tr ? s + " " + tr : s;
}
// Korostettu "Seuraava bussi" -kortti (näytetään VAIN kun kävely on nopein). busNode null → ei bussia tänään.
function deskNextBusHtml(busNode) {
  const head = `<div class="desk-next-bus-h">${icon("bus")} ${t("deskNextBusTitle")}</div>`;
  if (!busNode) return `<div class="desk-next-bus desk-next-bus--none">${head}<p>${t("deskNoBusToday")}</p></div>`;
  const ft = firstTransitLeg(busNode);
  const bg = ft.route?.color ? "#" + ft.route.color : "var(--btn-bg)";
  const fg = ft.route?.color ? badgeText(ft.route.color, ft.route.textColor) : "#fff";
  const tr = deskTransfersTxt(busNode);
  return `<div class="desk-next-bus">${head}
    <p class="desk-next-bus-body"><span class="badge" style="background:${bg};color:${fg}">${esc(ft.route?.shortName || "")}</span>
      ${t("deskNextBusFromTo", { stop: esc(ft.from.name), dep: fmtClock(legTime(ft.start)), arr: fmtClock(busNode.end) })}${tr ? ` <span class="muted">${tr}</span>` : ""}</p></div>`;
}

function deskTellHtml(nodes, busNode) {
  const node = nodes[0];
  const transit = node.legs.filter(l => l.mode !== "WALK" && l.mode !== "BICYCLE");
  const head = `<div class="desk-tell-h">${t("deskTellTitle")}</div>`;
  if (!transit.length) {
    // Nopein on pelkkä kävely → kerro silti seuraava bussi (asiakas kysyi bussia)
    const dur = fmtDur((new Date(node.end) - new Date(node.start)) / 1000);
    const walk = t("deskWalkFastest", { dur });
    const bus = busNode ? deskBusSentence(busNode) : t("deskNoBusToday");
    return `<div class="desk-tell">${head}<p class="desk-tell-body">${walk} ${bus}</p></div>`;
  }
  const first = transit[0];
  const line = first.route?.shortName || "";
  const board = first.from.name, dep = fmtClock(legTime(first.start));
  // Jättöpysäkki = viimeisen bussiosuuden päätepysäkki (ei kävelyn "Destination"-label);
  // perilläoloaika = koko matkan loppu (sisältää mahd. loppukävelyn).
  const lastTransit = transit[transit.length - 1];
  const arrStop = lastTransit.to.name, arr = fmtClock(node.end);
  let next = "";
  for (let i = 1; i < nodes.length; i++) {
    const ft = nodes[i].legs.find(l => l.mode !== "WALK" && l.mode !== "BICYCLE");
    if (ft && (ft.route?.shortName || "") === line && ft.from.name === board) { next = fmtClock(legTime(ft.start)); break; }
  }
  const boardTxt = next
    ? t("deskTellBoardNext", { line: esc(line), stop: esc(board), time: dep, next })
    : t("deskTellBoard", { line: esc(line), stop: esc(board), time: dep });
  const tr = node.numberOfTransfers;
  let transferTxt;
  if (tr === 0) transferTxt = t("deskNoTransfers");
  else {
    const tStops = node.legs.filter((l, i) => i > 0 && l.mode !== "WALK" && l.mode !== "BICYCLE").map(l => l.from.name);
    transferTxt = tr === 1 ? t("deskTransfer1", { stop: esc(tStops[0] || "") })
                           : t("deskTransferN", { n: tr, stop: esc(tStops.join(", ")) });
  }
  return `<div class="desk-tell">${head}
    <p class="desk-tell-body">${boardTxt} ${t("deskTellArrive", { stop: esc(arrStop), time: arr })} ${transferTxt}</p></div>`;
}

// Pysäkit reitillä: nousupysäkki (+ linja) → välipysäkit → jättö/vaihto, legeittäin.
function deskStopsListHtml(node) {
  const items = [];
  node.legs.forEach(leg => {
    if (leg.mode === "WALK" || leg.mode === "BICYCLE") return;
    const plat = leg.from.stop?.platformCode ? " (" + esc(leg.from.stop.platformCode) + ")" : "";
    items.push(`<li class="ds-board">▶ ${esc(leg.from.name)}${plat} — ${esc(leg.route?.shortName || "")}</li>`);
    (leg.intermediateStops || []).forEach(s => items.push(`<li class="ds-mid">${esc(s.name)}</li>`));
    items.push(`<li class="ds-alight">■ ${esc(leg.to.name)} ${fmtClock(legTime(leg.end))}</li>`);
  });
  return `<ul class="desk-stoplist">${items.join("")}</ul>`;
}

// Yhden yhteyden tiivistelmä (iso): ajat, kesto, linjabadget, vaihdot + pysäkit reitillä.
function deskOptionHtml(node) {
  const dur = fmtDur((new Date(node.end) - new Date(node.start)) / 1000);
  const tr = node.numberOfTransfers === 0 ? t("transfers0")
    : node.numberOfTransfers === 1 ? t("transfers1") : t("transfersN", { n: node.numberOfTransfers });
  const lines = node.legs.filter(l => l.route).map(l => badgeHtml(l.route, l.mode)).join(" ");
  return `<div class="desk-opt">
    <div class="desk-opt-top">
      <span class="desk-opt-time">${fmtClock(node.start)}–${fmtClock(node.end)}</span>
      <span class="desk-opt-dur">${dur}</span>
      <span class="muted">${tr}</span>
    </div>
    <div class="desk-opt-lines">${lines || `<span class="muted">${t("deskWalkOnly", { dur })}</span>`}</div>
    <details class="desk-stops"><summary>${t("deskStopsTitle")}</summary>${deskStopsListHtml(node)}</details>
  </div>`;
}

  await findFeed().catch(() => {});
  setView(`

          <div class="desk-field"><label for="deskTo">${t("to")}</label>

          <p class="muted">${t("deskKbdHint")}</p>
          <div id="deskMsg" role="status"></div>
          <div id="deskResults"></div>
        </section>
        <section class="desk-col">
          <h2>${t("deskStopTitle")}</h2>
          <div class="desk-field"><label for="deskStop">${t("deskStopLabel")}</label>
            <div class="suggest"><input id="deskStop" type="text" autocomplete="off" placeholder="${t("deskStopPlaceholder")}">
              <ul class="plain suggest-list" id="deskStopList" hidden></ul></div></div>

    msg.innerHTML = `<p class="muted">${t("searchingRoutes")}</p>`;
    const origin = { location: { coordinate: { latitude: dFrom.lat, longitude: dFrom.lon } } };
    const destination = { location: { coordinate: { latitude: dTo.lat, longitude: dTo.lon } } };
    let data;
    try { data = await gql(PLAN_QUERY, { origin, destination, first: 5 }); }
    catch (e) { msg.innerHTML = `<div class="error">${t("deskSearchErr")}</div>`; return; }
    msg.innerHTML = "";
    const nodes = (data.planConnection?.edges || []).map(e => e.node);
    const res = document.getElementById("deskResults");
    if (!nodes.length) { res.innerHTML = `<p class="muted">${t("noItineraries")}</p>`; return; }
    // Aina seuraava bussi näkyviin: jos ensisijaisessa haussa ei ole bussia (kävely voittaa tai
    // vuoroja ei juuri nyt aja), aja pakotettu bussikysely leveällä ikkunalla.
    const fastestHasBus = !!firstTransitLeg(nodes[0]);
    let busNode = soonestBusNode(nodes);
    if (!busNode) {
      try {
        const nb = await gql(NEXT_BUS_QUERY, { origin, destination });
        busNode = (nb.planConnection?.edges || []).map(e => e.node).find(firstTransitLeg) || null;
      } catch (e) { busNode = null; }
    }
    res.innerHTML = deskTellHtml(nodes, busNode)
      + (fastestHasBus ? "" : deskNextBusHtml(busNode))   // erillinen "Seuraava bussi" -kortti vain kun kävely voittaa
      + `<h3 class="desk-h3">${t("deskOptionsTitle")}</h3>`
      + nodes.map(n => deskOptionHtml(n)).join("");

  bindDeskPlace(fromEl, document.getElementById("deskFromList"), p => { dFrom = p; }, () => toEl.focus());
  bindDeskPlace(toEl, document.getElementById("deskToList"), p => { dTo = p; }, runSearch);
  // Luonnollisen kielen kenttä palvelutiskissä: täyttää saman Mistä/Minne + ajaa runSearchin
  bindNlField(document.getElementById("deskNlInput"), document.getElementById("deskNlMic"), {
    msg: document.getElementById("deskNlMsg"),
    fromInput: fromEl, toInput: toEl,
    setFrom: p => { dFrom = p; },
    setTo: p => { dTo = p; },
    setTime: null,   // palvelutiski on nyt-orientoitunut → parsittu aika ohitetaan v1:ssä
    focus: el => el.focus(),
    run: () => runSearch(),
  });
  fromEl.focus();

  // "Pysäkin linjat" -pikahaku
  const stopEl = document.getElementById("deskStop");
  const stopList = document.getElementById("deskStopList");
  let stopTimer = null, stopSeq = 0, stopMatches = [];
  const showStopRoutes = s => {
    const routes = dedupeRoutesByShort(s.routes);
    document.getElementById("deskStopResults").innerHTML =
      `<p class="desk-stop-h">${t("deskStopLines", { stop: esc(s.name) })}</p>
       <div class="desk-stop-lines">${routes.length
         ? routes.map(r => `<span class="badge">${esc(r.shortName || "")}</span>`).join(" ")
         : `<span class="muted">${t("deskStopNoLines")}</span>`}</div>`;
  };
  stopEl.addEventListener("input", () => {
    clearTimeout(stopTimer);
    const q = stopEl.value.trim();
    if (q.length < 2) { stopList.hidden = true; stopList.innerHTML = ""; return; }
    stopTimer = setTimeout(async () => {
      const my = ++stopSeq;
      let data;
      try { data = await gql(DESK_STOP_QUERY, { name: q }); } catch (e) { return; }
      if (my !== stopSeq) return;
      const pref = feedId ? feedId + ":" : "";
      stopMatches = (data.stops || []).filter(s => !pref || String(s.gtfsId).startsWith(pref))
        .filter(s => (s.routes || []).length).slice(0, 12);
      stopList.innerHTML = stopMatches.length
        ? stopMatches.map((s, i) => `<li><button type="button" class="item" data-s="${i}">
            ${icon("pin")}<span>${esc(s.name)}${s.code ? " (" + esc(s.code) + ")" : ""}</span></button></li>`).join("")
        : `<li><p class="muted" style="padding:0.4rem">${t("deskNoStop")}</p></li>`;
      stopList.hidden = false;
      stopList.querySelectorAll("button[data-s]").forEach(btn =>
        btn.addEventListener("click", () => { const s = stopMatches[Number(btn.dataset.s)]; stopEl.value = s.name; stopList.hidden = true; showStopRoutes(s); }));
    }, 250);
  });
  stopEl.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); if (stopMatches.length) { const s = stopMatches[0]; stopEl.value = s.name; stopList.hidden = true; showStopRoutes(s); } }
    else if (e.key === "Escape") { stopList.hidden = true; }
  });
  const sw = stopEl.closest(".suggest");
  sw.addEventListener("focusout", e => { if (!sw.contains(e.relatedTarget)) setTimeout(() => { stopList.hidden = true; }, 150); });
}

/* ---------- A→B-reitinhaku (planConnection) ---------- */

// Säilyy istunnon ajan, jotta paluu näkymään ei tyhjennä kenttiä
const planState = { from: null, to: null, timeMode: "dep", time: "", wheelchair: false, lessWalk: false };

function fmtClock(iso) {
  const d = new Date(iso);
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function fmtDur(sec) {
  const m = Math.round(sec / 60);
  return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`;
}

function nowLocalInput() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}

/* Jaettava reittilinkki: hakuehdot talteen URL:iin (replaceState ei laukaise
   hashchangea, joten näkymä ei piirry turhaan uudelleen) */
function planHash(includeTime = true) {
  const enc = p => encodeURIComponent(`${p.lat.toFixed(5)},${p.lon.toFixed(5)},${p.name}`);
  const opts = new URLSearchParams();
  if (includeTime && planState.time) opts.set("t", planState.time);
  if (includeTime && planState.timeMode === "arr") opts.set("m", "arr");
  if (planState.wheelchair) opts.set("wc", "1");
  if (planState.lessWalk) opts.set("lw", "1");
  const o = opts.toString();
  return `#/reitti/${enc(planState.from)}/${enc(planState.to)}${o ? "/" + encodeURIComponent(o) : ""}`;
}

function parsePlanParams(parts) {
  const dec = s => {
    const i1 = s.indexOf(","), i2 = s.indexOf(",", i1 + 1);
    if (i1 < 0 || i2 < 0) return null;
    const lat = parseFloat(s.slice(0, i1)), lon = parseFloat(s.slice(i1 + 1, i2));
    const name = s.slice(i2 + 1);
    return Number.isFinite(lat) && Number.isFinite(lon) && name ? { name, lat, lon } : null;
  };
  const from = dec(parts[1] || ""), to = dec(parts[2] || "");
  if (!from || !to) return false;
  planState.from = from;
  planState.to = to;
  const opts = new URLSearchParams(parts[3] || "");
  if (opts.get("t")) planState.time = opts.get("t");
  planState.timeMode = opts.get("m") === "arr" ? "arr" : "dep";
  planState.wheelchair = opts.get("wc") === "1";
  planState.lessWalk = opts.get("lw") === "1";
  return true;
}

// "2026-06-12T18:30" -> "2026-06-12T18:30:00+03:00"
function isoWithOffset(local) {
  const off = -new Date(local).getTimezoneOffset();
  const sign = off >= 0 ? "+" : "-";
  const pad = n => String(Math.floor(Math.abs(n))).padStart(2, "0");
  return `${local}:00${sign}${pad(off / 60)}:${pad(off % 60)}`;
}

const PLAN_QUERY = `
  query ($origin: PlanLabeledLocationInput!, $destination: PlanLabeledLocationInput!,
         $first: Int, $after: String, $last: Int, $before: String,
         $dateTime: PlanDateTimeInput, $preferences: PlanPreferencesInput) {
    planConnection(origin: $origin, destination: $destination,
                   first: $first, after: $after, last: $last, before: $before,
                   searchWindow: "PT2H", dateTime: $dateTime,
                   preferences: $preferences) {
      pageInfo { startCursor endCursor hasNextPage hasPreviousPage }
      edges { node {
        start end numberOfTransfers walkDistance
        legs {
          mode duration distance realtimeState
          start { scheduledTime estimated { time } }
          end { scheduledTime estimated { time } }
          from { name lat lon stop { code platformCode } }
          to { name lat lon stop { code } }
          route { gtfsId shortName color textColor }
          trip { tripHeadsign occupancy { occupancyStatus } }
          intermediateStops { name }
          legGeometry { points }
          alerts { alertHeaderText alertSeverityLevel }
        }
      } }
    }
  }`;

// Toissijainen "seuraava bussi" -kysely palvelutiskille: pakottaa joukkoliikennetuloksen
// (transitOnly: true → ei koko matkan kävelyä) leveällä aikaikkunalla, kun ensisijaisessa
// haussa ei ole lainkaan bussia. transit BUS rajaa busseihin. Tyhjä → ei bussia loppupäivänä.
const NEXT_BUS_QUERY = `
  query ($origin: PlanLabeledLocationInput!, $destination: PlanLabeledLocationInput!) {
    planConnection(origin: $origin, destination: $destination, first: 3,
                   searchWindow: "PT16H",
                   modes: { transitOnly: true, transit: { transit: [{ mode: BUS }] } }) {
      edges { node {
        start end numberOfTransfers
        legs {
          mode duration
          start { scheduledTime estimated { time } }
          end { scheduledTime estimated { time } }
          from { name stop { platformCode } }
          to { name }
          route { gtfsId shortName color textColor }
        }
      } }
    }
  }`;

// Suorat kävely- ja pyöräilyreitit vaihtoehdoiksi joukkoliikenteen rinnalle
const DIRECT_QUERY = `
  query ($origin: PlanLabeledLocationInput!, $destination: PlanLabeledLocationInput!,
         $direct: [PlanDirectMode!]) {
    planConnection(origin: $origin, destination: $destination, first: 1,
                   modes: { directOnly: true, direct: $direct }) {
      edges { node {
        start end
        legs { mode duration distance legGeometry { points } from { name lat lon } to { name lat lon } }
      } }
    }
  }`;

const MODE_ICONS = { WALK: "walk", BICYCLE: "bike" };

function fmtKm(m) {
  const km = (m / 1000).toFixed(1);
  return (lang === "en" ? km : km.replace(".", ",")) + " km";
}

function legTime(lt) { return lt.estimated?.time || lt.scheduledTime; }

// Yhteenvedon osuuspalkki: segmentin leveys = legin kesto, väri = linjan väri
function legBarHtml(node) {
  const total = node.legs.reduce((s, l) => s + l.duration, 0) || 1;
  return `<span class="legbar" aria-hidden="true">${node.legs.map(leg => {
    const grow = Math.max(leg.duration / total, 0.04);
    if (leg.mode === "WALK" || leg.mode === "BICYCLE") {
      return `<span class="seg walk" style="flex-grow:${grow.toFixed(3)}">${MODE_ICONS[leg.mode] ? icon(MODE_ICONS[leg.mode]) : ""}</span>`;
    }
    const bg = leg.route?.color ? "#" + leg.route.color : "var(--btn-bg)";
    const fg = leg.route?.color ? badgeText(leg.route.color, leg.route.textColor) : "#fff";
    return `<span class="seg" style="flex-grow:${grow.toFixed(3)};background:${bg};color:${fg}">
      ${esc(leg.route?.shortName || "")}</span>`;
  }).join("")}</span>`;
}

// Pystyaikajana: lähtöpaikka → kävely → pysäkki (laituri) → linja välipysäkkeineen → … → perille
function timelineHtml(node) {
  const rows = [];
  const pointRow = (timeIso, name, sub, cls) => `
    <div class="tl-row pt ${cls || ""}">
      <span class="tl-time">${timeIso ? fmtClock(timeIso) : ""}</span>
      <span class="tl-mid" aria-hidden="true"></span>
      <div class="tl-body"><strong>${name}</strong>${sub ? ` <span class="muted">${sub}</span>` : ""}</div>
    </div>`;

  const legs = node.legs;
  const originName = legs[0].from.name === "Origin"
    ? esc(planState.from?.name || t("origin")) : esc(legs[0].from.name);
  rows.push(pointRow(legTime(legs[0].start), originName, "", "start"));

  legs.forEach((leg, i) => {
    if (leg.mode === "WALK" || leg.mode === "BICYCLE") {
      rows.push(`
        <div class="tl-row leg dashed">
          <span class="tl-time"></span>
          <span class="tl-mid" aria-hidden="true"></span>
          <div class="tl-body">${icon(MODE_ICONS[leg.mode])} ${t(leg.mode === "WALK" ? "walkVerb" : "bikeVerb")}
            ${Math.round(leg.distance)} m
            <span class="muted">(${fmtDur(leg.duration)})</span></div>
        </div>`);
    } else {
      const rt = leg.realtimeState && leg.realtimeState !== "SCHEDULED";
      const rail = leg.route?.color ? "#" + leg.route.color : "var(--blue)";
      const mids = leg.intermediateStops || [];
      const midLabel = mids.length === 0 ? t("intermediate0")
        : mids.length === 1 ? t("intermediate1") : t("intermediateN", { n: mids.length });
      const alerts = (leg.alerts || []).map(a =>
        `<p class="muted">${icon("warning")} ${esc(a.alertHeaderText || t("legAlertDefault"))}</p>`).join("");
      rows.push(`
        <div class="tl-row leg" style="--rail:${rail}">
          <span class="tl-time"></span>
          <span class="tl-mid" aria-hidden="true"></span>
          <div class="tl-body">
            ${badgeHtml(leg.route, leg.mode)}
            ${esc(leg.trip?.tripHeadsign ? "→ " + leg.trip.tripHeadsign : "")}${occupancyHtml(leg.trip)}
            ${rt ? `<span class="rt"> ●</span>` : ""}
            <details class="tl-stops">
              <summary>${midLabel} · ${fmtDur(leg.duration)}</summary>
              ${mids.length ? `<ul>${mids.map(s => `<li>${esc(s.name)}</li>`).join("")}</ul>` : ""}
            </details>
            ${alerts}
          </div>
        </div>`);
    }
    // legin päätepiste: vaihtopysäkki tai määränpää
    const isLast = i === legs.length - 1;
    const next = legs[i + 1];
    if (isLast) {
      const destName = leg.to.name === "Destination"
        ? esc(planState.to?.name || t("destination")) : esc(leg.to.name);
      rows.push(pointRow(legTime(leg.end), destName, "", "end"));
    } else {
      // vaihtoaika näkyviin, kun seuraava osuus on joukkoliikennettä
      let wait = "";
      if (next && next.mode !== "WALK" && next.mode !== "BICYCLE") {
        const mins = Math.round((new Date(legTime(next.start)) - new Date(legTime(leg.end))) / 60000);
        if (mins >= 1) wait = t("transferWait", { n: mins });
      }
      const sub = [
        leg.to.stop?.code ? esc(leg.to.stop.code) : "",
        next?.from.stop?.platformCode ? t("platform", { p: esc(next.from.stop.platformCode) }) : "",
        wait,
      ].filter(Boolean).join(" · ");
      rows.push(pointRow(legTime(leg.end), esc(leg.to.name), sub));
    }
  });
  return `<div class="tl">${rows.join("")}</div>`;
}

function itinSummaryHtml(node) {
  const walk = Math.round(node.walkDistance);
  const transfers = node.numberOfTransfers === 0 ? t("transfers0")
    : node.numberOfTransfers === 1 ? t("transfers1") : t("transfersN", { n: node.numberOfTransfers });
  const durSec = (new Date(node.end) - new Date(node.start)) / 1000;
  // ensimmäisen bussin lähtölaskenta tuo tärkeimmän tiedon heti otsikkoriviin
  const firstTransit = node.legs.find(l => l.mode !== "WALK" && l.mode !== "BICYCLE");
  let departs = "";
  if (firstTransit) {
    const mins = Math.round((new Date(legTime(firstTransit.start)) - Date.now()) / 60000);
    if (mins >= 0 && mins <= 90) {
      departs = `<span class="rt">${mins === 0 ? t("departsNow") : t("departsIn", { n: mins })}</span>`;
    }
  }
  return `
    <span class="itin-head">
      <span class="times">${fmtClock(node.start)}–${fmtClock(node.end)}</span>
      <span>${fmtDur(durSec)}</span>
      <span class="muted">${transfers} · ${t("walkAmount", { n: walk })}</span>
      ${departs}
    </span>
    ${legBarHtml(node)}`;
}

// CO₂-säästöarvio: bussissa ajettu matka × (auton − bussin päästökerroin).
// Kertoimet ovat läpinäkyviä arvioita (näytetään title-vihjeenä), ei väitettä
// tarkasta päästömäärästä. Lähde-/oletustaso: henkilöauto ~0,15, bussi ~0,04
// kg CO₂/km matkustajaa kohti.
const CO2_CAR_KG_PER_KM = 0.15;
const CO2_BUS_KG_PER_KM = 0.04;
function transitKm(node) {
  return node.legs
    .filter(l => l.mode !== "WALK" && l.mode !== "BICYCLE")
    .reduce((s, l) => s + (l.distance || 0), 0) / 1000;
}
function fmtKg(kg) {
  const v = kg >= 10 ? Math.round(kg) : Math.round(kg * 10) / 10;
  const s = lang === "en" ? String(v) : String(v).replace(".", ",");
  return s + " kg";
}
function co2Html(node) {
  const km = transitKm(node);
  if (km < 0.3) return "";                 // hyvin lyhyt bussiosuus → ei näytetä
  const saved = km * (CO2_CAR_KG_PER_KM - CO2_BUS_KG_PER_KM);
  return `<p class="co2" title="${esc(t("co2Basis"))}">${icon("leaf")} ${t("co2Saved", { kg: fmtKg(saved) })}</p>`;
}

function itinHtml(node, idx) {
  return `<details class="itin" data-itin="${idx}">
    <summary>${itinSummaryHtml(node)}</summary>
    ${timelineHtml(node)}
    ${co2Html(node)}
    <div id="itinMap${idx}" class="map map-small" aria-label="${t("mapAria")}"></div>
  </details>`;
}

// Kompakti kävellen/pyörällä-vaihtoehto reittilistan kärkeen
function directHtml(node, key) {
  const leg = node.legs[0];
  const label = key === "walk" ? t("directWalk") : t("directBike");
  return `<details class="itin direct" data-direct="${key}">
    <summary>
      <span class="itin-head">
        <span>${icon(MODE_ICONS[leg.mode])} <strong>${label}</strong></span>
        <span>${fmtDur(node.legs.reduce((s, l) => s + l.duration, 0))}</span>
        <span class="muted">${fmtKm(node.legs.reduce((s, l) => s + l.distance, 0))}</span>
      </span>
    </summary>
    <div id="directMap${key}" class="map map-small" aria-label="${t("mapAria")}"></div>
  </details>`;
}

async function drawItineraryMap(elId, node) {
  await ensureLeaflet();
  const el = document.getElementById(elId);
  if (!el || el.dataset.drawn) return;
  el.dataset.drawn = "1";
  const map = makeMap(elId);
  let bounds = null;
  for (const leg of node.legs) {
    const pts = decodePolyline(leg.legGeometry?.points || "");
    if (!pts.length) continue;
    const style = leg.mode === "WALK"
      ? { color: "#5a6478", weight: 4, dashArray: "2 8" }
      : leg.mode === "BICYCLE"
        ? { color: "#1a7f4b", weight: 5, dashArray: "8 6", opacity: 0.9 }
        : { color: leg.route?.color ? "#" + leg.route.color : "#0a4ea3", weight: 5, opacity: 0.85 };
    const line = L.polyline(pts, style).addTo(map);
    bounds = bounds ? bounds.extend(line.getBounds()) : line.getBounds();
    if (leg.mode !== "WALK" && leg.mode !== "BICYCLE") {
      L.circleMarker(pts[0], STOP_MARKER).addTo(map).bindPopup(esc(leg.from.name));
    }
  }
  const first = node.legs[0], last = node.legs[node.legs.length - 1];
  L.circleMarker([first.from.lat, first.from.lon], { ...STOP_MARKER, fillColor: "#1a7f4b" })
    .addTo(map).bindPopup(t("origin"));
  L.circleMarker([last.to.lat, last.to.lon], { ...STOP_MARKER, fillColor: "#c0392b" })
    .addTo(map).bindPopup(t("destination"));
  if (bounds) map.fitBounds(bounds, { padding: [15, 15] });
  // reitin linjojen bussit liikkuvat kartalla reaaliajassa
  const transitRoutes = [...new Map(node.legs
    .filter(l => l.route?.gtfsId)
    .map(l => [l.route.gtfsId, { gtfsId: l.route.gtfsId, shortName: l.route.shortName }])).values()];
  if (transitRoutes.length) startVehicles(map, transitRoutes);
}

async function viewPlan(parts) {
  if (!PROXY_URL && !apiKey) { location.hash = "#/asetukset"; return; }
  const fromUrl = parts && parts[1] ? parsePlanParams(parts) : false;
  setView(`
    <nav class="crumb"><a href="#/">← ${t("home")}</a></nav>
    <div class="card">
      <h2>${t("planTitle")}</h2>
      <form id="planForm">
        <div class="field">
          <label for="fromInput">${t("from")}</label>
          <div class="suggest">
            <input type="text" id="fromInput" placeholder="${t("placePlaceholder")}"
                   autocomplete="off" value="${esc(planState.from?.name || "")}">
            <ul class="plain suggest-list" id="fromList" hidden></ul>
          </div>
          <button type="button" id="fromGeo" class="linkish">${icon("pin")} ${t("useMyLocation")}</button>
          <button type="button" id="swapBtn" class="linkish" title="${t("swap")}"
                  aria-label="${t("swap")}">⇅ ${t("swap")}</button>
        </div>
        <div class="field">
          <label for="toInput">${t("to")}</label>
          <div class="suggest">
            <input type="text" id="toInput" placeholder="${t("placePlaceholder")}"
                   autocomplete="off" value="${esc(planState.to?.name || "")}">
            <ul class="plain suggest-list" id="toList" hidden></ul>
          </div>
        </div>
        <div class="row" style="flex-wrap:wrap">
          <select id="timeMode" aria-label="${t("timeModeAria")}">
            <option value="dep"${planState.timeMode === "dep" ? " selected" : ""}>${t("departAt")}</option>
            <option value="arr"${planState.timeMode === "arr" ? " selected" : ""}>${t("arriveBy")}</option>
          </select>
          <input type="datetime-local" id="timeInput" aria-label="${t("timeAria")}"
                 value="${esc(planState.time || nowLocalInput())}">
          <button type="button" id="nowBtn" class="linkish">${t("now")}</button>
          <button type="submit">${t("searchRoutes")}</button>
        </div>
        <div class="row" style="flex-wrap:wrap; margin-top:0.4rem">
          <label><input type="checkbox" id="wheelchairBox"${planState.wheelchair ? " checked" : ""}>
            ${icon("wheelchair")} ${t("wheelchairRoute")}</label>
          <label><input type="checkbox" id="lessWalkBox"${planState.lessWalk ? " checked" : ""}>
            ${t("lessWalk")}</label>
        </div>
        <p class="row" style="margin-top:0.4rem">
          <button type="button" id="saveTripBtn" class="linkish">${icon("star")} <span id="saveTripLabel">${t("saveTrip")}</span></button>
        </p>
      </form>
      <div id="planMsg" role="status"></div>
    </div>
    <div id="planResults"></div>`);

  const fromInput = document.getElementById("fromInput");
  const toInput = document.getElementById("toInput");

  // Tallenna matka (Koti↔Työ): tallentaa nykyisen lähdön+määränpään etusivulle
  const updateSaveBtn = () => {
    const lbl = document.getElementById("saveTripLabel");
    if (lbl) lbl.textContent = isTripSaved(planState.from, planState.to) ? t("saveTripRemove") : t("saveTrip");
  };
  document.getElementById("saveTripBtn").addEventListener("click", () => {
    const msg = document.getElementById("planMsg");
    if (!planState.from || !planState.to) { msg.innerHTML = `<p class="muted">${t("selectFromTo")}</p>`; return; }
    if (isTripSaved(planState.from, planState.to)) {
      removeSavedTrip(tripId(planState.from, planState.to));
      updateSaveBtn();
      return;
    }
    const name = (prompt(t("nameTripPrompt"), `${planState.from.name} → ${planState.to.name}`) || "").trim();
    if (!name) return;
    addSavedTrip(name, planState.from, planState.to);
    updateSaveBtn();
  });
  updateSaveBtn();

  bindPlaceInput(fromInput, document.getElementById("fromList"), p => { planState.from = p; updateSaveBtn(); });
  bindPlaceInput(toInput, document.getElementById("toList"), p => { planState.to = p; updateSaveBtn(); });

  document.getElementById("swapBtn").addEventListener("click", () => {
    [planState.from, planState.to] = [planState.to, planState.from];
    fromInput.value = planState.from?.name || "";
    toInput.value = planState.to?.name || "";
    updateSaveBtn();
    if (planState.from && planState.to) search(false);
  });
  document.getElementById("nowBtn").addEventListener("click", () => {
    document.getElementById("timeInput").value = nowLocalInput();
    document.getElementById("timeMode").value = "dep";
    if (planState.from && planState.to) search(false);
  });

  document.getElementById("fromGeo").addEventListener("click", () => {
    const msg = document.getElementById("planMsg");
    if (!navigator.geolocation) { msg.innerHTML = `<div class="error">${t("geoUnsupported")}</div>`; return; }
    msg.innerHTML = `<p class="muted">${t("gettingLocation")}</p>`;
    navigator.geolocation.getCurrentPosition(pos => {
      planState.from = { name: t("myLocation"), lat: pos.coords.latitude, lon: pos.coords.longitude };
      fromInput.value = t("myLocation");
      updateSaveBtn();
      msg.innerHTML = "";
    }, err => {
      msg.innerHTML = `<div class="error">${t("geoFail")}${esc(err.message)}</div>`;
    }, { timeout: 10000 });
  });

  const results = document.getElementById("planResults");
  let nodes = [], cursor = null, prevCursor = null, directNodes = {};
  let lastHasNext = false, lastHasPrev = false, mainDone = false;

  const renderResults = () => {
    const directRow = ["walk", "bike"]
      .filter(k => directNodes[k])
      .map(k => directHtml(directNodes[k], k))
      .join("");
    results.innerHTML = nodes.length || directRow
      ? `<div class="card">
           <h2>${t("itinerariesTitle")}
             <button id="shareBtn" class="linkish no-print" style="float:right">${icon("link")} ${t("share")}</button></h2>
           ${directRow}
           ${lastHasPrev && nodes.length ? `<button id="earlierBtn" class="linkish no-print">↑ ${t("showEarlier")}</button>` : ""}
           ${nodes.map((n, i) => itinHtml(n, i)).join("")}
           ${lastHasNext ? `<button id="moreBtn" class="no-print">${t("showLater")}</button>` : ""}
         </div>`
      : `<div class="card"><p class="muted">${t("noItineraries")}</p></div>`;
    results.querySelectorAll("details.itin[data-itin]").forEach(d =>
      d.addEventListener("toggle", () => {
        if (d.open) drawItineraryMap("itinMap" + d.dataset.itin, nodes[Number(d.dataset.itin)]).catch(() => {});
      }));
    results.querySelectorAll("details.itin[data-direct]").forEach(d =>
      d.addEventListener("toggle", () => {
        if (d.open) drawItineraryMap("directMap" + d.dataset.direct, directNodes[d.dataset.direct]).catch(() => {});
      }));
    document.getElementById("moreBtn")?.addEventListener("click", () => search("more"));
    document.getElementById("earlierBtn")?.addEventListener("click", () => search("earlier"));
    document.getElementById("shareBtn")?.addEventListener("click", async e => {
      const url = location.origin + location.pathname + planHash();
      try {
        if (navigator.share) { await navigator.share({ url }); return; }
        await navigator.clipboard.writeText(url);
        e.target.textContent = "✓ " + t("linkCopied");
        setTimeout(() => { e.target.innerHTML = icon("link") + " " + t("share"); }, 2500);
      } catch (err) { /* käyttäjä perui jaon */ }
    });
  };

  // Kävely- ja pyörävaihtoehdot haetaan pääkyselyn rinnalla; lista täydentyy
  // vasta kun varsinaiset reittiehdotukset on jo piirretty
  const fetchDirects = async () => {
    const origin = { location: { coordinate: { latitude: planState.from.lat, longitude: planState.from.lon } } };
    const destination = { location: { coordinate: { latitude: planState.to.lat, longitude: planState.to.lon } } };
    const [walk, bike] = await Promise.allSettled([
      gql(DIRECT_QUERY, { origin, destination, direct: ["WALK"] }),
      gql(DIRECT_QUERY, { origin, destination, direct: ["BICYCLE"] }),
    ]);
    directNodes = {};
    if (walk.status === "fulfilled") directNodes.walk = walk.value.planConnection?.edges?.[0]?.node || null;
    if (bike.status === "fulfilled") directNodes.bike = bike.value.planConnection?.edges?.[0]?.node || null;
    // järjettömän pitkä kävely (yli 2 h) ei ole mielekäs vaihtoehto
    if (directNodes.walk && directNodes.walk.legs.reduce((s, l) => s + l.duration, 0) > 7200) {
      directNodes.walk = null;
    }
    if (mainDone && document.getElementById("planResults") === results) renderResults();
  };

  // mode: false/"new" = uusi haku, "more" = myöhemmät, "earlier" = aikaisemmat
  const search = async mode => {
    const msg = document.getElementById("planMsg");
    if (!planState.from || !planState.to) {
      msg.innerHTML = `<div class="error">${t("choosePlaces")}</div>`;
      return;
    }
    const append = mode === "more" || mode === "earlier";
    if (!append) {
      cursor = null; prevCursor = null; nodes = []; directNodes = {}; mainDone = false;
      results.innerHTML = `<p class="muted">${t("searchingRoutes")}</p>`;
      fetchDirects().catch(() => {});
    }
    msg.innerHTML = "";
    planState.timeMode = document.getElementById("timeMode").value;
    planState.time = document.getElementById("timeInput").value;
    planState.wheelchair = document.getElementById("wheelchairBox").checked;
    planState.lessWalk = document.getElementById("lessWalkBox").checked;
    const preferences = { accessibility: { wheelchair: { enabled: planState.wheelchair } } };
    if (planState.lessWalk) preferences.street = { walk: { reluctance: 3.5 } };
    const dateTime = planState.time
      ? (planState.timeMode === "arr"
          ? { latestArrival: isoWithOffset(planState.time) }
          : { earliestDeparture: isoWithOffset(planState.time) })
      : null;
    history.replaceState(null, "", planHash());
    addRecent(planState.from);
    addRecent(planState.to);
    // etusivun "viimeisin haku" -pikalinkki (ilman aikaa → haetaan avattaessa nyt-ajalla)
    try {
      localStorage.setItem(ns("lastPlan"), JSON.stringify({
        from: planState.from.name, to: planState.to.name, hash: planHash(false),
      }));
    } catch (e) {}
    try {
      const vars = {
        origin: { location: { coordinate: { latitude: planState.from.lat, longitude: planState.from.lon } } },
        destination: { location: { coordinate: { latitude: planState.to.lat, longitude: planState.to.lon } } },
        dateTime,
        preferences,
      };
      if (mode === "earlier") {
        vars.last = 5;
        vars.before = prevCursor;
      } else {
        vars.first = 5;
        vars.after = mode === "more" ? cursor : null;
      }
      const data = await gql(PLAN_QUERY, vars);
      const conn = data.planConnection;
      const newNodes = (conn.edges || []).map(e => e.node);
      if (mode === "earlier") {
        nodes = newNodes.concat(nodes);
        prevCursor = conn.pageInfo.startCursor;
        lastHasPrev = conn.pageInfo.hasPreviousPage;
      } else {
        nodes = nodes.concat(newNodes);
        cursor = conn.pageInfo.endCursor;
        lastHasNext = conn.pageInfo.hasNextPage;
        if (!append) {
          prevCursor = conn.pageInfo.startCursor;
          lastHasPrev = conn.pageInfo.hasPreviousPage;
        }
      }
      mainDone = true;
      renderResults();
    } catch (err) {
      results.innerHTML = `<div class="error">${esc(err.message)}</div>`;
    }
  };

  document.getElementById("planForm").addEventListener("submit", e => { e.preventDefault(); search(false); });
  // URL:sta tultaessa (jaettu linkki) tai paluunavigoinnissa haku käynnistyy heti
  if (planState.from && planState.to) search(false);
}

              <span class="rt-badge${special ? " special" : ""}">${esc(r.shortName || "")}</span>
              <span class="rt-name">${esc(r.longName || "")}</span></a></li>`;
        })
        .join("") || `<li style="grid-column:1/-1"><p class="muted">${t("noMatches")}</p></li>`;
    };
    render("");
    document.getElementById("routeFilter").addEventListener("input", e => render(e.target.value));
  }).catch(err => {
    if (mySeq !== viewSeq) return;
    const list = document.getElementById("routeList");
    if (list) { list.style.minHeight = ""; list.innerHTML = `<li><p class="error">${esc(err.message || String(err))}</p></li>`; }
  });
}

// Rakentaa pysäkeittäisen aikataulumatriisin: pysäkit riveinä, vuorot
// sarakkeina. Yksi sarake = yhden vuoron kellonajat reitin jokaisella
// pysäkillä (klassinen painettu bussiaikataulu).
function stopMatrixHtml(stops, trips, opts) {
  const valid = (trips || []).filter(tr => (tr.stoptimes || []).length);
  valid.sort((a, b) => a.stoptimes[0].scheduledDeparture - b.stoptimes[0].scheduledDeparture);
  if (!valid.length || !(stops || []).length) return `<p class="muted">${t("noDepsDay")}</p>`;
  // Vuoron ajat indeksoidaan patternin KÄYNTIIN (sijaintiin stoptimes-listassa), ei stop_id:hen.
  // Silmukka-/palvelureitillä sama pysäkki esiintyy patternissa monta kertaa (käynti 1 = lähtö,
  // viimeinen käynti = paluu/saapuminen); stop_id-avaus törmäyttäisi käynnit (1. ylikirjoittaa tai
  // jää voimaan) → väärä rivi. stops (pattern.stops) ja tr.stoptimes ovat samaa patternia → samassa
  // järjestyksessä, joten rivi i ↔ stoptimes[i].
  const tripTimes = valid.map(tr => (tr.stoptimes || []).map(st => st.scheduledDeparture));
  // Tulosteessa (opts.paginate): jos vuoroja enemmän kuin luettavuuslattialle (8pt)
  // mahtuu, pilko vuorot useammalle VAAKA-arkille fontin kutistamisen sijaan — max 30
  // saraketta/arkki (mitattu A4-vaakaan), pysäkkisarake toistuu ja numerointi jatkuu.
  // Ruutunäkymä (ilman paginate) = yksi vieritettävä taulu kuten ennen.
  const MAX_COLS = 30;
  let usedDot = false;
  const sheets = (opts && opts.paginate && valid.length > MAX_COLS)
    ? Math.ceil(valid.length / MAX_COLS) : 1;
  const perSheet = Math.ceil(valid.length / sheets);
  // Fonttilattia 8pt; harvemmille sarakkeille isompi (215/cols, katto 11pt). --mfs
  // luetaan vain @media print -lohkossa.
  const printPt = Math.max(8, Math.min(11, Math.floor((215 / perSheet) / 0.25) * 0.25));
  // Sarakeotsikko = vuoron lähtöaika = sarakkeen varhaisin ei-tyhjä aika (robusti myös
  // jos vuoro ei lähde reitin alkupysäkiltä). HH:MM ≤ solun aika → leveys ei kasva.
  const colDep = c => {
    const v = tripTimes[c].filter(x => x != null);
    return v.length ? Math.min(...v) : null;
  };
  const sheetHtml = (from, to, contClass) => {
    const n = to - from;
    const headCols = Array.from({ length: n }, (_, i) => {
      const d = colDep(from + i);
      return `<th scope="col">${d == null ? "" : fmtSec(d)}</th>`;
    }).join("");
    const rows = stops.map((s, rowIdx) => {
      const cells = Array.from({ length: n }, (_, i) => {
        const v = tripTimes[from + i][rowIdx];
        return `<td>${v == null ? (usedDot = true, "·") : fmtSec(v)}</td>`;
      }).join("");
      return `<tr><th scope="row">${esc(s.name)}</th>${cells}</tr>`;
    }).join("");
    // Jatkoarkilla kompakti otsikkorivi (linja · suunta · päivätyyppi · lähtöaikaväli),
    // jotta irrallinen jatkosivu on luettavissa ilman 1. arkkia. Konteksti tulee
    // opts:sta (printLine), ei globaalista DOMista. 1. arkki ei saa otsikkoa.
    const contHead = contClass && opts
      ? `<p class="matrix-cont-head">${t("matrixContHead", { line: esc(opts.line || ""),
          dir: esc(opts.dir || ""), day: esc(opts.daytype || ""),
          from: fmtSec(colDep(from) ?? 0), to: fmtSec(colDep(to - 1) ?? 0) })}</p>`
      : "";
    return `<div class="matrix-wrap${contClass}">${contHead}<table class="stoptable" style="--mfs:${printPt}pt">
        <thead><tr><th scope="col">${t("stopColHead")}</th>${headCols}</tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  };
  const legend = () => usedDot ? `<p class="matrix-legend">${t("legendSkipStop")}</p>` : "";
  if (sheets === 1) { const one = sheetHtml(0, valid.length, ""); return one + legend(); }
  let out = "";
  for (let s = 0; s < sheets; s++) {
    const from = s * perSheet, to = Math.min(valid.length, from + perSheet);
    out += sheetHtml(from, to, s === 0 ? "" : " matrix-cont");  // jatkoarkki omalle sivulle
  }
  return out + legend();
}

// Pysäkkijuliste: yhdeltä pysäkiltä lähtevät linjat tuntikaaviona
// (vasen sarake tunti, oikea minuutit) — kuten katoksen seinällä oleva
// painettu aikataulu. lines = stopPosterBlocks-blokin linjat ({route, headsign, times}).
function stopPosterHtml(lines) {
  const sorted = [...(lines || [])].sort((a, b) =>
    (a.route.shortName || "").localeCompare(b.route.shortName || "", "fi", { numeric: true }));
  if (!sorted.length) return `<p class="muted">${t("bookletNoData")}</p>`;
  return `<div class="poster-lines">${sorted.map(L => {
    const times = [...new Set(L.times)].sort((a, b) => a - b);
    const byHour = new Map();
    for (const sec of times) {
      const h = Math.floor(sec / 3600);
      if (!byHour.has(h)) byHour.set(h, []);
      byHour.get(h).push(String(Math.floor((sec % 3600) / 60)).padStart(2, "0"));
    }
    // Minuutit omiin sarakkeisiinsa kymmenluvuittain. Yhteen soluun ladottuna ne eivät
    // osu allekkain: tunnilla jolla on yksi lähtö se alkaa solun alusta, joten :35 päätyi
    // saman tunnin :05:n kohdalle ja luvut kulkivat vinosti alaspäin. Pysäkillä seisova
    // etsii omaa lähtöään silmällään pystysuunnassa, joten sarakkeen on oltava suora.
    // Tyhjät kymmenluvut pudotetaan, joten juliste ei levene turhaan; jos samaan
    // kymmenlukuun osuu tunnilla kaksi lähtöä, ne ovat samassa solussa vierekkäin.
    const tens = m => Math.floor(+m / 10);
    const cols = [...new Set([...byHour.values()].flat().map(tens))].sort((a, b) => a - b);
    const rows = [...byHour.entries()].map(([h, mins]) =>
      `<tr><th scope="row">${String(h % 24).padStart(2, "0")}</th>`
      + cols.map(c => `<td>${mins.filter(m => tens(m) === c).join(" ")}</td>`).join("")
      + `</tr>`).join("");
    return `<div class="poster-line">
        <h4>${badgeHtml(L.route)} <span>${esc(L.headsign)}</span></h4>
        <table class="hourgrid"><tbody>${rows}</tbody></table>
      </div>`;
  }).join("")}</div>`;
}

// Pysäkkien patternit YHDELLÄ kyselyllä (stops(ids:)). Erätulostus haki nämä aiemmin
// pysäkki kerrallaan, jolloin yhden linjan julisteajo teki 304 proxy-kutsua ja kaatui
// 13.8.2026 workerin purskerajaan (RATE_MAX 300). Niputus pudottaa pysäkkiosuuden
// n:stä muutamaan kyselyyn; loput kutsuista ovat pattern-hakuja, jotka ptdMemo jakaa.
// Paloittelu: yksi jättikysely 80 pysäkille palauttaisi ison vastauksen ja kaatuisi
// kokonaan yhteen virheeseen, joten erä on 40.
const POSTER_STOP_CHUNK = 40;
async function loadPosterPatterns(stopIds) {
  const byStop = new Map();
  for (let i = 0; i < stopIds.length; i += POSTER_STOP_CHUNK) {
    const ids = stopIds.slice(i, i + POSTER_STOP_CHUNK);
    // gql eikä cachedGql: 40 pysäkin patternipaketti on iso, ja sen tallennus
    // localStorageen täyttäisi välimuistin ja pakottaisi cachePutin tyhjennyskierrokseen.
    // Erätulostus on joka tapauksessa verkkotoimenpide (tuloste ei saa syntyä vanhalla datalla).
    const data = await gql(
      `query ($ids: [String]) {
         stops(ids: $ids) {
           gtfsId
           patterns { code headsign route { shortName longName@L color textColor } }
         }
       }`, { ids });
    for (const s of (data.stops || [])) if (s) byStop.set(s.gtfsId, s.patterns || []);
  }
  return byStop;
}

// Pysäkkijulisteen päiväblokit TODELLISTEN ajopäivien mukaan (activeDates) —
// sama moottori kuin linjatulosteessa/lehtitelineessä/vihossa (groupTripsByDays).
// Korjaa julisteen päivätyyppibugin: aiempi 1 edustava päivä / karkea tyyppi
// (A) leimasi osan viikosta ajavat vuorot "Ma–Pe":ksi, (B) pudotti vain-pe-yönä
// ajettavat vuorot ja (C) tuotti eri julisteen eri tulostuspäivinä.
// ptdMemo (Map) jakaa pattern-haut eräajon pysäkkien kesken. conc = pattern-hakujen
// rinnakkaisuus: yksittäisjuliste 4 (talon normi, vrt. vihko), eräajo 2 per pysäkki
// (ulompi mapLimit 2 pysäkkiä → yhteensä ~4 samanaikaista, upstream ~10 req/s).
// presetPats = valmiiksi haetut patternit (eräajo hakee ne yhdellä stops(ids:)-kyselyllä
// kaikille pysäkeille kerralla, ks. loadPosterPatterns) → per-pysäkki-kysely jää pois.
async function stopPosterBlocks(stopId, refISO, ptdMemo, conc, presetPats) {
  let pats = presetPats;
  if (!pats) {
    const { data } = await cachedGql(`posterpat:${stopId}`,
      `query ($id: String!) {
         stop(id: $id) {
           patterns { code headsign route { shortName longName@L color textColor } }
         }
       }`, { id: stopId });
    pats = data.stop?.patterns || [];
  }
  const memo = ptdMemo || new Map();
  // Retry+backoff proxyn 429-kuristusta vasten. Lopullinen epäonnistuminen HEITTÄÄ:
  // juliste ei saa koskaan tulostua hiljaa vajaana/tyhjänä virhetilassa (näyttäisi
  // "ei lähtöjä" vaikka data jäi saamatta).
  const fetchPat = async (code) => {
    for (let a = 0; ; a++) {
      try { return await patternTripsWithDays(code); }
      catch (e) {
        if (a >= 2) { memo.delete(code); throw e; }
        await new Promise(r => setTimeout(r, 700 * (a + 1) + Math.random() * 400));
      }
    }
  };
  const perPat = await mapLimit(pats, conc || 4, async p => {
    if (!memo.has(p.code)) memo.set(p.code, fetchPat(p.code));
    return { p, trips: await memo.get(p.code) };
  });
  // Pseudovuoro per käynti TÄLLÄ pysäkillä: silmukkareitillä sama pysäkki 2× =
  // 2 lähtöä (käyntikohtainen poiminta, ks. 91c9e7d). Lähtö EI ole: pickupType
  // NONE (pelkkä jättö) eikä vuoron viimeinen käynti (bussi päättää matkan —
  // feedit eivät aina merkitse päätepysäkin pickupTypea, esim. Salon silmukat).
  const byLine = new Map();
  for (const { p, trips } of perPat) {
    const r = p.route || {};
    for (const tr of trips || []) {
      const sts = tr.stoptimes || [];
      for (let i = 0; i < sts.length; i++) {
        const st = sts[i];
        if (st.stop?.gtfsId !== stopId || st.pickupType === "NONE" || i === sts.length - 1) continue;
        // sama etusija kuin vanhassa julisteessa: pysäkkikohtainen kilpi ensin
        // (sisältää via-tiedon, esim. "Soltti via Yliopisto - Mukkula")
        const headsign = st.headsign || tr.tripHeadsign || p.headsign || r.longName || "";
        const key = (r.shortName || "") + "␀" + headsign;
        if (!byLine.has(key)) byLine.set(key, { route: r, headsign, trips: [] });
        byLine.get(key).trips.push({
          serviceId: tr.serviceId, activeDates: tr.activeDates,
          stoptimes: [{ scheduledDeparture: st.scheduledDeparture }],
        });
      }
    }
  }
  // groupTripsByDays ajetaan PER LINJA (sen aikasignatuuri-dedup ei saa niputtaa
  // eri linjojen samanaikaisia lähtöjä yhteen); blokit kootaan päiväpatterni-
  // avaimella → sama todellinen ajopäiväjoukko = sama julisteosio.
  const blocks = new Map();
  for (const L of byLine.values()) {
    for (const g of groupTripsByDays(L.trips, refISO)) {
      const bk = [...g.dows].sort((a, b) => a - b).join(",") + "|" + g.school;
      if (!blocks.has(bk)) blocks.set(bk, { dows: g.dows, school: g.school, label: g.label, lines: new Map() });
      const b = blocks.get(bk);
      const lk = (L.route.shortName || "") + "␀" + L.headsign;
      if (!b.lines.has(lk)) b.lines.set(lk, { route: L.route, headsign: L.headsign, times: [] });
      b.lines.get(lk).times.push(...g.trips.map(tr => tr.stoptimes[0].scheduledDeparture));
    }
  }
  const arr = [...blocks.values()].map(b => ({ ...b, lines: [...b.lines.values()] }));
  // sama järjestys kuin groupTripsByDays: span alku nousevasti, laajempi ensin
  arr.sort((a, b) => {
    const am = Math.min(...a.dows), bm = Math.min(...b.dows);
    return am !== bm ? am - bm : b.dows.size - a.dows.size;
  });
  return arr;
}

// Map-first linjanäkymä (#/linjakartta/<id>): koko reitti kartalla + live-bussit
// rikkaalla popupilla (määränpää, myöhästymä, seuraavat pysäkit). Avataan esim.
// pysäkki-/lähellä-näkymän linjabadgea klikkaamalla.
async function viewRouteMap(routeId) {
  if (!PROXY_URL && !apiKey) { location.hash = "#/asetukset"; return; }
  setView(`<p class="muted">${t("loadingRoute")}</p>`);
  const ids = await lineIds(routeId);
  const { data } = await cachedGql("routemap:" + ids.join(","),
    `query ($ids: [String]) {
       routes(ids: $ids) {
         gtfsId shortName longName@L color textColor
         patterns { directionId patternGeometry { length points } stops { gtfsId name@L lat lon } }
       }
     }`, { ids });
  const routesArr = (data.routes || []).filter(Boolean);
  const route = routesArr.find(r => r.gtfsId === routeId) || routesArr[0];
  if (!route) throw new Error(t("errRouteNotFound") + routeId);
  const patterns = routesArr.flatMap(r => r.patterns || []);  // kaikki suunnat unioniin
  setView(`
    <nav class="crumb"><button class="linkish" id="backBtn">← ${t("back")}</button> · <a href="#/">${t("home")}</a></nav>
    <div class="card">
      <h2>${badgeHtml(route)} <span>${esc(route.longName || "")}</span></h2>
      <p class="muted">${t("lineMapHint")}</p>
      <p><a class="btnlink secondary" href="#/linja/${encodeURIComponent(routeId)}">${icon("list")} ${t("lineFullTimetable")}</a></p>
      <div id="lineMap" class="map bigmap" aria-label="${esc(t("mapAria"))}"></div>
    </div>`);
  document.getElementById("backBtn").addEventListener("click", () => history.back());
  const mySeq = viewSeq;
  try {
    await ensureLeaflet();
    if (mySeq !== viewSeq || !document.getElementById("lineMap")) return;
    const map = makeMap("lineMap", [AREA.focus.lat, AREA.focus.lon], 12);
    const color = route.color ? "#" + route.color : "#0a4ea3";
    let bounds = null;
    // kummankin suunnan pisin reittikuvio
    const byDir = new Map();
    for (const p of patterns) {
      if (!p.patternGeometry || !p.patternGeometry.points) continue;
      const prev = byDir.get(p.directionId);
      if (!prev || (p.patternGeometry.length || 0) > (prev.patternGeometry.length || 0)) byDir.set(p.directionId, p);
    }
    for (const p of byDir.values()) {
      const pts = decodePolyline(p.patternGeometry.points);
      if (!pts.length) continue;
      const line = L.polyline(pts, { color, weight: 5, opacity: 0.7 }).addTo(map);
      bounds = bounds ? bounds.extend(line.getBounds()) : line.getBounds();
    }
    // pysäkit (yhdistetty kaikista patterneista)
    const seen = new Set();
    for (const p of patterns) for (const s of (p.stops || [])) {
      if (s.lat == null || seen.has(s.gtfsId)) continue;
      seen.add(s.gtfsId);
      L.circleMarker([s.lat, s.lon], { radius: 4, color, weight: 2, fillColor: "#fff", fillOpacity: 1 })
        .addTo(map).bindPopup(`<a href="#/pysakki/${encodeURIComponent(s.gtfsId)}">${esc(s.name)}</a>`);
    }
    fitMap(map, bounds);
    startVehicles(map, [{ gtfsId: routeId, shortName: route.shortName }]);
  } catch (err) {
    const el = document.getElementById("lineMap");
    if (el) el.outerHTML = `<div class="error">${t("mapFail")}${esc(err.message)}</div>`;
  }
}

async function viewRoute(routeId, patternCode, date) {
  if (!PROXY_URL && !apiKey) { location.hash = "#/asetukset"; return; }
  setView(`<p class="muted">${t("loadingRoute")}</p>`);
  date = date || todayISO();

  // Häiriöt haetaan rinnakkain reittikyselyn kanssa, jotta ne voidaan
  // renderöidä jo ensipaintissa (ei async-hyppyä, CLS)
  const alertsPromise = loadAllAlerts().catch(() => []); // GTFS-RT + CMS + ylläpito
  // Vuoromäärät edustaville tuleville päiville (Ti/To/La/Su) patternien
  // järjestämiseen — linjalla voi olla "isoja" vanhoja/kausivariantteja joilla
  // ei ole vuoroja NYT; ne eivät saa voittaa pää- eikä suuntavalintaa.
  const probe = activeProbeDates();
  const probeAliases = probe.map((d, i) => `p${i}: tripsForDate(serviceDate: "${d}") { gtfsId }`).join(" ");
  const ids = await lineIds(routeId);
  const { data, cachedAt: routeCachedAt } = await cachedGql("route:" + ids.join(","),
    `query ($ids: [String]) {
       routes(ids: $ids) {
         gtfsId shortName longName@L color textColor
         patterns {
           code name directionId
           ${probeAliases}
           stops { gtfsId name@L lat lon }
         }
       }
     }`, { ids });
  // Linjan kaikkien suunta-/varianttiobjektien patternit yhteen (Vaasa: erilliset objektit
  // per suunta; Lahti: 1 objekti). route = primary (URL:n routeId) badgea/väriä varten.
  const routesArr = (data.routes || []).filter(Boolean);
  const route = routesArr.find(r => r.gtfsId === routeId) || routesArr[0];
  if (!route) throw new Error(t("errRouteNotFound") + routeId);

  const patterns = routesArr.flatMap(r => r.patterns || []);
  const upcoming = p => probe.reduce((n, _, i) => n + ((p["p" + i] || []).length), 0);
  // Oletuksena pääsuunta TULEVIEN vuorojen mukaan — EI patterns[0] eikä kaikkien
  // aikojen suurin (vanha variantti voi olla "isoin" mutta ei aja nyt → "ei lähtöjä").
  // Käyttäjän valitsema patternCode voittaa.
  const current = patterns.find(p => p.code === patternCode)
    || patterns.slice().sort((a, b) => upcoming(b) - upcoming(a))[0]
    || patterns[0];

  // Selkokielinen suunta: "lähtöpysäkki → päätepysäkki" pattern-koodien sijaan
  const patternLabel = p => {
    const stops = p.stops || [];
    return stops.length
      ? `${stops[0].name} → ${stops[stops.length - 1].name}`
      : (p.name || "");
  };
  // Suunnittain yleisin variantti (eniten vuoroja) välilehdeksi, harvinaiset
  // variaatiot pudotusvalikon taakse
  const byDir = new Map();
  for (const p of patterns) {
    const k = p.directionId ?? 0;
    if (!byDir.has(k)) byDir.set(k, []);
    byDir.get(k).push(p);
  }
  const primaries = [];
  for (const list of byDir.values()) {
    list.sort((a, b) => upcoming(b) - upcoming(a)); // suuntavälilehdeksi nyt liikennöivä pääpattern
    primaries.push(list[0]);
  }
  // Varianttivalikko skoopataan NYKYISEEN suuntaan: näkyy vain jos tällä suunnalla on
  // aidosti useampi reittikuvio (useimmilla 1 → valikko piilossa, näkymä pysyy puhtaana).
  const curDirId = current.directionId ?? 0;
  const curDirPatterns = (byDir.get(curDirId) || [current]).slice()
    .sort((a, b) => upcoming(b) - upcoming(a));

  let routeAlertsHtml = "";
  try {
    const stopIds = new Set(patterns.flatMap(p => p.stops.map(s => s.gtfsId)));
    const matched = dedupAlerts((await alertsPromise)
      .filter(a => alertMatchesRoute(a, routeId, route.shortName, stopIds)));
    if (matched.length) routeAlertsHtml = matched.map(a => alertHtml(a, true)).join("");
  } catch (err) { /* tiedotteiden puuttuminen ei kaada linjasivua */ }

  setView(`
    <nav class="crumb"><a href="#/">← ${t("allRoutes")}</a></nav>
    <div class="card no-print">
      <h2>${favButtonHtml(routeId)}${badgeHtml(route)} ${esc(route.longName)}</h2>
      <div id="routeAlerts">${routeAlertsHtml}</div>
      <div class="dir-row" role="group" aria-label="${t("directionAria")}">
        <span class="dir-label">${t("directionLabel")}</span>
        <strong class="dir-current">${esc(patternLabel(current))}</strong>
        ${primaries.length > 1 ? `<button type="button" id="dirSwap" class="secondary" aria-label="${t("directionSwap")}" title="${t("directionSwap")}">${icon("swap")} ${t("directionSwap")}</button>` : ""}
      </div>
      ${curDirPatterns.length > 1 ? `
        <div class="row no-print" style="margin:0.3rem 0">
          <label class="muted" for="variantSel">${t("routePatternLabel")}</label>
          <select id="variantSel">
            ${curDirPatterns.map(p => `
              <option value="${esc(p.code)}"${p === current ? " selected" : ""}>
                ${esc(patternLabel(p))} (${t("nStops", { n: (p.stops || []).length })})
              </option>`).join("")}
          </select>
        </div>` : ""}
      <div class="tabs no-print" role="group" aria-label="${t("dayTypesLabel")}">
        ${lineDayTabs(date).map(d => `
          <button class="daytab" data-date="${d.date}" aria-pressed="${d.active}">${esc(d.label)}</button>`).join("")}
      </div>
      <div id="timetable" class="no-print" style="min-height:15rem"><p class="muted">${t("loadingDeps")}</p></div>
    </div>
    <div class="card no-print">
      <h2>${t("mapStopsTitle")} <a class="linkish" style="font-size:0.8rem;font-weight:400" href="#/linjakartta/${encodeURIComponent(routeId)}">${icon("map")} ${t("openFullMap")}</a></h2>
      <div id="routeMap" class="map" aria-label="${t("mapAria")}"></div>
      <p class="muted">${t("busesHint")}</p>
      <p id="timelineSel" class="timeline-sel" role="status"></p>
      <ol class="stop-timeline" id="stopTimeline">
        ${(current?.stops || []).map(s => `
          <li class="stl-item">
            <span class="stl-dot" aria-hidden="true"></span>
            <a class="stl-name item" href="#/pysakki/${encodeURIComponent(s.gtfsId)}">${esc(s.name)}</a>
            <span class="stl-time" data-stop="${esc(s.gtfsId)}"></span>
          </li>`).join("")}
      </ol>
    </div>
    <div class="card lineprint-wrap ft-collapse">
      <button type="button" class="ft-toggle no-print" aria-expanded="false" aria-controls="ftBody">${t("fullTimetableShow")}</button>
      <div class="ft-body" id="ftBody">
        <h2 class="no-print">${t("fullTimetableTitle")}</h2>
        <p class="muted no-print">${t("fullTimetableHint")}</p>
        <div class="row no-print" style="flex-wrap:wrap;gap:0.4rem">
          <button id="printRackBtn">${icon("print")} ${t("rackPrintBtn")}</button>
          <button id="printKeyBtn">${icon("print")} ${t("printKeyStopsPort")}</button>
          <button id="printAllBtn">${icon("print")} ${t("printAllStopsLand")}</button>
          <button id="lineQrBtn" class="secondary">${icon("qr")} ${t("qrButton")}</button>
          <span id="linePrintStatus" class="muted" role="status"></span>
        </div>
        <div id="lineQr" class="qrbox no-print" hidden></div>
        <div id="stopMatrix" class="no-print"><p class="muted">${t("loadingMatrix")}</p></div>
        <div id="linePrintOut" class="print-only"></div>
      </div>
    </div>`);

  bindFavButton({ type: "route", id: routeId, name: route.longName, shortName: route.shortName,
                  color: route.color, textColor: route.textColor });
  document.getElementById("dirSwap")?.addEventListener("click", () => {
    const idx = primaries.findIndex(p => p === current);
    const next = primaries[(idx + 1) % primaries.length];
    location.hash = `#/linja/${encodeURIComponent(routeId)}/${encodeURIComponent(next.code)}/${date}`;
  });
  document.getElementById("variantSel")?.addEventListener("change", e => {
    if (e.target.value) {
      location.hash = `#/linja/${encodeURIComponent(routeId)}/${encodeURIComponent(e.target.value)}/${date}`;
    }
  });
  document.querySelectorAll(".daytab").forEach(btn =>
    btn.addEventListener("click", () => {
      location.hash = `#/linja/${encodeURIComponent(routeId)}/${encodeURIComponent(current.code)}/${btn.dataset.date}`;
    }));

  // Map is drawn concurrently with the timetable fetch below
  (async () => {
    const mapEl = document.getElementById("routeMap");
    if (!mapEl || !current) return;
    const mySeq = viewSeq;
    try {
      const [geo] = await Promise.all([
        gql(`query ($code: String!) { pattern(id: $code) { patternGeometry { points } } }`,
          { code: current.code }),
        ensureLeaflet(),
      ]);
      if (mySeq !== viewSeq || !document.getElementById("routeMap")) return;
      const map = makeMap("routeMap");
      const pts = decodePolyline(geo.pattern?.patternGeometry?.points || "");
      let bounds = null;
      if (pts.length) {
        const line = L.polyline(pts, { color: "#0a4ea3", weight: 4, opacity: 0.85 }).addTo(map);
        bounds = line.getBounds();
      }
      const located = current.stops.filter(s => s.lat != null);
      for (const s of located) {
        L.circleMarker([s.lat, s.lon], STOP_MARKER).addTo(map)
          .bindPopup(`<a href="#/pysakki/${encodeURIComponent(s.gtfsId)}">${esc(s.name)}</a>`);
      }
      if (!bounds && located.length) bounds = L.latLngBounds(located.map(s => [s.lat, s.lon]));
      fitMap(map, bounds);
      startVehicles(map, [{ gtfsId: routeId, shortName: route.shortName }]);
    } catch (err) {
      mapEl.outerHTML = `<div class="error">${t("mapFail")}${esc(err.message)}</div>`;
    }
  })();

  // Departure times from the pattern's first stop = classic line timetable
  const box = document.getElementById("timetable");
  if (!current || !current.stops.length) {
    box.innerHTML = `<p class="muted">${t("noStopsDirection")}</p>`;
    return;
  }
  const isTodayPrimary = date === todayISO();
  let nextDep = null; // seuraavan lähdön epoch (ms) lähtömuistutusta varten
  let selectedDepSec = null; // valittu lähtö (head-pysäkin scheduledDeparture); säilyy 30 s -päivityksen yli
  // Aikataulu näyttää suunnan KAIKKI lähdöt valitulle päivälle — ei suodateta
  // yhteen patterniin. Tämä on välttämätöntä, koska aikataulukauden vaihtuessa
  // (esim. kesä→syksy) suunnan vuorot voivat olla eri pattern-koodissa eri
  // päivinä; yhteen patterniin lukittu näkymä näyttäisi virheellisesti "ei lähtöjä".
  const curDir = current.directionId ?? 0;
  const dirPatterns = patterns.filter(p => (p.directionId ?? 0) === curDir);
  // HUOM: lähtöjen referenssipysäkki EI ole suunnan pisin pattern (sen lähtöpysäkki voi
  // käännetyissä varianteissa olla reitin VIIMEINEN pysäkki → saapumisajat). Referenssi on
  // päivän hallitseva pattern (bestPatternForDate, sama kuin koko aikataulu -taulu) ja sen
  // stops[0]. Ratkaistaan per päivä fetchDepsissä, ei kiinteää headStopia.

  // Valitsee suunnan patternin (+ sen vuorot) jolla on lähtöjä annettuna päivänä.
  // Kausivaihdon takia oikea pattern-koodi vaihtelee päivittäin → tarvitaan
  // matriisissa ja tulostuksessa (yksittäinen pattern, ei aggregointi kuten listassa).
  const bestPatternForDate = async (iso) => {
    const aliases = dirPatterns.map((p, i) =>
      `c${i}: pattern(id: "${p.code}") { tripsForDate(serviceDate: $date) { stoptimes { timepoint scheduledDeparture stop { gtfsId name@L } } } }`).join("\n");
    const { data } = await cachedGql(`matrix:${routeId}:dir${curDir}:${iso}`,
      `query ($date: String!) { ${aliases} }`, { date: iso.replace(/-/g, "") });
    let pat = current, trips = [], allTrips = [];
    dirPatterns.forEach((p, i) => {
      const tr = (data["c" + i] && data["c" + i].tripsForDate) || [];
      allTrips.push(...tr);
      if (tr.length > trips.length) { pat = p; trips = tr; }
    });
    return { pat, trips, allTrips };
  };

  const TT_QUERY = `query ($stopId: String!, $date: String!) {
    stop(id: $stopId) {
      stoptimesForServiceDate(date: $date, omitNonPickups: true) {
        pattern { code }
        stoptimes { scheduledDeparture realtimeDeparture realtime serviceDay trip { gtfsId } }
      }
    }
  }`;
  // Päivän lähdöt = SAMA totuus kuin koko aikataulu -taulu: hallitsevan patternin
  // (bestPatternForDate) vuorot sen LÄHTÖpysäkiltä. Suodatetaan ko. pattern-koodiin →
  // chipit == taulun sarakkeet (sama määrä/ajat/järjestys) ja duplikaatit poistuvat.
  // stoptimesForServiceDate tuo reaaliajan (●, seuraavat lähdöt -laskuri).
  const fetchDeps = async (iso) => {
    const { pat, trips } = await bestPatternForDate(iso);
    const refStop = (pat.stops || [])[0];
    if (!trips.length || !refStop) return { sts: [], pat, refStop, stale: routeCachedAt };
    const { data: tt, cachedAt } = await cachedGql(`tt:${routeId}:${pat.code}:${iso}`, TT_QUERY,
      { stopId: refStop.gtfsId, date: iso.replace(/-/g, "") });
    // Yksi (varhaisin) lähtö per vuoro: jos lähtöpysäkki on reitillä kahdesti (silmukka/
    // palveluliikenne, esim. Salo 31, Kajaani Pali), stoptimesForServiceDate palauttaa
    // saman vuoron kahdesti → pidetään ensimmäinen käynti = taulun sarake (joka ottaa
    // myös 1. käynnin). Vuorottelematon tapaus säilyy ennallaan.
    const byTrip = new Map();
    for (const g of (tt.stop?.stoptimesForServiceDate || [])) {
      if (g.pattern.code !== pat.code) continue;
      for (const s of (g.stoptimes || [])) {
        const key = s.trip?.gtfsId || ("anon:" + s.scheduledDeparture);
        const prev = byTrip.get(key);
        if (!prev || s.scheduledDeparture < prev.scheduledDeparture) byTrip.set(key, s);
      }
    }
    const sts = [...byTrip.values()].sort((a, b) => a.scheduledDeparture - b.scheduledDeparture);
    return { sts, pat, refStop, stale: cachedAt || routeCachedAt };
  };
  // Etsii seuraavan liikennöintipäivän (enintään 14 vrk eteenpäin) jolla on lähtöjä.
  const findNextServiceDate = async (fromISO) => {
    const [y, mo, d] = fromISO.split("-").map(Number);
    for (let i = 1; i <= 14; i++) {
      const iso = isoOf(new Date(y, mo - 1, d + i));
      if ((await fetchDeps(iso)).sts.length) return iso;
    }
    return null;
  };
  // Indeksoi hallitsevan patternin vuorot referenssipysäkin lähtöajalla → per-pysäkki-ajat.
  // Avain = refStopin scheduledDeparture (sama kuin chipin data-dep) → Map(stop.gtfsId → [ajat]).
  // Silmukka-/palvelureitillä sama pysäkki esiintyy patternissa monta kertaa (käynti 1 = lähtö,
  // viimeinen käynti = paluu/saapuminen). Talletetaan KAIKKI käynnit listana käyntijärjestyksessä,
  // ettei viimeinen käynti ylikirjoita ensimmäistä; paint poimii oikean käynnin järjestyksessä.
  const buildTripIndex = (trips, refStop) => {
    const idx = new Map();
    for (const tr of (trips || [])) {
      const stts = tr.stoptimes || [];
      const head = (refStop && stts.find(s => s.stop?.gtfsId === refStop.gtfsId)) || stts[0];
      if (!head) continue;
      if (!idx.has(head.scheduledDeparture)) {
        const byStop = new Map();
        for (const s of stts) if (s.stop?.gtfsId) {
          const arr = byStop.get(s.stop.gtfsId) || [];
          arr.push(s.scheduledDeparture);
          byStop.set(s.stop.gtfsId, arr);
        }
        idx.set(head.scheduledDeparture, byStop);
      }
    }
    return idx;
  };

  const loadTimetable = async (useDate, redirectNote) => {
    useDate = useDate || date;
    const { sts, stale, refStop } = await fetchDeps(useDate);
    const el = document.getElementById("timetable");
    if (!el) return;
    if (!sts.length) {
      // Ei liikennöintiä → ohjaa seuraavaan liikennöintipäivään, näytä sen lähdöt (ei tyhjää)
      const next = await findNextServiceDate(useDate);
      if (next) return loadTimetable(next, t("noServiceRedirect", { day: fmtDateLong(useDate), next: fmtDateLong(next) }));
      el.innerHTML = `<p class="muted">${t("noServiceSoon")}</p>`;
      return;
    }
    const isToday = useDate === todayISO();
    const now = Date.now();
    const depEpoch = st =>
      (st.serviceDay + (st.realtime ? st.realtimeDeparture : st.scheduledDeparture)) * 1000;
    let nextHtml = "";
    let remindHtml = "";
    if (isToday) {
      const upcoming = sts.filter(st => depEpoch(st) >= now - 30000).slice(0, 3);
      if (upcoming.length) {
        nextDep = depEpoch(upcoming[0]);
        nextHtml = `<p>${t("nextDeps")} ${upcoming.map(st => {
          const d = depInfo(st);
          return `<strong class="${d.rt ? "rt" : ""}">${d.when}${d.rt ? " ●" : ""}</strong>`;
        }).join(" · ")}</p>`;
        if (pushSupported()) {
          remindHtml = `<div class="remind no-print" id="remindBox">
            <label>${icon("bell")} ${t("remindBefore")}
              <select id="remindLead" aria-label="${t("remindBefore")}">
                <option value="5">5</option><option value="10" selected>10</option><option value="15">15</option>
              </select> ${t("remindUnit")}</label>
            <button type="button" id="remindBtn" class="secondary">${t("remindSet")}</button>
            <span id="remindMsg" class="muted" role="status"></span>
          </div>`;
        }
      }
    }
    const grid = sts.map(st => {
      const dep = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
      const past = isToday && depEpoch(st) < now;
      const cls = "timegrid-dep" + (past ? " past" : "") + (st.realtime && !past ? " rt" : "");
      return `<button type="button" class="${cls}" data-dep="${st.scheduledDeparture}" aria-pressed="false"` +
        ` aria-label="${t("depSelectAria", { time: fmtSec(dep) })}"${st.realtime && !past ? ` title="${t("rtTitleAttr")}"` : ""}>` +
        `${fmtSec(dep)}${st.realtime && !past ? " ●" : ""}</button>`;
    }).join("");
    el.innerHTML = `
      ${redirectNote ? `<p class="redirect-note">${icon("warning")} ${esc(redirectNote)}</p>` : ""}
      ${stale ? staleNoteHtml(stale) : ""}
      <p class="muted">${t("depsFromStop", { stop: esc((refStop || current.stops[0]).name) })}</p>
      ${nextHtml}
      ${remindHtml}
      <div class="timegrid" id="timegrid">${grid}</div>
      ${isToday ? `<p class="muted"><span class="rt">●</span> ${t("rtLegend")}</p>` : ""}`;
    const rb = document.getElementById("remindBtn");
    if (rb) rb.addEventListener("click", () =>
      setDepartureReminder(nextDep, route.shortName || "", patternLabel(current)));
    // Klikattavat lähdöt: kytke napit pysäkkiaikajanaan + valitse oletus (muisti / seuraava tuleva)
    (async () => {
      const seq = viewSeq;
      let index;
      try { const { pat, trips } = await bestPatternForDate(useDate); index = buildTripIndex(trips, (pat.stops || [])[0]); }
      catch (e) { return; }
      const tg = document.getElementById("timegrid");
      const selEl = document.getElementById("timelineSel");
      if (!tg || seq !== viewSeq) return;
      const paint = depSec => {
        const byStop = index.get(depSec);
        // Sama pysäkki voi olla aikajanalla monta kertaa (silmukka): n. käynnin span saa
        // n. käynnin ajan listasta → 1. rivi (lähtö) lähtöaika, viimeinen rivi (paluu) saapumisaika.
        const seen = new Map();
        document.querySelectorAll("#stopTimeline .stl-time[data-stop]").forEach(span => {
          const id = span.getAttribute("data-stop");
          const arr = byStop && byStop.get(id);
          const k = seen.get(id) || 0;
          seen.set(id, k + 1);
          const s = arr ? arr[k] : undefined;
          span.textContent = s != null ? fmtSec(s) : "";
        });
        if (selEl) selEl.textContent = t("timelineSelected", { time: fmtSec(depSec) });
        tg.querySelectorAll("button[data-dep]").forEach(b => {
          const on = Number(b.dataset.dep) === depSec;
          b.classList.toggle("selected", on);
          b.setAttribute("aria-pressed", on ? "true" : "false");
        });
        selectedDepSec = depSec;
      };
      tg.querySelectorAll("button[data-dep]").forEach(b =>
        b.addEventListener("click", () => paint(Number(b.dataset.dep))));
      // oletus: aiempi valinta jos yhä listalla, muuten seuraava tuleva (tänään) / ensimmäinen
      const inIdx = d => index.has(d);
      let def = (selectedDepSec != null && inIdx(selectedDepSec) && sts.some(st => st.scheduledDeparture === selectedDepSec))
        ? selectedDepSec : null;
      if (def == null && isToday) def = sts.find(st => depEpoch(st) >= now - 30000 && inIdx(st.scheduledDeparture))?.scheduledDeparture;
      if (def == null) def = sts.map(st => st.scheduledDeparture).find(inIdx);
      if (def != null) paint(def);
    })();
  };
  try {
    await loadTimetable();
  } catch (err) {
    box.innerHTML = `<div class="error">${esc(err.message)}</div>`;
  }
  if (isTodayPrimary) {
    refreshNow = () => loadTimetable().catch(() => {});
    refreshTimer = setInterval(refreshNow, 30000);
  }

  // Tulostuspainike voi "omistaa" #linePrintOutin: estää matriisihaun
  // myöhästyvää oletustäyttöä ylikirjoittamasta käyttäjän valitsemaa tulostetta
  let printOwned = false;

  // Koko aikataulu pysäkeittäin (matriisi) – ladataan omana kyselynään,
  // jotta se on valmiina myös tulostukseen
  (async () => {
    const mEl = document.getElementById("stopMatrix");
    if (!mEl) return;
    const mySeq = viewSeq;
    try {
      let { pat: mPat, trips } = await bestPatternForDate(date);
      let matrixDate = date;
      // Johdonmukaisuus aikataulun kanssa: jos valitulla päivällä ei liikennöintiä,
      // näytä matriisikin seuraavalta liikennöintipäivältä (ei tyhjää matriisia).
      if (!trips.length) {
        const next = await findNextServiceDate(date);
        if (next) { matrixDate = next; ({ pat: mPat, trips } = await bestPatternForDate(next)); }
      }
      if (mySeq !== viewSeq) return;
      const el = document.getElementById("stopMatrix");
      // Ruudulla koko pysäkkimatriisi (vieritettävä, valittu päivä)
      if (el) el.innerHTML = stopMatrixHtml(mPat.stops, trips);
      // Oletustuloste (raaka Ctrl+P): isot pysäkit valitulta päivältä.
      // Ei ylikirjoiteta, jos käyttäjä on jo valinnut tulosteen napista.
      const po = document.getElementById("linePrintOut");
      if (po && !printOwned) po.innerHTML =
        `<div class="card"><h2>${esc(route.shortName || "")} ${esc(patternLabel(mPat))}</h2>
           <p>${esc(matrixDate)}</p>${bookletTableHtml(trips)}</div>`;
    } catch (err) {
      if (mySeq !== viewSeq) return;
      const el = document.getElementById("stopMatrix");
      if (el) el.innerHTML = `<div class="error">${esc(err.message)}</div>`;
    }
  })();

  // Tulostus viikonpäivätyypeittäin (ma–pe/la/su). mode "key" = isot pysäkit
  // pystyarkille, "all" = kaikki pysäkit vaaka-arkille (mahtuu leveytensä takia).
  const printLine = async (mode) => {
    const st = document.getElementById("linePrintStatus");
    const po = document.getElementById("linePrintOut");
    if (!po) return;
    printOwned = true; // estä matriisihaun oletustäytön ylikirjoitus
    if (st) st.textContent = t("preparingPrint");
    // Ryhmittele nykyisen suunnan vuorot todellisten ajopäivien mukaan (activeDates),
    // ei pakotettuun Ma–Pe/La/Su-kaistaan → oikea otsikko + pe-yövuorot mukana.
    // Kaikki suunnan patternit unioniin (monivarianttilinjat, esim. 23S).
    let groups = [];
    try { groups = groupTripsByDays(await dirTripsWithDays(curDirPatterns), date); }
    catch (e) { groups = []; }
    const tables = groups.length
      ? groups.map(g =>
          `<h3 class="daytype">${esc(g.label)}</h3>` +
          (mode === "all"
            ? stopMatrixHtml(g.trips[0]?._stops || current.stops, g.trips, { paginate: true, line: route.shortName, dir: patternLabel(current), daytype: g.label })
            : bookletTableHtml(g.trips))).join("")
      : `<p class="muted">${t("bookletNoData")}</p>`;
    po.innerHTML = `<div class="card">
        <h2>${esc(route.shortName || "")} ${esc(patternLabel(current))}</h2>
        <p class="muted">${t("printDaysNote")}</p>${tables}</div>`;
    setPageOrientation(mode === "all" ? "landscape" : "portrait");
    if (st) st.textContent = "";
    window.print();
  };
  // Lehtiteline-tuloste: MOLEMMAT suunnat + KAIKKI 3 päivätyyppiä (Ma–Pe/La/Su) tiiviisti
  // yhdelle pystyarkille (tavoite 1–2 s). Ero printLine("key"):iin: tämä kattaa molemmat
  // suunnat ja latoo päivätyypit sarakkeisiin (rack-CSS), avainpysäkit rajattu (≤~4) ettei
  // mikään kellonaika leikkaudu. Aina livedataa (sama tripsForDate kuin muuallakin).
  const printRack = async () => {
    const st = document.getElementById("linePrintStatus");
    const po = document.getElementById("linePrintOut");
    if (!po) return;
    printOwned = true; // estä matriisihaun oletustäytön ylikirjoitus
    if (st) st.textContent = t("preparingPrint");
    // Molemmat suunnat; kummankin vuorot ryhmiteltynä todellisten ajopäivien mukaan.
    const dirBlocks = await Promise.all(primaries.map(async p => {
      const dirPats = byDir.get(p.directionId ?? 0) || [p];  // suunnan kaikki variantit
      let groups = [];
      try { groups = groupTripsByDays(await dirTripsWithDays(dirPats), date); }
      catch (e) { groups = []; }
      const days = groups.length
        ? groups.map(g =>
            `<div class="rack-day"><h4 class="daytype">${esc(g.label)}</h4>${bookletTableHtml(g.trips, { target: 4, limit: 5 })}</div>`).join("")
        : `<p class="muted">${t("bookletNoData")}</p>`;
      return `<section class="rack-dir"><h3>${esc(patternLabel(p))}</h3>
        <div class="rack-days">${days}</div></section>`;
    }));
    // Valinnainen QR linjan livenäkymään (PNG, jotta sarjallistuu innerHTML:ään)
    let qrHtml = "";
    try {
      const cv = await qrCanvas(appUrl("#/linja/" + encodeURIComponent(routeId)), 200);
      qrHtml = `<img class="rack-qr" alt="${esc(t("qrCaptionLine"))}" src="${cv.toDataURL("image/png")}">`;
    } catch (e) { /* QR ei pakollinen */ }
    po.innerHTML = `<div class="rackprint">
      <div class="rack-head">
        <div class="rack-head-main">
          <h2>${badgeHtml(route)} ${esc(route.longName)}</h2>
          <p class="rack-sub">${esc(primaries.map(patternLabel).join("    "))}</p>
          <p class="rack-period">${t("bookletPeriodNote", { date: fmtDateLong(date) })}</p>
        </div>
        ${qrHtml}
      </div>
      ${dirBlocks.join("")}
    </div>`;
    if (st) st.textContent = "";
    runPrintJob(t("preparingPrint"), () => {
      setPageOrientation("rack");
      const done = () => { setPageOrientation("portrait"); hidePrintPrep(); window.removeEventListener("afterprint", done); };
      window.addEventListener("afterprint", done);
      window.print();
    });
  };
  // "Koko aikataulu" -lohkon taitto mobiilissa (desktopilla CSS näyttää aina, nappi piilossa)
  document.querySelector(".ft-toggle")?.addEventListener("click", e => {
    const wrap = e.currentTarget.closest(".ft-collapse");
    const open = wrap.classList.toggle("ft-open");
    e.currentTarget.setAttribute("aria-expanded", String(open));
  });
  document.getElementById("printRackBtn")?.addEventListener("click", printRack);
  document.getElementById("printKeyBtn")?.addEventListener("click", () => printLine("key"));
  document.getElementById("printAllBtn")?.addEventListener("click", () => printLine("all"));
  document.getElementById("lineQrBtn")?.addEventListener("click", () => {
    const box = document.getElementById("lineQr");
    if (!box) return;
    if (!box.hidden) { box.hidden = true; box.innerHTML = ""; return; }
    box.hidden = false;
    showQrInto(box, appUrl("#/linja/" + encodeURIComponent(routeId)),
      t("qrCaptionLine"), "qr-linja-" + (route.shortName || "").replace(/\W+/g, ""));
  });
}

// Lukee pysäkin seuraavat lähdöt ääneen (puhesynteesi); toinen klikkaus lopettaa
function speakDepartures(stop) {
  const synth = window.speechSynthesis;
  if (!synth || !stop) return;
  if (synth.speaking) { synth.cancel(); return; }
  const sts = (stop.stoptimesWithoutPatterns || []).slice(0, 5);
  if (!sts.length) return;
  const now = Date.now();
  const parts = sts.map(st => {
    const r = st.trip?.route || {};
    const dep = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
    const mins = Math.round(((st.serviceDay + dep) * 1000 - now) / 60000);
    const when = mins <= 0 ? t("speakNow")
      : mins < 60 ? t("speakInMin", { n: mins }) : t("speakAt", { time: fmtSec(dep) });
    return t("speakLine", { line: r.shortName || "", dest: st.headsign || "", when });
  });
  const u = new SpeechSynthesisUtterance(t("speakIntro", { stop: stop.name }) + " " + parts.join(" "));
  u.lang = lang === "fi" ? "fi-FI" : lang === "sv" ? "sv-SE" : "en-GB";
  synth.cancel();
  synth.speak(u);
}

// Pysäkin live-taulun (monitorin) jako-/upotuspaneeli yrityksille
function showEmbedInto(box, stopId) {
  const url = appUrl("#/monitori/" + encodeURIComponent(stopId));
  const iframe = `<iframe src="${url}" width="400" height="600" style="border:0" title="${esc(t("monitorLink"))}"></iframe>`;
  box.innerHTML = `
    <p class="muted">${t("embedIntro")}</p>
    <label class="embed-field">${t("embedLink")}
      <input type="text" readonly value="${esc(url)}" aria-label="${t("embedLink")}"></label>
    <label class="embed-field">${t("embedCode")}
      <textarea readonly rows="3" aria-label="${t("embedCode")}">${esc(iframe)}</textarea></label>
    <p class="row" style="gap:0.4rem;flex-wrap:wrap">
      <button type="button" class="copybtn" data-copy="${esc(url)}">${t("embedCopyLink")}</button>
      <button type="button" class="copybtn" data-copy="${esc(iframe)}">${t("embedCopyCode")}</button>
      <span id="embedMsg" class="muted" role="status"></span>
    </p>`;
  box.querySelectorAll("button[data-copy]").forEach(b =>

    }));
}

// Korjaa feed-duplikaatit pysäkkidatassa: sama linja voi olla kahdesti eri
// liikennöitsijällä (esim. 23), jolloin lähdöt tuplautuisivat ja linja näkyisi
// kahtena suodattimena. Normalisoidaan duplikaattilinja yhdeksi (kanoninen
// gtfsId per shortName) ja poistetaan identtiset lähdöt.
function dedupStopDuplicates(stop) {
  const canon = new Map();
  for (const r of (stop.routes || [])) if (r.shortName && !canon.has(r.shortName)) canon.set(r.shortName, r.gtfsId);
  if (Array.isArray(stop.stoptimesWithoutPatterns)) {
    const seen = new Set();
    stop.stoptimesWithoutPatterns = stop.stoptimesWithoutPatterns.filter(st => {
      const r = st.trip && st.trip.route;
      if (r && r.shortName && canon.has(r.shortName)) r.gtfsId = canon.get(r.shortName); // kanonisoi
      const k = (r && r.shortName || "") + "|" + (st.headsign || "") + "|" + ((st.serviceDay || 0) + (st.scheduledDeparture || 0));
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }
  if (Array.isArray(stop.routes)) {
    const rseen = new Set();
    stop.routes = stop.routes.filter(r => {
      const k = r.shortName || r.gtfsId;
      if (rseen.has(k)) return false;
      rseen.add(k);
      return true;
    });
  }
}

           name@L code lat lon wheelchairBoarding
           routes { gtfsId shortName color textColor }
           stoptimesWithoutPatterns(numberOfDepartures: 30, omitNonPickups: true) {
             scheduledDeparture realtimeDeparture realtime serviceDay headsign@L

           }
         }

      .sort((a, b) => (a.shortName || "").localeCompare(b.shortName || "", "fi", { numeric: true }));
    if (routes.length < 2) return "";
    return `<div class="legchips no-print" id="stopRoutes">${routes.map(r => {
      const style = r.color ? ` style="background:#${esc(r.color)};color:${badgeText(r.color, r.textColor)}"` : "";
      return `<button class="badge" data-route="${esc(r.gtfsId)}" aria-pressed="false"${style}
        title="${t("filterByRoute", { line: esc(r.shortName) })}">${esc(r.shortName)}</button>`;
    }).join("")}</div>`;
  };

  const { stop, cachedAt } = await fetchStop();
  lastStopData = stop;
  const accNote = stop.wheelchairBoarding === "POSSIBLE"
    ? `<p class="muted">${icon("wheelchair")} ${t("accStop")}</p>`
    : stop.wheelchairBoarding === "NOT_POSSIBLE"
      ? `<p class="muted">${icon("warning")} ${t("accStopNo")}</p>` : "";
  setView(`
    <nav class="crumb"><button class="linkish" id="backBtn">← ${t("back")}</button> · <a href="#/">${t("home")}</a></nav>
    <!-- Ruutukortti on no-print (sama kuvio kuin linjasivulla): paperille menee vain
         #stopPrintOut-säiliöön koottu pysäkkijuliste. Ilman tätä juliste alkoi sivulla
         jossa luki "nyt / 3 min" (live-lähtölista) — merkityksetön paperilla ja toistaa
         pysäkin nimen. Juliste on kortin ULKOPUOLELLA, joten se ei piiloudu. -->
    <div class="card no-print">
      <h2>${favButtonHtml(stopId)}${esc(stop.name)} <span class="muted">${esc(stop.code || "")}</span></h2>
      ${accNote}
      ${stopRoutesHtml(stop)}
      <div id="staleNote">${cachedAt ? staleNoteHtml(cachedAt) : ""}</div>
      <table class="deps">
        <thead><tr><th>${t("thLine")}</th><th>${t("thDest")}</th><th>${t("thDeparts")}</th></tr></thead>
        <tbody id="depRows">${renderRows(stop)}</tbody>
      </table>
      <p class="muted"><span class="rt">●</span> ${t("rtLegendStop")}</p>
      <p class="no-print" style="margin:0.6rem 0 0; display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center">
        <button type="button" id="stopPosterBtn">${icon("print")} ${t("printStopPoster")}</button>
        <a class="btnlink secondary" href="#/monitori/${encodeURIComponent(stopId)}">${icon("monitor")} ${t("monitorLink")}</a>
        ${("speechSynthesis" in window) ? `<button type="button" id="speakBtn" class="secondary">${icon("speaker")} ${t("speakAloud")}</button>` : ""}
        <button type="button" id="stopQrBtn" class="secondary">${icon("qr")} ${t("qrButton")}</button>
        <button type="button" id="stopEmbedBtn" class="secondary">${icon("link")} ${t("embedButton")}</button>
        ${(stop.lat != null && (stop.routes || []).length && "Notification" in window)
          ? `<button type="button" id="approachBtn" class="secondary">${icon("bell")} ${t("approachArm")}</button>` : ""}
        <span id="stopPrintStatus" class="muted" role="status"></span>
      </p>
      <div id="approachBanner" class="approach-banner no-print" role="status" aria-live="polite" hidden></div>
      <div id="stopEmbed" class="embedbox no-print" hidden></div>
      <div id="stopQr" class="qrbox no-print" hidden></div>
      <div id="stopMap" class="map map-small" aria-label="${t("stopMapAria")}"></div>
      <p class="muted" id="stopMapHint" hidden>${t("stopBusesHint")}</p>
    </div>
    <div id="stopPrintOut"></div>`);

  bindFavButton({ type: "stop", id: stopId, name: stop.name });
  document.getElementById("backBtn").addEventListener("click", () => history.back());

  // Lähestyvä bussi -hälytys: kun pysäkin linjojen ajoneuvon seuraava pysäkki
  // (MQTT-topicin nextStop) on TÄMÄ pysäkki, bussi on lähestymässä (yhden pysäkin
  // päässä). Toimii etualalla (sovellus auki); ilmoitus + sivun sisäinen banneri.
  const stopNum = stopId.split(":")[1];
  let approachArmed = false;
  const notifiedVeh = new Set();
  const fireApproach = (routeName, dest) => {
    const banner = document.getElementById("approachBanner");
    if (banner) {
      banner.hidden = false;
      banner.innerHTML = `${icon("bell")} <strong>${esc(t("approachFired", { line: routeName }))}</strong>${dest ? ` · ${esc(dest)}` : ""}`;
    }
    try {
      if ("Notification" in window && Notification.permission === "granted")
        new Notification(t("approachTitle", { line: routeName }),
          { body: t("approachBody", { stop: stop.name }), tag: "approach-" + stopId, icon: "icon-192.png" });
    } catch (e) { /* ilmoitus ei pakollinen */ }
    if (navigator.vibrate) try { navigator.vibrate([200, 100, 200]); } catch (e) {}
  };
  const onVehicleMsg = (seg, route) => {
    if (!approachArmed) return;
    const vehId = seg[13] || "";
    if ((seg[11] || "") === stopNum) {
      if (!notifiedVeh.has(vehId)) { notifiedVeh.add(vehId); fireApproach(route.shortName, seg[9] || ""); }
    } else {
      notifiedVeh.delete(vehId); // bussi ohitti → salli uusi hälytys jos linja palaa
    }
  };
  document.getElementById("approachBtn")?.addEventListener("click", async () => {
    const btn = document.getElementById("approachBtn");
    const banner = document.getElementById("approachBanner");
    if (approachArmed) {
      approachArmed = false; notifiedVeh.clear();
      btn.classList.remove("armed");
      btn.innerHTML = `${icon("bell")} ${t("approachArm")}`;
      if (banner) { banner.hidden = true; banner.innerHTML = ""; }
      return;
    }
    let perm = Notification.permission;
    if (perm === "default") { try { perm = await Notification.requestPermission(); } catch (e) {} }
    approachArmed = true;
    btn.classList.add("armed");
    btn.innerHTML = `${icon("bell")} ${t("approachOn")}`;
    if (banner) {
      banner.hidden = false;
      banner.textContent = perm === "granted" ? t("approachWaiting") : t("approachWaitingNoPerm");
    }
  });

  // QR-koodi pysäkin live-sivulle (LSL voi teipata katokseen)
  document.getElementById("stopQrBtn")?.addEventListener("click", () => {
    const box = document.getElementById("stopQr");
    if (!box) return;
    if (!box.hidden) { box.hidden = true; box.innerHTML = ""; return; }
    box.hidden = false;
    showQrInto(box, appUrl("#/pysakki/" + encodeURIComponent(stopId)),
      t("qrCaptionStop"), "qr-pysakki-" + (stop.code || stopId).replace(/\W+/g, ""));
  });

  // Lue lähdöt ääneen (puhesynteesi)
  document.getElementById("speakBtn")?.addEventListener("click", () => speakDepartures(lastStopData || stop));

  // Jaa / upota pysäkin live-taulu (iframe yrityksille)
  document.getElementById("stopEmbedBtn")?.addEventListener("click", () => {
    const box = document.getElementById("stopEmbed");
    if (!box) return;
    if (!box.hidden) { box.hidden = true; box.innerHTML = ""; return; }
    box.hidden = false;
    showEmbedInto(box, stopId);
  });

  // Pysäkkijuliste: kaikki pysäkiltä lähtevät linjat tuntikaaviona, osiot
  // TODELLISTEN ajopäivien mukaan (activeDates → esim. Ma–Pe / Pe / La / Su),
  // tulostettava A4-pystyyn. Sama tulos tulostuspäivästä riippumatta.
  document.getElementById("stopPosterBtn")?.addEventListener("click", async () => {
    const stEl = document.getElementById("stopPrintStatus");
    const po = document.getElementById("stopPrintOut");
    if (!po) return;
    if (stEl) stEl.textContent = t("preparingPrint");
    const today = todayISO();
    let blocks;
    try { blocks = await stopPosterBlocks(stopId, today); }
    catch (e) {
      // Haku epäonnistui → EI tulosteta (tyhjä juliste = "ei lähtöjä" olisi valhe)
      if (stEl) stEl.textContent = esc(e.message);
      return;
    }
    // QR pysäkin live-sivulle upotetaan julisteeseen (skannattava katoksessa)
    let qrImg = "";
    try {
      const u = await qrDataUrl(appUrl("#/pysakki/" + encodeURIComponent(stopId)), 240);
      qrImg = `<div class="poster-qrwrap"><img class="poster-qr" src="${u}" alt="">
        <span class="poster-qrcap">${t("qrPosterHint")}</span></div>`;
    } catch (e) { /* QR ei pakollinen tulosteelle */ }
    const head = (sub) => `<div class="poster-head">
           <div>
             <h2>${esc(stop.name)} <span class="muted">${esc(stop.code || "")}</span></h2>
             <p class="poster-sub">${esc(sub)}</p>
             <p class="muted">${t("posterAllLinesNote")}</p>
           </div>
           ${qrImg}
         </div>`;
    const sections = blocks.length
      ? blocks.map(b =>
          `<section class="card poster-day">
             ${head(b.label)}
             ${stopPosterHtml(b.lines)}
           </section>`).join("")
      : `<section class="card poster-day">${head("")}<p class="muted">${t("bookletNoData")}</p></section>`;
    po.innerHTML = `<div class="print-only">${sections}
        <p class="muted">${t("bookletPeriodNote", { date: fmtDateLong(today) })}</p></div>`;
    setPageOrientation("portrait");
    if (stEl) stEl.textContent = "";
    window.print();
  });

  document.querySelectorAll("#stopRoutes button[data-route]").forEach(btn =>
    btn.addEventListener("click", () => {
      routeFilter = routeFilter === btn.dataset.route ? null : btn.dataset.route;
      document.getElementById("stopRoutes").classList.toggle("filtered", !!routeFilter);
      document.querySelectorAll("#stopRoutes button[data-route]").forEach(b =>
        b.setAttribute("aria-pressed", String(b.dataset.route === routeFilter)));
      const tbody = document.getElementById("depRows");
      if (tbody && lastStopData) tbody.innerHTML = renderRows(lastStopData);
    }));

  if (stop.lat != null) {
    const mySeq = viewSeq;
    ensureLeaflet().then(() => {
      if (mySeq !== viewSeq || !document.getElementById("stopMap")) return;
      const map = makeMap("stopMap", [stop.lat, stop.lon], 16);
      L.circleMarker([stop.lat, stop.lon], STOP_MARKER).addTo(map)
        .bindPopup(esc(stop.name));
      // pysäkkiä liikennöivien linjojen bussit lähestymässä
      const routes = (stop.routes || []).slice(0, 15);
      if (routes.length) {
        startVehicles(map, routes, onVehicleMsg);
        const hint = document.getElementById("stopMapHint");
        if (hint) hint.hidden = false;
      }
    }).catch(() => { document.getElementById("stopMap")?.remove(); });
  } else {
    const el = document.getElementById("stopMap");
    if (el) el.remove();
  }

  refreshNow = async () => {
    try {
      const fresh = await fetchStop();
      lastStopData = fresh.stop;
      const tbody = document.getElementById("depRows");
      if (tbody) tbody.innerHTML = renderRows(fresh.stop);
      const note = document.getElementById("staleNote");
      if (note) note.innerHTML = fresh.cachedAt ? staleNoteHtml(fresh.cachedAt) : "";
    } catch (err) {
      // verkkohikka: jätetään edelliset lähdöt näkyviin ja yritetään taas 30 s päästä
    }
  };
  refreshTimer = setInterval(refreshNow, 30000);
}

let networkCache = null;
async function loadNetwork() {
  if (networkCache) return networkCache;
  const feed = await findFeed();
  const data = await gql(
    `query ($feeds: [String]) {
       routes(feeds: $feeds) {
         gtfsId shortName longName@L mode color
         patterns { patternGeometry { length points } }
       }
     }`, { feeds: [feed] });
  // Suodata samaan aktiivijoukkoon kuin linjalista (ei piirretä kausi-/koululinjoja
  // joilla ei ole tulevia lähtöjä). loadRoutes on välimuistitettu → halpa.
  let activeIds = null;
  try { const ar = await loadRoutes(); if (ar && ar.length) activeIds = new Set(ar.map(r => r.gtfsId)); } catch (e) { /* näytä kaikki jos epäonnistuu */ }
  networkCache = (data.routes || [])
    .filter(r => r.mode === "BUS")
    .filter(r => !activeIds || activeIds.has(r.gtfsId));
  return networkCache;
}

async function viewNetworkMap() {
  if (!PROXY_URL && !apiKey) { location.hash = "#/asetukset"; return; }
  setView(`
    <nav class="crumb"><a href="#/">← ${t("home")}</a></nav>
    <div class="card">
      <h2>${icon("network")} ${t("netMapTitle")}</h2>
      <p class="muted" id="netCount" role="status">${t("netMapLoading")}</p>
      <div id="netMap" class="map bigmap" aria-label="${esc(t("netMapAria"))}"></div>
      <p class="muted">${t("netMapHint")}</p>
    </div>`);
  const mySeq = viewSeq;
  try {
    const [routes] = await Promise.all([loadNetwork(), ensureLeaflet()]);
    if (mySeq !== viewSeq || !document.getElementById("netMap")) return;
    const map = makeMap("netMap", [AREA.focus.lat, AREA.focus.lon], 12);
    let bounds = null, drawn = 0;
    for (const r of routes) {
      // piirrä linjan pisin reittikuvio (yksi viiva/linja pitää kartan luettavana)
      const pat = (r.patterns || [])
        .filter(p => p.patternGeometry && p.patternGeometry.points)
        .sort((a, b) => (b.patternGeometry.length || 0) - (a.patternGeometry.length || 0))[0];
      if (!pat) continue;
      const pts = decodePolyline(pat.patternGeometry.points);
      if (!pts.length) continue;
      const color = r.color ? "#" + r.color : "#0a4ea3";
      const line = L.polyline(pts, { color, weight: 3, opacity: 0.55 }).addTo(map);
      const label = (r.shortName || "") + (r.longName ? " " + r.longName : "");
      line.bindTooltip(label.trim() || t("alertDefault"), { sticky: true });
      line.on("mouseover", () => line.setStyle({ weight: 6, opacity: 0.95 }));
      line.on("mouseout", () => line.setStyle({ weight: 3, opacity: 0.55 }));
      line.on("click", () => { location.hash = "#/linja/" + encodeURIComponent(r.gtfsId); });
      bounds = bounds ? bounds.extend(line.getBounds()) : line.getBounds();
      drawn++;
    }
    fitMap(map, bounds);
    const el = document.getElementById("netCount");
    if (el) el.textContent = t("netMapCount", { n: drawn });

/* ---------- Keskusterminaalien laiturit (#/laiturit) ----------
   Matkakeskus / Kauppatori / Trio: kunkin laiturit piirretään avoimesta
   GTFS-datasta (stops nimellä) kartalle laiturikirjaimin + linjoineen ja
   linkitetään LSL:n viralliseen PDF-laiturikarttaan (kuvia ei upoteta —
   ne ovat LSL:n tekijänoikeutta; oma kartta päivittyy avoimesta datasta). */

// Pysäkin tunnus (kartan merkki) + näyttönimi LSL:n termein: numeropysäkki on
// "Laituri N" (esim. Matkakeskus 3/4), kirjainpysäkki "Pysäkki X" (A–F; Trion
// kirjaimet tulevat nimestä "Trio A"). Jos kumpaakaan ei ole, näytetään pysäkin
// nimi sellaisenaan — koodia EI esitetä laiturinumerona.
function boardingInfo(stop, hubName) {
  const pc = stop.platformCode;
  if (pc) {
    const word = /^\d+$/.test(pc) ? t("termPlatform") : t("termStop");
    return { tag: pc, full: word + " " + pc };
  }
  const n = (stop.name || "").trim();
  if (hubName && n.toLowerCase().startsWith(hubName.toLowerCase())) {
    const rest = n.slice(hubName.length).replace(/^[\s,–-]+/, "").trim();
    if (rest && rest.length <= 4) return { tag: rest, full: t("termStop") + " " + rest };
  }
  return { tag: "•", full: n || stop.code || "?" };
}

async function loadHubStops(name) {
  const feed = await findFeed();
  const data = await gql(
    `query ($name: String!) {
       stops(name: $name) {
         gtfsId code platformCode name@L lat lon
         routes { gtfsId shortName color textColor }
       }
     }`, { name });
  // stops(name:) EI ole feed-rajattu (hakee kaikki Waltti-kaupungit) → suodata oma feed
  const pref = feed + ":";
  return (data.stops || []).filter(s => s.gtfsId.startsWith(pref) && s.lat != null && s.lon != null);
}

async function viewHubs(parts) {
  if (!CONFIG.hubs || !CONFIG.hubs.length) { location.hash = "#/"; return; }

  const hub = CONFIG.hubs.find(h => h.key === parts[1]) || CONFIG.hubs[0];
  const tabs = CONFIG.hubs.map(h =>
    `<button data-hub-tab="${esc(h.key)}" aria-pressed="${h.key === hub.key}">${esc(h.name)}</button>`).join("");
  setView(`
    <nav class="crumb"><a href="#/">← ${t("home")}</a></nav>
    <div class="card">
      <h2>${icon("pin")} ${t("hubTitle")}</h2>
      <p class="muted">${t("hubIntro")}</p>
      <div class="tabs plat-tabs" role="group" aria-label="${esc(t("hubTitle"))}">${tabs}</div>
      <div id="hubMap" class="map bigmap" aria-label="${esc(t("hubMapAria", { hub: hub.name }))}"></div>
      ${hub.pdf
        ? `<p class="muted">${icon("doc")} <a href="${esc(hub.pdf)}" target="_blank" rel="noopener">${t("hubOfficialMap")}</a><br><span class="muted">${t("hubOfficialNote")}</span></p>`

  document.querySelectorAll("[data-hub-tab]").forEach(btn =>
    btn.addEventListener("click", () => { location.hash = "#/laiturit/" + btn.dataset.hubTab; }));
  const mySeq = viewSeq;
  try {
    let [stops] = await Promise.all([loadHubStops(hub.name), ensureLeaflet()]);
    if (mySeq !== viewSeq || !document.getElementById("hubMap")) return;
    // Hygienia: piilota pysäkit joilla ei ole yhtään linjaa (ei lähtöjä → pelkkää kohinaa).
    stops = stops.filter(s => (s.routes || []).length > 0);
    // Jos hubilla on LSL:n virallinen lähtöpaikkalista (allow), näytä vain ne
    // (suodattaa GTFS:n tekniset/vanhentuneet pysäkit, esim. Matkakeskuksen Laituri 2/7).
    if (hub.allow) stops = stops.filter(s => hub.allow.includes(boardingInfo(s, hub.name).tag));
    // järjestä tunnuksen mukaan (numerot ja kirjaimet luonnollisesti, nimi-pysäkit viimeiseksi)
    const sortKey = s => { const tg = boardingInfo(s, hub.name).tag; return tg === "•" ? "￿" : tg; };
    stops.sort((a, b) => sortKey(a).localeCompare(sortKey(b), "fi", { numeric: true }));
    const map = makeMap("hubMap", [hub.center.lat, hub.center.lon], 16);
    let bounds = null;
    const listHtml = [];
    for (const s of stops) {
      const { tag: label, full } = boardingInfo(s, hub.name);
      // uniikit linjat (sama linja voi toistua) brändiväreissä
      const lines = [...new Map((s.routes || []).map(r => [r.shortName, r])).values()]
        .sort((a, b) => (a.shortName || "").localeCompare(b.shortName || "", "fi", { numeric: true }));
      const badges = lines.map(r => {
        const style = r.color ? ` style="background:#${esc(r.color)};color:${badgeText(r.color, r.textColor)}"` : "";
        return `<a class="badge" href="#/linja/${encodeURIComponent(r.gtfsId)}"${style}>${esc(r.shortName || "")}</a>`;
      }).join("");
      const stopUrl = "#/pysakki/" + encodeURIComponent(s.gtfsId);
      const linesShort = lines.slice(0, 16).map(r => esc(r.shortName)).join(", ");
      const icon = L.divIcon({ className: "plat-marker-wrap",
        html: `<span class="plat-marker">${esc(label)}</span>`, iconSize: [30, 30] });
      const marker = L.marker([s.lat, s.lon], { icon }).addTo(map).bindPopup(
        `<strong>${esc(hub.name)} · ${esc(full)}</strong><br>${linesShort || t("hubNoLines")}<br><a href="${stopUrl}">${t("hubDepartures")}</a>`,
        { maxWidth: 260 });
      bounds = bounds ? bounds.extend(marker.getLatLng()) : L.latLngBounds(marker.getLatLng(), marker.getLatLng());
      listHtml.push(
        `<li class="plat-item"><div class="plat-head"><span class="plat-tag">${esc(label)}</span>` +
        `<strong class="plat-name">${esc(full)}</strong>` +
        `<a href="${stopUrl}" aria-label="${esc(full)}: ${t("hubDepartures")}">${t("hubDepartures")}</a></div>` +
        (badges ? `<div class="plat-lines">${badges}</div>` : `<p class="muted">${t("hubNoLines")}</p>`) +
        `</li>`);

    if (listEl) listEl.innerHTML = stops.length
      ? `<ul class="plat-list">${listHtml.join("")}</ul>`
      : `<p class="muted">${t("hubNone")}</p>`;
  } catch (e) {
    const el = document.getElementById("hubList");
    if (el) el.innerHTML = `<div class="error">${t("hubFail")}${esc(e.message)}</div>`;
  }
}

/* ---------- Poikkeuspäivät (#/poikkeukset): tulevat pyhä- ja juhlapäivät ----------
   Suomen arkipyhät ovat deterministisiä (sama computus kuin fiHolidays), joten
   kalenteri rakennetaan ilman rajapintaa. Sisältö on faktuaalinen päivälista;
   palvelutason tarkka muutos kehotetaan tarkistamaan linjasivulta (rehellisyys
   — avoin data ei anna luotettavaa "sunnuntaiaikataulu"-merkintää per päivä). */
const HOLIDAY_NAMES = {
  fi: { newyear: "Uudenvuodenpäivä", epiphany: "Loppiainen", goodfri: "Pitkäperjantai", easter: "Pääsiäispäivä", easter2: "2. pääsiäispäivä", mayday: "Vappu", ascension: "Helatorstai", pentecost: "Helluntai", midsummereve: "Juhannusaatto", midsummer: "Juhannuspäivä", allsaints: "Pyhäinpäivä", independence: "Itsenäisyyspäivä", xmaseve: "Jouluaatto", xmas: "Joulupäivä", boxing: "Tapaninpäivä", newyeareve: "Uudenvuodenaatto" },
  en: { newyear: "New Year's Day", epiphany: "Epiphany", goodfri: "Good Friday", easter: "Easter Sunday", easter2: "Easter Monday", mayday: "May Day", ascension: "Ascension Day", pentecost: "Whitsun", midsummereve: "Midsummer Eve", midsummer: "Midsummer Day", allsaints: "All Saints' Day", independence: "Independence Day", xmaseve: "Christmas Eve", xmas: "Christmas Day", boxing: "St. Stephen's Day", newyeareve: "New Year's Eve" },
  sv: { newyear: "Nyårsdagen", epiphany: "Trettondedag jul", goodfri: "Långfredagen", easter: "Påskdagen", easter2: "Annandag påsk", mayday: "Första maj", ascension: "Kristi himmelsfärdsdag", pentecost: "Pingst", midsummereve: "Midsommarafton", midsummer: "Midsommardagen", allsaints: "Alla helgons dag", independence: "Självständighetsdagen", xmaseve: "Julafton", xmas: "Juldagen", boxing: "Annandag jul", newyeareve: "Nyårsafton" },
};
const HOLIDAY_EVES = new Set(["xmaseve", "midsummereve", "newyeareve"]);

// Nimetyt pyhäpäivät vuodelle: [{iso, key}] (sama laskenta kuin fiHolidays)
function namedHolidays(year) {
  const out = [];
  const iso = (m, d) => `${year}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  out.push({ iso: iso(1, 1), key: "newyear" }, { iso: iso(1, 6), key: "epiphany" },
    { iso: iso(5, 1), key: "mayday" }, { iso: iso(12, 6), key: "independence" },
    { iso: iso(12, 24), key: "xmaseve" }, { iso: iso(12, 25), key: "xmas" },
    { iso: iso(12, 26), key: "boxing" }, { iso: iso(12, 31), key: "newyeareve" });
  const a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, mm = Math.floor((a + 11 * h + 22 * l) / 451),
    month = Math.floor((h + l - 7 * mm + 114) / 31), day = ((h + l - 7 * mm + 114) % 31) + 1;
  const easter = new Date(year, month - 1, day);
  const off = (n, key) => { const x = new Date(easter); x.setDate(easter.getDate() + n); out.push({ iso: isoOf(x), key }); };
  off(-2, "goodfri"); off(0, "easter"); off(1, "easter2"); off(39, "ascension"); off(49, "pentecost");
  for (let dd = 20; dd <= 26; dd++) { const dt = new Date(year, 5, dd); if (dt.getDay() === 6) { out.push({ iso: isoOf(dt), key: "midsummer" }); const fr = new Date(dt); fr.setDate(dd - 1); out.push({ iso: isoOf(fr), key: "midsummereve" }); break; } }
  for (let dd = 31; dd <= 37; dd++) { const dt = new Date(year, 9, dd); if (dt.getDay() === 6) { out.push({ iso: isoOf(dt), key: "allsaints" }); break; } }
  return out;
}

function fmtWeekday(iso) {
  const [y, m, d] = (iso || "").split("-").map(Number);
  if (!y) return "";
  const loc = lang === "fi" ? "fi-FI" : lang === "sv" ? "sv-FI" : "en-GB";
  return new Date(y, m - 1, d).toLocaleDateString(loc, { weekday: "long" });
}

function viewExceptions() {
  const today = todayISO();
  const yr = +today.slice(0, 4);
  const names = HOLIDAY_NAMES[lang] || HOLIDAY_NAMES.fi;
  const all = [...namedHolidays(yr), ...namedHolidays(yr + 1)]
    .filter(h => h.iso >= today)
    .sort((a, b) => a.iso.localeCompare(b.iso))
    .slice(0, 16);
  const rows = all.map(h => {
    const eve = HOLIDAY_EVES.has(h.key);
    const tag = eve ? t("exTagEve") : t("exTagHoliday");
    return `<li class="ex-row">

      <span class="ex-name">${esc(names[h.key] || "")}</span>
      <span class="ex-tag ${eve ? "ex-eve" : ""}">${esc(tag)}</span>

  setView(`

/* ---------- Junien lähdöt (#/junat) — rata.digitraffic.fi (Fintraffic, CC BY 4.0) ---------- */
// Vain rail-kaupungit (CONFIG.rail = asemakoodi). Data haetaan SUORAAN selaimesta:
// rajapinta on avoin, avaimeton ja palauttaa Access-Control-Allow-Origin: * →
// proxya ei tarvita EIKÄ kutsu kuluta Digitransit-kiintiötä. Rajapinnan
// Cache-Control on 30 s, joten 60 s päivitysväli ei kuormita sitä turhaan.

const RAIL_API = "https://rata.digitraffic.fi/api/v1";

// Asemakoodi → nimi (563 asemaa) localStorage-välimuistiin 7 vrk:ksi. Avain on
// tarkoituksella kaupunkijaon (ns()) ulkopuolella: sama data joka kaupungille.
async function railStationNames() {
  const KEY = "railStations-v1";
  try {
    const c = JSON.parse(localStorage.getItem(KEY));
    if (c && c.t > Date.now() - 7 * 864e5) return c.map;
  } catch (e) { /* rikkinäinen välimuisti ohitetaan */ }
  const res = await fetch(RAIL_API + "/metadata/stations", { headers: { "Digitraffic-User": "Reittari" } });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const map = {};
  for (const s of await res.json()) {
    // "Kuopio asema" → "Kuopio" — asema-pääte on tässä käytössä kohinaa
    map[s.stationShortCode] = String(s.stationName || s.stationShortCode).replace(/ asema$/i, "");
  }
  try { localStorage.setItem(KEY, JSON.stringify({ t: Date.now(), map })); } catch (e) { /* täysi storage ei kaada */ }
  return map;
}

async function loadTrains(code, names) {
  const res = await fetch(`${RAIL_API}/live-trains/station/${code}` +
    "?arrived_trains=0&arriving_trains=0&departed_trains=0&departing_trains=15&include_nonstopping=false",
    { headers: { "Digitraffic-User": "Reittari" } });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const rows = [];
  for (const tr of await res.json()) {
    // vain matkustajajunat; tavara- ja työjunat pois
    if (tr.trainCategory !== "Long-distance" && tr.trainCategory !== "Commuter") continue;
    const dep = (tr.timeTableRows || []).find(r =>
      r.stationShortCode === code && r.type === "DEPARTURE" && r.trainStopping !== false);
    if (!dep) continue;
    const stops = (tr.timeTableRows || []).filter(r => r.trainStopping !== false);
    const destCode = stops.length ? stops[stops.length - 1].stationShortCode : "";
    rows.push({
      sched: new Date(dep.scheduledTime),
      est: dep.liveEstimateTime ? new Date(dep.liveEstimateTime) : null,
      cancelled: !!(tr.cancelled || dep.cancelled),
      // lähijunilla kirjaintunnus (Z, R, …), kaukojunilla tyyppi + numero (IC 62)
      label: tr.commuterLineID || `${tr.trainType} ${tr.trainNumber}`,
      dest: names[destCode] || destCode,
      track: dep.commercialTrack || "",
    });
  }
  rows.sort((a, b) => a.sched - b.sched);
  return rows;
}

// Lähtörivien renderöinti jaettuna kahdelle kutsujalle: #/junat-näkymä (koko lista) ja
// palvelutiskin junalohko (lyhennetty). Sama muotoilu molemmissa, jotta tiskin luku ja
// näkymän luku eivät voi erota toisistaan.
function railHhmm(d) { return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
function railDayTime(d) {
  // Harvaan liikennöidyillä asemilla lista jatkuu huomiseen (esim. Vaasa: 18:07 → 04:44)
  // → pelkkä kellonaika olisi harhaanjohtava, joten muu kuin tämä päivä saa viikonpäivän eteen
  const locale = lang === "sv" ? "sv-FI" : lang === "en" ? "en-GB" : "fi-FI";
  return (d.toDateString() === new Date().toDateString() ? ""
    : d.toLocaleDateString(locale, { weekday: "short" }) + " ") + railHhmm(d);
}
function railTableHtml(rows, limit) {
  const body = rows.slice(0, limit || rows.length).map(r => {
    // myöhässä ≥ 1 min → arvioitu aika korostettuna aikataulunmukaisen perään
    const late = r.est && Math.abs(r.est - r.sched) >= 60000;
    const time = r.cancelled
      ? `<s>${railDayTime(r.sched)}</s> <span class="ex-tag">${t("trainsCancelled")}</span>`
      : railDayTime(r.sched) + (late ? ` <strong>→ ${railHhmm(r.est)}</strong>` : "");
    return `<tr><td>${time}</td><td><strong>${esc(r.label)}</strong></td>` +
      `<td style="text-align:left">${esc(r.dest)}</td><td>${esc(r.track)}</td></tr>`;
  }).join("");
  return `<div class="matrix-wrap"><table class="stoptable booklet">
       <thead><tr><th scope="col">${t("thDeparts")}</th><th scope="col">${t("trainsTrain")}</th>
       <th scope="col" style="text-align:left">${t("thDest")}</th><th scope="col">${t("trainsTrack")}</th></tr></thead>
       <tbody>${body}</tbody></table></div>`;
}

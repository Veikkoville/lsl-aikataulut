<script>
// Teema ratkaistaan ennen ensimmäistä maalausta välähdyksen välttämiseksi
(function () {
  function apply() {
    var pref = localStorage.getItem("theme") || "auto";
    var dark = pref === "dark" ||
      (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = dark ? "#102a4d" : "#0a4ea3";
  }
  apply();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", apply);
  window.applyTheme = apply;

  // Tekstikoko (esteettömyys): normal/large/larger → html[data-text], ennen maalausta
  function applyText() {
    var size = localStorage.getItem("textSize") || "normal";
    if (size === "large" || size === "larger") document.documentElement.dataset.text = size;
    else delete document.documentElement.dataset.text;
  }
  applyText();
  window.applyTextSize = applyText;

  // Korkea kontrasti (esteettömyys): high → html[data-contrast], ennen maalausta
  function applyContrast() {
    if ((localStorage.getItem("contrast") || "normal") === "high")
      document.documentElement.dataset.contrast = "high";
    else delete document.documentElement.dataset.contrast;
  }
  applyContrast();
  window.applyContrast = applyContrast;
})();
</script>
<style>
  :root {
    /* Transit-grade design-tokenit. Yksi vahva sininen primääri + neutraalit harmaat.
       Semanttiset värit VAIN merkitykseen: --green = ok/nopein, --sev-warning = häiriö,
       --sev-severe = vakava. Litteä ilme: ei gradientteja/varjoja (--shadow = läpinäkyvä). */
    --blue: #0a4ea3;            /* primääri, AA valkoisella (~7.6:1) */
    --btn-bg: #0a4ea3;
    --btn-hover: #083d80;
    --header-bg: #0a4ea3;       /* litteä, ei gradienttia */
    --bg: #f3f5f8;
    --card: #ffffff;
    --text: #182234;
    --muted: #56607a;          /* AA valkoisella (~5.9:1) */
    --green: #1a7f4b;
    --border: #dbe1ea;
    --hover: #eef3fb;
    --chip: #eaeff6;
    --rt-bg: #e2f3e9;
    --rt-text: #135c37;
    --error-bg: #fdecec;
    --error-border: #f3b6b6;
    --error-text: #8a1f1f;
    --shadow: transparent;     /* litteä: ei varjoja (muuttuja säilytetty yhteensopivuuden vuoksi) */
    --star: #b8860b;
    --sev-severe: #c0392b;
    --sev-warning: #b9740f;
    /* Muoto- ja välitokenit: yhtenäiset kortit, badget ja painikkeet */
    --radius: 12px;            /* kortit */
    --radius-sm: 8px;          /* napit, badget, kentät */
    --pill: 999px;             /* pilleri-/etäisyysmerkit */
    --pad-card: 1.05rem 1.15rem;
    --wmed: 500;               /* ainoa korostuspaino (perus 400) */
  }
  html[data-theme="dark"] {
    --blue: #7db3f0;
    --btn-bg: #155bb5;
    --btn-hover: #1e6ad0;
    --header-bg: #102a4d;
    --bg: #0f1522;
    --card: #19202f;
    --text: #e6ebf5;
    --muted: #9aa6bd;
    --green: #5ecf96;
    --border: #323c52;
    --hover: #222c42;
    --chip: #243049;
    --rt-bg: #14301f;
    --rt-text: #7fd6a4;
    --error-bg: #3a1414;
    --error-border: #7a2e2e;
    --error-text: #f0a0a0;
    --shadow: transparent;
    --star: #e0b13e;
    --sev-severe: #e06050;
    --sev-warning: #e8a33d;
  }
  /* Korkea kontrasti (esteettömyys): maksimoi tekstin ja reunojen erottuvuus.
     Vaalea ja tumma erikseen; tumma+kontrasti voittaa specificityllä. */
  html[data-contrast="high"] {
    --bg: #ffffff; --card: #ffffff; --text: #000000; --muted: #1a1a1a;
    --border: #000000; --hover: #e6e6e6; --chip: #dcdcdc;
    --blue: #0033cc; --btn-bg: #0033cc; --btn-hover: #001f99;
    --rt-bg: #d4f0d4; --rt-text: #005800; --error-text: #990000;
    --sev-severe: #a00000; --sev-warning: #8a5200; --star: #6e5200;
    --shadow: transparent;
  }
  html[data-theme="dark"][data-contrast="high"] {
    --bg: #000000; --card: #000000; --text: #ffffff; --muted: #e8e8e8;
    --border: #ffffff; --hover: #1c1c1c; --chip: #202020;
    --blue: #7db8ff; --btn-bg: #1a5fd0; --btn-hover: #2e78ec;
    --rt-bg: #0a2a0a; --rt-text: #82ff82; --error-text: #ff8c8c;
    --sev-severe: #ff7060; --sev-warning: #ffc24d; --star: #ffcf52;
    --shadow: transparent;
  }
  html[data-contrast="high"] a { text-decoration: underline; }
  html[data-contrast="high"] .card,
  html[data-contrast="high"] button.secondary,
  html[data-contrast="high"] a.btnlink.secondary,
  html[data-contrast="high"] input, html[data-contrast="high"] select { border-width: 2px; }
  html[data-theme="dark"] .leaflet-popup-content-wrapper,
  html[data-theme="dark"] .leaflet-popup-tip {
    background: var(--card);
    color: var(--text);
  }
  * { box-sizing: border-box; }
  a { color: var(--blue); }
  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, summary:focus-visible {
    outline: 3px solid var(--blue);
    outline-offset: 2px;
  }
  /* Kunnioita "vähennä liikettä" -asetusta: animaatiot, siirtymät ja korttien
     hover-nostot pois käytöstä niiltä, jotka ovat sen valinneet */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    .route-tile:hover, button:active { transform: none !important; }
  }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  /* Esteettömyys: tekstikoko skaalaa koko käyttöliittymän (rem-pohjainen) */
  html[data-text="large"] { font-size: 118.75%; }
  html[data-text="larger"] { font-size: 137.5%; }
  html[data-text="large"] body, html[data-text="larger"] body { line-height: 1.6; }
  html[data-text="large"] button, html[data-text="large"] a.btnlink,
  html[data-text="larger"] button, html[data-text="larger"] a.btnlink { min-height: 52px; }
  header {
    background: var(--header-bg);
    color: #fff;
    padding: 0.85rem 1rem;
    position: sticky;
    top: 0;
    z-index: 600;
  }
  .brand {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    max-width: 760px;
    margin: 0 auto;
  }
  a.brand { color: inherit; text-decoration: none; }
  a.brand:hover h1 { text-decoration: underline; }
  .logo {
    width: 2.6rem;
    height: 2.6rem;
    border-radius: var(--radius);
    flex-shrink: 0;
  }
  header h1 { margin: 0; font-size: 1.25rem; font-weight: var(--wmed); letter-spacing: 0.01em; }
  header p { margin: 0.1rem 0 0; font-size: 0.78rem; opacity: 0.88; }
  /* min-height pitää footerin aina taitteen alapuolella, joten näkymän
     sisällön asynkroninen latautuminen ei työnnä sitä näkyvistä (CLS) */
  main { max-width: 760px; margin: 0 auto; padding: 1rem; min-height: 100vh; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--pad-card);
    margin-bottom: 1rem;
  }
  h2 { font-size: 1.15rem; font-weight: var(--wmed); margin: 0 0 0.7rem; letter-spacing: 0.01em; }
  /* "Kaikki linjat": värillisten linjabadgejen ruudukko (joukkoliikennemäinen) */
  ul.route-grid {
    list-style: none; margin: 0.3rem 0 0; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 0.55rem;
  }
  .route-tile {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.5rem 0.6rem; min-height: 52px;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
    text-decoration: none; color: var(--text);
    transition: background 0.1s, border-color 0.1s;
  }
  .route-tile:hover { background: var(--hover); border-color: var(--rc, var(--blue)); }
  .rt-badge {
    flex: 0 0 auto; min-width: 2.7rem; padding: 0.3rem 0.5rem; border-radius: var(--radius-sm);
    text-align: center; font-weight: var(--wmed); font-size: 1.02rem; letter-spacing: 0.01em;
    background: var(--rc, var(--chip)); color: var(--rt, var(--text));
  }
  .rt-name { font-size: 0.82rem; line-height: 1.2; color: var(--muted);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow-wrap: anywhere; }
  /* Vuorokuormitus: värillinen piste emojin tilalle (aria-label säilyttää merkityksen) */
  .occ-dot { display: inline-block; width: 0.72em; height: 0.72em; border-radius: 50%;
    vertical-align: -0.04em; margin-left: 0.15em; }
  .occ-low { background: #1a8a3a; } .occ-mid { background: #b58900; }
  .occ-high { background: #cf6a00; } .occ-full { background: #c0392b; }
  /* Esteettömyys: pysäkkimerkki + "vain esteettömät" -suodatin */
  .acc-mark { color: var(--blue); }
  .acc-mark .ic, .occ-ico .ic { vertical-align: -0.18em; }
  .acc-toggle { display: inline-flex; align-items: center; gap: 0.45rem; margin: 0 0 0.7rem;
    font-size: 0.92rem; cursor: pointer; }
  .acc-toggle input { width: auto; min-height: auto; margin: 0; }
  /* Lähestyvä bussi -hälytys */
  .approach-banner { margin: 0.2rem 0 0.6rem; padding: 0.6rem 0.8rem; border-radius: 10px;
    background: var(--rt-bg); color: var(--rt-text); border: 1px solid var(--rt-text); font-size: 0.95rem; }
  button.secondary.armed { border-color: var(--blue); color: var(--blue);
    background: var(--hover); font-weight: 600; }
  /* Jäsennelty footer (linkkisarakkeet + lähde + varauma) */
  .foot-cols { max-width: 760px; margin: 0 auto; display: grid;
    grid-template-columns: 1.7fr 1fr 1fr; gap: 1.3rem; }
  .foot-brand { display: flex; gap: 0.6rem; align-items: flex-start; }
  .foot-brand img { border-radius: 8px; flex-shrink: 0; }
  .foot-brand strong { color: var(--text); }
  .foot-col h4 { margin: 0 0 0.4rem; font-size: 0.78rem; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text); }
  .foot-col a { display: block; padding: 0.22rem 0; color: var(--blue); text-decoration: none; }
  .foot-col a:hover { text-decoration: underline; }
  .foot-note { max-width: 760px; margin: 1.2rem auto 0; padding-top: 1rem;
    border-top: 1px solid var(--border); }
  @media (max-width: 540px) {
    .foot-cols { grid-template-columns: 1fr 1fr; }
    .foot-brand { grid-column: 1 / -1; }
  }
  input[type="search"], input[type="password"], input[type="date"],
  input[type="datetime-local"], input[type="text"], select {
    font: inherit;
    padding: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 100%;
    min-height: 44px;
    background: var(--card);
    color: var(--text);
  }
  select, input[type="datetime-local"] { width: auto; }
  .field { margin: 0.5rem 0; }
  .field > label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.15rem; }
  .suggest { position: relative; }
  .suggest-list {
    position: absolute;
    left: 0; right: 0; top: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    max-height: 15rem;
    overflow: auto;
    z-index: 500;
  }
  button {
    font: inherit;
    font-weight: var(--wmed);
    padding: 0.5rem 0.95rem;
    min-height: 44px;            /* riittävä kosketuskohde (myös ikäihmisille) */
    border: none;
    border-radius: var(--radius-sm);
    background: var(--btn-bg);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--btn-hover); }
  button.linkish {
    background: none;
    color: var(--blue);
    padding: 0.2rem 0.4rem;
    min-height: auto;
    text-decoration: underline;
  }
  a.btnlink {
    display: inline-flex; align-items: center; gap: 0.4rem; font: inherit; font-weight: var(--wmed);
    padding: 0.5rem 0.95rem; min-height: 44px; box-sizing: border-box;
    border-radius: var(--radius-sm); background: var(--btn-bg); color: #fff; text-decoration: none;
  }
  a.btnlink:hover { background: var(--btn-hover); }
  /* Toissijainen (outline) painike: erottaa avustavat toiminnot ensisijaisesta */
  button.secondary, a.btnlink.secondary {
    background: transparent; color: var(--blue); border: 1.5px solid var(--border);
  }
  button.secondary:hover, a.btnlink.secondary:hover {
    background: var(--hover); border-color: var(--blue);
  }
  /* Pysäkkimonitori / kioski: koko ruudun live-lähtötaulu isolla fontilla */
  body.monitor-mode header, body.monitor-mode #appFooter { display: none; }
  body.monitor-mode main { max-width: none; padding: 0; }
  .monitor { min-height: 100vh; display: flex; flex-direction: column;
    padding: clamp(0.8rem, 2.5vw, 2rem); box-sizing: border-box; }
  .m-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    border-bottom: 3px solid var(--blue); padding-bottom: 0.5rem; margin-bottom: 0.4rem; }
  .m-title { font-size: clamp(1.4rem, 4.5vw, 3rem); font-weight: var(--wmed); line-height: 1.1; }
  .m-code { color: var(--muted); font-weight: var(--wmed); font-size: 0.6em; }
  .m-clock { font-size: clamp(1.4rem, 4.5vw, 3rem); font-weight: var(--wmed);
    font-variant-numeric: tabular-nums; color: var(--blue); }
  .m-table { width: 100%; border-collapse: collapse; }
  .m-table thead th { text-align: left; font-size: clamp(0.75rem, 1.8vw, 1.1rem);
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 0 0.4rem 0.3rem; }
  .m-table td { font-size: clamp(1.2rem, 3.6vw, 2.6rem); font-weight: var(--wmed);
    padding: clamp(0.3rem, 1.2vw, 0.7rem) 0.4rem; border-bottom: 1px solid var(--border); }
  .m-line { width: 1%; white-space: nowrap; }
  .monitor .badge { font-size: clamp(1.1rem, 3.4vw, 2.3rem); padding: 0.1em 0.45em; }
  .m-dest { overflow: hidden; text-overflow: ellipsis; }
  td.m-when { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: var(--wmed); }
  .m-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; padding-top: 0.8rem; flex-wrap: wrap; }
  a.m-exit { color: var(--blue); text-decoration: none; padding: 0.5rem 0.9rem;
    border: 1px solid var(--border); border-radius: 8px; }
  .row { display: flex; gap: 0.5rem; align-items: center; }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { border-top: 1px solid var(--border); }
  ul.plain li:first-child { border-top: none; }
  li.search-cat { padding: 0.5rem 0.75rem 0.2rem; font-size: 0.72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  a.item, button.item {
    display: flex;
    gap: 0.75rem;
    align-items: baseline;
    width: 100%;
    text-align: left;
    padding: 0.55rem 0.25rem;
    min-height: 44px;
    background: none;
    border: none;
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
    font: inherit;
  }
  a.item, button.item { transition: background 0.12s; border-radius: 6px; }
  a.item:hover, button.item:hover { background: var(--hover); }
  .badge {
    display: inline-block;
    min-width: 2.4em;
    text-align: center;
    background: var(--btn-bg);
    color: #fff;
    border-radius: var(--radius-sm);
    padding: 0.1rem 0.45rem;
    font-weight: var(--wmed);
    font-size: 0.95rem;
    flex-shrink: 0;
  }
  .muted { color: var(--muted); font-size: 0.9rem; }
  a.badge { text-decoration: none; }
  button.star {
    background: none;
    color: var(--star);
    font-size: 1.3rem;
    line-height: 1;
    padding: 0 0.3rem;
    float: right;
  }
  button.star:hover { background: none; }
  button.star[aria-pressed="false"] { color: var(--border); }
  h3.stophead {
    font-size: 0.98rem;
    margin: 0.85rem 0 0.15rem;
    display: flex;
    gap: 0.5rem;
    align-items: baseline;
  }
  h3.stophead a { color: var(--text); text-decoration: none; }
  h3.stophead a:hover { color: var(--blue); text-decoration: underline; }
  .dist {
    background: var(--chip);
    color: var(--muted);
    border-radius: var(--pill);
    padding: 0.1rem 0.6rem;
    font-size: 0.74rem;
    white-space: nowrap;
  }
  details.alertsum { border-left: 4px solid var(--sev-warning); }
  details.alertsum summary { cursor: pointer; padding: 0.1rem 0; }
  details.alertsum[open] summary { margin-bottom: 0.3rem; }
  .tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0; }
  .tabs button {
    background: var(--chip);
    color: var(--text);
    font-size: 0.85rem;
  }
  .tabs button[aria-pressed="true"] { background: var(--btn-bg); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--border); }
  th { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  table.deps th:last-child, table.deps td:last-child {
    white-space: nowrap;
    text-align: right;
    font-weight: 600;
  }
  table.deps td:first-child { width: 3em; }
  tbody tr:last-child td { border-bottom: none; }
  .rt { color: var(--green); font-weight: var(--wmed); }
  .remind { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin: 0.2rem 0 0.5rem; }
  .remind select { font: inherit; padding: 0.2rem; }
  .timegrid { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .timegrid span {
    background: var(--chip);
    border-radius: 5px;
    padding: 0.28rem 0.6rem;
    font-size: 1.05rem;
    font-variant-numeric: tabular-nums;
  }
  .timegrid span.past { background: none; color: var(--muted); border: 1px solid var(--border); }
  .timegrid span.rt { background: var(--rt-bg); color: var(--rt-text); font-weight: 600; }
  /* Linjanäkymä: suunta yhdellä rivillä + vaihtonappi */
  .dir-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin: 0.6rem 0; }
  .dir-label { color: var(--muted); }
  .dir-current { font-size: 1.05rem; }
  #dirSwap { padding: 0.4rem 0.7rem; }
  /* Pysäkkiaikajana: pisteet + yhdistävä viiva + seuraava lähtöaika per pysäkki */
  .stop-timeline { list-style: none; margin: 0.4rem 0 0; padding: 0; }
  .stl-item { position: relative; display: flex; align-items: baseline; gap: 0.6rem; padding: 0.35rem 0 0.35rem 1.5rem; }
  .stl-item::before { content: ""; position: absolute; left: 0.42rem; top: 0; bottom: 0; width: 2px; background: var(--border); }
  .stl-item:first-child::before { top: 0.65rem; }
  .stl-item:last-child::before { bottom: auto; height: 0.65rem; }
  .stl-dot { position: absolute; left: 0; top: 0.5rem; width: 0.85rem; height: 0.85rem; border-radius: 50%;

  .stl-name { flex: 1; }
  .stl-time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.92rem; }
  /* Tyhjän päivän ohjaus: näytetään seuraavan liikennöintipäivän lähdöt, ei tyhjää */
  .redirect-note { display: flex; align-items: center; gap: 0.4rem; background: var(--chip);
    border-radius: var(--radius-sm); padding: 0.5rem 0.7rem; margin: 0 0 0.6rem; }
  /* Linjasivun häiriöt: auki ja korostettuna (ei pelkän ▶ takana) */

  #routeAlerts .alert.sev-SEVERE { border-left-color: var(--sev-severe); }
  /* Koko aikataulu pysäkeittäin -matriisi: pysäkit riveinä, vuorot sarakkeina.
     Ruudulla vieritettävä laatikko, tulostuksessa koko taulukko näkyviin. */
  .matrix-wrap { overflow: auto; max-height: 65vh; margin: 0.5rem 0; border: 1px solid var(--border); border-radius: 6px; }
  table.stoptable { border-collapse: collapse; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  table.stoptable th, table.stoptable td { border: 1px solid var(--border); padding: 0.25rem 0.5rem; text-align: center; white-space: nowrap; }
  table.stoptable thead th { position: sticky; top: 0; background: var(--chip); z-index: 2; }
  table.stoptable th[scope="row"] { position: sticky; left: 0; background: var(--card); text-align: left; font-weight: 500; z-index: 1; }
  table.stoptable thead th:first-child { left: 0; z-index: 3; }
  table.stoptable tbody tr:nth-child(even) td { background: var(--hover); }
  /* Tulostusvihko: harvempi pysäkkijoukko, hieman isompi luettava fontti */
  table.booklet { font-size: 0.95rem; }
  table.booklet th, table.booklet td { padding: 0.3rem 0.6rem; }
  .booklet-line h3 { font-size: 1rem; margin: 0.6rem 0 0.2rem; }

  .booklet-toc h3 { font-size: 1rem; margin: 0 0 0.3rem; }

  .booklet-toc li { break-inside: avoid; }
  h4.daytype { font-size: 0.92rem; font-weight: 600; margin: 0.5rem 0 0.15rem; }
  /* Pysäkkijuliste: linjat tuntikaavioina, vierekkäin kun tilaa */
  .poster-sub { font-weight: var(--wmed); margin: 0.1rem 0 0.5rem; }
  .poster-lines { display: flex; flex-wrap: wrap; gap: 0.8rem 1.6rem; align-items: flex-start; }
  .poster-line { break-inside: avoid; min-width: 11rem; }
  .poster-line h4 { display: flex; align-items: center; gap: 0.4rem; margin: 0 0 0.2rem; font-size: 0.95rem; }
  table.hourgrid { border-collapse: collapse; width: auto; }
  table.hourgrid th[scope="row"] { text-align: right; padding: 0.1rem 0.5rem 0.1rem 0; color: var(--muted);
    font-weight: 700; font-variant-numeric: tabular-nums; vertical-align: top; }
  table.hourgrid td { padding: 0.1rem 0; font-variant-numeric: tabular-nums; letter-spacing: 0.05em; }
  /* QR-koodit (näyttö + juliste) */
  .embedbox { margin: 0.5rem 0; display: flex; flex-direction: column; gap: 0.5rem; }
  .embed-field { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.85rem; color: var(--muted); }
  .embed-field input, .embed-field textarea { font: inherit; font-size: 0.85rem; padding: 0.4rem;
    border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--text);
    width: 100%; box-sizing: border-box; resize: vertical; }
  .qrbox { margin: 0.6rem 0 0; display: flex; flex-direction: column; align-items: flex-start; gap: 0.2rem; }
  canvas.qrimg { width: 200px; height: 200px; image-rendering: pixelated;

  .poster-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .poster-qrwrap { text-align: center; flex: none; }
  img.poster-qr { width: 120px; height: 120px; image-rendering: pixelated; display: block; }
  .poster-qrcap { font-size: 0.7rem; color: var(--muted); }
  .dtopt { display: inline-flex; align-items: center; gap: 0.35rem; cursor: pointer; }
  .dtopt input { width: 1.3rem; height: 1.3rem; }
  /* Kokoa-painike pysyy näkyvissä pitkää linjalistaa selatessa */
  .buildbar {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    margin: 0; padding: 0.5rem 0;
    background: var(--card); border-bottom: 1px solid var(--border);
  }
  .error { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); padding: 0.6rem; border-radius: 6px; }
  details.alert {

  }
  details.alert summary { cursor: pointer; font-weight: var(--wmed); }
  .alert-src { font-weight: 400; font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
  details.alert p { margin: 0.4rem 0 0.2rem; white-space: pre-line; font-size: 0.9rem; }
  details.alert.sev-SEVERE { border-left-color: var(--sev-severe); }
  details.alert.sev-WARNING { border-left-color: var(--sev-warning); }
  ul.ex-list { list-style: none; padding: 0; margin: 0.6rem 0 0; }
  li.ex-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0; border-top: 1px solid var(--border); }
  li.ex-row:first-child { border-top: none; }
  .ex-date { flex: 0 0 auto; min-width: 8.5rem; }
  .ex-name { flex: 1 1 auto; font-weight: var(--wmed); }
  .ex-tag { flex: 0 0 auto; font-size: 0.78rem; padding: 0.15rem 0.5rem; border-radius: 999px; background: var(--sev-warning); color: #1a1200; white-space: nowrap; }
  .ex-tag.ex-eve { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  p.co2 { margin: 0.3rem 0 0.1rem; font-size: 0.88rem; color: #1e7d3a; }
  html[data-theme="dark"] p.co2 { color: #5fd07f; }
  #fbForm label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0.6rem 0 0.15rem; }
  #fbForm select { width: 100%; }
  #fbForm textarea { font: inherit; padding: 0.5rem; border: 1px solid var(--border); border-radius: 6px;
    width: 100%; background: var(--card); color: var(--text); resize: vertical; }
  #fbForm button[type="submit"] { margin-top: 0.8rem; }
  #fbStatus { margin: 0.6rem 0 0; }
  #fbStatus.ok-msg { color: #1e7d3a; font-weight: 600; }
  html[data-theme="dark"] #fbStatus.ok-msg { color: #5fd07f; }
  .map { height: clamp(340px, 55vh, 540px); border-radius: 6px; margin: 0.5rem 0; z-index: 0; }
  .map-small { height: clamp(220px, 35vh, 340px); }
  .bigmap { height: clamp(400px, 78vh, 900px); }
  a.badgelink { text-decoration: none; }
  .bus-live-wrap { background: none; border: none; }
  .bus-live { display: flex; width: 28px; height: 28px; align-items: center; justify-content: center;
    border: 2px solid #fff; border-radius: 50%; font-weight: var(--wmed); font-size: 0.66rem;
    box-sizing: border-box; }
  /* Keskusterminaalien laituritunnukset kartalla */
  .plat-marker-wrap { background: none; border: none; }
  .plat-marker { display: flex; min-width: 30px; height: 30px; padding: 0 6px; align-items: center;
    justify-content: center; background: var(--blue); color: #fff; border: 2px solid #fff;
    border-radius: var(--radius-sm); font-weight: var(--wmed); font-size: 0.85rem; box-sizing: border-box; }
  .plat-list { list-style: none; padding: 0; margin: 0.5rem 0 0; display: grid; gap: 0.5rem; }
  .plat-item { border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 0.75rem; }
  .plat-item .plat-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .plat-name { font-weight: var(--wmed); }
  .plat-item .plat-head > a { margin-left: auto; }
  .plat-tag { display: inline-flex; min-width: 1.8rem; height: 1.8rem; padding: 0 0.45rem;
    align-items: center; justify-content: center; background: var(--blue); color: #fff;
    border-radius: var(--radius-sm); font-weight: var(--wmed); }
  .plat-lines { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.4rem; }
  .plat-tabs { flex-wrap: wrap; }
  /* Liput ja hinnat */
  .notice { background: var(--rt-bg); border-left: 4px solid var(--green); border-radius: 6px;
    padding: 0.6rem 0.8rem; margin: 0.4rem 0 0.9rem; }
  .notice p { margin: 0.3rem 0 0; }
  .fare-wrap { overflow-x: auto; margin: 0.3rem 0 0.5rem; }
  table.fare { width: 100%; border-collapse: collapse; }
  table.fare th, table.fare td { padding: 0.4rem 0.55rem; border-bottom: 1px solid var(--border); text-align: left; }
  table.fare thead th { font-size: 0.8rem; color: var(--muted); font-weight: 600; vertical-align: bottom; }
  table.fare tbody th { font-weight: var(--wmed); }
  table.fare td { font-variant-numeric: tabular-nums; white-space: nowrap; }
  ul.bullets { margin: 0.3rem 0; padding-left: 1.2rem; }
  ul.bullets li { margin: 0.2rem 0; }
  .fares-source { margin-top: 0.9rem; font-size: 0.85em; }
  /* Tallennetut matkat */
  .saved-trip { border-top: 1px solid var(--border); padding: 0.2rem 0 0.4rem; }
  .saved-trip:first-child { border-top: none; }
  .saved-row { display: flex; align-items: center; gap: 0.5rem; }
  .saved-row a.item { flex: 1; }
  .saved-next { margin: 0.1rem 0 0 0.4rem; }
  .saved-next .badge { vertical-align: middle; }
  .leaflet-popup-content a { color: var(--blue); }
  .bus-marker {
    background: #b34700;
    color: #fff;
    border: 2px solid #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: var(--wmed);
    font-size: 0.68rem;
  }
  details.itin {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.7rem 0.85rem;
    margin: 0.55rem 0;
    background: var(--card);
    transition: border-color 0.15s;
  }
  details.itin:hover { border-color: var(--blue); }
  details.itin[open] { border-color: var(--blue); }
  details.itin summary { cursor: pointer; list-style: none; position: relative; padding-right: 1.4rem; }
  details.itin summary::-webkit-details-marker { display: none; }
  details.itin summary::after {
    content: "▾";
    position: absolute;
    right: 0.1rem;
    top: 0.1rem;
    color: var(--muted);
    transition: transform 0.15s;
  }
  details.itin[open] summary::after { transform: rotate(180deg); }
  .itin-head { display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; align-items: baseline; }
  .itin-head .times { font-weight: var(--wmed); font-variant-numeric: tabular-nums; font-size: 1.02rem; }
  .legchips { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; margin-top: 0.25rem; }
  .legchips .sep { color: var(--muted); }
  .legchips button.badge { border: none; cursor: pointer; padding: 0.15rem 0.5rem; }
  .legchips button.badge[aria-pressed="true"] { outline: 3px solid var(--blue); outline-offset: 2px; }
  #stopRoutes.filtered button.badge[aria-pressed="false"] { opacity: 0.4; }
  /* Suhteellinen osuuspalkki: legien leveys = kesto */
  .legbar { display: flex; gap: 2px; margin-top: 0.4rem; height: 1.5rem; border-radius: 7px; overflow: hidden; }
  .legbar .seg {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.78rem;
    font-weight: var(--wmed);
    color: #fff;
    min-width: 0.9rem;
    overflow: hidden;
    white-space: nowrap;
  }
  .legbar .seg.walk {
    background: var(--chip);
    color: var(--text);
  }
  /* Pystyaikajana reittiohjeille */
  .tl { margin: 0.7rem 0 0.2rem; }
  .tl-row {
    display: grid;
    grid-template-columns: 3.3rem 1.1rem 1fr;
    column-gap: 0.6rem;
  }
  .tl-time {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: var(--wmed);
    font-size: 0.9rem;
    padding-top: 0.05rem;
  }
  .tl-mid { position: relative; }
  .tl-row.pt .tl-mid::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 0.3rem;
    width: 0.66rem;
    height: 0.66rem;
    border-radius: 50%;
    background: var(--card);
    border: 3px solid var(--blue);
    transform: translateX(-50%);
    z-index: 1;
    box-sizing: border-box;
  }
  .tl-row.pt.start .tl-mid::after { border-color: var(--green); }
  .tl-row.pt.end .tl-mid::after { border-color: var(--sev-severe); }
  .tl-row.leg .tl-mid::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -0.5rem;
    bottom: -0.5rem;
    width: 5px;
    transform: translateX(-50%);

    border-radius: 3px;
  }
  .tl-row.leg.dashed .tl-mid::before {

    border-left: 4px dotted var(--rail, var(--muted));

    border-radius: 0;

  .tl-body { padding: 0.05rem 0 0.7rem; min-width: 0; }
  .tl-row.leg .tl-body { padding: 0.35rem 0 0.9rem; font-size: 0.92rem; }
  details.tl-stops { margin-top: 0.15rem; }

  details.tl-stops ul { list-style: none; margin: 0.25rem 0 0; padding: 0 0 0 0.2rem; }
  details.tl-stops li { font-size: 0.85rem; color: var(--muted); padding: 0.1rem 0; }
  nav.crumb { margin-bottom: 0.75rem; font-size: 0.9rem; }
  nav.crumb a { color: var(--blue); }
  footer { margin-top: 2rem; padding: 1.6rem 1rem 2rem; font-size: 0.82rem; color: var(--muted);
    background: var(--card); border-top: 1px solid var(--border); }
  /* Palvelutiski-tila: koko ruudun työntekijän näyttö. Pakotettu kirkas korkea
     kontrasti — .desk ylikirjoittaa tokenit, joten ilme on sama riippumatta teemasta. */
  body.desk-mode header, body.desk-mode #appFooter { display: none; }
  body.desk-mode main { max-width: none; padding: 0; }
  .desk {
    --bg: #ffffff; --card: #ffffff; --text: #111111; --muted: #2f2f2f;
    --border: #1a1a1a; --hover: #eaf0fb; --chip: #e7edf6;
    --blue: #0033cc; --btn-bg: #0033cc; --btn-hover: #001f99;
    --rt-bg: #d6f0d6; --rt-text: #00540f;
    background: #ffffff; color: #111111; min-height: 100vh; box-sizing: border-box;
    padding: clamp(1rem, 2.2vw, 2.2rem);
    font-size: clamp(1.05rem, 1.35vw, 1.3rem);
  }
  .desk-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem;

  .desk-top h1 { margin: 0; font-size: clamp(1.5rem, 2.6vw, 2.4rem); font-weight: var(--wmed); }

  @media (max-width: 820px) { .desk-grid { grid-template-columns: 1fr; } }
  .desk-col { border: 2px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.2rem; background: #fff; }
  .desk-col h2 { font-size: clamp(1.2rem, 1.9vw, 1.6rem); }
  .desk-field { margin: 0 0 0.9rem; }
  .desk-field label { display: block; font-weight: var(--wmed); margin-bottom: 0.3rem; }
  .desk input[type="text"] { font-size: 1.15em; min-height: 60px; border: 2px solid var(--border); }
  .desk .suggest-list { border: 2px solid var(--border); }
  .desk .suggest-list .item { padding: 0.7rem 0.5rem; min-height: 52px; font-size: 1.02em; }
  .desk-h3 { font-size: clamp(1.1rem, 1.7vw, 1.4rem); margin: 1.1rem 0 0.4rem; font-weight: var(--wmed); }
  /* "Kerro asiakkaalle": korostettu, iso, ääneen luettava suositus */
  .desk-tell { border: 3px solid var(--blue); border-radius: var(--radius); padding: 1rem 1.2rem;
    margin: 0.4rem 0 0.7rem; background: #eef4ff; }
  .desk-tell-h { font-size: 0.8em; font-weight: var(--wmed); text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--blue); }
  .desk-tell-body { font-size: clamp(1.2rem, 2vw, 1.7rem); line-height: 1.4; margin: 0.35rem 0 0; }
  /* "Seuraava bussi" -kortti: kun kävely on nopein mutta asiakas kysyi bussia (rauhallinen korostus) */
  .desk-next-bus { border: 2px solid var(--blue); border-left-width: 6px; border-radius: var(--radius);
    padding: 0.85rem 1.1rem; margin: 0.2rem 0 0.7rem; background: var(--card); }
  .desk-next-bus--none { border-color: var(--border); border-left-color: var(--muted); }
  .desk-next-bus-h { font-size: 0.8em; font-weight: var(--wmed); text-transform: uppercase;

  .desk-next-bus-h .ic { width: 1.2em; height: 1.2em; }

  .desk-next-bus-body .badge { font-size: 1em; padding: 0.15rem 0.55rem; }
  .desk-opt { border: 2px solid var(--border); border-radius: var(--radius); padding: 0.8rem 1rem; margin: 0.5rem 0; }
  .desk-opt-top { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; align-items: baseline; }
  .desk-opt-time { font-size: 1.3em; font-weight: var(--wmed); font-variant-numeric: tabular-nums; }
  .desk-opt-dur { font-weight: var(--wmed); }
  .desk-opt-lines { margin: 0.45rem 0; display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
  .desk-opt-lines .badge { font-size: 1.05em; }
  details.desk-stops summary { cursor: pointer; color: var(--blue); font-weight: var(--wmed); margin-top: 0.2rem; }
  ul.desk-stoplist { list-style: none; margin: 0.4rem 0 0; padding: 0; }

  ul.desk-stoplist li:last-child { border-bottom: none; }

  /* Inline-ikonit: kokoa em:nä → skaalautuu tekstikoon mukaan, väri perii currentColorin */

  h1 .ic, h2 .ic, h3 .ic { color: var(--blue); margin-right: 0.1rem; }

  /* Työkalut: hillitty, sekundaarinen ikonirivi (pienemmät kuin hero/lähimmät) */

  .tool { display: flex; align-items: center; gap: 0.55rem; padding: 0.7rem 0.8rem;

  /* Luonnollisen kielen älykenttä + mikrofoni */

let lang = localStorage.getItem("lang") || "fi";
if (!STRINGS[lang]) lang = "fi";

// Kuntalaiselle näkyvä joukkoliikenneverkon ilmaus (esim. "Kajaanin joukkoliikenteessä").
// Oletus johdetaan kaupungin genetiivistä/nimestä; CONFIG.network (per kieli) ylikirjoittaa
// (Lahti käyttää "seudun"-muotoa). Käytetään {network}-placeholderissa, esim. homeIntro.
function networkPhrase() {
  if (CONFIG.network && CONFIG.network[lang]) return CONFIG.network[lang];
  if (CONFIG.network && CONFIG.network.fi) return CONFIG.network.fi;
  if (lang === "en") return CONFIG.city + " public transport";
  if (lang === "sv") return CONFIG.city + " kollektivtrafik";
  return CONFIG.cityGenitive + " joukkoliikenteessä";
}

function t(key, params) {
  let s = STRINGS[lang][key] ?? STRINGS.fi[key] ?? key;
  const all = { city: CONFIG.city, cityGen: CONFIG.cityGenitive,
                operator: CONFIG.operator, operatorShort: CONFIG.operatorShort,
                network: networkPhrase(), ...params };
  return s.replace(/\{(\w+)\}/g, (_, k) => all[k] ?? "");
}

let apiKey = localStorage.getItem("digitransitKey") || "";
// "feedId" on nykyinen avain; "lslFeedId" luetaan migraationa vanhoilta kävijöiltä
let feedId = localStorage.getItem(ns("feedId")) || (NS ? "" : localStorage.getItem("lslFeedId")) || "";

/* ---------- API ---------- */

async function gql(query, variables) {
  const headers = { "Content-Type": "application/json" };
  if (!PROXY_URL) headers["digitransit-subscription-key"] = apiKey;
  const res = await fetch(API_URL, {
    method: "POST",
    headers,
    body: JSON.stringify({ query, variables }),
  });
  if (res.status === 401 || res.status === 403) {
    throw new Error(t("errApiKey"));
  }
  if (!res.ok) throw new Error(t("errApi") + "HTTP " + res.status);
  const json = await res.json();
  if (json.errors) throw new Error(t("errApi") + json.errors.map(e => e.message).join("; "));
  return json.data;
}

/* ---------- Offline-välimuisti: viimeksi nähty data ---------- */

function cachePut(key, data) {
  const write = () =>
    localStorage.setItem(ns("cache:" + key), JSON.stringify({ ts: Date.now(), data }));
  try { write(); } catch (e) {
    // localStorage täynnä: tyhjennä välimuisti ja yritä kerran uudelleen
    try {
      for (const k of Object.keys(localStorage)) {
        if (k.includes("cache:")) localStorage.removeItem(k);
      }
      write();
    } catch (e2) { /* ilman välimuistia pärjätään */ }
  }
}

function cacheGet(key) {
  try {
    const hit = JSON.parse(localStorage.getItem(ns("cache:" + key)) || "null");
    return hit && hit.data ? hit : null;
  } catch (e) { return null; }
}

// Onnistunut haku tallennetaan; virheen sattuessa palautetaan viimeksi
// nähty versio. cachedAt != null kertoo näkymälle, että data on vanhaa.
async function cachedGql(key, query, variables) {
  try {
    const data = await gql(query, variables);
    cachePut(key, data);
    return { data, cachedAt: null };
  } catch (err) {
    const hit = cacheGet(key);
    if (hit) return { data: hit.data, cachedAt: hit.ts };
    throw err;
  }
}

function staleNoteHtml(ts) {
  const d = new Date(ts);
  const time = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const sameDay = d.toDateString() === new Date().toDateString();
  const when = sameDay ? time
    : t("dateAt", { date: d.toLocaleDateString(lang === "fi" ? "fi-FI" : lang === "sv" ? "sv-FI" : "en-GB"), time });
  return `<p class="muted">${icon("warning")} ${t("staleNote", { when })}</p>`;
}

// Käynnistyssiivous: vanhentuneet ja ylimääräiset cache-avaimet pois
(function cleanCache() {
  try {
    const entries = [];
    for (const k of Object.keys(localStorage)) {
      if (!k.includes("cache:")) continue;
      try {
        const v = JSON.parse(localStorage.getItem(k));
        if (!v?.ts || Date.now() - v.ts > 7 * 24 * 3600 * 1000) localStorage.removeItem(k);
        else entries.push([k, v.ts]);
      } catch (e) { localStorage.removeItem(k); }
    }
    entries.sort((a, b) => a[1] - b[1]);
    while (entries.length > 30) localStorage.removeItem(entries.shift()[0]);
  } catch (e) { /* localStorage estetty: ohitetaan */ }
})();

async function findFeed() {
  if (feedId) return feedId;
  const data = await gql(`{ feeds { feedId publisher { name } } }`);
  const hit = data.feeds.find(f =>
    CONFIG.feedMatch.test(f.feedId) || CONFIG.feedMatch.test(f.publisher?.name || ""));
  if (!hit) throw new Error(t("errFeedNotFound"));
  feedId = hit.feedId;
  localStorage.setItem(ns("feedId"), feedId);
  return feedId;
}

// Edustavat tulevat päivät (Ti/To/La/Su seuraavan viikon sisällä). Riittää
// erottamaan liikennöivät linjat kausi-/koululinjoista joilla ei ole vuoroja nyt.
function activeProbeDates() {
  const want = new Set([2, 4, 6, 0]); // getDay: Ti=2, To=4, La=6, Su=0
  const out = [], base = new Date();
  for (let i = 0; i < 8 && want.size; i++) {
    const d = new Date(base.getFullYear(), base.getMonth(), base.getDate() + i);
    if (want.has(d.getDay())) {
      out.push(`${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`);
      want.delete(d.getDay());
    }
  }
  return out;
}

async function loadRoutes() {
  if (routesCache) return routesCache;
  try {
    const cached = JSON.parse(localStorage.getItem(ns("routesCache3")) || "null");
    if (cached && Date.now() - cached.ts < 24 * 3600 * 1000 && cached.routes?.length) {
      routesCache = cached.routes;
      return routesCache;
    }
  } catch (e) { /* rikkinäinen välimuisti ohitetaan */ }
  const feed = await findFeed();
  // Haetaan linjat + tarkistetaan vuorojen olemassaolo edustavina päivinä samalla
  // kyselyllä, jotta linjalista vastaa LSL:ää: ei näytetä linjoja joilla ei ole
  // tulevia lähtöjä (esim. talvi-/koululinjat kesällä).
  const dates = activeProbeDates();
  const aliases = dates.map((d, i) => `d${i}: tripsForDate(serviceDate: "${d}") { gtfsId }`).join(" ");
  const data = await gql(
    `query ($feeds: [String]) {
       routes(feeds: $feeds) { gtfsId shortName longName mode color textColor patterns { ${aliases} } }
     }`, { feeds: [feed] });
  const tripCount = r => (r.patterns || []).reduce((n, p) => n + dates.reduce((m, _, i) => m + (p["d" + i] || []).length, 0), 0);
  const isActive = r => tripCount(r) > 0;
  // varakeino: jos jostain syystä mikään linja ei näytä aktiiviselta, näytetään kaikki
  const anyActive = (data.routes || []).some(r => r.mode === "BUS" && isActive(r));
  const buses = (data.routes || []).filter(r => r.mode === "BUS").filter(r => !anyActive || isActive(r));
  // Dedup: sama linja voi olla feedissä kahdesti eri liikennöitsijällä (esim. 23
  // Koiviston Auto + Vekka, identtiset vuorot = liikennöitsijävaihdoksen duplikaatti).
  // Pidetään samannimisistä (shortName+longName) eniten vuoroja sisältävä → ei tuplaa.
  const byKey = new Map();
  for (const r of buses) {
    const k = (r.shortName || "") + "|" + (r.longName || "");
    const prev = byKey.get(k);
    if (!prev || tripCount(r) > tripCount(prev)) byKey.set(k, r);
  }
  routesCache = [...byKey.values()]
    .map(r => ({ gtfsId: r.gtfsId, shortName: r.shortName, longName: r.longName, mode: r.mode, color: r.color, textColor: r.textColor }))
    .sort((a, b) => (a.shortName || "").localeCompare(b.shortName || "", "fi", { numeric: true }));
  try {
    localStorage.setItem(ns("routesCache3"), JSON.stringify({ ts: Date.now(), routes: routesCache }));
  } catch (e) { /* täysi localStorage ei ole este */ }
  return routesCache;
}

/* ---------- Helpers ---------- */

function fmtSec(sec) {
  const h = Math.floor(sec / 3600) % 24;
  const m = Math.floor((sec % 3600) / 60);
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
}

// Lähtöajan esitys: "nyt" / "5 min" / "14:32"; rt = reaaliaikainen arvio
function depInfo(st) {
  const dep = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
  const epoch = (st.serviceDay + dep) * 1000;
  const mins = Math.round((epoch - Date.now()) / 60000);
  const when = mins <= 0 ? t("depNow") : mins < 60 ? t("depMin", { n: mins }) : fmtSec(dep);
  return { when, rt: !!st.realtime };
}

function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function isoOf(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

// "2026-06-14" -> luettava päivämäärä valitulla kielellä (paikallinen
// aika, ei UTC-siirtymää: komponentit puretaan käsin)
function fmtDateLong(iso) {
  const [y, m, d] = (iso || "").split("-").map(Number);
  if (!y || !m || !d) return iso || "";
  const loc = lang === "fi" ? "fi-FI" : lang === "sv" ? "sv-FI" : "en-GB";
  return new Date(y, m - 1, d).toLocaleDateString(loc, {
    day: "numeric", month: "long", year: "numeric" });
}

// Suomen arkipyhät vuodelle (kiinteät + pääsiäispohjaiset + juhannus +
// pyhäinpäivä). Näinä päivinä joukkoliikenne ajaa usein poikkeusaikataulua,
// joten ne ohitetaan kun valitaan tulosteen "normaali" edustava päivä.
const _holCache = {};
function fiHolidays(year) {
  if (_holCache[year]) return _holCache[year];
  const set = new Set();
  const add = (m, d) => set.add(`${year}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`);
  [[1, 1], [1, 6], [5, 1], [12, 6], [12, 24], [12, 25], [12, 26], [12, 31]].forEach(([m, d]) => add(m, d));
  // Pääsiäinen (gregoriaaninen computus)
  const a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, mm = Math.floor((a + 11 * h + 22 * l) / 451),
    month = Math.floor((h + l - 7 * mm + 114) / 31), day = ((h + l - 7 * mm + 114) % 31) + 1;
  const easter = new Date(year, month - 1, day);
  const addD = n => { const x = new Date(easter); x.setDate(easter.getDate() + n); set.add(isoOf(x)); };
  [-2, 0, 1, 39, 49].forEach(addD); // pitkäperjantai, pääsiäissunnuntai, 2. pp, helatorstai, helluntai
  // Juhannus: lauantai 20.–26.6. + aatto (pe)
  for (let dd = 20; dd <= 26; dd++) { const dt = new Date(year, 5, dd); if (dt.getDay() === 6) { set.add(isoOf(dt)); const fr = new Date(dt); fr.setDate(dd - 1); set.add(isoOf(fr)); break; } }
  // Pyhäinpäivä: lauantai 31.10.–6.11.
  for (let dd = 31; dd <= 37; dd++) { const dt = new Date(year, 9, dd); if (dt.getDay() === 6) { set.add(isoOf(dt)); break; } }
  _holCache[year] = set;
  return set;
}
function isFiHoliday(iso) {
  return fiHolidays(+iso.slice(0, 4)).has(iso);
}

// Normaali edustava päivä annetusta päivästä eteenpäin: tyyppi (ma–pe/la/su)
// täsmää eikä päivä ole arkipyhä → tuloste näyttää normaalin kausivuoron,
// ei esim. juhannuslauantain "ei lähtöjä".
function normalDateForType(fromISO, key) {
  const d = new Date((fromISO || todayISO()) + "T12:00:00");
  for (let i = 0; i < 90; i++) {
    const dow = (d.getDay() + 6) % 7;
    const iso = isoOf(d);
    const match = key === "weekday" ? dow <= 4 : key === "sat" ? dow === 5 : dow === 6;
    if (match && !isFiHoliday(iso)) return iso;
    d.setDate(d.getDate() + 1);
  }
  return fromISO || todayISO();
}

// Edustavat päivät tulosteeseen (ma–pe/la/su): normaali kausivuoro
// viitepäivästä eteenpäin, arkipyhät ohittaen.
function dayTypeDates(refISO) {
  const base = refISO || todayISO();
  return [
    { key: "weekday", label: t("dayWeekday"), date: normalDateForType(base, "weekday") },
    { key: "sat", label: t("daySat"), date: normalDateForType(base, "sat") },
    { key: "sun", label: t("daySun"), date: normalDateForType(base, "sun") },
  ];
}

// Päivän tyyppi (ma–pe / la / su) ISO-päivästä
function dayTypeOf(iso) {
  const dow = (new Date(iso + "T12:00:00").getDay() + 6) % 7;
  return dow <= 4 ? "weekday" : dow === 5 ? "sat" : "sun";
}

// Linjasivun päivätyyppivälilehdet (Ma–Pe / La / Su): kullekin tyypille
// lähin päivä (tänään jos osuu tyyppiin → reaaliaika näkyy, muuten seuraava
// kyseinen viikonpäivä). active = nykyisen näytetyn päivän tyyppi.
function lineDayTabs(currentISO) {
  const today = todayISO();
  const todayType = dayTypeOf(today);
  const cur = dayTypeOf(currentISO);
  // Tämän päivän tyyppi käyttää tätä päivää (reaaliaika näkyy); muut tyypit
  // seuraavan normaalin (arkipyhät ohittavan) kyseisen päivän.
  return ["weekday", "sat", "sun"].map(key => ({
    key,
    label: t(key === "weekday" ? "dayWeekday" : key === "sat" ? "daySat" : "daySun"),
    date: key === todayType ? today : normalDateForType(today, key),
    active: key === cur,
  }));
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Ylätunnisteen brändiväritausta: pidä valkoinen teksti AA-luettavana (kontrasti ≥ 4.5)
// tummentamalla väriä tarvittaessa. Oletus vahva sininen; CONFIG.brandColor voi ylikirjoittaa
// (otetaan käyttöön vain varmennetulla värillä). Valkoisen (L=1) kontrasti = 1.05/(L+0.05).
function headerBgColor() {
  let hex = String(CONFIG.brandColor || "#0a4ea3").replace(/^#/, "");
  if (!/^[0-9a-fA-F]{6}$/.test(hex)) hex = "0a4ea3";
  let r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
  const toHex = () => [r, g, b].map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, "0")).join("");
  for (let i = 0; i < 40 && (1.05 / (relLum(toHex()) + 0.05)) < 4.5; i++) {
    r = Math.round(r * 0.9); g = Math.round(g * 0.9); b = Math.round(b * 0.9);
  }
  return "#" + toHex();
}

// Tämän näkymän jaettava absoluuttinen URL (säilyttää origin/polun/?city-parametrin)
function appUrl(hash) {

}

let qrLibPromise = null;
function loadQrLib() {
  if (window.qrcode) return Promise.resolve();
  if (!qrLibPromise) {
    qrLibPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "qrcode.js"; s.async = true;
      s.onload = () => resolve();
      s.onerror = () => { qrLibPromise = null; reject(new Error("qr")); };
      document.head.appendChild(s);
    });
  }
  return qrLibPromise;
}

// Piirtää QR:n canvasille (terävä, valittu pikselikoko). Hiljainen reuna 4 moduulia.
async function qrCanvas(text, px) {
  await loadQrLib();
  const qr = window.qrcode(0, "M");
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount();
  const margin = 4;
  const total = n + margin * 2;
  const scale = Math.max(2, Math.floor(px / total));
  const size = total * scale;
  const cv = document.createElement("canvas");
  cv.width = cv.height = size;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = "#000";
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++)
      if (qr.isDark(r, c)) ctx.fillRect((c + margin) * scale, (r + margin) * scale, scale, scale);
  return cv;
}

// QR PNG-data-URL:na (tulosteisiin upotettavaksi <img src>)
async function qrDataUrl(text, px) {
  return (await qrCanvas(text, px)).toDataURL("image/png");
}

// Liittää QR:n säiliöön + lataa PNG -linkin. caption = ohjeteksti, fileBase = tiedostonimi.
async function showQrInto(box, url, caption, fileBase) {
  box.innerHTML = `<p class="muted">${t("qrLoading")}</p>`;
  try {
    const cv = await qrCanvas(url, 320);
    box.innerHTML = "";
    cv.className = "qrimg";
    cv.setAttribute("role", "img");
    cv.setAttribute("aria-label", caption);
    box.appendChild(cv);
    const dl = document.createElement("a");
    dl.href = cv.toDataURL("image/png");
    dl.download = fileBase + ".png";
    dl.className = "btnlink";
    dl.style.marginTop = "0.5rem";
    dl.innerHTML = icon("download") + " " + esc(t("qrDownload"));
    const cap = document.createElement("p");
    cap.className = "muted";
    cap.textContent = caption;
    box.append(cap, dl);
  } catch (e) {
    box.innerHTML = `<div class="error">${esc(t("qrFail"))}</div>`;
  }
}

// Google encoded polyline, precision 1e-5 (OTP:n patternGeometry-muoto)
function decodePolyline(str) {
  let index = 0, lat = 0, lng = 0;
  const coords = [];
  while (index < str.length) {
    for (const which of [0, 1]) {
      let result = 0, shift = 0, b;
      do {
        b = str.charCodeAt(index++) - 63;
        result |= (b & 0x1f) << shift;
        shift += 5;
      } while (b >= 0x20);
      const delta = (result & 1) ? ~(result >> 1) : (result >> 1);
      if (which === 0) lat += delta; else lng += delta;
    }
    coords.push([lat / 1e5, lng / 1e5]);
  }
  return coords;
}

// Rajaa kartta AINA reitin/pysäkkien bboxiin (ei oletuszoomiin). Jos bbox puuttuu tai on
// virheellinen, fall back kaupungin keskipisteeseen — ei koskaan maailmanlaajuista näkymää.
function fitMap(map, bounds, fallbackLatLon) {
  try { map.invalidateSize(false); } catch (e) {}
  if (bounds && bounds.isValid && bounds.isValid()) {
    map.fitBounds(bounds, { padding: [20, 20], maxZoom: 16 });
    return;
  }
  // bbox puuttuu: aseta fallback-näkymä vain jos karttaa ei ole vielä keskitetty (makeMap ilman keskipistettä)
  try { map.getCenter(); } catch (e) { map.setView(fallbackLatLon || [AREA.focus.lat, AREA.focus.lon], 13); }
}

// Minimaalinen protobuf-kävelijä: riittää GTFS-RT VehiclePositionin
// koordinaattien poimintaan ilman riippuvuuksia
function pbParse(buf) {
  const out = [];
  let i = 0;
  while (i < buf.length) {
    let key = 0, shift = 0, b;
    do { b = buf[i++]; key |= (b & 0x7f) << shift; shift += 7; } while (b & 0x80);
    const field = key >>> 3, wire = key & 7;
    if (wire === 0) {
      do { b = buf[i++]; } while (b & 0x80);
      out.push({ field, wire });
    } else if (wire === 2) {
      let len = 0; shift = 0;
      do { b = buf[i++]; len |= (b & 0x7f) << shift; shift += 7; } while (b & 0x80);
      out.push({ field, wire, bytes: buf.subarray(i, i + len) }); i += len;
    } else if (wire === 5) { out.push({ field, wire, bytes: buf.subarray(i, i + 4) }); i += 4; }
    else if (wire === 1) { out.push({ field, wire, bytes: buf.subarray(i, i + 8) }); i += 8; }
    else return out; // tuntematon wire-tyyppi: lopetetaan siististi
  }
  return out;
}

function pbFloat(b) {
  return new DataView(b.buffer, b.byteOffset, 4).getFloat32(0, true);
}

// FeedMessage(2: entity) -> FeedEntity(4: vehicle) -> VehiclePosition(2: position)
function decodeVehiclePosition(buf) {
  for (const fm of pbParse(buf)) {
    if (fm.field !== 2 || fm.wire !== 2) continue;
    for (const ent of pbParse(fm.bytes)) {
      if (ent.field !== 4 || ent.wire !== 2) continue;
      for (const vp of pbParse(ent.bytes)) {
        if (vp.field === 2 && vp.wire === 2) {
          const pos = {};
          for (const p of pbParse(vp.bytes)) {
            if (p.field === 1 && p.bytes) pos.lat = pbFloat(p.bytes);
            if (p.field === 2 && p.bytes) pos.lon = pbFloat(p.bytes);
          }
          return pos;
        }
      }
    }
  }
  return null;
}

// Bussin klikkauspopup: linja, määränpää, aikataulupoikkeama ja seuraavat
// pysäkit GraphQL:n trip-haulla (topicin tripId + seuraava pysäkki)
const tripInfoCache = new Map();

async function vehiclePopupHtml(tripId, nextStopId) {
  const cached = tripInfoCache.get(tripId);
  if (cached && Date.now() - cached.ts < 20000) return cached.html;
  const data = await gql(
    `query ($id: String!, $date: String!) {
       trip(id: $id) {
         tripHeadsign route { shortName }
         stoptimesForDate(serviceDate: $date) {
           scheduledDeparture realtimeDeparture realtime departureDelay serviceDay
           stop { gtfsId name }
         }
       }
     }`, { id: feedId + ":" + tripId, date: todayISO().replace(/-/g, "") });
  const trip = data.trip;
  if (!trip) return t("vehNoTrip");
  const sts = trip.stoptimesForDate || [];
  let idx = sts.findIndex(st => st.stop.gtfsId === feedId + ":" + nextStopId);
  if (idx < 0) {
    const now = Date.now();
    idx = sts.findIndex(st =>
      (st.serviceDay + (st.realtime ? st.realtimeDeparture : st.scheduledDeparture)) * 1000 > now);
  }
  const cur = idx >= 0 ? sts[idx] : null;
  let delayText = "";
  if (cur && cur.realtime) {
    const d = cur.departureDelay;
    delayText = d >= 60 ? t("vehLate", { n: Math.round(d / 60) })
      : d <= -60 ? t("vehEarly", { n: Math.round(-d / 60) })
      : t("vehOnTime");
  }
  const nexts = idx >= 0 ? sts.slice(idx, idx + 4) : [];
  const html = `<strong>${t("vehLine", { line: esc(trip.route.shortName), dest: esc(trip.tripHeadsign || "") })}</strong>
    ${delayText ? `<br>${delayText}` : ""}
    ${nexts.length ? `<br><span class="muted">${t("vehNextStops")}</span><br>`
      + nexts.map(st => {
          const dep = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
          return `${fmtSec(dep)} <a href="#/pysakki/${encodeURIComponent(st.stop.gtfsId)}">${esc(st.stop.name)}</a>`;
        }).join("<br>") : ""}`;
  tripInfoCache.set(tripId, { ts: Date.now(), html });
  return html;
}

// Näyttää listan linjoista live-busseina kartalla. Kerrallaan aktiivisena on
// yksi tilaus: uusi kutsu (esim. toisen reittiehdotuksen avaus) siirtää bussit
// uudelle kartalle.
async function startVehicles(map, routeList, onMessage) {
  const mySeq = viewSeq;
  try {
    await ensureMqtt();
    await findFeed(); // MQTT-topic ja trip-haut tarvitsevat feedId:n
  } catch (e) { return; }
  if (mySeq !== viewSeq) return; // näkymä ehti vaihtua latauksen aikana
  stopVehicles();
  const byNum = new Map(routeList.map(r => [r.gtfsId.split(":")[1], r]));
  const markers = new Map(); // vehicleId -> { marker, ts }
  mqttClient = mqtt.connect(CONFIG.mqttUrl, { reconnectPeriod: 5000 });
  mqttClient.on("connect", () => {
    if (!mqttClient) return;
    for (const num of byNum.keys()) {
      mqttClient.subscribe(`/gtfsrt/vp/${feedId}/+/+/+/${num}/#`);
    }
  });
  mqttClient.on("message", (topic, payload) => {
    const seg = topic.split("/");
    const route = byNum.get(seg[7]);
    if (!route) return;
    const vehId = seg[13] || topic;
    const headsign = seg[9] || "";
    const pos = decodeVehiclePosition(payload);
    if (!pos || pos.lat == null || pos.lon == null) return;
    let m = markers.get(vehId);
    if (!m) {
      const icon = L.divIcon({ className: "bus-marker", html: esc(route.shortName), iconSize: [26, 26] });
      m = { marker: L.marker([pos.lat, pos.lon], { icon, zIndexOffset: 1000 })
        .addTo(map).bindTooltip("").bindPopup(t("vehLoading"), { maxWidth: 280 }) };
      m.marker.on("popupopen", async () => {
        try {
          m.marker.setPopupContent(await vehiclePopupHtml(m.tripId, m.nextStop));
        } catch (err) {
          m.marker.setPopupContent(t("vehLoadFail"));
        }
      });
      markers.set(vehId, m);
    }
    m.tripId = seg[10] || "";
    m.nextStop = seg[11] || "";
    m.marker.setLatLng([pos.lat, pos.lon]);
    m.marker.setTooltipContent(t("vehLine", { line: esc(route.shortName), dest: esc(headsign) }));
    m.ts = Date.now();
    if (onMessage) try { onMessage(seg, route, pos); } catch (e) { /* hälytyslogiikka ei saa kaataa karttaa */ }
  });
  // siivoa bussit, joista ei ole kuulunut 90 sekuntiin (esim. päätepysäkillä)
  vehicleSweep = setInterval(() => {
    const cutoff = Date.now() - 90000;
    for (const [id, m] of markers) {
      if ((m.ts || 0) < cutoff) { map.removeLayer(m.marker); markers.delete(id); }
    }
  }, 15000);
}

function stopVehicles() {
  if (vehicleSweep) { clearInterval(vehicleSweep); vehicleSweep = null; }
  if (mqttClient) { try { mqttClient.end(true); } catch (e) {} mqttClient = null; }
}

// Koko verkon bussit kartalla: tilaa feedin KAIKKI ajoneuvot (/gtfsrt/vp/<feed>/#).
// byNum: linjanumero -> route (väritystä ja nimeä varten). onCount: bussimäärän takaisinkutsu.
async function startLiveMap(map, byNum, onCount) {
  const mySeq = viewSeq;
  try { await ensureMqtt(); await findFeed(); }
  catch (e) { if (onCount) onCount(0); return; }
  if (mySeq !== viewSeq) return;
  stopVehicles();
  const markers = new Map(); // vehicleId -> { marker, ts, tripId, nextStop }
  mqttClient = mqtt.connect(CONFIG.mqttUrl, { reconnectPeriod: 5000 });
  mqttClient.on("connect", () => {
    if (mqttClient) mqttClient.subscribe(`/gtfsrt/vp/${feedId}/#`);
  });
  mqttClient.on("message", (topic, payload) => {
    const seg = topic.split("/");
    const pos = decodeVehiclePosition(payload);
    if (!pos || pos.lat == null || pos.lon == null) return;
    const routeNum = seg[7] || "";
    const route = byNum.get(routeNum);
    const label = route?.shortName || routeNum || "?";
    const vehId = seg[13] || topic;
    const headsign = seg[9] || "";
    let m = markers.get(vehId);
    if (!m) {
      const bg = route?.color ? "#" + route.color : "#b34700";
      const fg = route?.color ? badgeText(route.color, route.textColor) : "#fff";
      const icon = L.divIcon({ className: "bus-live-wrap",
        html: `<span class="bus-live" style="background:${bg};color:${fg}">${esc(label)}</span>`, iconSize: [28, 28] });
      m = { marker: L.marker([pos.lat, pos.lon], { icon, zIndexOffset: 1000 })
        .addTo(map).bindTooltip("").bindPopup(t("vehLoading"), { maxWidth: 280 }) };
      m.marker.on("popupopen", async () => {
        try { m.marker.setPopupContent(await vehiclePopupHtml(m.tripId, m.nextStop)); }
        catch (err) { m.marker.setPopupContent(t("vehLoadFail")); }
      });
      markers.set(vehId, m);
      if (onCount) onCount(markers.size);
    }
    m.tripId = seg[10] || "";
    m.nextStop = seg[11] || "";
    m.marker.setLatLng([pos.lat, pos.lon]);
    m.marker.setTooltipContent(t("vehLine", { line: esc(label), dest: esc(headsign) }));
    m.ts = Date.now();
  });
  vehicleSweep = setInterval(() => {
    const cutoff = Date.now() - 90000;
    let changed = false;
    for (const [id, m] of markers) {
      if ((m.ts || 0) < cutoff) { map.removeLayer(m.marker); markers.delete(id); changed = true; }
    }
    if (changed && onCount) onCount(markers.size);
  }, 15000);
}

async function bindEmailSubSetting() {

  let routes = [];
  try { routes = await loadRoutes(); } catch (e) { /* näytä virhe alla */ }
  const favIds = new Set(getFavs().filter(f => f.type === "route").map(f => f.id));
  if (routes.length) {
    box.innerHTML = `<legend>${t("emailSubLinesLabel")}</legend>` +
      `<p class="muted">${t("emailSubFav")}</p>` +
      `<div style="display:flex;flex-wrap:wrap;gap:.4rem .9rem;margin-top:.3rem">` +
      routes.map(r => `<label style="display:inline-flex;align-items:center;gap:.35rem;min-height:44px">` +

    box.innerHTML = `<legend>${t("emailSubLinesLabel")}</legend><p class="muted">${t("emailSubNoLines")}</p>`;

const SEVERITY_ORDER = { SEVERE: 0, WARNING: 1, INFO: 2, UNKNOWN_SEVERITY: 3 };

let alertsPromise = null;

// Voimassa olevat tiedotteet, haetaan kerran per istunto.
// force=true ohittaa istuntokohtaisen välimuistin (häiriöpollaus).
function loadAlerts(force) {
  if (force) alertsPromise = null;
  if (!alertsPromise) {
    alertsPromise = (async () => {
      const feed = await findFeed();
      const data = await gql(
        `query ($feeds: [String!]) {
           alerts(feeds: $feeds) {
             alertHeaderText alertDescriptionText alertSeverityLevel alertUrl
             effectiveStartDate effectiveEndDate
             route { gtfsId } stop { gtfsId }
           }
         }`, { feeds: [feed] });
      const now = Date.now() / 1000;
      return (data.alerts || []).filter(a =>
        !(a.effectiveStartDate && a.effectiveStartDate > now) &&
        !(a.effectiveEndDate && a.effectiveEndDate < now));
    })().catch(err => { alertsPromise = null; throw err; });
  }
  return alertsPromise;
}

function dedupAlerts(alerts) {
  const seen = new Map();
  for (const a of alerts) {
    seen.set((a.alertHeaderText || "") + "|" + (a.alertDescriptionText || ""), a);
  }
  return [...seen.values()].sort((a, b) =>
    (SEVERITY_ORDER[a.alertSeverityLevel] ?? 9) - (SEVERITY_ORDER[b.alertSeverityLevel] ?? 9));
}

function alertHtml(a, open) {
  const src = a._admin ? ` <span class="alert-src">${esc(t("adminSource"))}</span>`
    : a._cms ? ` <span class="alert-src">${esc(t("cmsSource"))}</span>` : "";
  return `<details class="alert sev-${esc(a.alertSeverityLevel)}"${open ? " open" : ""}>
    <summary>${esc(a.alertHeaderText || t("alertDefault"))}${src}</summary>
    <p>${esc(a.alertDescriptionText || "")}</p>
    ${a.alertUrl ? `<p><a href="${esc(a.alertUrl)}" target="_blank" rel="noopener">${t("readMore")}</a></p>` : ""}
  </details>`;
}

   Digitransitin GTFS-RT-alerts kattaa vain osan lsl.fi:n julkaisemista
   häiriötiedotteista. Täydennetään etusivun banneri WordPressistä haetuilla
   tiedotteilla (workerin /cms-alerts kautta), jotta sovellus näyttää saman

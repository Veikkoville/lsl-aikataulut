<!-- REILA F1: esilataa kriittinen latin-fontti (LCP-otsikko); crossorigin pakollinen myös samalle originille (fontit haetaan CORS-tilassa) -->
<link rel="preload" href="fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
// Teema ratkaistaan ennen ensimmäistä maalausta välähdyksen välttämiseksi
(function () {
  function apply() {
    var pref = localStorage.getItem("theme") || "auto";
    var dark = pref === "dark" ||
      (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = dark ? "#102a4d" : "#0a4ea3";
  }
  apply();
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", apply);
  window.applyTheme = apply;

  // Tekstikoko (esteettömyys): normal/large/larger → html[data-text], ennen maalausta
  function applyText() {
    var size = localStorage.getItem("textSize") || "normal";
    if (size === "large" || size === "larger") document.documentElement.dataset.text = size;
    else delete document.documentElement.dataset.text;
  }
  applyText();
  window.applyTextSize = applyText;

  // Korkea kontrasti (esteettömyys): OLETUS = Normaali — ei auto-laukaisua laitteen
  // asetuksesta (normaalitila on jo WCAG 2.1 AA). "Suuri kontrasti" vain käyttäjän omasta
  // Asetukset-valinnasta, joka persistoituu localStorageen ("high"). Ennen maalausta.
  function applyContrast() {
    if ((localStorage.getItem("contrast") || "normal") === "high")
      document.documentElement.dataset.contrast = "high";
    else delete document.documentElement.dataset.contrast;
  }
  applyContrast();
  window.applyContrast = applyContrast;

  // Per-kaupunki teemaväri (esim. Vaasan Lift-pinkki): aseta data-city ennen maalausta ?city-
  // parametrista, ettei väri vilku. Pääskripti vahvistaa arvon CONFIGin mukaan (ks. cityKey).
  var cityParam = (new URLSearchParams(location.search).get("city") || "").toLowerCase().replace(/[^a-z]/g, "");
  if (cityParam) document.documentElement.dataset.city = cityParam;
})();
</script>
<style>
  /* ============================================================
     REILA-ILME F1 — brändifontti (SELF-HOST, GDPR: ei Google CDN).
     Kuntalais-/julkissektorikäyttö → fonttitiedostot tarjotaan samasta
     originista (GitHub Pages), EI fonts.gstatic.com → loppukäyttäjän IP
     ei vuoda Googlelle. Hanken Grotesk on VARIABLE font (wght-akseli
     100–900) → yksi woff2 per subset kattaa kaikki painot 400/500/600/
     700/800. Skandit ä ö å Ä Ö Å ovat latin-subsetissa (U+0000–00FF);
     numerot ovat tabular (560u) oletuksena → kellot/hinnat linjautuvat
     ilman erillistä tnum-featurea (jota fontissa ei ole). */
  @font-face {
    font-family: 'Hanken Grotesk';
    font-style: normal;
    font-weight: 100 900;          /* variable: kattaa 400/500/600/700/800 */
    font-display: swap;
    src: url('fonts/hanken-grotesk-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Hanken Grotesk';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('fonts/hanken-grotesk-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  :root {
    /* Transit-grade design-tokenit. Yksi vahva sininen primääri + neutraalit harmaat.
       Semanttiset värit VAIN merkitykseen: --green = ok/nopein, --sev-warning = häiriö,
       --sev-severe = vakava. Litteä ilme: ei gradientteja/varjoja (--shadow = läpinäkyvä). */
    --page-max: 760px;          /* sisältösarakkeen leveys; kasvaa isolla ruudulla (ks. main) */
    --blue: #0a4ea3;            /* primääri, AA valkoisella (~7.6:1) */
    --btn-bg: #0a4ea3;
    --btn-hover: #083d80;
    --header-bg: #0a4ea3;       /* litteä, ei gradienttia */
    --bg: #f3f5f8;
    --card: #ffffff;
    --text: #182234;
    --muted: #56607a;          /* AA valkoisella (~5.9:1) */
    --green: #1a7f4b;
    --border: #dbe1ea;
    --hover: #eef3fb;
    --chip: #eaeff6;
    --rt-bg: #e2f3e9;
    --rt-text: #135c37;
    --error-bg: #fdecec;
    --error-border: #f3b6b6;
    --error-text: #8a1f1f;
    --shadow: transparent;     /* litteä: ei varjoja (muuttuja säilytetty yhteensopivuuden vuoksi) */
    --star: #b8860b;
    --sev-severe: #c0392b;
    --sev-warning: #b9740f;
    /* Muoto- ja välitokenit: yhtenäiset kortit, badget ja painikkeet */
    --radius: 12px;            /* kortit */
    --radius-sm: 8px;          /* napit, badget, kentät */
    --pill: 999px;             /* pilleri-/etäisyysmerkit */
    --pad-card: 1.05rem 1.15rem;
    --wmed: 500;               /* ainoa korostuspaino (perus 400) */

    /* ===== REILA-token-kerros F1 (RINNAKKAINEN — ei kuluteta vielä komponenteissa;
       F2/F3 alkavat käyttää). Vanhat muuttujat yllä pysyvät ennallaan ja toimivina.
       Aksentti peritään per-kaupunki --blue:stä → seuraa Vaasa-pinkki/Kotka-oranssi
       -ohitukset automaattisesti ILMAN että data-city-selektoreihin kosketaan. ===== */
    --font-sans: 'Hanken Grotesk', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    /* Aksentti — koko jutun ydin: --accent = per-kaupunki brändiväri (--blue) */
    --accent: var(--blue);
    --accent-dark: var(--btn-hover);   /* fallback ennen color-mixiä (per-kaupunki hover) */
    --accent-dark: color-mix(in srgb, var(--accent) 78%, #000);
    --accent-soft: var(--hover);       /* fallback ennen color-mixiä (per-kaupunki vaalea tint) */
    --accent-soft: color-mix(in srgb, var(--accent) 12%, #fff);   /* vaalea: hero/aktiivi */

    /* Neutraalit/pinnat (vaalea — handoffin arvot). Teemakohtaiset: tumma + 2× kontrasti alla. */
    --surface-page: #F1F4F3;     /* sivun tausta */
    --surface: #FFFFFF;          /* pinta/kortti */
    --field-bg: #F2F5F4;         /* kentän tausta */
    --ink: #16201C;              /* päätekstiväri (AA 16.7:1 valkoisella) */
    --ink-muted: #5C6B66;        /* muted (AA 5.6:1 valkoisella) */
    --ink-muted-2: #6B7872;      /* muted-2: AA 4.61:1 valkoisella pinnalla; off-white page/field 4.17-4.20 → suosi surface-pintaa */
    --line: #E6EBE8;             /* reuna oletus */
    --line-header: #E3E8E5;      /* reuna header */
    --line-divider: #ECEFED;     /* reuna jakaja */

    /* F4: coralin kaksi semanttista käyttöä eriytetty omiin tokeneihinsa.
       --coral = LIVE / kiireellisyys (PYSYY GLOBAALINA #F0734E kaikilla kaupungeilla:
       "Lähtee X min" -pillerit, punainen/lämmin = kiireellisyys on universaali konventio). */
    --coral: #F0734E;            /* ei-tekstuaalinen aksentti (sirun tausta) */
    --coral-text: #C2451F;       /* AA 5.04:1 valkoisella — käytä tätä tekstinä, EI valkoista coralin päällä */
    --coral-soft: #FDE7DF;       /* fallback ennen color-mixiä */
    --coral-soft: color-mix(in srgb, var(--coral) 14%, #fff);
    /* F4: live-pillerin TEKSTI ≥4.5:1 coral-soft-pohjalla. Vaalea = syvennetty coral
       #A8330F (5.79:1 #fdebe6:lla, 6.68:1 valkoisella). Tumma-pari html[data-theme=dark]:ssa.
       Piste + pulssi + --coral pysyvät ennallaan (live-semantiikka). */
    --live-text: #A8330F;

    /* --dest = MÄÄRÄNPÄÄ / spatiaalinen merkki (Minne-piste hakukortissa, kartan
       määränpää-pin, laajennetun detaljin viimeinen solmu). Oletus = coral; Kotka
       ylikirjoittaa brändivihreäksi (oranssi accent + vihreä dest → ei warm-on-warm).
       Pari: lähtö = --accent, määränpää = --dest kaikkialla. */
    --dest: #F0734E;             /* oletus = coral (Lahti/Salo/Kajaani/Vaasa) */
    --dest-edge: #C2451F;        /* dest-pisteen reuna: WCAG 1.4.11 — coral/valkoinen 2.89<3:1
                                    → 1px reuna (#C2451F 5.04:1 valkoisella) nostaa rajan yli */

    /* Typo-skaala (handoff: H1 38/800). Variable-painot 400–800. */
    --fs-h1: 2.375rem;  --fw-h1: 800;
    --fs-h2: 1.75rem;
    --fs-h3: 1.375rem;
    --fs-h4: 1.125rem;
    --fs-body: 1rem;
    --fs-sm: 0.875rem;
    --fs-xs: 0.75rem;
    --fw-regular: 400; --fw-medium: 500; --fw-semibold: 600; --fw-bold: 700; --fw-black: 800;
    --lh-tight: 1.1; --lh-snug: 1.3; --lh-base: 1.5;

    /* Radius (handoff): kortti 16, kenttä/nappi 13, segmentti 9. (vanhat --radius/-sm/-pill ennallaan) */
    --radius-card: 16px;
    --radius-control: 13px;
    --radius-segment: 9px;

    /* Varjot — 3 tasoa (Reila: hienovarainen kohotus; vanha --shadow:transparent ennallaan). */
    --shadow-1: 0 1px 2px rgba(16, 32, 28, 0.06);
    --shadow-2: 0 2px 8px rgba(16, 32, 28, 0.08);
    --shadow-3: 0 8px 24px rgba(16, 32, 28, 0.12);

    /* Spacing-asteikko (4px-perusta). */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
    --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

    /* Kontaineri (handoff). */
    --container-max: 1180px;
  }
  html[data-theme="dark"] {
    --blue: #7db3f0;
    --btn-bg: #155bb5;
    --btn-hover: #1e6ad0;
    --header-bg: #102a4d;
    --bg: #0f1522;
    --card: #19202f;
    --text: #e6ebf5;
    --muted: #9aa6bd;
    --green: #5ecf96;
    --border: #323c52;
    --hover: #222c42;
    --chip: #243049;
    --rt-bg: #14301f;
    --rt-text: #7fd6a4;
    --error-bg: #3a1414;
    --error-border: #7a2e2e;
    --error-text: #f0a0a0;
    --shadow: transparent;
    --star: #e0b13e;
    --sev-severe: #e06050;
    --sev-warning: #e8a33d;
    /* REILA F1 — tumman teeman peilaus (mitattu AA): accent-soft ei voi olla
       valkopohjainen tummassa → mix mustaan. Neutraalit ja varjot tummalle. */
    --accent-soft: var(--hover);       /* fallback ennen color-mixiä */
    --accent-soft: color-mix(in srgb, var(--accent) 22%, #000);
    --surface-page: #0D1311;     /* ink/page 15.9:1 */
    --surface: #161F1B;          /* ink/surface 14.2:1 */
    --field-bg: #1B2622;
    --ink: #E8EDEA;
    --ink-muted: #9DABA5;        /* /surface 7.1:1 */
    --ink-muted-2: #7E8C86;      /* /surface 4.8:1 (AA normaali OK tummassa) */
    --line: #2A352F;
    --line-header: #243029;
    --line-divider: #202B26;
    --coral-soft: #2A1812;       /* fallback ennen color-mixiä (tumma, ei valkopohja) */
    --coral-soft: color-mix(in srgb, var(--coral) 22%, #000);
    /* F4: tummassa live-pillerin teksti vaaleaksi coraliksi tummalle coral-soft-pohjalle
       (#351911): #F0A085 = 7.76:1 (norm) / 10.07:1 (high #000). Piste/pulssi ennallaan. */
    --live-text: #F0A085;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.40);
    --shadow-2: 0 2px 10px rgba(0, 0, 0, 0.50);
    --shadow-3: 0 10px 30px rgba(0, 0, 0, 0.60);
  }
  /* Korkea kontrasti (esteettömyys): maksimoi tekstin ja reunojen erottuvuus.
     Vaalea ja tumma erikseen; tumma+kontrasti voittaa specificityllä. */
  html[data-contrast="high"] {
    --bg: #ffffff; --card: #ffffff; --text: #000000; --muted: #1a1a1a;
    --border: #000000; --hover: #e6e6e6; --chip: #dcdcdc;
    --blue: #0033cc; --btn-bg: #0033cc; --btn-hover: #001f99;
    --rt-bg: #d4f0d4; --rt-text: #005800; --error-text: #990000;
    --sev-severe: #a00000; --sev-warning: #8a5200; --star: #6e5200;
    --shadow: transparent;
    /* REILA F1 — vaalea suuri kontrasti: neutraalit puhtaiksi (sama intentio kuin --bg/--text yllä) */
    --surface-page: #ffffff; --surface: #ffffff; --field-bg: #ffffff;
    --ink: #000000; --ink-muted: #1a1a1a; --ink-muted-2: #1a1a1a;
    --line: #000000; --line-header: #000000; --line-divider: #000000;
    --accent-soft: #ffffff; --coral-soft: #ffffff;
  }
  html[data-theme="dark"][data-contrast="high"] {
    --bg: #000000; --card: #000000; --text: #ffffff; --muted: #e8e8e8;
    --border: #ffffff; --hover: #1c1c1c; --chip: #202020;
    --blue: #7db8ff; --btn-bg: #1a5fd0; --btn-hover: #2e78ec;
    --rt-bg: #0a2a0a; --rt-text: #82ff82; --error-text: #ff8c8c;
    --sev-severe: #ff7060; --sev-warning: #ffc24d; --star: #ffcf52;
    --shadow: transparent;
    /* REILA F1 — tumma suuri kontrasti: neutraalit puhtaiksi (sama intentio kuin --bg/--text yllä) */
    --surface-page: #000000; --surface: #000000; --field-bg: #000000;
    --ink: #ffffff; --ink-muted: #e8e8e8; --ink-muted-2: #e8e8e8;
    --line: #ffffff; --line-header: #ffffff; --line-divider: #ffffff;
    --accent-soft: #000000; --coral-soft: #000000;
  }
  /* Vaasan demo: Lift-brändin pinkki/magenta (per-kaupunki, data-city="vaasa"). Vain Vaasa muuttuu.
     Valkoisen tekstin alle (header/primary-napit) syvät AA-sävyt (mitattu ≥5:1), kirkas #E6007E
     ei-tekstuaalisena aksenttina. Kaikki neljä kontekstia (vaalea/tumma × normaali/kontrasti);
     yhdistelmäselektorit voittavat teemablokit specificityllä. */
  html[data-city="vaasa"] {                                  /* vaalea, normaali */
    --blue: #cc0077; --btn-bg: #cc0077; --btn-hover: #a8005e;
  }
  html[data-city="vaasa"][data-contrast="high"] {            /* vaalea, suuri kontrasti (manuaalinen) */
    --blue: #a30062; --btn-bg: #a30062; --btn-hover: #7d004a;
  }
  html[data-theme="dark"][data-city="vaasa"] {               /* tumma, normaali */
    --blue: #ff8ac6; --btn-bg: #b81570; --btn-hover: #c41a7e;
  }
  html[data-theme="dark"][data-city="vaasa"][data-contrast="high"] {  /* tumma, suuri kontrasti */
    --blue: #ff8fcf; --btn-bg: #c2007a; --btn-hover: #cc0080;
  }
  /* Header-tausta tulee CONFIG.brandColorista (headerBgColor() asettaa --header-bg inline,
     auto-tummennus AA:han). Kirkas Lift-cerise -aksenttiraita headerin alle (ei-tekstuaalinen). */
  html[data-city="vaasa"] header { border-bottom: 3px solid #e6007e; }
  /* Kotkan demo: Jonne ja Minne -brändin oranssi (per-kaupunki, data-city="kotka"). Sama
     mekaniikka kuin Vaasalla. Valkoisen tekstin alle (header/primary-napit/aktiivitilat) syvät
     oranssit (mitattu valkoiselle >=4.5:1 kaikissa neljassa kontekstissa), kirkas logo-oranssi
     #dc7b38 ei-tekstuaalisena aksenttiraitana. Brandin vihrea #80bc54 (valkoiselle tekstille
     #4e7a2e, AA 5.06:1) on toissijainen aksentti. Yhdistelmaselektorit voittavat teemablokit. */
  html[data-city="kotka"] {                                  /* vaalea, normaali */
    --blue: #a8500f; --btn-bg: #a8500f; --btn-hover: #8a4109;
  }
  html[data-city="kotka"][data-contrast="high"] {            /* vaalea, suuri kontrasti (manuaalinen) */
    --blue: #8a4109; --btn-bg: #8a4109; --btn-hover: #6e340b;
  }
  html[data-theme="dark"][data-city="kotka"] {               /* tumma, normaali */
    --blue: #e89456; --btn-bg: #a8500f; --btn-hover: #b65b14;
  }
  html[data-theme="dark"][data-city="kotka"][data-contrast="high"] {  /* tumma, suuri kontrasti */
    --blue: #f0a866; --btn-bg: #964810; --btn-hover: #a8500f;
  }
  html[data-city="kotka"] header { border-bottom: 3px solid #dc7b38; }
  /* F4: Kotkan määränpää = brändivihreä (Jonne ja Minne -logon vihreä, syvennetty AA:han)
     → lähtö = oranssi (accent), määränpää = vihreä → selvä spatiaalinen erottuvuus, on-brand.
     Vaalea/kontrasti: #4e7a2e (5.06:1 valkoisella). Tumma: nostettu #6aa840 (5.85:1 tummalla
     pinnalla, #4e7a2e jäisi 3.33:1). Reuna syvävihreä. EI kirkasta #80bc54 (pisteenä <2:1). */
  html[data-city="kotka"] { --dest: #4e7a2e; --dest-edge: #355420; }
  html[data-theme="dark"][data-city="kotka"] { --dest: #6aa840; --dest-edge: #2f4a1c; }
  html[data-contrast="high"] a { text-decoration: underline; }
  html[data-contrast="high"] .card,
  html[data-contrast="high"] button.secondary,
  html[data-contrast="high"] a.btnlink.secondary,
  html[data-contrast="high"] input, html[data-contrast="high"] select { border-width: 2px; }
  html[data-theme="dark"] .leaflet-popup-content-wrapper,
  html[data-theme="dark"] .leaflet-popup-tip {
    background: var(--card);
    color: var(--text);
  }
  * { box-sizing: border-box; }
  a { color: var(--blue); }
  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, summary:focus-visible {
    outline: 3px solid var(--blue);
    outline-offset: 2px;
  }
  /* Kunnioita "vähennä liikettä" -asetusta: animaatiot, siirtymät ja korttien
     hover-nostot pois käytöstä niiltä, jotka ovat sen valinneet */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    .route-tile:hover, button:active { transform: none !important; }
  }
  body {
    margin: 0;
    font-family: var(--font-sans);   /* REILA F1: Hanken Grotesk + system-ui-fallback */
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  /* Esteettömyys: tekstikoko skaalaa koko käyttöliittymän (rem-pohjainen) */
  html[data-text="large"] { font-size: 118.75%; }
  html[data-text="larger"] { font-size: 137.5%; }
  html[data-text="large"] body, html[data-text="larger"] body { line-height: 1.6; }
  html[data-text="large"] button, html[data-text="large"] a.btnlink,
  html[data-text="larger"] button, html[data-text="larger"] a.btnlink { min-height: 52px; }
  header {
    background: var(--header-bg);
    color: #fff;
    padding: 0.85rem 1rem;
    position: sticky;
    top: 0;
    z-index: 600;
  }
  .header-inner {
    max-width: var(--page-max);
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 0.75rem 1rem;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    flex: 1 1 auto;
    min-width: 0;            /* salli otsikon kutistua, ettei se työnnä kontrolleja ulos */
  }
  a.brand { color: inherit; text-decoration: none; }
  a.brand:hover h1 { text-decoration: underline; }
  header h1 { margin: 0; font-size: 1.25rem; font-weight: var(--wmed); letter-spacing: 0.01em; }
  header p { margin: 0.1rem 0 0; font-size: 0.78rem; opacity: 0.88; }
  /* Globaalit kontrollit ylätunnisteessa (kieli / tekstikoko / kontrasti) */
  .hdr-tools {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 0.4rem;
    flex: 0 1 auto;       /* saa kutistua, ei pakota ylätunnistetta ylileveäksi */
    min-width: 0;
  }
  .hdr-tools .seg {
    display: inline-flex;
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .hdr-tools .seg .hdr-btn { border: 0; border-radius: 0; }
  .hdr-tools .seg .hdr-btn + .hdr-btn { border-left: 1px solid rgba(255, 255, 255, 0.55); }
  .hdr-btn {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.55);
    border-radius: var(--radius);
    min-width: 2.1rem;
    min-height: 2.1rem;
    padding: 0.25rem 0.5rem;
    font-size: 0.82rem;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
  }
  .hdr-btn:hover { background: rgba(255, 255, 255, 0.15); }
  .hdr-btn[aria-pressed="true"] { background: #fff; color: var(--header-bg); }
  .hdr-btn:disabled { opacity: 0.4; cursor: default; }
  .hdr-btn:disabled:hover { background: transparent; }
  .hdr-contrast { font-size: 1rem; }
  /* Tekstikoko-kytkimet eivät kasva 52px:ään suuressa tekstikoossa (chrome pysyy kompaktina) */
  html[data-text="large"] .hdr-btn, html[data-text="larger"] .hdr-btn { min-height: 2.1rem; }
  /* Suuri kontrasti: vahvempi reunus näkyvyyden takaamiseksi */
  html[data-contrast="high"] .hdr-btn,
  html[data-contrast="high"] .hdr-tools .seg { border-width: 2px; }
  @media (max-width: 520px) {
    header { padding: 0.7rem 0.8rem; }
    .hdr-tools { width: 100%; justify-content: flex-end; }
    .hdr-btn { min-width: 1.9rem; padding: 0.25rem 0.4rem; }
    header h1 { font-size: 1.1rem; }
  }
  /* min-height pitää footerin aina taitteen alapuolella, joten näkymän
     sisällön asynkroninen latautuminen ei työnnä sitä näkyvistä (CLS) */
  main { max-width: var(--page-max); margin: 0 auto; padding: 1rem; min-height: 100vh; }
  /* Isolla ruudulla 760 px jättää puolet näytöstä tyhjäksi, ja juuri linjaruudukko
     (auto-fill 158 px) kärsii siitä eniten. Leveys kasvaa vain ylöspäin ja maltillisesti:
     980 px pitää leipätekstin yhä luettavan mittaisena mutta antaa ruudukolle 2 saraketta
     lisää. Ylätunniste ja footer seuraavat samaa muuttujaa, joten reunat pysyvät linjassa. */
  @media (min-width: 1200px) { :root { --page-max: 980px; } }
  /* REILA F3: peruskortti saa Reila-signaalin — suurempi pyöristys + hienovarainen
     kohotus. Tokenit (--card/--border) pysyvät, joten print/dark/kontrasti/per-kaupunki
     -mekaniikka ei muutu; print nollaa varjon erikseen (ks. @media print). */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-2);
    padding: var(--pad-card);
    margin-bottom: 1rem;
  }
  h2 { font-size: 1.2rem; font-weight: 600; margin: 0 0 0.7rem; letter-spacing: 0.01em; }
  /* "Kaikki linjat": värillisten linjabadgejen ruudukko (joukkoliikennemäinen) */
  ul.route-grid {
    list-style: none; margin: 0.3rem 0 0; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 0.55rem;
  }
  .route-tile {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.5rem 0.6rem; min-height: 62px;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
    text-decoration: none; color: var(--text);
    transition: background 0.1s, border-color 0.1s;
  }
  /* Hierarkiapassi: normaalilinjan rondelli on neutraali (kortti-pohja + ink-reuna +
     brändivärinen numero) → ei "sinistä seinää". Numero ja reuna käyttävät teemamuuttujia
     → toimii kaikissa neljässä kontekstissa ja kaikilla kaupunkiväreillä (--blue). */
  .route-tile:hover { background: var(--hover); border-color: var(--blue); }
  .rt-badge {
    flex: 0 0 auto; box-sizing: border-box;
    min-width: 44px; height: 44px; padding: 0 0.55rem;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px; text-align: center; font-weight: 700; font-size: 1.02rem; letter-spacing: 0.01em;
    background: var(--card); border: 2px solid var(--text); color: var(--blue);
  }
  /* Erikoisreitit (esim. 81B punainen, 81C amber, Kotkan vihreät P-linjat) säilyttävät
     täytetyn brändivärinsä: --rc = täyttö/reuna, --rt = numero. Voittaa normaalitreatmentin. */
  .rt-badge.special {
    background: var(--rc); border-color: var(--rc); color: var(--rt);
  }
  .rt-name { font-size: 0.82rem; line-height: 1.25; color: var(--muted);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow-wrap: anywhere; }
  /* Vuorokuormitus: värillinen piste emojin tilalle (aria-label säilyttää merkityksen) */
  .occ-dot { display: inline-block; width: 0.72em; height: 0.72em; border-radius: 50%;
    vertical-align: -0.04em; margin-left: 0.15em; }
  .occ-low { background: #1a8a3a; } .occ-mid { background: #b58900; }
  .occ-high { background: #cf6a00; } .occ-full { background: #c0392b; }
  /* Esteettömyys: pysäkkimerkki + "vain esteettömät" -suodatin */
  .acc-mark { color: var(--blue); }
  .acc-mark .ic, .occ-ico .ic { vertical-align: -0.18em; }
  .acc-toggle { display: inline-flex; align-items: center; gap: 0.45rem; margin: 0 0 0.7rem;
    font-size: 0.92rem; cursor: pointer; }
  .acc-toggle input { width: auto; min-height: auto; margin: 0; }
  /* Lähestyvä bussi -hälytys */
  .approach-banner { margin: 0.2rem 0 0.6rem; padding: 0.6rem 0.8rem; border-radius: var(--radius-control);
    background: var(--rt-bg); color: var(--rt-text); border: 1px solid var(--rt-text); font-size: 0.95rem; }
  button.secondary.armed { border-color: var(--blue); color: var(--blue);
    background: var(--hover); font-weight: 600; }
  /* Jäsennelty footer (linkkisarakkeet + lähde + varauma) */
  .foot-cols { max-width: var(--page-max); margin: 0 auto; display: grid;
    grid-template-columns: 1.7fr 1fr 1fr; gap: 1.3rem; }
  .foot-brand { display: flex; gap: 0.6rem; align-items: flex-start; }
  .foot-brand img { border-radius: 8px; flex-shrink: 0; }
  .foot-brand strong { color: var(--text); }
  .foot-col h4 { margin: 0 0 0.4rem; font-size: 0.78rem; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text); }
  .foot-col a { display: block; padding: 0.22rem 0; color: var(--blue); text-decoration: none; }
  .foot-col a:hover { text-decoration: underline; }
  .foot-note { max-width: var(--page-max); margin: 1.2rem auto 0; padding-top: 1rem;
    border-top: 1px solid var(--border); }
  @media (max-width: 540px) {
    .foot-cols { grid-template-columns: 1fr 1fr; }
    .foot-brand { grid-column: 1 / -1; }
  }
  /* REILA F3: kentät saavat pehmeän harmaan pohjan + 13px pyöristyksen + accent-fokuksen.
     --field-bg/--line ovat teemakohtaisia (tumma/kontrasti/print määritelty) → toimii
     kaikissa konteksteissa; per-kaupunki seuraa accentia fokusreunassa. */
  input[type="search"], input[type="password"], input[type="date"],
  input[type="datetime-local"], input[type="text"], select {
    font: inherit;
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--line);
    border-radius: var(--radius-control);
    width: 100%;
    min-height: 44px;
    background: var(--field-bg);
    color: var(--text);
  }
  input[type="search"]:focus, input[type="password"]:focus, input[type="date"]:focus,
  input[type="datetime-local"]:focus, input[type="text"]:focus, select:focus {
    border-color: var(--accent);
  }
  select, input[type="datetime-local"] { width: auto; }
  .field { margin: 0.5rem 0; }
  .field > label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.15rem; }
  .suggest { position: relative; }
  .suggest-list {
    position: absolute;
    left: 0; right: 0; top: 100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0 0 var(--radius-control) var(--radius-control);
    box-shadow: var(--shadow-2);
    max-height: 15rem;
    overflow: auto;
    z-index: 500;
  }
  button {
    font: inherit;
    font-weight: var(--wmed);
    padding: 0.5rem 0.95rem;
    min-height: 44px;            /* riittävä kosketuskohde (myös ikäihmisille) */
    border: none;
    border-radius: var(--radius-control);   /* REILA F3: 13px kentät/napit */
    background: var(--btn-bg);
    color: #fff;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--btn-hover); }
  button.linkish {
    background: none;
    color: var(--blue);
    padding: 0.2rem 0.4rem;
    min-height: auto;
    text-decoration: underline;
  }
  a.btnlink {
    display: inline-flex; align-items: center; gap: 0.4rem; font: inherit; font-weight: var(--wmed);
    padding: 0.5rem 0.95rem; min-height: 44px; box-sizing: border-box;
    border-radius: var(--radius-control); background: var(--btn-bg); color: #fff; text-decoration: none;
  }
  a.btnlink:hover { background: var(--btn-hover); }
  /* Toissijainen (outline) painike: erottaa avustavat toiminnot ensisijaisesta */
  button.secondary, a.btnlink.secondary {
    background: transparent; color: var(--text); border: 2px solid var(--text);
  }
  button.secondary:hover, a.btnlink.secondary:hover {
    background: var(--hover); border-color: var(--blue);
  }
  /* Pysäkkimonitori / kioski: koko ruudun live-lähtötaulu isolla fontilla */
  body.monitor-mode header, body.monitor-mode #appFooter { display: none; }
  body.monitor-mode main { max-width: none; padding: 0; }
  .monitor { min-height: 100vh; display: flex; flex-direction: column;
    padding: clamp(0.8rem, 2.5vw, 2rem); box-sizing: border-box; }
  .m-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem;
    border-bottom: 3px solid var(--blue); padding-bottom: 0.5rem; margin-bottom: 0.4rem; }
  .m-title { font-size: clamp(1.4rem, 4.5vw, 3rem); font-weight: var(--wmed); line-height: 1.1; }
  .m-code { color: var(--muted); font-weight: var(--wmed); font-size: 0.6em; }
  .m-clock { font-size: clamp(1.4rem, 4.5vw, 3rem); font-weight: var(--wmed);
    font-variant-numeric: tabular-nums; color: var(--blue); }
  .m-table { width: 100%; border-collapse: collapse; }
  .m-table thead th { text-align: left; font-size: clamp(0.75rem, 1.8vw, 1.1rem);
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 0 0.4rem 0.3rem; }
  .m-table td { font-size: clamp(1.2rem, 3.6vw, 2.6rem); font-weight: var(--wmed);
    padding: clamp(0.3rem, 1.2vw, 0.7rem) 0.4rem; border-bottom: 1px solid var(--border); }
  .m-line { width: 1%; white-space: nowrap; }
  .monitor .badge { font-size: clamp(1.1rem, 3.4vw, 2.3rem); padding: 0.1em 0.45em; }
  .m-dest { overflow: hidden; text-overflow: ellipsis; }
  td.m-when { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: var(--wmed); }
  .m-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; padding-top: 0.8rem; flex-wrap: wrap; }
  a.m-exit { color: var(--blue); text-decoration: none; padding: 0.5rem 0.9rem;
    border: 1px solid var(--border); border-radius: 8px; }
  .row { display: flex; gap: 0.5rem; align-items: center; }
  ul.plain { list-style: none; margin: 0; padding: 0; }
  ul.plain li { border-top: 1px solid var(--border); }
  ul.plain li:first-child { border-top: none; }
  li.search-cat { padding: 0.5rem 0.75rem 0.2rem; font-size: 0.72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  a.item, button.item {
    display: flex;
    gap: 0.75rem;
    align-items: baseline;
    width: 100%;
    text-align: left;
    padding: 0.55rem 0.25rem;
    min-height: 44px;
    background: none;
    border: none;
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
    font: inherit;
  }
  a.item, button.item { transition: background 0.12s; border-radius: 6px; }
  a.item:hover, button.item:hover { background: var(--hover); }
  .badge {
    display: inline-block;
    min-width: 2.4em;
    text-align: center;
    background: var(--btn-bg);
    color: #fff;
    border-radius: var(--radius-sm);
    padding: 0.1rem 0.45rem;
    font-weight: var(--wmed);
    font-size: 0.95rem;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;   /* REILA F1: linjanumerot tasalevyisinä */
  }
  .muted { color: var(--muted); font-size: 0.9rem; }
  a.badge { text-decoration: none; }
  button.star {
    background: none;
    color: var(--star);
    font-size: 1.3rem;
    line-height: 1;
    padding: 0 0.3rem;
    float: right;
  }
  button.star:hover { background: none; }
  button.star[aria-pressed="false"] { color: var(--border); }
  h3.stophead {
    font-size: 0.98rem;
    margin: 0.85rem 0 0.15rem;
    display: flex;
    gap: 0.5rem;
    align-items: baseline;
  }
  h3.stophead a { color: var(--text); text-decoration: none; }
  h3.stophead a:hover { color: var(--blue); text-decoration: underline; }
  .dist {
    background: var(--chip);
    color: var(--muted);
    border-radius: var(--pill);
    padding: 0.1rem 0.6rem;
    font-size: 0.74rem;
    white-space: nowrap;
  }
  details.alertsum { border-left: 4px solid var(--sev-warning); }
  details.alertsum summary { cursor: pointer; padding: 0.1rem 0; }
  details.alertsum[open] summary { margin-bottom: 0.3rem; }
  /* Informatiiviset tiedotteet: vaimennettu (harmaa reunus + himmeä otsikko), oletus kiinni */
  details.infosum { border-left: 4px solid var(--border); margin-top: 0.6rem; }
  details.infosum summary { cursor: pointer; padding: 0.1rem 0; color: var(--muted); }
  details.infosum summary strong { font-weight: var(--wmed); }
  details.infosum[open] summary { margin-bottom: 0.3rem; }
  .tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0; }
  /* REILA F3: segmentoidut valitsimet (päivätyyppi/kieli/teema/tekstikoko/kontrasti/
     tulostevälilehdet). Inaktiivi = neutraali kenttäpohja + reuna, aktiivi = accent-täyttö.
     Segmenttipyöristys 9px. Accent = per-kaupunki brändiväri (Lahti/Salo/Kajaani sininen,
     Kotka oranssi, Vaasa pinkki) → seuraa automaattisesti. */
  .tabs button {
    background: var(--field-bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: var(--radius-segment);
    font-size: 0.85rem;
  }
  .tabs button:hover { border-color: var(--accent); }
  .tabs button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  /* Tulosteet-keskuksen päävälilehdet: hieman suuremmat kuin päivätyyppi-chipit */
  .tabs .ptab { font-size: 0.95rem; padding: 0.5rem 0.9rem; min-height: 44px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--border); }
  th { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  table.deps th:last-child, table.deps td:last-child {
    white-space: nowrap;
    text-align: right;
    font-weight: 600;
  }
  table.deps td:first-child { width: 3em; }
  tbody tr:last-child td { border-bottom: none; }
  .rt { color: var(--green); font-weight: var(--wmed); }
  .remind { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin: 0.2rem 0 0.5rem; }
  .remind select { font: inherit; padding: 0.2rem; }
  .timegrid { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .timegrid span {
    background: var(--chip);
    border-radius: var(--radius-sm);
    padding: 0.28rem 0.6rem;
    font-size: 1.05rem;
    font-variant-numeric: tabular-nums;
  }
  .timegrid span.past { background: none; color: var(--muted); border: 1px solid var(--border); }
  .timegrid span.rt { background: var(--rt-bg); color: var(--rt-text); font-weight: 600; }
  /* Klikattavat lähdöt: napit peilaavat chip-ulkoasun; valittu vuoro korostettu */
  .timegrid button { font: inherit; cursor: pointer; min-height: 0;
    background: var(--chip); border: 1px solid transparent; border-radius: var(--radius-sm);
    padding: 0.28rem 0.6rem; font-size: 1.05rem; font-variant-numeric: tabular-nums; color: var(--text); }
  .timegrid button.past { background: none; color: var(--muted); border-color: var(--border); }
  .timegrid button.rt { background: var(--rt-bg); color: var(--rt-text); font-weight: 600; }
  .timegrid button:hover { border-color: var(--blue); }
  .timegrid button.selected { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 600; }
  .timeline-sel { font-weight: 600; color: var(--text); margin: 0.2rem 0 0.4rem; }
  .timeline-sel:empty { display: none; }
  /* Linjanäkymä: suunta yhdellä rivillä + vaihtonappi */
  .dir-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin: 0.6rem 0; }
  .dir-label { color: var(--muted); }
  .dir-current { font-size: 1.05rem; }
  #dirSwap { padding: 0.4rem 0.7rem; }
  /* Pysäkkiaikajana: pisteet + yhdistävä viiva + seuraava lähtöaika per pysäkki */
  .stop-timeline { list-style: none; margin: 0.4rem 0 0; padding: 0; }
  .stl-item { position: relative; display: flex; align-items: baseline; gap: 0.6rem; padding: 0.35rem 0 0.35rem 1.5rem; }
  .stl-item::before { content: ""; position: absolute; left: 0.42rem; top: 0; bottom: 0; width: 2px; background: var(--border); }
  .stl-item:first-child::before { top: 0.65rem; }
  .stl-item:last-child::before { bottom: auto; height: 0.65rem; }
  .stl-dot { position: absolute; left: 0; top: 0.5rem; width: 0.85rem; height: 0.85rem; border-radius: 50%;
    background: var(--card); border: 2px solid var(--blue); }
  .stl-name { flex: 1; }
  .stl-time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.92rem; }
  /* Tyhjän päivän ohjaus: näytetään seuraavan liikennöintipäivän lähdöt, ei tyhjää */
  .redirect-note { display: flex; align-items: center; gap: 0.4rem; background: var(--chip);
    border-radius: var(--radius-sm); padding: 0.5rem 0.7rem; margin: 0 0 0.6rem; }
  /* Linjasivun häiriöt: auki ja korostettuna (ei pelkän ▶ takana) */
  #routeAlerts .alert { border-left: 4px solid var(--sev-warning); margin-bottom: 0.5rem; }
  #routeAlerts .alert.sev-SEVERE { border-left-color: var(--sev-severe); }
  /* Koko aikataulu pysäkeittäin -matriisi: pysäkit riveinä, vuorot sarakkeina.
     Ruudulla vieritettävä laatikko, tulostuksessa koko taulukko näkyviin. */
  .matrix-wrap { overflow: auto; max-height: 65vh; margin: 0.5rem 0; border: 1px solid var(--border); border-radius: 6px; }
  table.stoptable { border-collapse: collapse; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  table.stoptable th, table.stoptable td { border: 1px solid var(--border); padding: 0.25rem 0.5rem; text-align: center; white-space: nowrap; }
  table.stoptable thead th { position: sticky; top: 0; background: var(--chip); z-index: 2; }
  table.stoptable th[scope="row"] { position: sticky; left: 0; background: var(--card); text-align: left; font-weight: 500; z-index: 1; }
  table.stoptable thead th:first-child { left: 0; z-index: 3; }
  table.stoptable tbody tr:nth-child(even) td { background: var(--hover); }
  /* Tulostusvihko: harvempi pysäkkijoukko, hieman isompi luettava fontti */
  table.booklet { font-size: 0.95rem; }
  table.booklet th, table.booklet td { padding: 0.3rem 0.6rem; }
  .booklet-line h3 { font-size: 1rem; margin: 0.6rem 0 0.2rem; }
  .booklet-toc { margin-top: 0.6rem; }
  .booklet-toc h3 { font-size: 1rem; margin: 0 0 0.3rem; }
  .booklet-toc ul { margin: 0; padding-left: 1.2rem; columns: 2; column-gap: 1.5rem; }
  .booklet-toc li { break-inside: avoid; }

  /* Tulosteen valmistelu-indikaattori (UX): ei estä tulostusta, .no-print → ei näy printissä */
  #printPrep { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;

  .pp-box { background: var(--card); color: var(--text); padding: 0.9rem 1.4rem; border-radius: var(--radius);

  /* Pysäkkijuliste: linjat tuntikaavioina, vierekkäin kun tilaa */
  .poster-sub { font-weight: var(--wmed); margin: 0.1rem 0 0.5rem; }

  /* "·"-selite tulostetaulujen alla + yhdistetyn suunta-aikataulun sarakkeet */

  /* QR-koodit (näyttö + juliste) */

  .dtopt { display: inline-flex; align-items: center; gap: 0.35rem; cursor: pointer; }

  /* Kokoa-painike pysyy näkyvissä pitkää linjalistaa selatessa */
  .buildbar {

  ul.ex-list { list-style: none; padding: 0; margin: 0.6rem 0 0; }

  .ex-date { flex: 0 0 auto; min-width: 8.5rem; }
  .ex-name { flex: 1 1 auto; font-weight: var(--wmed); }

  p.co2 { margin: 0.3rem 0 0.1rem; font-size: 0.88rem; color: #1e7d3a; }

  #fbForm label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0.6rem 0 0.15rem; }

  #fbForm textarea { font: inherit; padding: 0.55rem 0.7rem; border: 1px solid var(--line);

  #fbStatus { margin: 0.6rem 0 0; }

  .map { height: clamp(340px, 55vh, 540px); border-radius: 6px; margin: 0.5rem 0; z-index: 0; }
  .map-small { height: clamp(220px, 35vh, 340px); }
  .bigmap { height: clamp(400px, 78vh, 900px); }
  a.badgelink { text-decoration: none; }
  .bus-live-wrap { background: none; border: none; }
  .bus-live { display: flex; width: 28px; height: 28px; align-items: center; justify-content: center;
    border: 2px solid #fff; border-radius: 50%; font-weight: var(--wmed); font-size: 0.66rem;
    box-sizing: border-box; }
  /* Keskusterminaalien laituritunnukset kartalla */
  .plat-marker-wrap { background: none; border: none; }

    border-radius: var(--radius-sm); font-weight: var(--wmed); font-size: 0.85rem; box-sizing: border-box; }
  .plat-list { list-style: none; padding: 0; margin: 0.5rem 0 0; display: grid; gap: 0.5rem; }
  .plat-item { border: 1px solid var(--line); border-radius: var(--radius-card);
    box-shadow: var(--shadow-1); padding: 0.7rem 0.85rem; }
  .plat-item .plat-head { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .plat-name { font-weight: var(--wmed); }
  .plat-item .plat-head > a { margin-left: auto; }
  .plat-tag { display: inline-flex; min-width: 1.8rem; height: 1.8rem; padding: 0 0.45rem;
    align-items: center; justify-content: center; background: var(--blue); color: #fff;
    border-radius: var(--radius-sm); font-weight: var(--wmed); font-variant-numeric: tabular-nums; }
  .plat-lines { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.4rem; }
  .plat-tabs { flex-wrap: wrap; }
  /* Liput ja hinnat */
  .notice { background: var(--rt-bg); border-left: 4px solid var(--green); border-radius: var(--radius-control);
    padding: 0.7rem 0.9rem; margin: 0.4rem 0 0.9rem; }
  .notice p { margin: 0.3rem 0 0; }
  .fare-wrap { overflow-x: auto; margin: 0.3rem 0 0.5rem; }
  table.fare { width: 100%; border-collapse: collapse; }
  table.fare th, table.fare td { padding: 0.4rem 0.55rem; border-bottom: 1px solid var(--border); text-align: left; }
  table.fare thead th { font-size: 0.8rem; color: var(--muted); font-weight: 600; vertical-align: bottom; }
  table.fare tbody th { font-weight: var(--wmed); }
  table.fare td { font-variant-numeric: tabular-nums; white-space: nowrap; }
  ul.bullets { margin: 0.3rem 0; padding-left: 1.2rem; }
  ul.bullets li { margin: 0.2rem 0; }
  .fares-source { margin-top: 0.9rem; font-size: 0.85em; }
  /* Tallennetut matkat */
  .saved-trip { border-top: 1px solid var(--border); padding: 0.2rem 0 0.4rem; }
  .saved-trip:first-child { border-top: none; }
  .saved-row { display: flex; align-items: center; gap: 0.5rem; }
  .saved-row a.item { flex: 1; }
  .saved-next { margin: 0.1rem 0 0 0.4rem; }
  .saved-next .badge { vertical-align: middle; }
  .leaflet-popup-content a { color: var(--blue); }
  .bus-marker {
    background: #b34700;
    color: #fff;
    border: 2px solid #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: var(--wmed);
    font-size: 0.68rem;
  }
  details.itin {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0.7rem 0.85rem;
    margin: 0.55rem 0;
    background: var(--card);
    transition: border-color 0.15s;
  }
  details.itin:hover { border-color: var(--blue); }
  details.itin[open] { border-color: var(--blue); }
  details.itin summary { cursor: pointer; list-style: none; position: relative; padding-right: 1.4rem; }
  details.itin summary::-webkit-details-marker { display: none; }
  details.itin summary::after {
    content: "▾";
    position: absolute;
    right: 0.1rem;
    top: 0.1rem;
    color: var(--muted);
    transition: transform 0.15s;
  }
  details.itin[open] summary::after { transform: rotate(180deg); }
  .itin-head { display: flex; flex-wrap: wrap; gap: 0.3rem 0.8rem; align-items: baseline; }
  /* Linjasivun "Koko aikataulu" -lohko: kapealla näytöllä taitettava (oletus KIINNI), desktopilla
     (>=700px) aina auki. Toteutus omalla luokalla (ei natiivi <details>, jonka taitto ei toiminut
     tällä sivulla) → deterministinen näkyvyys CSS:llä. */
  .ft-toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
    width: 100%; background: transparent; border: 0; padding: 0.2rem 0;
    font: inherit; font-weight: var(--wmed); font-size: 1.1rem; color: var(--blue); cursor: pointer;
  }
  .ft-toggle::after { content: "▾"; color: var(--muted); transition: transform 0.15s; }
  .ft-toggle[aria-expanded="true"]::after { transform: rotate(180deg); }
  .ft-collapse .ft-body { display: none; }
  .ft-collapse.ft-open .ft-body { display: block; }
  @media (min-width: 700px) {
    .ft-toggle { display: none; }
    .ft-collapse .ft-body { display: block; }
  }
  .itin-head .times { font-weight: var(--wmed); font-variant-numeric: tabular-nums; font-size: 1.02rem; }
  .legchips { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; margin-top: 0.25rem; }
  .legchips .sep { color: var(--muted); }
  .legchips button.badge { border: none; cursor: pointer; padding: 0.15rem 0.5rem; }
  .legchips button.badge[aria-pressed="true"] { outline: 3px solid var(--blue); outline-offset: 2px; }
  #stopRoutes.filtered button.badge[aria-pressed="false"] { opacity: 0.4; }
  /* Suhteellinen osuuspalkki: legien leveys = kesto */
  /* Reittitulosten kevyt edistymispalkki (matalampi, pehmeämpi) */
  .legbar { display: flex; gap: 2px; margin-top: 0.4rem; height: 1.05rem; border-radius: 5px; overflow: hidden; opacity: 0.92; }
  .legbar .seg .ic { width: 0.85em; height: 0.85em; }
  .legbar .seg {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.66rem;
    font-weight: var(--wmed);
    color: #fff;
    min-width: 0.9rem;
    overflow: hidden;
    white-space: nowrap;
  }
  .legbar .seg.walk {
    background: var(--chip);
    color: var(--text);
  }
  /* Pystyaikajana reittiohjeille */
  .tl { margin: 0.7rem 0 0.2rem; }
  .tl-row {
    display: grid;
    grid-template-columns: 3.3rem 1.1rem 1fr;
    column-gap: 0.6rem;
  }
  .tl-time {
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: var(--wmed);
    font-size: 0.9rem;
    padding-top: 0.05rem;
  }
  .tl-mid { position: relative; }
  .tl-row.pt .tl-mid::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 0.3rem;
    width: 0.66rem;
    height: 0.66rem;
    border-radius: 50%;
    background: var(--card);
    border: 3px solid var(--blue);
    transform: translateX(-50%);
    z-index: 1;
    box-sizing: border-box;
  }
  .tl-row.pt.start .tl-mid::after { border-color: var(--green); }
  .tl-row.pt.end .tl-mid::after { border-color: var(--sev-severe); }
  .tl-row.leg .tl-mid::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -0.5rem;
    bottom: -0.5rem;
    width: 5px;
    transform: translateX(-50%);
    background: var(--rail, var(--blue));
    border-radius: 3px;
  }
  .tl-row.leg.dashed .tl-mid::before {
    width: 0;
    border-left: 4px dotted var(--rail, var(--muted));
    background: none;
    border-radius: 0;
  }

  details.tl-stops li { font-size: 0.85rem; color: var(--muted); padding: 0.1rem 0; display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
  details.tl-stops li .tl-stop-name { min-width: 0; overflow-wrap: anywhere; }
  details.tl-stops li .tl-stop-time { flex: none; font-variant-numeric: tabular-nums; white-space: nowrap; }
  nav.crumb { margin-bottom: 0.75rem; font-size: 0.9rem; }
  nav.crumb a { color: var(--blue); }
  footer { margin-top: 2rem; padding: 1.6rem 1rem 2rem; font-size: 0.82rem; color: var(--muted);
    background: var(--card); border-top: 1px solid var(--border); }
  /* Palvelutiski-tila: koko ruudun työntekijän näyttö. Pakotettu kirkas korkea
     kontrasti — .desk ylikirjoittaa tokenit, joten ilme on sama riippumatta teemasta. */
  body.desk-mode header, body.desk-mode #appFooter { display: none; }
  body.desk-mode main { max-width: none; padding: 0; }
  .desk {
    --bg: #ffffff; --card: #ffffff; --text: #111111; --muted: #2f2f2f;
    --border: #1a1a1a; --hover: #eaf0fb; --chip: #e7edf6;
    --blue: #0033cc; --btn-bg: #0033cc; --btn-hover: #001f99;
    --rt-bg: #d6f0d6; --rt-text: #00540f;
    /* REILA F3: tiski on tahallaan pakotettu kirkas korkea kontrasti riippumatta teemasta.
       F3 alkoi kuluttaa Reila-neutraaleja (--field-bg/--line/--accent/--ink) kentissä/napeissa,
       joten ne on pakotettava tässä myös → tumma teema ei vuoda tiskin valkoiselle pinnalle. */
    --field-bg: #ffffff; --line: #1a1a1a; --surface: #ffffff;
    --ink: #111111; --ink-muted: #2f2f2f; --ink-muted-2: #2f2f2f;
    --accent: #0033cc; --accent-dark: #001f99;
    background: #ffffff; color: #111111; min-height: 100vh; box-sizing: border-box;
    padding: clamp(1rem, 2.2vw, 2.2rem);
    font-size: clamp(1.05rem, 1.35vw, 1.3rem);
  }
  .desk-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    border-bottom: 3px solid var(--blue); padding-bottom: 0.6rem; margin-bottom: 1.1rem; flex-wrap: wrap; }
  .desk-top h1 { margin: 0; font-size: clamp(1.5rem, 2.6vw, 2.4rem); font-weight: var(--wmed); }
  .desk-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 1.4rem; align-items: start; }
  @media (max-width: 820px) { .desk-grid { grid-template-columns: 1fr; } }
  .desk-col { border: 2px solid var(--border); border-radius: var(--radius); padding: 1.1rem 1.2rem; background: #fff; }
  .desk-col h2 { font-size: clamp(1.2rem, 1.9vw, 1.6rem); }
  .desk-field { margin: 0 0 0.9rem; }
  .desk-field label { display: block; font-weight: var(--wmed); margin-bottom: 0.3rem; }
  .desk input[type="text"] { font-size: 1.15em; min-height: 60px; border: 2px solid var(--border); }
  .desk .suggest-list { border: 2px solid var(--border); }
  .desk .suggest-list .item { padding: 0.7rem 0.5rem; min-height: 52px; font-size: 1.02em; }
  .desk-h3 { font-size: clamp(1.1rem, 1.7vw, 1.4rem); margin: 1.1rem 0 0.4rem; font-weight: var(--wmed); }
  /* "Kerro asiakkaalle": korostettu, iso, ääneen luettava suositus */
  .desk-tell { border: 3px solid var(--blue); border-radius: var(--radius); padding: 1rem 1.2rem;
    margin: 0.4rem 0 0.7rem; background: #eef4ff; }
  .desk-tell-h { font-size: 0.8em; font-weight: var(--wmed); text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--blue); }
  .desk-tell-body { font-size: clamp(1.2rem, 2vw, 1.7rem); line-height: 1.4; margin: 0.35rem 0 0; }
  /* "Seuraava bussi" -kortti: kun kävely on nopein mutta asiakas kysyi bussia (rauhallinen korostus) */
  .desk-next-bus { border: 2px solid var(--blue); border-left-width: 6px; border-radius: var(--radius);
    padding: 0.85rem 1.1rem; margin: 0.2rem 0 0.7rem; background: var(--card); }
  .desk-next-bus--none { border-color: var(--border); border-left-color: var(--muted); }
  .desk-next-bus-h { font-size: 0.8em; font-weight: var(--wmed); text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--blue); display: flex; align-items: center; gap: 0.35rem; }
  .desk-next-bus-h .ic { width: 1.2em; height: 1.2em; }
  .desk-next-bus-body { font-size: clamp(1.1rem, 1.8vw, 1.5rem); line-height: 1.4; margin: 0.35rem 0 0;
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; }
  .desk-next-bus-body .badge { font-size: 1em; padding: 0.15rem 0.55rem; }
  .desk-opt { border: 2px solid var(--border); border-radius: var(--radius); padding: 0.8rem 1rem; margin: 0.5rem 0; }
  .desk-opt-top { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; align-items: baseline; }
  .desk-opt-time { font-size: 1.3em; font-weight: var(--wmed); font-variant-numeric: tabular-nums; }
  .desk-opt-dur { font-weight: var(--wmed); }
  .desk-opt-lines { margin: 0.45rem 0; display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
  .desk-opt-lines .badge { font-size: 1.05em; }
  details.desk-stops summary { cursor: pointer; color: var(--blue); font-weight: var(--wmed); margin-top: 0.2rem; }
  ul.desk-stoplist { list-style: none; margin: 0.4rem 0 0; padding: 0; }
  ul.desk-stoplist li { padding: 0.22rem 0; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  ul.desk-stoplist li:last-child { border-bottom: none; }
  ul.desk-stoplist li.ds-mid { color: var(--muted); padding-left: 1.3rem; font-size: 0.95em; }
  ul.desk-stoplist li.ds-board, ul.desk-stoplist li.ds-alight { font-weight: var(--wmed); }
  .desk-stop-h { font-weight: var(--wmed); margin: 0.7rem 0 0.35rem; }
  .desk-stop-lines { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .desk-stop-lines .badge { font-size: 1.1em; padding: 0.2rem 0.6rem; }
  /* Palvelutiski (Kierros 2): ensisijainen pysäkin lähdöt -lohko, lisätoimet, aputiedot */
  .desk-col--primary { border-color: var(--blue); border-width: 3px; }
  .desk-actions { margin: 0.3rem 0 0.6rem; display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .desk-actions button { font-size: 1.02em; min-height: 56px; }
  .desk-deps-lines { margin: 0 0 0.6rem; display: flex; flex-wrap: wrap; gap: 0.35rem; align-items: center; }
  .desk-deps-lines .badge { font-size: 1.05em; padding: 0.18rem 0.55rem; }
  .desk-deps-upd { margin-top: 0.55rem; }
  /* Kiinnitys ja tulostusnappi samalla rivillä; kapealla ruudulla ne rivittyvät
     eivätkä puristu päällekkäin (tiskillä käytetään myös tablettia). */
  .desk-pin-row { margin: 0.6rem 0 0; display: flex; flex-wrap: wrap; gap: 0.6rem;
    align-items: center; }
  .desk .deps td, .desk .deps th { font-size: 1em; padding: 0.45rem 0.5rem; }
  .desk-aux { display: grid; grid-template-columns: 1.5fr 1fr; gap: 1.4rem; align-items: start; margin-top: 1.4rem; }
  @media (max-width: 820px) { .desk-aux { grid-template-columns: 1fr; } }
  .desk-aux .alert { font-size: 0.95em; }
  .desk-fares-single { font-weight: var(--wmed); margin: 0 0 0.4rem; }
  table.desk-fares td { text-align: right; font-weight: var(--wmed); }
  table.desk-fares th { font-size: 1em; color: var(--text); }
  /* Inline-ikonit: kokoa em:nä → skaalautuu tekstikoon mukaan, väri perii currentColorin */
  .ic { width: 1.15em; height: 1.15em; vertical-align: -0.18em; flex: none; }
  h1 .ic, h2 .ic, h3 .ic { color: var(--blue); margin-right: 0.1rem; }
  /* Etusivun hero: reittihaku pääpainopisteenä */
  .hero h2 { display: flex; align-items: center; gap: 0.4rem; font-size: 1.3rem; }
  /* Layer-hero: arvolupaus + nostot; A->B toissijaisena alaosassa */
  .hero-layer h2 { font-size: 1.45rem; }
  .hero-highlights { display: grid; gap: 0.6rem; margin: 0 0 1.1rem; }
  @media (min-width: 600px) { .hero-highlights { grid-template-columns: repeat(3, 1fr); } }
  .hl { display: flex; flex-direction: column; gap: 0.15rem; text-align: left;
    padding: 0.75rem 0.85rem; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--card); color: var(--text); text-decoration: none; cursor: pointer; font: inherit; }
  .hl:hover { border-color: var(--blue); background: var(--hover); }
  /* Hierarkiapassi: nosto-otsikot ink-väriin, ikonit neutraaliin harmaaseen
     → vahva brändiväri jää headeriin + primäärinappiin (ei kilpailevaa sinistä). */
  .hl .ic { color: var(--muted); width: 1.4em; height: 1.4em; }
  /* SV-ylivuotosuoja: pitkä yhdyssana (esim. "Störningsmeddelanden") katkeaa riville
     eikä valu kortin reunan yli — myös sarakkeen ollessa kapea (flex/grid-lapsi). */
  .hl-t { font-weight: var(--wmed); color: var(--text); min-width: 0; overflow-wrap: anywhere; }
  .hl-d { font-size: 0.85rem; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
  .hero-journey { border-top: 1px solid var(--border); padding-top: 0.8rem; }
  .hero-journey-h { display: flex; align-items: center; gap: 0.4rem; font-size: 1.05rem;
    font-weight: var(--wmed); margin: 0 0 0.5rem; color: var(--muted); }
  .hero-journey-h .ic { color: var(--muted); }
  /* A->B-merkki reittihaun otsikon vieressä (erottaa A->B-haun universaalihausta) */
  .ab-badge { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; line-height: 1;
    padding: 0.18rem 0.42rem; border-radius: 999px; background: var(--chip); color: var(--muted);
    border: 1px solid var(--border); white-space: nowrap; }
  /* Erillinen universaalihaku-lohko: kevyt neutraali tausta erottaa sen A->B-herosta */
  .search-section { background: var(--hover); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0.85rem 0.9rem; margin: 0 0 1.1rem; }
  .search-section-h { display: flex; align-items: center; gap: 0.4rem; font-size: 1.05rem;
    font-weight: var(--wmed); margin: 0 0 0.5rem; color: var(--text); }
  .search-section-h .ic { color: var(--muted); }
  .search-section .home-search { margin: 0; }
  .hero-fields { display: grid; gap: 0.65rem; margin: 0.5rem 0 0.85rem; }
  @media (min-width: 560px) { .hero-fields { grid-template-columns: 1fr 1fr; } }
  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    width: 100%; font-size: 1.08rem; padding: 0.85rem 1.2rem; min-height: 56px;
  }
  .btn-primary .ic { width: 1.25em; height: 1.25em; }
  @media (min-width: 560px) { .btn-primary { width: auto; min-width: 15rem; } }
  /* Työkalut: hillitty, sekundaarinen ikonirivi (pienemmät kuin hero/lähimmät) */
  /* 140 px katkoi pitkät suomalaiset yhdyssanat kesken sanan ("Poikkeuspäivä-t"); 168 px
     vie ne yhdelle riville eikä vie saraketta pois (mitattu 13.8.2026: 5 saraketta ennallaan). */
  .tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 0.55rem; margin: 0 0 1.1rem; }
  /* Kompakti yhden rivin haku heron alle (ei isoa korttia) */
  .home-search { margin: 0 0 1.1rem; }
  .hs-field { display: flex; align-items: center; gap: 0.5rem;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 0 0.7rem; }
  .home-search:focus-within .hs-field { border-color: var(--blue); }
  .hs-field .ic { color: var(--muted); flex: none; }
  .hs-field input { flex: 1; min-width: 0; border: 0; background: transparent;
    padding: 0.65rem 0; font: inherit; color: var(--text); }
  .hs-field input:focus { outline: none; }
  .home-search #searchResults:not(:empty) { margin-top: 0.4rem; }
  /* Ryhmitellyt pikavalinnat: otsikoitu ryhmä; tyhjä ryhmä ei renderöidy lainkaan */
  .tool-group { margin: 0 0 1.1rem; }
  .tool-group-h { font-size: 0.95rem; font-weight: var(--wmed); margin: 0 0 0.5rem;
    color: var(--muted); letter-spacing: 0.01em; }
  .tool-group .tool-grid { margin: 0; }
  .tool { display: flex; align-items: center; gap: 0.55rem; padding: 0.7rem 0.8rem;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
    color: var(--text); text-decoration: none; font-size: 0.9rem; line-height: 1.2;
    transition: background 0.12s, border-color 0.12s; }
  /* Tekstisarake on flex-lapsi → min-width:0, jotta se kutistuu kortin alle, ja pitkä
     yhdyssana (esim. SV "Störningsmeddelanden") katkeaa riville eikä valu reunan yli. */
  .tool span { min-width: 0; overflow-wrap: anywhere; }
  .tool:hover { background: var(--hover); border-color: var(--blue); }
  .tool .ic { color: var(--blue); width: 1.35em; height: 1.35em; flex-shrink: 0; }
  /* Luonnollisen kielen älykenttä + mikrofoni */
  .nl-field { margin: 0.2rem 0 0.3rem; }
  .nl-field label { display: block; font-weight: var(--wmed); margin-bottom: 0.3rem; }
  .nl-row { display: flex; gap: 0.5rem; align-items: stretch; }
  .nl-row input { flex: 1; }
  .nl-mic { flex: none; min-width: 52px; padding: 0.5rem;
    display: inline-flex; align-items: center; justify-content: center; }
  .nl-mic .ic { width: 1.45em; height: 1.45em; }
  /* Kuuntelutila: staattinen korostus (ei animaatiokikkoja) */
  .nl-mic.listening { background: var(--sev-severe); color: #fff; border-color: var(--sev-severe); }
  .nl-hint { font-size: 0.82rem; margin: 0.35rem 0 0; }
  /* "— tai —" -erotin NL-kentän ja Mistä/Minne-lomakkeen välissä */
  .nl-sep { display: flex; align-items: center; gap: 0.6rem; color: var(--muted);
    font-size: 0.85rem; margin: 0.7rem 0; }
  .nl-sep::before, .nl-sep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  /* Yhtenäinen haku: mic-ikoni Mistä-kentän sisällä */
  .suggest.with-mic input { padding-right: 3rem; }
  .field-mic { position: absolute; top: 0; right: 0; height: 100%; width: 2.8rem;
    display: inline-flex; align-items: center; justify-content: center; min-height: 0;
    background: none; border: none; color: var(--muted); cursor: pointer; padding: 0; }
  .field-mic:hover { color: var(--blue); }
  .field-mic.listening { color: var(--sev-severe); }
  .field-mic .ic { width: 1.4em; height: 1.4em; }
  /* Hero-toiminnot: ensisijainen (sininen) + lähimmät (neutraali). Mobiili = pinottu
     luonnollisella korkeudella; ≥560px = vierekkäin (flex-basis vain row-suunnassa). */
  .hero-actions { display: flex; flex-direction: column; gap: 0.6rem; margin: 0.5rem 0 0.2rem; }
  .hero-actions .btn-primary, .hero-actions .secondary { width: 100%; flex: 0 0 auto; }
  @media (min-width: 560px) {
    .hero-actions { flex-direction: row; }
    .hero-actions .btn-primary { flex: 1 1 15rem; width: auto; }
    .hero-actions .secondary { flex: 0 1 auto; width: auto; }
  }
  /* Häiriöt ohuena bannerina otsikon alle (ei iso pinottu kortti) */
  .alerts-banner { margin-bottom: 0.9rem; }
  .alerts-banner:empty { display: none; }
  .alerts-banner .alertsum { padding: 0.5rem 0.85rem; margin-bottom: 0; }
  .alerts-banner .infosum { padding: 0.5rem 0.85rem; margin-bottom: 0; }
  .alerts-banner .alertsum summary, .alerts-banner .infosum summary { font-size: 0.95rem; }

  /* ============================================================
     REILA F2 — reittihaun visuaalinen layout (hakukortti + A->B-tuloskortit
     + karttasivupalkki). Kuluttaa F1-tokeneita (--accent/-soft/-dark, --surface,
     --ink, --line, --field-bg, --radius-card/-control/-segment, --shadow-*, coral).
     KAIKKI värit --accent-ketjun kautta → per-kaupunki brändiväri seuraa.
     Ei kosketa per-kaupunki html[data-city] -selektoreihin. ============ */
  :root { --bus: #26332C; --bus-text: #ffffff; }          /* bussimerkki (neutraali tumma) */
  html[data-theme="dark"] { --bus: #3a4a42; --bus-text: #ffffff; }   /* tummassa vaaleampi, erottuu kortista */
  html[data-contrast="high"] { --bus: #000000; }
  html[data-theme="dark"][data-contrast="high"] { --bus: #ffffff; --bus-text: #000000; }

  /* ---- REILA F5: hero-kaista (ilmava, tuotemainen). Tausta = --accent-soft → seuraa
     per-kaupunki-väriä (Lahti/Salo/Kajaani sininen-soft, Kotka oranssi-soft, Vaasa pinkki-soft)
     ja teemaa automaattisesti. Suuri padding-bottom → seuraava .searchcard.sc-hero limittyy.
     H1 = --ink (≥12.7:1 softilla kaikissa kaupungeissa), alaotsikko = --ink-muted (≥4.52:1). ---- */
  .reila-hero { background: var(--accent-soft); border-radius: var(--radius-card);
    padding: 2.75rem 1.5rem 4rem; margin: 0 0 1rem; }
  .reila-hero h1, .reila-hero-h1 { margin: 0; font-size: var(--fs-h1); font-weight: var(--fw-h1);
    letter-spacing: -1px; line-height: var(--lh-tight); color: var(--ink); overflow-wrap: anywhere; }
  .reila-hero .reila-hero-sub { margin: 0.7rem 0 0; font-size: 1.06rem; color: var(--ink-muted);
    max-width: 38rem; overflow-wrap: anywhere; }
  /* layer-hero: nostot + A->B-journey soft-kaistalla (säilyttää .hl-ruudut + hero-journeyn) */
  .reila-hero .hero-highlights { margin-top: 1.1rem; }
  .reila-hero .hero-journey { border-top-color: var(--line); }
  /* mobiili: tiiviimpi kaista, ettei iso H1 vie koko ruutua kapealla */
  @media (max-width: 560px) {
    .reila-hero { padding: 1.6rem 1.05rem 3rem; }
    .reila-hero h1, .reila-hero-h1 { font-size: 1.9rem; letter-spacing: -0.5px; }
  }

  /* ---- Hakukortti (jaettu: etusivu + reitti) ---- */
  .searchcard { background: var(--surface); border-radius: var(--radius-card);
    box-shadow: var(--shadow-3); padding: 16px; }
  /* sc-hero: hakukortti limittyy hero-kaistan päälle (referenssin margin-top:-32px) */
  .searchcard.sc-hero { margin-top: -2rem; position: relative; z-index: 1; }
  @media (max-width: 560px) { .searchcard.sc-hero { margin-top: -1.6rem; } }
  .searchcard .sc-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .sc-field { flex: 1 1 200px; min-width: 170px; }
  .sc-label { display: block; font-size: var(--fs-xs); font-weight: 700; text-transform: uppercase;
    letter-spacing: .6px; color: var(--ink-muted); margin: 0 0 6px 4px; }
  .sc-box { position: relative; display: flex; align-items: center; gap: 10px;
    background: var(--field-bg); border: 1px solid var(--line); border-radius: var(--radius-control);
    padding: 0 14px; min-height: 52px; }
  .sc-box:focus-within { border-color: var(--accent); }
  .sc-dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .sc-dot.from { background: var(--accent); }
  /* F4: Minne-piste = --dest (Kotka vihreä, muut coral). 1px --dest-edge -reuna takaa
     ei-tekstikontrastin ≥3:1 viereistä pintaa vasten (coral/valkoinen olisi 2.89). */
  .sc-dot.to { background: var(--dest); box-shadow: 0 0 0 1px var(--dest-edge); }
  .sc-box input { border: none; background: transparent; outline: none; font-size: 16px;
    font-weight: 600; width: 100%; min-height: 44px; color: var(--ink); padding: 0; }
  /* mikrofoni kentän oikeaan reunaan (säilyttää #homeNlMic/.field-mic) */
  .sc-box .field-mic { position: static; height: auto; width: 2.6rem; min-height: 44px;
    background: transparent; border: none; color: var(--ink-muted); flex: none; }
  .sc-box .field-mic:hover { color: var(--accent-dark); background: transparent; }
  .sc-box .suggest-list { left: -1px; right: -1px; }
  .sc-swap { flex: none; width: 46px; min-height: 52px; border: 1px solid var(--line);
    background: var(--surface); border-radius: var(--radius-control); font-size: 19px;
    color: var(--ink-muted); display: flex; align-items: center; justify-content: center; padding: 0; }
  .sc-swap:hover { border-color: var(--accent); color: var(--accent-dark); background: var(--surface); }
  .sc-time { display: flex; align-items: center; gap: 6px; background: var(--field-bg);
    border: 1px solid var(--line); border-radius: var(--radius-control); padding: 6px; min-height: 52px;
    flex-wrap: wrap; }
  .sc-seg { border: none; background: transparent; color: var(--ink-muted); font-size: 13.5px;
    font-weight: 700; border-radius: var(--radius-segment); padding: 8px 13px; min-height: 40px; }
  .sc-seg[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-dark); }
  .sc-time input[type="datetime-local"] { border: none; background: transparent; min-height: 40px;
    font-weight: 600; color: var(--ink); width: auto; }
  .sc-cta { flex: 0 0 auto; min-height: 52px; background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius-control); padding: 0 26px; font-size: 16px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 8px; }
  .sc-cta:hover { background: var(--accent-dark); }
  .sc-extra { display: flex; align-items: center; gap: 14px 18px; flex-wrap: wrap; margin-top: 12px; }
  .sc-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600;
    color: var(--ink); cursor: pointer; min-height: 44px; }
  .sc-chip input { width: 1.15rem; height: 1.15rem; accent-color: var(--accent); }

  /* ---- Tulosten yläpalkki + lajittelusegmentit ---- */
  .plan-topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; margin: 0 0 14px; }
  .plan-count { font-size: 15px; color: var(--ink-muted); }
  .plan-count strong { color: var(--ink); font-weight: 700; }
  .plan-sort { display: flex; align-items: center; gap: 6px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 11px; padding: 5px; flex-wrap: wrap; }
  .plan-sort button { border: none; background: transparent; color: var(--ink-muted); font-size: 13.5px;
    font-weight: 600; border-radius: 8px; padding: 8px 14px; min-height: 40px; }
  .plan-sort button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

  /* ---- Kaksisarakelayout (desktop >=1000px): tulokset + karttasivupalkki ---- */
  /* oletus: sivupalkki piilossa (mobiili/kapea); desktop-sääntö alla nostaa spesifisyyttä
     (body.plan-mode .plan-aside) jotta se voittaa tämän riippumatta lähdekoodijärjestyksestä */
  .plan-aside { display: none; }
  @media (min-width: 1000px) {
    body.plan-mode main { max-width: var(--container-max); }
    body.plan-mode .plan-grid { display: flex; gap: 24px; align-items: flex-start; }
    body.plan-mode .plan-grid .plan-results { flex: 1 1 auto; min-width: 0; }
    body.plan-mode .plan-aside { flex: 0 0 360px; position: sticky; top: 90px; display: block; }
    /* desktopilla reitin kartta näkyy sivupalkissa → kortin sisäinen kartta piiloon */
    body.plan-mode details.itin .map { display: none; }
  }
  .plan-aside .aside-card { background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-card); overflow: hidden; box-shadow: var(--shadow-1); }
  /* Sivupalkkikartta: kaupungin kartta näkyy heti (initAsideCity) → neutraali latauspohja
     (raidoitettu placeholder poistettu). Leaflet-tiilet peittävät pohjan kun kartta latautuu. */
  #planAsideMap { height: 360px; width: 100%; background: var(--field-bg); }
  /* .aside-empty = pre-JS-fallback (initAsideCity tyhjentää sen); ei näy normaalitilassa */
  .plan-aside .aside-empty { display: flex; align-items: center; justify-content: center; height: 100%;
    color: var(--ink-muted-2); font-size: 14px; padding: 1rem; text-align: center; }

  /* ---- A->B-tuloskortti (handoff): restyle olemassa oleva details.itin ---- */
  details.itin { border-radius: var(--radius-card); border: 1px solid var(--line);
    box-shadow: var(--shadow-1); margin: 0 0 14px; transition: box-shadow .15s, border-color .15s; }
  details.itin[open] { border: 2px solid var(--accent); box-shadow: var(--shadow-3); }
  details.itin > summary { padding: 16px 18px; }
  details.itin > summary::after { right: 16px; top: 18px; font-size: 20px; color: var(--ink-muted-2); }
  .itin-head { display: grid; grid-template-columns: minmax(96px,auto) 1fr minmax(120px,max-content);
    align-items: center; gap: 18px; }
  .ih-time { display: flex; flex-direction: column; gap: 3px; }
  .ih-time .times { font-size: 19px; font-weight: 800; letter-spacing: -.3px;
    font-variant-numeric: tabular-nums; color: var(--ink); }
  .ih-dur { font-size: 14px; font-weight: 600; color: var(--ink-muted); }
  .ih-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; text-align: right; }
  .ih-transfers { font-size: 14.5px; font-weight: 700; color: var(--ink); }
  .ih-walk { font-size: 13px; font-weight: 600; color: var(--ink-muted-2); }
  .live-pill { display: inline-flex; align-items: center; gap: 7px; background: var(--coral-soft);
    border-radius: var(--pill); padding: 4px 11px 4px 9px; }
  .live-pill .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--coral); flex: none; }
  .live-pill.pulse .live-dot { animation: reilaPulse 1.8s infinite; }
  .live-pill span.live-text { font-size: 13px; font-weight: 700; color: var(--live-text); }
  @keyframes reilaPulse {
    0% { box-shadow: 0 0 0 0 rgba(240,115,78,.55); }
    70% { box-shadow: 0 0 0 8px rgba(240,115,78,0); }
    100% { box-shadow: 0 0 0 0 rgba(240,115,78,0); }
  }

  /* ---- Matka-aikajana (legbar): bussi = täytetty --bus-palkki, kävely = katkoviiva+min ---- */
  .legbar { display: flex; align-items: center; gap: 5px; height: 27px; margin: 0; overflow: visible;
    border-radius: 0; opacity: 1; }
  .legbar .seg { flex-basis: 0; min-width: 46px; height: 27px; border-radius: 8px; background: var(--bus);
    color: var(--bus-text); font-size: 13.5px; font-weight: 700; letter-spacing: .3px;
    display: flex; align-items: center; justify-content: center; }
  .legbar .seg.walk { position: relative; background: transparent; min-width: 26px; color: var(--ink-muted-2); }
  .legbar .seg.walk::before { content: ""; position: absolute; left: 2px; right: 2px; top: 50%;
    border-top: 2px dotted var(--line); }
  .legbar .seg.walk .walk-min { position: relative; background: var(--surface); padding: 0 4px;
    font-size: 11.5px; font-weight: 700; color: var(--ink-muted-2); font-variant-numeric: tabular-nums; }

  /* ---- Laajennettu pysäkkiaikajana (tl): handoff-tyyli ---- */
  details.itin .tl { background: var(--surface); border-top: 1px solid var(--line-divider);
    margin: 0; padding: 16px 18px 18px; border-radius: 0 0 var(--radius-card) var(--radius-card); }

    table.corridor thead th:nth-child(2) { width: 9%; }

let lang = localStorage.getItem("lang") || "fi";
if (!STRINGS[lang]) lang = "fi";

// Kuntalaiselle näkyvä joukkoliikenneverkon ilmaus (esim. "Kajaanin joukkoliikenteessä").
// Oletus johdetaan kaupungin genetiivistä/nimestä; CONFIG.network (per kieli) ylikirjoittaa
// (Lahti käyttää "seudun"-muotoa). Käytetään {network}-placeholderissa, esim. homeIntro.
// Kaupungin näyttönimi valitulla kielellä (Vaasa→"Vasa" SV). Oletus CONFIG.city;
// CONFIG.cityNames[lang] / cityGenitives[lang] ylikirjoittaa kielikohtaisesti.
function cityName() { return (CONFIG.cityNames && CONFIG.cityNames[lang]) || CONFIG.city; }
function cityGenName() { return (CONFIG.cityGenitives && CONFIG.cityGenitives[lang]) || CONFIG.cityGenitive; }

function networkPhrase() {
  if (CONFIG.network && CONFIG.network[lang]) return CONFIG.network[lang];
  if (CONFIG.network && CONFIG.network.fi) return CONFIG.network.fi;
  if (lang === "en") return cityName() + " public transport";
  if (lang === "sv") return cityName() + " kollektivtrafik";
  return cityGenName() + " joukkoliikenteessä";
}

function t(key, params) {
  let s = STRINGS[lang][key] ?? STRINGS.fi[key] ?? key;
  const all = { city: cityName(), cityGen: cityGenName(),
                operator: CONFIG.operator, operatorShort: CONFIG.operatorShort,
                network: networkPhrase(), ...params };
  return s.replace(/\{(\w+)\}/g, (_, k) => all[k] ?? "");
}

// Kaupunkikohtainen hintasivun copy (fares.i18n[key] = {fi,sv,en}). Puuttuva avain →
// fallbackKey:n geneerinen STRINGS-teksti, tai null → kutsuja jättää rivin/lohkon
// kokonaan renderöimättä. Tietoisesti EI fallbackia toisen kaupungin copyyn:
// Lahti-tekstit eivät saa vuotaa muille kaupungeille (fares-yleistys 7/2026).
function faresText(f, key, params, fallbackKey) {
  const src = f && f.i18n && f.i18n[key];
  const s = src == null ? null : (src[lang] ?? src.fi);
  if (s == null) return fallbackKey ? t(fallbackKey, params) : null;
  return String(s).replace(/\{(\w+)\}/g, (_, k) => (params && params[k] != null ? params[k] : ""));
}

// Ostopaikkalista ({fi,sv,en} → kielen mukainen taulukko; puuttuu → tyhjä)
function faresWhereItems(f) {
  const src = f && f.i18n && f.i18n.where;
  return (src && (src[lang] ?? src.fi)) || [];
}

function loadCmsAlerts(force) {
  if (!CONFIG.cmsAlerts || !PROXY_URL) return Promise.resolve([]);
  if (force) cmsAlertsPromise = null;
  if (!cmsAlertsPromise) {
    const { host, categoryId } = CONFIG.cmsAlerts;
    const u = PROXY_URL.replace(/\/$/, "") +
      `/cms-alerts?host=${encodeURIComponent(host)}&cat=${encodeURIComponent(categoryId)}`;
    cmsAlertsPromise = fetch(u)
      .then(r => (r.ok ? r.json() : { items: [] }))
      .then(d => (d && d.items) || [])
      .catch(() => []);   // degradoidu: ilman CMS-tiedotteita näytetään pelkät GTFS-RT
  }
  return cmsAlertsPromise;
}

/* ---------- Kaupungin itse julkaisemat tiedotteet (ylläpitonäkymä → worker /published) ----------
   Kaupungin henkilöstö julkaisee häiriötiedotteita admin-näkymässä; ne haetaan
   tässä ja yhdistetään etusivun banneriin GTFS-RT:n ja CMS:n rinnalle. */
let publishedPromise = null;
function loadPublished(force) {
  if (!PROXY_URL) return Promise.resolve({ alerts: [], fares: null });
  if (force) publishedPromise = null;
  if (!publishedPromise) {
    const u = PROXY_URL.replace(/\/$/, "") + "/published?city=" + encodeURIComponent(cityKey);
    publishedPromise = fetch(u)
      .then(r => (r.ok ? r.json() : {}))
      .then(d => ({ alerts: (d && d.alerts) || [], fares: (d && d.fares) || null, a11y: (d && d.a11y) || null }))
      .catch(() => ({ alerts: [], fares: null, a11y: null }));   // degradoidu: näytetään muut lähteet / CONFIG-oletukset
  }
  return publishedPromise;
}
function loadAdminAlerts(force) { return loadPublished(force).then(d => d.alerts); }

/* ---------- Anonyymi käyttöanalytiikka (kaupungin dashboardia varten) ----------
   Ei käyttäjätunnuksia, ei evästeitä, ei IP-tallennusta; kunnioittaa Do Not
   Track -asetusta. Lähetetään sendBeaconilla (fire-and-forget) workerin /track-
   päätepisteeseen, joka kirjaa anonyymin tapahtuman Analytics Engineen. */
function track(type, value) {
  try {
    if (!PROXY_URL) return;
    if (navigator.doNotTrack === "1" || window.doNotTrack === "1") return;
    const body = JSON.stringify({ type, value: String(value == null ? "" : value).slice(0, 80), city: cityKey });
    const u = PROXY_URL.replace(/\/$/, "") + "/track";
    if (navigator.sendBeacon) navigator.sendBeacon(u, body);
    else fetch(u, { method: "POST", body, keepalive: true }).catch(() => {});
  } catch (e) { /* analytiikka ei saa koskaan rikkoa sovellusta */ }
}
function adminToAlerts(items) {
  return (items || []).map(a => ({
    alertHeaderText: a.title,
    alertDescriptionText: a.body || "",
    alertSeverityLevel: a.severity || "WARNING",
    alertUrl: a.url || "",
    _admin: true,
    lines: (a.lines || []).map(x => String(x).toUpperCase()),   // ylläpitäjän valitsemat linjat
  }));
}

const normAlertUrl = u => (u || "").toLowerCase().replace(/^https?:\/\//, "").replace(/\/+$/, "");
const normAlertTitle = s => (s || "").toLowerCase()
  .replace(/­/g, "").replace(/[^a-z0-9äöå]+/gi, " ").trim();

// Muuntaa WordPress-tiedotteet alert-muotoisiksi ja suodattaa:
// liian vanhat pois, "Tilanne ohi" pois, ja jo GTFS-RT:ssä olevat pois (dedup).
function cmsToAlerts(items, gtfsAlerts) {
  const maxAge = ((CONFIG.cmsAlerts && CONFIG.cmsAlerts.maxAgeDays) || 45) * 86400 * 1000;
  const now = Date.now();
  const gUrls = new Set((gtfsAlerts || []).map(a => normAlertUrl(a.alertUrl)).filter(Boolean));
  const gTitles = new Set((gtfsAlerts || []).map(a => normAlertTitle(a.alertHeaderText)).filter(Boolean));
  const out = [];
  for (const it of items || []) {
    const ts = Date.parse(it.date || "");
    if (Number.isFinite(ts) && now - ts > maxAge) continue;          // liian vanha
    if (/^\s*(tilanne ohi|p[äa]ivitys:.*(palaa|peruttu|ohi))/i.test(it.title || "")) continue;
    if (gUrls.has(normAlertUrl(it.link))) continue;                  // jo GTFS-RT:ssä (URL)
    if (gTitles.has(normAlertTitle(it.title))) continue;             // jo GTFS-RT:ssä (otsikko)
    out.push({
      alertHeaderText: it.title,
      alertDescriptionText: it.excerpt || "",
      alertSeverityLevel: "WARNING",
      alertUrl: it.link || "",
      _cms: true,
      lines: it.lines || [],   // workerin rungosta poimimat linjanumerot (linjasivun täsmäys)
    });
  }
  return out;
}

// LSL ei kiinnitä tiedotteita linjaobjekteihin, joten linjat poimitaan myös
// tiedotetekstin maininnoista: "linjoja 3, 6, 8(K)" -> 3, 6, 8, 8K
function lineTokensFromText(text) {
  const out = new Set();
  for (const seg of text.matchAll(/linj\w*\s+([0-9][0-9A-ZÅÄÖ()\s,.ja-]*)/gi)) {
    for (const tok of seg[1].matchAll(/(\d+)\s*(?:\(([A-ZÅÄÖ,\s]+)\))?([A-ZÅÄÖ]?)/g)) {
      out.add(tok[1]);
      if (tok[3]) out.add(tok[1] + tok[3]);
      if (tok[2]) for (const l of tok[2].split(/[,\s]+/)) if (l) out.add(tok[1] + l);
    }
  }
  return out;
}

function alertMatchesRoute(a, routeGtfsId, shortName, stopIds) {
  if (a.route && a.route.gtfsId === routeGtfsId) return true;
  if (a.stop && stopIds.has(a.stop.gtfsId)) return true;
  const sn = (shortName || "").toUpperCase();
  // CMS/ylläpito-tiedotteiden valmiiksi poimitut linjat (otsikossa ei aina numeroita)
  if (Array.isArray(a.lines) && a.lines.includes(sn)) return true;
  const tokens = lineTokensFromText((a.alertHeaderText || "") + " " + (a.alertDescriptionText || ""));
  return tokens.has(sn);
}

// Kaikki häiriölähteet yhdistettynä (GTFS-RT + lsl.fi-CMS + kaupungin ylläpito).
// Jaettu etusivun bannerin ja linjasivun kesken, jotta linjasivu näyttää SAMAT
// tiedotteet (esim. CMS:n "Kytölässä poikkeusreitti") eikä vain GTFS-RT:tä.
async function loadAllAlerts() {
  const [gtfs, cmsItems, adminItems] = await Promise.all([
    loadAlerts(),
    CONFIG.cmsAlerts ? loadCmsAlerts() : Promise.resolve([]),
    loadAdminAlerts(),
  ]);
  return [...adminToAlerts(adminItems), ...gtfs, ...cmsToAlerts(cmsItems, gtfs)];
}

async function loadAlertsInto(box) {
  try {
    const alerts = dedupAlerts(await loadAllAlerts());
    if (!alerts.length) { box.innerHTML = ""; return; }
    // tiivis banneri: lista aukeaa pyynnöstä (LSL pitää osaa tiedotteista
    // SEVERE-tasolla viikkoja, joten auto-avaus veisi koko etusivun)
    const label = alerts.length === 1 ? t("alertsCount1") : t("alertsCountN", { n: alerts.length });
    box.innerHTML = `
      <details class="card alertsum">
        <summary>${icon("warning")} <strong>${label}</strong></summary>
        ${alerts.map(alertHtml).join("")}
      </details>`;
  } catch (err) {
    box.innerHTML = `<div class="error">${t("alertsFail")}${esc(err.message)}</div>`;
  }
}

/* ---------- Häiriöilmoitukset suosikkilinjoille (sovelluksen ollessa auki) ---------- */

const alertKey = a =>
  (a.alertHeaderText || "") + "|" + (a.alertDescriptionText || "") + "|" + (a.effectiveStartDate || "");

function getSeenAlerts() {
  try { return JSON.parse(localStorage.getItem(ns("seenAlerts")) || "{}"); }
  catch (e) { return {}; }
}

function markAlertsSeen(alerts) {
  const seen = getSeenAlerts();
  const cutoff = Date.now() - 30 * 24 * 3600 * 1000;
  for (const k of Object.keys(seen)) if (seen[k] < cutoff) delete seen[k];
  for (const a of alerts) seen[alertKey(a)] = Date.now();
  try { localStorage.setItem(ns("seenAlerts"), JSON.stringify(seen)); } catch (e) {}
}

function favRouteAlerts(alerts) {
  const favRoutes = getFavs().filter(f => f.type === "route");
  if (!favRoutes.length) return [];
  const noStops = new Set();
  return dedupAlerts(alerts).filter(a =>
    favRoutes.some(f => alertMatchesRoute(a, f.id, f.shortName, noStops)));
}

async function showAlertNotification(a) {
  const title = a.alertHeaderText || t("alertDefault");
  const opts = { body: (a.alertDescriptionText || "").slice(0, 180), tag: alertKey(a), icon: "icon.svg" };
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg && reg.showNotification) { reg.showNotification(title, opts); return; }
  } catch (e) { /* kokeillaan suoraa konstruktoria */ }
  try { new Notification(title, opts); } catch (e) {}
}

// seedOnly: merkitse nykyiset nähdyiksi ilmoittamatta (käyttöönotto)
async function pollFavAlerts(seedOnly, force = true) {
  if (localStorage.getItem("notifyAlerts") !== "1") return;
  if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
  // Taustapush hoitaa ilmoitukset palvelimelta → ei etualailmoituksia (ei tuplia)
  if (pushActive) return;
  try {
    const matched = favRouteAlerts(await loadAlerts(force));
    if (seedOnly) { markAlertsSeen(matched); return; }
    const seen = getSeenAlerts();
    const fresh = matched.filter(a => !(alertKey(a) in seen));
    markAlertsSeen(matched);
    for (const a of fresh.slice(0, 3)) showAlertNotification(a);
  } catch (e) { /* seuraava kierros yrittää uudelleen */ }
}

// Globaali ajastin — EI kytkeydy refreshTimeriin, jonka näkymänvaihto tyhjentää
let alertPollTimer = null;
function startAlertPolling() {
  if (alertPollTimer) return;
  alertPollTimer = setInterval(() => pollFavAlerts(false), 5 * 60 * 1000);
}

/* ---------- Taustapush (Web Push): ilmoitukset myös sovellus kiinni ---------- */

// Tosi kun taustapush-tilaus on voimassa → etualapollaus pysyy pois päältä
let pushActive = false;

function pushSupported() {
  return !!(PROXY_URL && VAPID_PUBLIC_KEY &&
    "serviceWorker" in navigator && "PushManager" in window &&
    typeof Notification !== "undefined");
}

function urlBase64ToUint8Array(base64) {
  const pad = "=".repeat((4 - base64.length % 4) % 4);
  const b64 = (base64 + pad).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(b64);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

// Tilaa push (jos ei vielä tilattu) ja synkronoi seuratut suosikkilinjat
// palvelimelle. Palauttaa true jos taustapush on käytössä.
async function syncPushSubscription() {
  if (!pushSupported() || Notification.permission !== "granted") return false;
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
    }
    await findFeed().catch(() => {});
    const favRoutes = getFavs().filter(f => f.type === "route");
    const res = await fetch(PROXY_URL.replace(/\/$/, "") + "/push/subscribe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        subscription: sub.toJSON(),
        routes: favRoutes.map(f => (f.shortName || "").toUpperCase()).filter(Boolean),
        gtfsRoutes: favRoutes.map(f => f.id),
        feed: feedId,
        city: CONFIG.city,
        lang,
      }),
    });
    pushActive = res.ok;
    return res.ok;
  } catch (e) {
    return false;
  }
}

async function unsubscribePush() {
  if (!("serviceWorker" in navigator)) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (!sub) return;
    const endpoint = sub.endpoint;
    pushActive = false;
    await sub.unsubscribe().catch(() => {});
    if (PROXY_URL) await fetch(PROXY_URL.replace(/\/$/, "") + "/push/unsubscribe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ endpoint }),
    }).catch(() => {});
  } catch (e) { /* ohita */ }
}

// Suosikkien muuttuessa: pidä palvelimen seurattu linjalista ajan tasalla
function resyncPushIfEnabled() {
  if (localStorage.getItem("notifyAlerts") === "1" && pushSupported() &&
      typeof Notification !== "undefined" && Notification.permission === "granted") {
    syncPushSubscription();
  }
}

// Varmistaa push-luvan + tilauksen lähtömuistutusta varten (ei rekisteröi
// häiriötilausta, vain palauttaa tilauksen viestin lähetystä varten)
async function getPushSubscription() {
  if (!pushSupported()) return null;
  if (Notification.permission !== "granted") {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") return null;
  }
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
  });
  return sub;
}

function fmtClockLocal(epochMs) {
  return new Date(epochMs).toLocaleTimeString(
    lang === "fi" ? "fi-FI" : lang === "sv" ? "sv-FI" : "en-GB",
    { hour: "2-digit", minute: "2-digit" });
}

// Lähtömuistutus: ajastaa palvelimelle push-viestin lead-minuuttia ennen lähtöä
async function setDepartureReminder(epochMs, line, dest) {
  const msg = document.getElementById("remindMsg");
  if (!epochMs || !PROXY_URL) return;
  const lead = Number(document.getElementById("remindLead")?.value || 10);
  const fireAt = Math.floor(epochMs / 1000) - lead * 60;
  if (fireAt <= Date.now() / 1000 + 20) {
    if (msg) msg.innerHTML = `<span class="error">${t("remindTooSoon")}</span>`;
    return;
  }
  if (msg) msg.textContent = t("remindWorking");
  const sub = await getPushSubscription();
  if (!sub) { if (msg) msg.innerHTML = `<div class="error">${t("notifyDenied")}</div>`; return; }
  const time = fmtClockLocal(epochMs);
  try {
    const res = await fetch(PROXY_URL.replace(/\/$/, "") + "/push/reminder", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        subscription: sub.toJSON(),
        fireAt,
        title: t("remindTitle", { line }),
        body: t("remindBody", { line, dest, time }),
        tag: `rem-${line}-${fireAt}`,
      }),
    });
    if (msg) msg.textContent = res.ok ? t("remindDone", { time, min: lead }) : t("connFail");
  } catch (e) {
    if (msg) msg.textContent = t("connFail");
  }
}

function bindStopSearch(input, results) {
  let timer = null, seq = 0;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 3) { results.innerHTML = ""; return; }
    timer = setTimeout(async () => {
      const mySeq = ++seq;
      try {
        const data = await gql(
          `query ($name: String) { stops(name: $name) { gtfsId name code } }`, { name: q });
        if (mySeq !== seq) return;
        const hits = (data.stops || [])
          .filter(s => s.gtfsId.startsWith(feedId + ":"))
          .slice(0, 20);
        results.innerHTML = hits.length
          ? hits.map(s => `<li><a class="item" href="#/pysakki/${encodeURIComponent(s.gtfsId)}">
              <span>${esc(s.name)}</span> <span class="muted">${esc(s.code || "")}</span></a></li>`).join("")
          : `<li><p class="muted">${t("noStopsFor", { q: esc(q) })}</p></li>`;
      } catch (err) {
        if (mySeq === seq) results.innerHTML = `<li><div class="error">${esc(err.message)}</div></li>`;
      }
    }, 300);
  });
}

// Yhdistetty etusivun haku: linjat (cached), pysäkit (gql) ja osoitteet
// (geokoodaus) yhdessä, kategorioituina. Osoite avaa reittioppaan määränpääksi.
function bindUnifiedSearch(input, results) {
  let timer = null, seq = 0;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const q = input.value.trim();
    const digits = /^\d+$/.test(q);
    if (q.length < 2 && !(digits && q.length >= 1)) { results.innerHTML = ""; return; }
    timer = setTimeout(async () => {
      const mySeq = ++seq;
      results.innerHTML = `<li><p class="muted">${t("searching")}</p></li>`;
      try {
        await findFeed();
        const ql = q.toLowerCase();
        const routes = await loadRoutes().catch(() => []);
        const lineHits = routes.filter(r =>
          (r.shortName || "").toLowerCase().includes(ql) ||
          (r.longName || "").toLowerCase().includes(ql)).slice(0, 6);

        // Pysäkit ja osoitteet vain ≥2 merkillä (lyhyt numero = linjahaku)
        let stopHits = [], placeHits = [];
        if (q.length >= 2) {
          const [stopsRes, geoRes] = await Promise.allSettled([
            gql(`query ($name: String) { stops(name: $name) { gtfsId name code } }`, { name: q }),
            geocode(q),
          ]);
          if (mySeq !== seq) return;
          stopHits = stopsRes.status === "fulfilled"
            ? (stopsRes.value.stops || []).filter(s => s.gtfsId.startsWith(feedId + ":")).slice(0, 6) : [];
          placeHits = (geoRes.status === "fulfilled" ? geoRes.value : [])
            .filter(p => p.layer !== "stop").slice(0, 5);
        }
        if (mySeq !== seq) return;

        let html = "";
        if (lineHits.length) {
          html += `<li class="search-cat">${t("catLines")}</li>` +
            lineHits.map(r => `<li><a class="item" href="#/linja/${encodeURIComponent(r.gtfsId)}">
              ${badgeHtml(r)} <span>${esc(r.longName)}</span></a></li>`).join("");
        }
        if (stopHits.length) {
          html += `<li class="search-cat">${t("catStops")}</li>` +
            stopHits.map(s => `<li><a class="item" href="#/pysakki/${encodeURIComponent(s.gtfsId)}">
              <span>${icon("pin")} ${esc(s.name)}</span>
              <span class="muted">${esc(s.code || "")}</span></a></li>`).join("");
        }
        if (placeHits.length) {
          html += `<li class="search-cat">${t("catPlaces")}</li>` +
            placeHits.map((p, i) => `<li><button class="item" type="button" data-place="${i}">
              <span>${icon(PLACE_ICONS[p.layer] || "pin")} ${esc(p.name)}</span></button></li>`).join("");
        }
        if (!html) track("search_fail", q);   // haku ilman osumia = suunnittelijoille arvokas signaali
        results.innerHTML = html || `<li><p class="muted">${t("noMatches")}</p></li>`;

        // Osoiteklikkaus: aseta reittioppaan määränpää ja avaa reittihaku
        results.querySelectorAll("button[data-place]").forEach(btn =>
          btn.addEventListener("click", () => {
            const p = placeHits[+btn.dataset.place];
            if (!p) return;
            addRecent(p);
            planState.to = { name: p.name, lat: p.lat, lon: p.lon };
            planState.from = null;
            location.hash = "#/reitti";
          }));
      } catch (err) {
        if (mySeq === seq) results.innerHTML = `<li><div class="error">${esc(err.message)}</div></li>`;
      }
    }, 250);
  });
}

function bindNearbyButton(btn, results) {
  btn.addEventListener("click", () => {
    if (!navigator.geolocation) {
      results.innerHTML = `<li><div class="error">${t("geoUnsupported")}</div></li>`;
      return;
    }
    results.innerHTML = `<li><p class="muted">${t("gettingLocation")}</p></li>`;
    navigator.geolocation.getCurrentPosition(async pos => {
      try {
        const data = await gql(
          `query ($lat: Float!, $lon: Float!) {
             stopsByRadius(lat: $lat, lon: $lon, radius: 800, first: 15) {
               edges { node { distance stop { gtfsId name code } } }
             }
           }`, { lat: pos.coords.latitude, lon: pos.coords.longitude });
        const nodes = (data.stopsByRadius?.edges || [])
          .map(e => e.node)
          .filter(n => n.stop && n.stop.gtfsId.startsWith(feedId + ":"))
          .sort((a, b) => a.distance - b.distance);
        results.innerHTML = nodes.length
          ? nodes.map(n => `<li><a class="item" href="#/pysakki/${encodeURIComponent(n.stop.gtfsId)}">
              <span>${esc(n.stop.name)}</span>
              <span class="muted">${n.distance} m</span></a></li>`).join("")
          : `<li><p class="muted">${t("noStopsRadius")}</p></li>`;
      } catch (err) {
        results.innerHTML = `<li><div class="error">${esc(err.message)}</div></li>`;
      }
    }, geoErr => {
      results.innerHTML = `<li><div class="error">${t("geoFail")}${esc(geoErr.message)}</div></li>`;
    }, { timeout: 10000 });
  });
}

/* ---------- Suosikit (localStorage) ---------- */

function getFavs() {
  try { return JSON.parse(localStorage.getItem(ns("favorites")) || "[]"); }
  catch (e) { return []; }
}

function saveFavs(favs) {
  try { localStorage.setItem(ns("favorites"), JSON.stringify(favs)); } catch (e) {}
}

function isFav(id) { return getFavs().some(f => f.id === id); }

// Palauttaa true jos kohde lisättiin, false jos poistettiin
function toggleFav(item) {
  const favs = getFavs();
  const i = favs.findIndex(f => f.id === item.id);
  if (i >= 0) favs.splice(i, 1); else favs.push(item);
  saveFavs(favs);
  // Linjasuosikin muuttuessa: päivitä palvelimen seurattu linjalista taustapushia varten
  if (item.type === "route") resyncPushIfEnabled();
  return i < 0;
}

function favButtonHtml(id) {
  const fav = isFav(id);
  return `<button class="star no-print" id="favBtn" aria-pressed="${fav}"
    aria-label="${fav ? t("favRemove") : t("favAdd")}" title="${t("favTitle")}">${icon("star")}</button>`;
}

function bindFavButton(item) {
  const btn = document.getElementById("favBtn");
  if (!btn) return;
  btn.addEventListener("click", () => {
    const added = toggleFav(item);
    btn.setAttribute("aria-pressed", String(added));
    btn.setAttribute("aria-label", added ? t("favRemove") : t("favAdd"));
  });
}

const FAV_STOPS_QUERY = `

        scheduledDeparture realtimeDeparture realtime serviceDay headsign
        trip { wheelchairAccessible occupancy { occupancyStatus } route { gtfsId shortName color textColor } }
      }
    }
  }`;

async function renderFavStops() {
  const stopFavs = getFavs().filter(f => f.type === "stop");
  if (!document.getElementById("favStops") || !stopFavs.length) return;
  try {
    const data = await gql(FAV_STOPS_QUERY, { ids: stopFavs.map(f => f.id) });
    const el = document.getElementById("favStops");
    if (!el) return;

/* ---------- Etusivun lähimmät lähdöt ---------- */

const NEARBY_QUERY = `
  query ($lat: Float!, $lon: Float!) {
    stopsByRadius(lat: $lat, lon: $lon, radius: 800, first: 25) {
      edges { node { distance stop {
        gtfsId name code wheelchairBoarding
        stoptimesWithoutPatterns(numberOfDepartures: 3, omitNonPickups: true) {
          scheduledDeparture realtimeDeparture realtime serviceDay headsign
          trip { wheelchairAccessible occupancy { occupancyStatus } route { gtfsId shortName color textColor } }
        }
      } } }
    }
  }`;

let lastCoords = null;
let nearbyAccessibleOnly = localStorage.getItem(ns("accOnly")) === "1";

// Täyttöaste näytetään vain kun syöte kertoo sen; LSL:n GTFS-RT antaa nyt
// NO_DATA_AVAILABLE, jolloin ikonia ei näytetä lainkaan (degrade gracefully)
const OCCUPANCY_LABELS = {
  EMPTY: ["low", "occEmpty"],
  MANY_SEATS_AVAILABLE: ["low", "occMany"],
  FEW_SEATS_AVAILABLE: ["mid", "occFew"],
  STANDING_ROOM_ONLY: ["high", "occStanding"],
  CRUSHED_STANDING_ROOM_ONLY: ["full", "occCrushed"],
  FULL: ["full", "occFull"],
};

function occupancyHtml(trip) {
  const o = OCCUPANCY_LABELS[trip?.occupancy?.occupancyStatus];
  return o ? ` <span class="occ-dot occ-${o[0]}" role="img" aria-label="${t(o[1])}" title="${t(o[1])}"></span>` : "";
}

// WCAG-kontrasti: syötteen tekstiväriä käytetään vain jos se täyttää 4.5:1,
// muuten valitaan musta tai valkoinen luminanssin mukaan
function relLum(hex) {
  const v = [0, 2, 4].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}

function badgeText(bgHex, prefHex) {
  const L = relLum(bgHex);
  const ratio = fg => (Math.max(L, fg) + 0.05) / (Math.min(L, fg) + 0.05);
  if (prefHex && ratio(relLum(prefHex)) >= 4.5) return "#" + prefHex;
  return ratio(1) >= ratio(0) ? "#ffffff" : "#10141c";
}

// Linjan virallinen brändiväri badgessa, kun syöte sen kertoo
function badgeHtml(route, fallback) {
  const style = route?.color
    ? ` style="background:#${route.color};color:${badgeText(route.color, route.textColor)}"` : "";
  return `<span class="badge"${style}>${esc(route?.shortName || fallback || "")}</span>`;
}

function depTableRows(stoptimes) {
  // Poista feed-duplikaatit (sama linja kahdesti eri liikennöitsijällä → tuplalähdöt)
  const seen = new Set();
  return (stoptimes || []).filter(st => {
    const r = st.trip && st.trip.route;
    const k = ((r && r.shortName) || "") + "|" + (st.headsign || "") + "|" + ((st.serviceDay || 0) + (st.scheduledDeparture || 0));
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  }).map(st => {
    const d = depInfo(st);
    const acc = st.trip?.wheelchairAccessible === "POSSIBLE"
      ? ` <span role="img" aria-label="${t("accVehicle")}" title="${t("accVehicle")}">${icon("wheelchair")}</span>` : "";
    const rid = st.trip && st.trip.route && st.trip.route.gtfsId;
    const badge = rid
      ? `<a class="badgelink" href="#/linjakartta/${encodeURIComponent(rid)}" title="${t("lineMapLink")}">${badgeHtml(st.trip.route)}</a>`
      : badgeHtml(st.trip.route);
    return `<tr>
      <td>${badge}</td>
      <td>${esc(st.headsign || "")}${acc}${occupancyHtml(st.trip)}</td>
      <td class="${d.rt ? "rt" : ""}">${d.when}${d.rt ? " ●" : ""}</td>
    </tr>`;
  }).join("");
}

function stopDepGroupHtml(stop, extra) {
  const rows = depTableRows(stop.stoptimesWithoutPatterns);
  if (!rows) return "";
  const acc = stop.wheelchairBoarding === "POSSIBLE"
    ? ` <span class="acc-mark" role="img" aria-label="${t("accStop")}" title="${t("accStop")}">${icon("wheelchair")}</span>` : "";
  return `<h3 class="stophead"><a href="#/pysakki/${encodeURIComponent(stop.gtfsId)}">${esc(stop.name)}</a>${acc}
      ${extra ? `<span class="dist">${extra}</span>` : ""}</h3>
    <table class="deps"><tbody>${rows}</tbody></table>`;
}

async function renderNearby() {
  const el = document.getElementById("nearbyBody");
  if (!el || !lastCoords) return;
  try {
    await findFeed();
    const { data, cachedAt } = await cachedGql("nearby", NEARBY_QUERY, lastCoords);
    if (!document.getElementById("nearbyBody")) return;
    const all = (data.stopsByRadius?.edges || [])
      .map(e => e.node)
      .filter(n => n.stop && n.stop.gtfsId.startsWith(feedId + ":")
                && (n.stop.stoptimesWithoutPatterns || []).length)
      .sort((a, b) => a.distance - b.distance);
    const groups = (nearbyAccessibleOnly
      ? all.filter(n => n.stop.wheelchairBoarding === "POSSIBLE") : all).slice(0, 5);
    const toggle = `<label class="acc-toggle no-print"><input type="checkbox" id="accOnly"${nearbyAccessibleOnly ? " checked" : ""}> <span>${icon("wheelchair")} ${t("accOnlyToggle")}</span></label>`;
    const list = groups.length
      ? (cachedAt ? staleNoteHtml(cachedAt) : "")
        + groups.map(n => stopDepGroupHtml(n.stop, n.distance + " m")).join("")
        + `<p class="muted"><span class="rt">●</span> ${t("rtLegend")}</p>`
      : `<p class="muted">${nearbyAccessibleOnly ? t("accNearbyNone") : t("noDepsRadius")}</p>`;
    const box = document.getElementById("nearbyBody");
    box.innerHTML = toggle + list;
    const cb = document.getElementById("accOnly");
    if (cb) cb.addEventListener("change", () => {
      nearbyAccessibleOnly = cb.checked;
      localStorage.setItem(ns("accOnly"), nearbyAccessibleOnly ? "1" : "0");
      renderNearby();
    });
  } catch (err) {
    const box = document.getElementById("nearbyBody");
    if (box && !box.querySelector("table")) {
      box.innerHTML = `<div class="error">${esc(err.message)}</div>`;
    } // jos vanhat lähdöt näkyvät, verkkohikka ei pyyhi niitä pois
  }
}

function initNearby(body) {
  if (!navigator.geolocation) {
    body.innerHTML = `<p class="muted">${t("geoUnsupportedHint")}</p>`;
    return;
  }
  const locate = () => {
    body.innerHTML = `<p class="muted">${t("gettingLocation")}</p>`;
    navigator.geolocation.getCurrentPosition(pos => {
      localStorage.setItem("geoAllowed", "1");
      lastCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      renderNearby();
    }, err => {
      localStorage.removeItem("geoAllowed");
      body.innerHTML = `<div class="error">${t("geoFail")}${esc(err.message)}</div>
        <p class="muted">${t("searchByNameHint")}</p>`;
    }, { timeout: 10000, maximumAge: 60000 });
  };
  if (localStorage.getItem("geoAllowed")) {
    locate();
  } else {
    body.innerHTML = `
      <button id="nearbyStart">${icon("pin")} ${t("showNearby")}</button>
      <p class="muted">${t("geoPrivacy")}</p>`;
    document.getElementById("nearbyStart").addEventListener("click", locate);
  }
}

// Rakentaa pysäkeittäisen aikataulumatriisin: pysäkit riveinä, vuorot
// sarakkeina. Yksi sarake = yhden vuoron kellonajat reitin jokaisella
// pysäkillä (klassinen painettu bussiaikataulu).
function stopMatrixHtml(stops, trips) {
  const valid = (trips || []).filter(tr => (tr.stoptimes || []).length);
  valid.sort((a, b) => a.stoptimes[0].scheduledDeparture - b.stoptimes[0].scheduledDeparture);
  if (!valid.length || !(stops || []).length) return `<p class="muted">${t("noDepsDay")}</p>`;
  const tripTimes = valid.map(tr => {
    const m = {};
    for (const st of tr.stoptimes) if (m[st.stop.gtfsId] == null) m[st.stop.gtfsId] = st.scheduledDeparture;
    return m;
  });
  const headCols = valid.map((_, i) => `<th scope="col">${i + 1}</th>`).join("");
  const rows = stops.map(s => {
    const cells = tripTimes.map(m =>
      `<td>${m[s.gtfsId] == null ? "·" : fmtSec(m[s.gtfsId])}</td>`).join("");
    return `<tr><th scope="row">${esc(s.name)}</th>${cells}</tr>`;
  }).join("");
  return `<div class="matrix-wrap"><table class="stoptable">
      <thead><tr><th scope="col">${t("stopColHead")}</th>${headCols}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
}

// Pysäkkijuliste: yhdeltä pysäkiltä lähtevät linjat tuntikaaviona
// (vasen sarake tunti, oikea minuutit) — kuten katoksen seinällä oleva
// painettu aikataulu. groups = stoptimesForServiceDate-tulos.
function stopPosterHtml(groups) {
  const byLine = new Map();
  for (const g of groups || []) {
    const r = g.pattern?.route || {};
    for (const st of g.stoptimes || []) {
      const headsign = st.headsign || g.pattern?.headsign || r.longName || "";
      const key = (r.shortName || "") + "␀" + headsign;
      if (!byLine.has(key)) byLine.set(key, { route: r, headsign, times: [] });
      byLine.get(key).times.push(st.scheduledDeparture);
    }
  }
  const lines = [...byLine.values()].sort((a, b) =>
    (a.route.shortName || "").localeCompare(b.route.shortName || "", "fi", { numeric: true }));
  if (!lines.length) return `<p class="muted">${t("bookletNoData")}</p>`;
  return `<div class="poster-lines">${lines.map(L => {
    const times = [...new Set(L.times)].sort((a, b) => a - b);
    const byHour = new Map();
    for (const sec of times) {
      const h = Math.floor(sec / 3600);
      if (!byHour.has(h)) byHour.set(h, []);
      byHour.get(h).push(String(Math.floor((sec % 3600) / 60)).padStart(2, "0"));
    }
    const rows = [...byHour.entries()].map(([h, mins]) =>
      `<tr><th scope="row">${String(h % 24).padStart(2, "0")}</th><td>${mins.join(" ")}</td></tr>`).join("");
    return `<div class="poster-line">
        <h4>${badgeHtml(L.route)} <span>${esc(L.headsign)}</span></h4>
        <table class="hourgrid"><tbody>${rows}</tbody></table>
      </div>`;
  }).join("")}</div>`;
}

// Map-first linjanäkymä (#/linjakartta/<id>): koko reitti kartalla + live-bussit
// rikkaalla popupilla (määränpää, myöhästymä, seuraavat pysäkit). Avataan esim.
// pysäkki-/lähellä-näkymän linjabadgea klikkaamalla.
async function viewRouteMap(routeId) {
  if (!PROXY_URL && !apiKey) { location.hash = "#/asetukset"; return; }
  setView(`<p class="muted">${t("loadingRoute")}</p>`);
  const { data } = await cachedGql("routemap:" + routeId,
    `query ($id: String!) {
       route(id: $id) {
         shortName longName color textColor
         patterns { directionId patternGeometry { length points } stops { gtfsId name lat lon } }
       }
     }`, { id: routeId });
  const route = data.route;
  if (!route) throw new Error(t("errRouteNotFound") + routeId);
  setView(`
    <nav class="crumb"><button class="linkish" id="backBtn">← ${t("back")}</button> · <a href="#/">${t("home")}</a></nav>
    <div class="card">
      <h2>${badgeHtml(route)} <span>${esc(route.longName || "")}</span></h2>
      <p class="muted">${t("lineMapHint")}</p>
      <p><a class="btnlink secondary" href="#/linja/${encodeURIComponent(routeId)}">${icon("list")} ${t("lineFullTimetable")}</a></p>
      <div id="lineMap" class="map bigmap" aria-label="${esc(t("mapAria"))}"></div>
    </div>`);
  document.getElementById("backBtn").addEventListener("click", () => history.back());
  const mySeq = viewSeq;
  try {
    await ensureLeaflet();
    if (mySeq !== viewSeq || !document.getElementById("lineMap")) return;
    const map = makeMap("lineMap", [AREA.focus.lat, AREA.focus.lon], 12);
    const color = route.color ? "#" + route.color : "#0a4ea3";
    let bounds = null;
    // kummankin suunnan pisin reittikuvio
    const byDir = new Map();
    for (const p of (route.patterns || [])) {
      if (!p.patternGeometry || !p.patternGeometry.points) continue;
      const prev = byDir.get(p.directionId);
      if (!prev || (p.patternGeometry.length || 0) > (prev.patternGeometry.length || 0)) byDir.set(p.directionId, p);
    }
    for (const p of byDir.values()) {
      const pts = decodePolyline(p.patternGeometry.points);
      if (!pts.length) continue;
      const line = L.polyline(pts, { color, weight: 5, opacity: 0.7 }).addTo(map);
      bounds = bounds ? bounds.extend(line.getBounds()) : line.getBounds();
    }
    // pysäkit (yhdistetty kaikista patterneista)
    const seen = new Set();
    for (const p of (route.patterns || [])) for (const s of (p.stops || [])) {
      if (s.lat == null || seen.has(s.gtfsId)) continue;
      seen.add(s.gtfsId);
      L.circleMarker([s.lat, s.lon], { radius: 4, color, weight: 2, fillColor: "#fff", fillOpacity: 1 })
        .addTo(map).bindPopup(`<a href="#/pysakki/${encodeURIComponent(s.gtfsId)}">${esc(s.name)}</a>`);
    }
    fitMap(map, bounds);
    startVehicles(map, [{ gtfsId: routeId, shortName: route.shortName }]);
  } catch (err) {
    const el = document.getElementById("lineMap");
    if (el) el.outerHTML = `<div class="error">${t("mapFail")}${esc(err.message)}</div>`;
  }
}

async function viewRoute(routeId, patternCode, date) {
  if (!PROXY_URL && !apiKey) { location.hash = "#/asetukset"; return; }
  setView(`<p class="muted">${t("loadingRoute")}</p>`);
  date = date || todayISO();

  // Häiriöt haetaan rinnakkain reittikyselyn kanssa, jotta ne voidaan
  // renderöidä jo ensipaintissa (ei async-hyppyä, CLS)
  const alertsPromise = loadAllAlerts().catch(() => []); // GTFS-RT + CMS + ylläpito
  // Vuoromäärät edustaville tuleville päiville (Ti/To/La/Su) patternien
  // järjestämiseen — linjalla voi olla "isoja" vanhoja/kausivariantteja joilla
  // ei ole vuoroja NYT; ne eivät saa voittaa pää- eikä suuntavalintaa.
  const probe = activeProbeDates();
  const probeAliases = probe.map((d, i) => `p${i}: tripsForDate(serviceDate: "${d}") { gtfsId }`).join(" ");
  const { data, cachedAt: routeCachedAt } = await cachedGql("route:" + routeId,
    `query ($id: String!) {
       route(id: $id) {
         shortName longName color textColor
         patterns {
           code name directionId
           ${probeAliases}
           stops { gtfsId name lat lon }
         }
       }
     }`, { id: routeId });
  const route = data.route;
  if (!route) throw new Error(t("errRouteNotFound") + routeId);

  const patterns = route.patterns || [];
  const upcoming = p => probe.reduce((n, _, i) => n + ((p["p" + i] || []).length), 0);
  // Oletuksena pääsuunta TULEVIEN vuorojen mukaan — EI patterns[0] eikä kaikkien
  // aikojen suurin (vanha variantti voi olla "isoin" mutta ei aja nyt → "ei lähtöjä").
  // Käyttäjän valitsema patternCode voittaa.
  const current = patterns.find(p => p.code === patternCode)
    || patterns.slice().sort((a, b) => upcoming(b) - upcoming(a))[0]
    || patterns[0];

  // Selkokielinen suunta: "lähtöpysäkki → päätepysäkki" pattern-koodien sijaan
  const patternLabel = p => {
    const stops = p.stops || [];
    return stops.length
      ? `${stops[0].name} → ${stops[stops.length - 1].name}`
      : (p.name || "");
  };
  // Suunnittain yleisin variantti (eniten vuoroja) välilehdeksi, harvinaiset
  // variaatiot pudotusvalikon taakse
  const byDir = new Map();
  for (const p of patterns) {
    const k = p.directionId ?? 0;
    if (!byDir.has(k)) byDir.set(k, []);
    byDir.get(k).push(p);
  }
  const primaries = [], variants = [];
  for (const list of byDir.values()) {
    list.sort((a, b) => upcoming(b) - upcoming(a)); // suuntavälilehdeksi nyt liikennöivä pääpattern
    primaries.push(list[0]);
    variants.push(...list.slice(1));
  }

  let routeAlertsHtml = "";
  try {
    const stopIds = new Set(patterns.flatMap(p => p.stops.map(s => s.gtfsId)));
    const matched = dedupAlerts((await alertsPromise)
      .filter(a => alertMatchesRoute(a, routeId, route.shortName, stopIds)));
    if (matched.length) routeAlertsHtml = matched.map(a => alertHtml(a, true)).join("");
  } catch (err) { /* tiedotteiden puuttuminen ei kaada linjasivua */ }

  setView(`
    <nav class="crumb"><a href="#/">← ${t("allRoutes")}</a></nav>
    <div class="card">
      <h2>${favButtonHtml(routeId)}${badgeHtml(route)} ${esc(route.longName)}</h2>
      <div id="routeAlerts">${routeAlertsHtml}</div>
      <div class="dir-row" role="group" aria-label="${t("directionAria")}">
        <span class="dir-label">${t("directionLabel")}</span>
        <strong class="dir-current">${esc(patternLabel(current))}</strong>
        ${primaries.length > 1 ? `<button type="button" id="dirSwap" class="secondary" aria-label="${t("directionSwap")}" title="${t("directionSwap")}">${icon("swap")} ${t("directionSwap")}</button>` : ""}
      </div>
      ${variants.length ? `
        <div class="row no-print" style="margin:0.3rem 0">
          <label class="muted" for="variantSel">${t("moreVariants")}</label>
          <select id="variantSel">
            <option value="">${t("chooseVariant")}</option>
            ${variants.map(p => `
              <option value="${esc(p.code)}"${p === current ? " selected" : ""}>
                ${esc(patternLabel(p))} (${t("nStops", { n: (p.stops || []).length })})
              </option>`).join("")}
          </select>
        </div>` : ""}
      <div class="tabs no-print" role="group" aria-label="${t("dayTypesLabel")}">
        ${lineDayTabs(date).map(d => `
          <button class="daytab" data-date="${d.date}" aria-pressed="${d.active}">${esc(d.label)}</button>`).join("")}
      </div>
      <div id="timetable" class="no-print" style="min-height:15rem"><p class="muted">${t("loadingDeps")}</p></div>
    </div>
    <div class="card no-print">
      <h2>${t("mapStopsTitle")} <a class="linkish" style="font-size:0.8rem;font-weight:400" href="#/linjakartta/${encodeURIComponent(routeId)}">${icon("map")} ${t("openFullMap")}</a></h2>
      <div id="routeMap" class="map" aria-label="${t("mapAria")}"></div>
      <p class="muted">${t("busesHint")}</p>
      <ol class="stop-timeline" id="stopTimeline">
        ${(current?.stops || []).map(s => `
          <li class="stl-item">
            <span class="stl-dot" aria-hidden="true"></span>
            <a class="stl-name item" href="#/pysakki/${encodeURIComponent(s.gtfsId)}">${esc(s.name)}</a>
            <span class="stl-time" data-stop="${esc(s.gtfsId)}"></span>
          </li>`).join("")}
      </ol>
    </div>
    <div class="card">
      <h2 class="no-print">${t("fullTimetableTitle")}</h2>
      <p class="muted no-print">${t("fullTimetableHint")}</p>
      <div class="row no-print" style="flex-wrap:wrap;gap:0.4rem">
        <button id="printKeyBtn">${icon("print")} ${t("printKeyStopsPort")}</button>
        <button id="printAllBtn">${icon("print")} ${t("printAllStopsLand")}</button>
        <button id="lineQrBtn" class="secondary">${icon("qr")} ${t("qrButton")}</button>
        <span id="linePrintStatus" class="muted" role="status"></span>
      </div>
      <div id="lineQr" class="qrbox no-print" hidden></div>
      <div id="stopMatrix" class="no-print"><p class="muted">${t("loadingMatrix")}</p></div>
      <div id="linePrintOut" class="print-only"></div>
    </div>`);

  bindFavButton({ type: "route", id: routeId, name: route.longName, shortName: route.shortName,
                  color: route.color, textColor: route.textColor });
  document.getElementById("dirSwap")?.addEventListener("click", () => {
    const idx = primaries.findIndex(p => p === current);
    const next = primaries[(idx + 1) % primaries.length];
    location.hash = `#/linja/${encodeURIComponent(routeId)}/${encodeURIComponent(next.code)}/${date}`;
  });
  document.getElementById("variantSel")?.addEventListener("change", e => {
    if (e.target.value) {
      location.hash = `#/linja/${encodeURIComponent(routeId)}/${encodeURIComponent(e.target.value)}/${date}`;
    }
  });
  document.querySelectorAll(".daytab").forEach(btn =>
    btn.addEventListener("click", () => {
      location.hash = `#/linja/${encodeURIComponent(routeId)}/${encodeURIComponent(current.code)}/${btn.dataset.date}`;
    }));

  // Map is drawn concurrently with the timetable fetch below
  (async () => {
    const mapEl = document.getElementById("routeMap");
    if (!mapEl || !current) return;
    const mySeq = viewSeq;
    try {
      const [geo] = await Promise.all([
        gql(`query ($code: String!) { pattern(id: $code) { patternGeometry { points } } }`,
          { code: current.code }),
        ensureLeaflet(),
      ]);
      if (mySeq !== viewSeq || !document.getElementById("routeMap")) return;
      const map = makeMap("routeMap");
      const pts = decodePolyline(geo.pattern?.patternGeometry?.points || "");
      let bounds = null;
      if (pts.length) {
        const line = L.polyline(pts, { color: "#0a4ea3", weight: 4, opacity: 0.85 }).addTo(map);
        bounds = line.getBounds();
      }
      const located = current.stops.filter(s => s.lat != null);
      for (const s of located) {
        L.circleMarker([s.lat, s.lon], STOP_MARKER).addTo(map)
          .bindPopup(`<a href="#/pysakki/${encodeURIComponent(s.gtfsId)}">${esc(s.name)}</a>`);
      }
      if (!bounds && located.length) bounds = L.latLngBounds(located.map(s => [s.lat, s.lon]));
      fitMap(map, bounds);
      startVehicles(map, [{ gtfsId: routeId, shortName: route.shortName }]);
    } catch (err) {
      mapEl.outerHTML = `<div class="error">${t("mapFail")}${esc(err.message)}</div>`;
    }
  })();

  // Departure times from the pattern's first stop = classic line timetable
  const box = document.getElementById("timetable");
  if (!current || !current.stops.length) {
    box.innerHTML = `<p class="muted">${t("noStopsDirection")}</p>`;
    return;
  }
  const isTodayPrimary = date === todayISO();
  let nextDep = null; // seuraavan lähdön epoch (ms) lähtömuistutusta varten
  // Aikataulu näyttää suunnan KAIKKI lähdöt valitulle päivälle — ei suodateta
  // yhteen patterniin. Tämä on välttämätöntä, koska aikataulukauden vaihtuessa
  // (esim. kesä→syksy) suunnan vuorot voivat olla eri pattern-koodissa eri
  // päivinä; yhteen patterniin lukittu näkymä näyttäisi virheellisesti "ei lähtöjä".
  const curDir = current.directionId ?? 0;
  const dirPatterns = patterns.filter(p => (p.directionId ?? 0) === curDir);
  const dirCodes = new Set(dirPatterns.map(p => p.code));
  // kysely suunnan täysimmän patternin päätepysäkiltä (sieltä lähtevät kaikki vuorot)
  const headStop = (dirPatterns.slice().sort((a, b) => (b.stops?.length || 0) - (a.stops?.length || 0))[0] || current).stops[0];

  // Valitsee suunnan patternin (+ sen vuorot) jolla on lähtöjä annettuna päivänä.
  // Kausivaihdon takia oikea pattern-koodi vaihtelee päivittäin → tarvitaan
  // matriisissa ja tulostuksessa (yksittäinen pattern, ei aggregointi kuten listassa).
  const bestPatternForDate = async (iso) => {
    const aliases = dirPatterns.map((p, i) =>
      `c${i}: pattern(id: "${p.code}") { tripsForDate(serviceDate: $date) { stoptimes { timepoint scheduledDeparture stop { gtfsId name } } } }`).join("\n");
    const { data } = await cachedGql(`matrix:${routeId}:dir${curDir}:${iso}`,
      `query ($date: String!) { ${aliases} }`, { date: iso.replace(/-/g, "") });
    let pat = current, trips = [];
    dirPatterns.forEach((p, i) => {
      const tr = (data["c" + i] && data["c" + i].tripsForDate) || [];
      if (tr.length > trips.length) { pat = p; trips = tr; }
    });
    return { pat, trips };
  };

  const TT_QUERY = `query ($stopId: String!, $date: String!) {
    stop(id: $stopId) {
      stoptimesForServiceDate(date: $date, omitNonPickups: true) {
        pattern { code }
        stoptimes { scheduledDeparture realtimeDeparture realtime serviceDay }
      }
    }
  }`;
  // Suunnan kaikki lähdöt annetulle päivälle (suunnan patternit yhdistettynä).
  const fetchDeps = async (iso) => {
    const { data: tt, cachedAt } = await cachedGql(`tt:${routeId}:dir${curDir}:${iso}`, TT_QUERY,
      { stopId: headStop.gtfsId, date: iso.replace(/-/g, "") });
    const sts = (tt.stop?.stoptimesForServiceDate || [])
      .filter(g => dirCodes.has(g.pattern.code)).flatMap(g => g.stoptimes)
      .sort((a, b) => a.scheduledDeparture - b.scheduledDeparture);
    return { sts, stale: cachedAt || routeCachedAt };
  };
  // Etsii seuraavan liikennöintipäivän (enintään 14 vrk eteenpäin) jolla on lähtöjä.
  const findNextServiceDate = async (fromISO) => {
    const [y, mo, d] = fromISO.split("-").map(Number);
    for (let i = 1; i <= 14; i++) {
      const iso = isoOf(new Date(y, mo - 1, d + i));
      if ((await fetchDeps(iso)).sts.length) return iso;
    }
    return null;
  };
  // Täyttää pysäkkiaikajanan seuraavan vuoron lähtöajalla per pysäkki (paras pattern tälle päivälle).
  const annotateTimeline = async (useDate, isToday) => {
    const { trips } = await bestPatternForDate(useDate);
    if (!trips.length) return;
    trips.sort((a, b) => (a.stoptimes?.[0]?.scheduledDeparture ?? 0) - (b.stoptimes?.[0]?.scheduledDeparture ?? 0));
    let trip = trips[0];
    if (isToday) {
      const d = new Date(), nowSec = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
      trip = trips.find(tr => (tr.stoptimes?.[0]?.scheduledDeparture ?? -1) >= nowSec - 30) || trips[0];
    }
    const byStop = new Map();
    for (const stt of (trip.stoptimes || [])) if (stt.stop?.gtfsId) byStop.set(stt.stop.gtfsId, stt.scheduledDeparture);
    document.querySelectorAll("#stopTimeline .stl-time[data-stop]").forEach(span => {
      const sec = byStop.get(span.getAttribute("data-stop"));
      if (sec != null) span.textContent = fmtSec(sec);
    });
  };

  const loadTimetable = async (useDate, redirectNote) => {
    useDate = useDate || date;
    const { sts, stale } = await fetchDeps(useDate);
    const el = document.getElementById("timetable");
    if (!el) return;
    if (!sts.length) {
      // Ei liikennöintiä → ohjaa seuraavaan liikennöintipäivään, näytä sen lähdöt (ei tyhjää)
      const next = await findNextServiceDate(useDate);
      if (next) return loadTimetable(next, t("noServiceRedirect", { day: fmtDateLong(useDate), next: fmtDateLong(next) }));
      el.innerHTML = `<p class="muted">${t("noServiceSoon")}</p>`;
      return;
    }
    const isToday = useDate === todayISO();
    const now = Date.now();
    const depEpoch = st =>
      (st.serviceDay + (st.realtime ? st.realtimeDeparture : st.scheduledDeparture)) * 1000;
    let nextHtml = "";
    let remindHtml = "";
    if (isToday) {
      const upcoming = sts.filter(st => depEpoch(st) >= now - 30000).slice(0, 3);
      if (upcoming.length) {
        nextDep = depEpoch(upcoming[0]);
        nextHtml = `<p>${t("nextDeps")} ${upcoming.map(st => {
          const d = depInfo(st);
          return `<strong class="${d.rt ? "rt" : ""}">${d.when}${d.rt ? " ●" : ""}</strong>`;
        }).join(" · ")}</p>`;
        if (pushSupported()) {
          remindHtml = `<div class="remind no-print" id="remindBox">
            <label>${icon("bell")} ${t("remindBefore")}
              <select id="remindLead" aria-label="${t("remindBefore")}">
                <option value="5">5</option><option value="10" selected>10</option><option value="15">15</option>
              </select> ${t("remindUnit")}</label>
            <button type="button" id="remindBtn" class="secondary">${t("remindSet")}</button>
            <span id="remindMsg" class="muted" role="status"></span>
          </div>`;
        }
      }
    }
    const grid = sts.map(st => {
      const dep = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
      const past = isToday && depEpoch(st) < now;
      const cls = (past ? "past" : "") + (st.realtime && !past ? " rt" : "");
      return `<span class="${cls.trim()}"${st.realtime && !past ? ` title="${t("rtTitleAttr")}"` : ""}>
        ${fmtSec(dep)}${st.realtime && !past ? " ●" : ""}</span>`;
    }).join("");
    el.innerHTML = `
      ${redirectNote ? `<p class="redirect-note">${icon("warning")} ${esc(redirectNote)}</p>` : ""}
      ${stale ? staleNoteHtml(stale) : ""}
      <p class="muted">${t("depsFromStop", { stop: esc(current.stops[0].name) })}</p>
      ${nextHtml}
      ${remindHtml}
      <div class="timegrid">${grid}</div>
      ${isToday ? `<p class="muted"><span class="rt">●</span> ${t("rtLegend")}</p>` : ""}`;
    const rb = document.getElementById("remindBtn");
    if (rb) rb.addEventListener("click", () =>
      setDepartureReminder(nextDep, route.shortName || "", patternLabel(current)));
    annotateTimeline(useDate, isToday).catch(() => {});
  };
  try {
    await loadTimetable();
  } catch (err) {
    box.innerHTML = `<div class="error">${esc(err.message)}</div>`;
  }
  if (isTodayPrimary) {
    refreshNow = () => loadTimetable().catch(() => {});
    refreshTimer = setInterval(refreshNow, 30000);
  }

  // Tulostuspainike voi "omistaa" #linePrintOutin: estää matriisihaun
  // myöhästyvää oletustäyttöä ylikirjoittamasta käyttäjän valitsemaa tulostetta
  let printOwned = false;

  // Koko aikataulu pysäkeittäin (matriisi) – ladataan omana kyselynään,
  // jotta se on valmiina myös tulostukseen
  (async () => {
    const mEl = document.getElementById("stopMatrix");
    if (!mEl) return;
    const mySeq = viewSeq;
    try {
      let { pat: mPat, trips } = await bestPatternForDate(date);
      let matrixDate = date;
      // Johdonmukaisuus aikataulun kanssa: jos valitulla päivällä ei liikennöintiä,
      // näytä matriisikin seuraavalta liikennöintipäivältä (ei tyhjää matriisia).
      if (!trips.length) {
        const next = await findNextServiceDate(date);
        if (next) { matrixDate = next; ({ pat: mPat, trips } = await bestPatternForDate(next)); }
      }
      if (mySeq !== viewSeq) return;
      const el = document.getElementById("stopMatrix");
      // Ruudulla koko pysäkkimatriisi (vieritettävä, valittu päivä)
      if (el) el.innerHTML = stopMatrixHtml(mPat.stops, trips);
      // Oletustuloste (raaka Ctrl+P): isot pysäkit valitulta päivältä.
      // Ei ylikirjoiteta, jos käyttäjä on jo valinnut tulosteen napista.
      const po = document.getElementById("linePrintOut");
      if (po && !printOwned) po.innerHTML =
        `<div class="card"><h2>${esc(route.shortName || "")} ${esc(patternLabel(mPat))}</h2>
           <p>${esc(matrixDate)}</p>${bookletTableHtml(trips)}</div>`;
    } catch (err) {
      if (mySeq !== viewSeq) return;
      const el = document.getElementById("stopMatrix");
      if (el) el.innerHTML = `<div class="error">${esc(err.message)}</div>`;
    }
  })();

  // Tulostus viikonpäivätyypeittäin (ma–pe/la/su). mode "key" = isot pysäkit
  // pystyarkille, "all" = kaikki pysäkit vaaka-arkille (mahtuu leveytensä takia).
  const printLine = async (mode) => {
    const st = document.getElementById("linePrintStatus");
    const po = document.getElementById("linePrintOut");
    if (!po) return;
    printOwned = true; // estä matriisihaun oletustäytön ylikirjoitus
    if (st) st.textContent = t("preparingPrint");
    const dts = dayTypeDates(date);
    const sets = await Promise.all(dts.map(async dt => {
      try { const { pat, trips } = await bestPatternForDate(dt.date); return { dt, pat, trips }; }
      catch (e) { return { dt, pat: current, trips: [] }; }
    }));
    const tables = sets.map(({ dt, pat, trips }) =>
      `<h3 class="daytype">${esc(dt.label)}</h3>` +
      (mode === "all" ? stopMatrixHtml(pat.stops, trips) : bookletTableHtml(trips))).join("");
    po.innerHTML = `<div class="card">
        <h2>${esc(route.shortName || "")} ${esc(patternLabel(current))}</h2>
        <p class="muted">${t("dayTypeNote")}</p>${tables}</div>`;
    setPageOrientation(mode === "all" ? "landscape" : "portrait");
    if (st) st.textContent = "";
    window.print();
  };
  document.getElementById("printKeyBtn")?.addEventListener("click", () => printLine("key"));
  document.getElementById("printAllBtn")?.addEventListener("click", () => printLine("all"));
  document.getElementById("lineQrBtn")?.addEventListener("click", () => {
    const box = document.getElementById("lineQr");
    if (!box) return;
    if (!box.hidden) { box.hidden = true; box.innerHTML = ""; return; }
    box.hidden = false;
    showQrInto(box, appUrl("#/linja/" + encodeURIComponent(routeId)),
      t("qrCaptionLine"), "qr-linja-" + (route.shortName || "").replace(/\W+/g, ""));
  });
}

// Lukee pysäkin seuraavat lähdöt ääneen (puhesynteesi); toinen klikkaus lopettaa
function speakDepartures(stop) {
  const synth = window.speechSynthesis;
  if (!synth || !stop) return;
  if (synth.speaking) { synth.cancel(); return; }
  const sts = (stop.stoptimesWithoutPatterns || []).slice(0, 5);
  if (!sts.length) return;
  const now = Date.now();
  const parts = sts.map(st => {
    const r = st.trip?.route || {};
    const dep = st.realtime ? st.realtimeDeparture : st.scheduledDeparture;
    const mins = Math.round(((st.serviceDay + dep) * 1000 - now) / 60000);
    const when = mins <= 0 ? t("speakNow")
      : mins < 60 ? t("speakInMin", { n: mins }) : t("speakAt", { time: fmtSec(dep) });
    return t("speakLine", { line: r.shortName || "", dest: st.headsign || "", when });
  });
  const u = new SpeechSynthesisUtterance(t("speakIntro", { stop: stop.name }) + " " + parts.join(" "));
  u.lang = lang === "fi" ? "fi-FI" : lang === "sv" ? "sv-SE" : "en-GB";
  synth.cancel();
  synth.speak(u);
}

// Pysäkin live-taulun (monitorin) jako-/upotuspaneeli yrityksille
function showEmbedInto(box, stopId) {
  const url = appUrl("#/monitori/" + encodeURIComponent(stopId));
  const iframe = `<iframe src="${url}" width="400" height="600" style="border:0" title="${esc(t("monitorLink"))}"></iframe>`;
  box.innerHTML = `
    <p class="muted">${t("embedIntro")}</p>
    <label class="embed-field">${t("embedLink")}
      <input type="text" readonly value="${esc(url)}" aria-label="${t("embedLink")}"></label>
    <label class="embed-field">${t("embedCode")}
      <textarea readonly rows="3" aria-label="${t("embedCode")}">${esc(iframe)}</textarea></label>
    <p class="row" style="gap:0.4rem;flex-wrap:wrap">
      <button type="button" class="copybtn" data-copy="${esc(url)}">${t("embedCopyLink")}</button>
      <button type="button" class="copybtn" data-copy="${esc(iframe)}">${t("embedCopyCode")}</button>
      <span id="embedMsg" class="muted" role="status"></span>
    </p>`;
  box.querySelectorAll("button[data-copy]").forEach(b =>
    b.addEventListener("click", async () => {
      const m = document.getElementById("embedMsg");
      try { await navigator.clipboard.writeText(b.dataset.copy); if (m) m.textContent = t("copied"); }
      catch (e) { if (m) m.textContent = t("copyManual"); }
    }));
}

// Korjaa feed-duplikaatit pysäkkidatassa: sama linja voi olla kahdesti eri
// liikennöitsijällä (esim. 23), jolloin lähdöt tuplautuisivat ja linja näkyisi
// kahtena suodattimena. Normalisoidaan duplikaattilinja yhdeksi (kanoninen
// gtfsId per shortName) ja poistetaan identtiset lähdöt.
function dedupStopDuplicates(stop) {
  const canon = new Map();
  for (const r of (stop.routes || [])) if (r.shortName && !canon.has(r.shortName)) canon.set(r.shortName, r.gtfsId);
  if (Array.isArray(stop.stoptimesWithoutPatterns)) {
    const seen = new Set();
    stop.stoptimesWithoutPatterns = stop.stoptimesWithoutPatterns.filter(st => {
      const r = st.trip && st.trip.route;
      if (r && r.shortName && canon.has(r.shortName)) r.gtfsId = canon.get(r.shortName); // kanonisoi
      const k = (r && r.shortName || "") + "|" + (st.headsign || "") + "|" + ((st.serviceDay || 0) + (st.scheduledDeparture || 0));
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }
  if (Array.isArray(stop.routes)) {
    const rseen = new Set();
    stop.routes = stop.routes.filter(r => {
      const k = r.shortName || r.gtfsId;
      if (rseen.has(k)) return false;
      rseen.add(k);
      return true;
    });
  }
}

async function viewStop(stopId) {
  if (!PROXY_URL && !apiKey) { location.hash = "#/asetukset"; return; }
  setView(`<p class="muted">${t("loadingStopDeps")}</p>`);

  const fetchStop = async () => {
    const { data, cachedAt } = await cachedGql("stop:" + stopId,
      `query ($id: String!) {
         stop(id: $id) {
           name code lat lon wheelchairBoarding
           routes { gtfsId shortName color textColor }
           stoptimesWithoutPatterns(numberOfDepartures: 30, omitNonPickups: true) {
             scheduledDeparture realtimeDeparture realtime serviceDay headsign
             trip { wheelchairAccessible occupancy { occupancyStatus } route { gtfsId shortName color textColor } }
           }
         }
       }`, { id: stopId });
    if (!data.stop) throw new Error(t("errStopNotFound") + stopId);
    dedupStopDuplicates(data.stop);
    return { stop: data.stop, cachedAt };
  };

  let routeFilter = null;
  let lastStopData = null;

  const renderRows = stop => {
    const sts = (stop.stoptimesWithoutPatterns || []).filter(st =>
      !routeFilter || st.trip?.route?.gtfsId === routeFilter);

      || `<tr><td colspan="3" class="muted">${t("noUpcoming")}</td></tr>`;
  };

  // Pysäkkiä liikennöivät linjat suodatinnappeina (brändiväreissä)
  const stopRoutesHtml = stop => {
    const routes = (stop.routes || []).slice()
      .sort((a, b) => (a.shortName || "").localeCompare(b.shortName || "", "fi", { numeric: true }));
    if (routes.length < 2) return "";
    return `<div class="legchips no-print" id="stopRoutes">${routes.map(r => {
      const style = r.color ? ` style="background:#${esc(r.color)};color:${badgeText(r.color, r.textColor)}"` : "";
      return `<button class="badge" data-route="${esc(r.gtfsId)}" aria-pressed="false"${style}
        title="${t("filterByRoute", { line: esc(r.shortName) })}">${esc(r.shortName)}</button>`;
    }).join("")}</div>`;
  };

  const { stop, cachedAt } = await fetchStop();
  lastStopData = stop;
  const accNote = stop.wheelchairBoarding === "POSSIBLE"
    ? `<p class="muted">${icon("wheelchair")} ${t("accStop")}</p>`
    : stop.wheelchairBoarding === "NOT_POSSIBLE"
      ? `<p class="muted">${icon("warning")} ${t("accStopNo")}</p>` : "";
  setView(`
    <nav class="crumb"><button class="linkish" id="backBtn">← ${t("back")}</button> · <a href="#/">${t("home")}</a></nav>
    <div class="card">
      <h2>${favButtonHtml(stopId)}${esc(stop.name)} <span class="muted">${esc(stop.code || "")}</span></h2>
      ${accNote}
      ${stopRoutesHtml(stop)}
      <div id="staleNote">${cachedAt ? staleNoteHtml(cachedAt) : ""}</div>
      <table class="deps">
        <thead><tr><th>${t("thLine")}</th><th>${t("thDest")}</th><th>${t("thDeparts")}</th></tr></thead>
        <tbody id="depRows">${renderRows(stop)}</tbody>
      </table>
      <p class="muted"><span class="rt">●</span> ${t("rtLegendStop")}</p>
      <p class="no-print" style="margin:0.6rem 0 0; display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center">
        <button type="button" id="stopPosterBtn">${icon("print")} ${t("printStopPoster")}</button>
        <a class="btnlink secondary" href="#/monitori/${encodeURIComponent(stopId)}">${icon("monitor")} ${t("monitorLink")}</a>
        ${("speechSynthesis" in window) ? `<button type="button" id="speakBtn" class="secondary">${icon("speaker")} ${t("speakAloud")}</button>` : ""}
        <button type="button" id="stopQrBtn" class="secondary">${icon("qr")} ${t("qrButton")}</button>
        <button type="button" id="stopEmbedBtn" class="secondary">${icon("link")} ${t("embedButton")}</button>
        ${(stop.lat != null && (stop.routes || []).length && "Notification" in window)
          ? `<button type="button" id="approachBtn" class="secondary">${icon("bell")} ${t("approachArm")}</button>` : ""}
        <span id="stopPrintStatus" class="muted" role="status"></span>
      </p>
      <div id="approachBanner" class="approach-banner no-print" role="status" aria-live="polite" hidden></div>
      <div id="stopEmbed" class="embedbox no-print" hidden></div>
      <div id="stopQr" class="qrbox no-print" hidden></div>
      <div id="stopMap" class="map map-small" aria-label="${t("stopMapAria")}"></div>
      <p class="muted" id="stopMapHint" hidden>${t("stopBusesHint")}</p>
    </div>
    <div id="stopPrintOut"></div>`);

  bindFavButton({ type: "stop", id: stopId, name: stop.name });
  document.getElementById("backBtn").addEventListener("click", () => history.back());

  // Lähestyvä bussi -hälytys: kun pysäkin linjojen ajoneuvon seuraava pysäkki
  // (MQTT-topicin nextStop) on TÄMÄ pysäkki, bussi on lähestymässä (yhden pysäkin
  // päässä). Toimii etualalla (sovellus auki); ilmoitus + sivun sisäinen banneri.
  const stopNum = stopId.split(":")[1];
  let approachArmed = false;
  const notifiedVeh = new Set();
  const fireApproach = (routeName, dest) => {
    const banner = document.getElementById("approachBanner");
    if (banner) {
      banner.hidden = false;
      banner.innerHTML = `${icon("bell")} <strong>${esc(t("approachFired", { line: routeName }))}</strong>${dest ? ` · ${esc(dest)}` : ""}`;
    }
    try {
      if ("Notification" in window && Notification.permission === "granted")
        new Notification(t("approachTitle", { line: routeName }),
          { body: t("approachBody", { stop: stop.name }), tag: "approach-" + stopId, icon: "icon-192.png" });
    } catch (e) { /* ilmoitus ei pakollinen */ }
    if (navigator.vibrate) try { navigator.vibrate([200, 100, 200]); } catch (e) {}
  };
  const onVehicleMsg = (seg, route) => {
    if (!approachArmed) return;
    const vehId = seg[13] || "";
    if ((seg[11] || "") === stopNum) {
      if (!notifiedVeh.has(vehId)) { notifiedVeh.add(vehId); fireApproach(route.shortName, seg[9] || ""); }
    } else {
      notifiedVeh.delete(vehId); // bussi ohitti → salli uusi hälytys jos linja palaa
    }
  };
  document.getElementById("approachBtn")?.addEventListener("click", async () => {
    const btn = document.getElementById("approachBtn");
    const banner = document.getElementById("approachBanner");
    if (approachArmed) {
      approachArmed = false; notifiedVeh.clear();
      btn.classList.remove("armed");
      btn.innerHTML = `${icon("bell")} ${t("approachArm")}`;
      if (banner) { banner.hidden = true; banner.innerHTML = ""; }
      return;
    }
    let perm = Notification.permission;
    if (perm === "default") { try { perm = await Notification.requestPermission(); } catch (e) {} }
    approachArmed = true;
    btn.classList.add("armed");
    btn.innerHTML = `${icon("bell")} ${t("approachOn")}`;
    if (banner) {
      banner.hidden = false;
      banner.textContent = perm === "granted" ? t("approachWaiting") : t("approachWaitingNoPerm");
    }
  });

  // QR-koodi pysäkin live-sivulle (LSL voi teipata katokseen)
  document.getElementById("stopQrBtn")?.addEventListener("click", () => {
    const box = document.getElementById("stopQr");
    if (!box) return;
    if (!box.hidden) { box.hidden = true; box.innerHTML = ""; return; }
    box.hidden = false;
    showQrInto(box, appUrl("#/pysakki/" + encodeURIComponent(stopId)),
      t("qrCaptionStop"), "qr-pysakki-" + (stop.code || stopId).replace(/\W+/g, ""));
  });

  // Lue lähdöt ääneen (puhesynteesi)
  document.getElementById("speakBtn")?.addEventListener("click", () => speakDepartures(lastStopData || stop));

  // Jaa / upota pysäkin live-taulu (iframe yrityksille)
  document.getElementById("stopEmbedBtn")?.addEventListener("click", () => {
    const box = document.getElementById("stopEmbed");
    if (!box) return;
    if (!box.hidden) { box.hidden = true; box.innerHTML = ""; return; }
    box.hidden = false;
    showEmbedInto(box, stopId);
  });

  // Pysäkkijuliste: kaikki pysäkiltä lähtevät linjat tuntikaaviona,
  // erikseen Ma–Pe/La/Su (edustavat ei-pyhäpäivät), tulostettava A4-pystyyn.
  document.getElementById("stopPosterBtn")?.addEventListener("click", async () => {
    const stEl = document.getElementById("stopPrintStatus");
    const po = document.getElementById("stopPrintOut");
    if (!po) return;
    if (stEl) stEl.textContent = t("preparingPrint");
    const today = todayISO();
    const dts = dayTypeDates(today);
    const sets = await Promise.all(dts.map(dt =>
      cachedGql(`poster:${stopId}:${dt.date}`,
        `query ($id: String!, $date: String!) {
           stop(id: $id) {
             stoptimesForServiceDate(date: $date, omitNonPickups: true) {
               pattern { headsign route { shortName longName color textColor } }
               stoptimes { scheduledDeparture headsign }
             }
           }
         }`, { id: stopId, date: dt.date.replace(/-/g, "") })
        .then(r => ({ dt, groups: r.data.stop?.stoptimesForServiceDate || [] }))
        .catch(() => ({ dt, groups: [] }))));
    // QR pysäkin live-sivulle upotetaan julisteeseen (skannattava katoksessa)
    let qrImg = "";
    try {
      const u = await qrDataUrl(appUrl("#/pysakki/" + encodeURIComponent(stopId)), 240);
      qrImg = `<div class="poster-qrwrap"><img class="poster-qr" src="${u}" alt="">
        <span class="poster-qrcap">${t("qrPosterHint")}</span></div>`;
    } catch (e) { /* QR ei pakollinen tulosteelle */ }
    const sections = sets.map(({ dt, groups }) =>
      `<section class="card poster-day">
         <div class="poster-head">
           <div>
             <h2>${esc(stop.name)} <span class="muted">${esc(stop.code || "")}</span></h2>
             <p class="poster-sub">${esc(dt.label)} · ${esc(fmtDateLong(dt.date))}</p>
             <p class="muted">${t("posterAllLinesNote")}</p>
           </div>
           ${qrImg}
         </div>
         ${stopPosterHtml(groups)}
       </section>`).join("");
    po.innerHTML = `<div class="print-only">${sections}
        <p class="muted">${t("bookletPeriodNote", { date: fmtDateLong(today) })}</p></div>`;
    setPageOrientation("portrait");
    if (stEl) stEl.textContent = "";
    window.print();
  });

  document.querySelectorAll("#stopRoutes button[data-route]").forEach(btn =>
    btn.addEventListener("click", () => {
      routeFilter = routeFilter === btn.dataset.route ? null : btn.dataset.route;
      document.getElementById("stopRoutes").classList.toggle("filtered", !!routeFilter);
      document.querySelectorAll("#stopRoutes button[data-route]").forEach(b =>
        b.setAttribute("aria-pressed", String(b.dataset.route === routeFilter)));
      const tbody = document.getElementById("depRows");
      if (tbody && lastStopData) tbody.innerHTML = renderRows(lastStopData);
    }));

  if (stop.lat != null) {
    const mySeq = viewSeq;
    ensureLeaflet().then(() => {
      if (mySeq !== viewSeq || !document.getElementById("stopMap")) return;
      const map = makeMap("stopMap", [stop.lat, stop.lon], 16);
      L.circleMarker([stop.lat, stop.lon], STOP_MARKER).addTo(map)
        .bindPopup(esc(stop.name));
      // pysäkkiä liikennöivien linjojen bussit lähestymässä
      const routes = (stop.routes || []).slice(0, 15);
      if (routes.length) {
        startVehicles(map, routes, onVehicleMsg);
        const hint = document.getElementById("stopMapHint");
        if (hint) hint.hidden = false;
      }
    }).catch(() => { document.getElementById("stopMap")?.remove(); });
  } else {
    const el = document.getElementById("stopMap");
    if (el) el.remove();
  }

  refreshNow = async () => {
    try {
      const fresh = await fetchStop();
      lastStopData = fresh.stop;
      const tbody = document.getElementById("depRows");
      if (tbody) tbody.innerHTML = renderRows(fresh.stop);
      const note = document.getElementById("staleNote");
      if (note) note.innerHTML = fresh.cachedAt ? staleNoteHtml(fresh.cachedAt) : "";
    } catch (err) {
      // verkkohikka: jätetään edelliset lähdöt näkyviin ja yritetään taas 30 s päästä
    }
  };
  refreshTimer = setInterval(refreshNow, 30000);
}

  const setTimeMode = m => {
    document.getElementById("timeMode").value = m;
    document.getElementById("tmDep").setAttribute("aria-pressed", String(m === "dep"));
    document.getElementById("tmArr").setAttribute("aria-pressed", String(m === "arr"));
  };
  document.getElementById("tmDep").addEventListener("click", () => {
    setTimeMode("dep"); if (planState.from && planState.to) search(false);
  });
  document.getElementById("tmArr").addEventListener("click", () => {
    setTimeMode("arr"); if (planState.from && planState.to) search(false);
  });
  document.getElementById("nowBtn").addEventListener("click", () => {
    document.getElementById("timeInput").value = nowLocalInput();
    setTimeMode("dep");
    if (planState.from && planState.to) search(false);
  });

  document.getElementById("fromGeo").addEventListener("click", () => {
    const msg = document.getElementById("planMsg");
    if (!navigator.geolocation) { msg.innerHTML = `<div class="error">${t("geoUnsupported")}</div>`; return; }
    msg.innerHTML = `<p class="muted">${t("gettingLocation")}</p>`;
    navigator.geolocation.getCurrentPosition(pos => {
      planState.from = { name: t("myLocation"), lat: pos.coords.latitude, lon: pos.coords.longitude };
      fromInput.value = t("myLocation");
      updateSaveBtn();
      msg.innerHTML = "";
    }, err => {
      msg.innerHTML = `<div class="error">${t("geoFail")}${esc(err.message)}</div>`;
    }, { timeout: 10000 });
  });

  const results = document.getElementById("planResults");
  let nodes = [], cursor = null, prevCursor = null, directNodes = {};
  let lastHasNext = false, lastHasPrev = false, mainDone = false;
  let planSort = "depart";        // REILA F2: lajittelusegmentti (Lähtöaika/Nopein/Perillä aiemmin/Vähiten kävelyä); oletus = lähtöaika nouseva
  let asideMap = null;            // sivupalkkikartan Leaflet-instanssi (desktop)

  // REILA F2: desktopilla (>=1000px) reitin kartta piirtyy sivupalkkiin; uudelleenpiirrettävä
  // (poistaa edellisen instanssin). Kapealla näytöllä käytetään kortin sisäistä karttaa.
  const asideActive = () => window.matchMedia("(min-width: 1000px)").matches;
  const drawAside = async node => {
    if (!asideActive()) return;
    const el = document.getElementById("planAsideMap");
    if (!el) return;
    await ensureLeaflet();
    if (asideMap) { try { asideMap.remove(); } catch (e) {} asideMap = null; }
    el.innerHTML = "";
    const map = makeMap("planAsideMap");
    asideMap = map;
    let bounds = null;
    for (const leg of node.legs) {
      const pts = decodePolyline(leg.legGeometry?.points || "");
      if (!pts.length) continue;
      const style = leg.mode === "WALK"
        ? { color: "#5a6478", weight: 4, dashArray: "2 8" }
        : leg.mode === "BICYCLE"
          ? { color: "#1a7f4b", weight: 5, dashArray: "8 6", opacity: 0.9 }
          : { color: leg.route?.color ? "#" + leg.route.color : "#0a4ea3", weight: 5, opacity: 0.85 };
      const line = L.polyline(pts, style).addTo(map);
      bounds = bounds ? bounds.extend(line.getBounds()) : line.getBounds();
    }
    const first = node.legs[0], last = node.legs[node.legs.length - 1];
    // F4: lähtö = accent, määränpää = --dest (Kotka vihreä) — sama pari kuin hakukortissa
    const asideCS = getComputedStyle(document.documentElement);
    const originCol = asideCS.getPropertyValue("--accent").trim() || "#0a4ea3";
    const destCol = asideCS.getPropertyValue("--dest").trim() || "#F0734E";
    L.circleMarker([first.from.lat, first.from.lon], { ...STOP_MARKER, fillColor: originCol }).addTo(map).bindPopup(t("origin"));
    L.circleMarker([last.to.lat, last.to.lon], { ...STOP_MARKER, fillColor: destCol }).addTo(map).bindPopup(t("destination"));
    if (bounds) map.fitBounds(bounds, { padding: [20, 20] });
    const transitRoutes = [...new Map(node.legs.filter(l => l.route?.gtfsId)
      .map(l => [l.route.gtfsId, { gtfsId: l.route.gtfsId, shortName: l.route.shortName }])).values()];
    if (transitRoutes.length) startVehicles(map, transitRoutes);
  };
  // Sivupalkkikartan ALKUTILA (desktop): näytä kaupungin kartta heti, ei placeholderia. Sama
  // Leaflet/tile-pohja kuin muualla; keskitä CONFIG:n kaupunkikeskipisteeseen (AREA.focus, sama
  // lähde kuin linjasivun kartta). Jos lähtö/määränpää tiedossa → accent/dest-merkit + rajaus
  // näihin. Reitin valinta (drawAside) korvaa tämän ennallaan → ei kosketa reittikäytökseen.
  const initAsideCity = async () => {
    if (!asideActive() || asideMap) return;        // vain desktop-sivupalkki; ei ylikirjoiteta reittikarttaa
    const el = document.getElementById("planAsideMap");
    if (!el) return;
    await ensureLeaflet();
    if (asideMap) return;                          // reitti ehti valituksi awaitin aikana → älä piirrä päälle
    el.innerHTML = "";                             // poista raidoitettu placeholder
    const map = makeMap("planAsideMap", [AREA.focus.lat, AREA.focus.lon], 13);
    asideMap = map;
    try { map.invalidateSize(false); } catch (e) {}
    const cs = getComputedStyle(document.documentElement);
    const from = planState.from, to = planState.to;
    let b = null;
    if (from && Number.isFinite(from.lat) && Number.isFinite(from.lon)) {
      L.circleMarker([from.lat, from.lon], { ...STOP_MARKER, fillColor: cs.getPropertyValue("--accent").trim() || "#0a4ea3" })
        .addTo(map).bindPopup(t("origin"));
      b = L.latLngBounds([[from.lat, from.lon]]);
    }
    if (to && Number.isFinite(to.lat) && Number.isFinite(to.lon)) {
      L.circleMarker([to.lat, to.lon], { ...STOP_MARKER, fillColor: cs.getPropertyValue("--dest").trim() || "#F0734E" })
        .addTo(map).bindPopup(t("destination"));
      b = b ? b.extend([to.lat, to.lon]) : L.latLngBounds([[to.lat, to.lon]]);
    }
    if (b && b.isValid()) map.fitBounds(b, { padding: [40, 40], maxZoom: 15 });
  };
  const sortNodes = arr => {
    const c = arr.slice();
    if (planSort === "depart") c.sort((a, b) => (new Date(a.start) - new Date(b.start)) || ((new Date(a.end) - new Date(a.start)) - (new Date(b.end) - new Date(b.start))));
    else if (planSort === "fast") c.sort((a, b) => (new Date(a.end) - new Date(a.start)) - (new Date(b.end) - new Date(b.start)));
    else if (planSort === "arrive") c.sort((a, b) => new Date(a.end) - new Date(b.end));
    else if (planSort === "walk") c.sort((a, b) => (a.walkDistance || 0) - (b.walkDistance || 0));
    return c;
  };

  const renderResults = () => {
    const directRow = ["walk", "bike"]
      .filter(k => directNodes[k])
      .map(k => directHtml(directNodes[k], k))
      .join("");
    const view = sortNodes(nodes);   // näyttöjärjestys (data-itin viittaa tähän)
    const topbar = nodes.length || directRow
      ? `<div class="plan-topbar">
           <div class="plan-count"><strong>${t("planNResults", { n: nodes.length })}</strong></div>
           <div class="plan-sort" role="group" aria-label="${t("sortFast")}">
             <button type="button" data-sort="depart" aria-pressed="${planSort === "depart"}">${t("sortDepart")}</button>
             <button type="button" data-sort="fast" aria-pressed="${planSort === "fast"}">${t("sortFast")}</button>
             <button type="button" data-sort="arrive" aria-pressed="${planSort === "arrive"}">${t("sortArrive")}</button>
             <button type="button" data-sort="walk" aria-pressed="${planSort === "walk"}">${t("sortWalk")}</button>
           </div>
         </div>` : "";
    results.innerHTML = nodes.length || directRow
      ? `${topbar}
         <div class="card">
           <h2 class="no-print" style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem">${t("itinerariesTitle")}
             <button id="shareBtn" class="linkish no-print">${icon("link")} ${t("share")}</button></h2>
           ${directRow}
           ${lastHasPrev && nodes.length ? `<button id="earlierBtn" class="linkish no-print">↑ ${t("showEarlier")}</button>` : ""}
           ${view.map((n, i) => itinHtml(n, i)).join("")}
           ${lastHasNext ? `<button id="moreBtn" class="no-print">${t("showLater")}</button>` : ""}
         </div>`
      : `<div class="card"><p class="muted">${t("noItineraries")}</p></div>`;
    results.querySelectorAll("details.itin[data-itin]").forEach(d =>
      d.addEventListener("toggle", () => {
        if (!d.open) return;
        // handoff: vain yksi kortti auki kerrallaan
        results.querySelectorAll("details.itin[open]").forEach(o => { if (o !== d) o.open = false; });
        const node = view[Number(d.dataset.itin)];
        if (asideActive()) drawAside(node).catch(() => {});
        else drawItineraryMap("itinMap" + d.dataset.itin, node).catch(() => {});
      }));
    results.querySelectorAll("details.itin[data-direct]").forEach(d =>
      d.addEventListener("toggle", () => {
        if (d.open) drawItineraryMap("directMap" + d.dataset.direct, directNodes[d.dataset.direct]).catch(() => {});
      }));
    results.querySelectorAll(".plan-sort button[data-sort]").forEach(b =>
      b.addEventListener("click", () => { planSort = b.dataset.sort; renderResults(); }));
    document.getElementById("moreBtn")?.addEventListener("click", () => search("more"));
    document.getElementById("earlierBtn")?.addEventListener("click", () => search("earlier"));
    document.getElementById("shareBtn")?.addEventListener("click", async e => {
      const url = location.origin + location.pathname + planHash();
      try {
        if (navigator.share) { await navigator.share({ url }); return; }
        await navigator.clipboard.writeText(url);
        e.target.textContent = "✓ " + t("linkCopied");
        setTimeout(() => { e.target.innerHTML = icon("link") + " " + t("share"); }, 2500);
      } catch (err) { /* käyttäjä perui jaon */ }
    });
  };

  // Kävely- ja pyörävaihtoehdot haetaan pääkyselyn rinnalla; lista täydentyy
  // vasta kun varsinaiset reittiehdotukset on jo piirretty
  const fetchDirects = async () => {
    const origin = { location: { coordinate: { latitude: planState.from.lat, longitude: planState.from.lon } } };
    const destination = { location: { coordinate: { latitude: planState.to.lat, longitude: planState.to.lon } } };
    const [walk, bike] = await Promise.allSettled([
      gql(DIRECT_QUERY, { origin, destination, direct: ["WALK"] }),
      gql(DIRECT_QUERY, { origin, destination, direct: ["BICYCLE"] }),
    ]);
    directNodes = {};
    if (walk.status === "fulfilled") directNodes.walk = walk.value.planConnection?.edges?.[0]?.node || null;
    if (bike.status === "fulfilled") directNodes.bike = bike.value.planConnection?.edges?.[0]?.node || null;
    // järjettömän pitkä kävely (yli 2 h) ei ole mielekäs vaihtoehto
    if (directNodes.walk && directNodes.walk.legs.reduce((s, l) => s + l.duration, 0) > 7200) {
      directNodes.walk = null;
    }
    if (mainDone && document.getElementById("planResults") === results) renderResults();
  };

  // mode: false/"new" = uusi haku, "more" = myöhemmät, "earlier" = aikaisemmat
  const search = async mode => {
    const msg = document.getElementById("planMsg");
    if (!planState.from || !planState.to) {
      msg.innerHTML = `<div class="error">${t("choosePlaces")}</div>`;
      return;
    }
    const append = mode === "more" || mode === "earlier";
    if (!append) {
      cursor = null; prevCursor = null; nodes = []; directNodes = {}; mainDone = false;
      results.innerHTML = `<p class="muted">${t("searchingRoutes")}</p>`;
      fetchDirects().catch(() => {});
    }
    msg.innerHTML = "";
    planState.timeMode = document.getElementById("timeMode").value;
    planState.time = document.getElementById("timeInput").value;
    planState.wheelchair = document.getElementById("wheelchairBox").checked;
    planState.lessWalk = document.getElementById("lessWalkBox").checked;
    const preferences = { accessibility: { wheelchair: { enabled: planState.wheelchair } } };
    if (planState.lessWalk) preferences.street = { walk: { reluctance: 3.5 } };
    const dateTime = planState.time
      ? (planState.timeMode === "arr"
          ? { latestArrival: isoWithOffset(planState.time) }
          : { earliestDeparture: isoWithOffset(planState.time) })
      : null;
    history.replaceState(null, "", planHash());
    addRecent(planState.from);
    addRecent(planState.to);
    // etusivun "viimeisin haku" -pikalinkki (ilman aikaa → haetaan avattaessa nyt-ajalla)
    try {
      localStorage.setItem(ns("lastPlan"), JSON.stringify({
        from: planState.from.name, to: planState.to.name, hash: planHash(false),
      }));
    } catch (e) {}
    try {
      const vars = {
        origin: { location: { coordinate: { latitude: planState.from.lat, longitude: planState.from.lon } } },
        destination: { location: { coordinate: { latitude: planState.to.lat, longitude: planState.to.lon } } },
        dateTime,
        preferences,
      };
      if (mode === "earlier") {
        vars.last = 5;
        vars.before = prevCursor;
      } else {
        vars.first = 5;
        vars.after = mode === "more" ? cursor : null;
      }
      const data = await gql(PLAN_QUERY, vars);
      const conn = data.planConnection;
      const newNodes = (conn.edges || []).map(e => localizePlanNode(e.node));
      if (mode === "earlier") {
        nodes = newNodes.concat(nodes);
        prevCursor = conn.pageInfo.startCursor;
        lastHasPrev = conn.pageInfo.hasPreviousPage;
      } else {
        nodes = nodes.concat(newNodes);
        cursor = conn.pageInfo.endCursor;
        lastHasNext = conn.pageInfo.hasNextPage;
        if (!append) {
          prevCursor = conn.pageInfo.startCursor;
          lastHasPrev = conn.pageInfo.hasPreviousPage;
        }
      }
      mainDone = true;
      renderResults();
    } catch (err) {
      results.innerHTML = `<div class="error">${esc(err.message)}</div>`;
    }
  };

  document.getElementById("planForm").addEventListener("submit", e => { e.preventDefault(); search(false); });
  // Sivupalkkikartan alkutila: kaupungin kartta heti (desktop) — ennen mahdollista hakua.
  initAsideCity().catch(() => {});
  // URL:sta tultaessa (jaettu linkki) tai paluunavigoinnissa haku käynnistyy heti
  if (planState.from && planState.to) search(false);
}

/* ---------- Router ---------- */

// Asettaa tulostussivun suunnan (@page). Vaaka tarvitaan koko pysäkkimatriisille
// (kaikki vuorot eivät mahdu pystyarkin leveyteen). Nollataan pystyyn printin jälkeen.
function setPageOrientation(orient) {
  let s = document.getElementById("pageOrient");
  if (!s) { s = document.createElement("style"); s.id = "pageOrient"; document.head.appendChild(s); }
  s.textContent = orient === "landscape"
    ? "@page { size: A4 landscape; margin: 8mm; }"
    : orient === "vihko"
    ? "@page { size: A4 landscape; margin: 0; }"   // vihko: 2× A5/arkki, reunaan asti
    : orient === "rack"
    ? "@page { size: A4 portrait; margin: 8mm; }"  // lehtiteline: tiukat marginaalit, max tila
    : "@page { size: A4 portrait; margin: 12mm; }";
}

/* ---------- Vihko (A5, taitettava): mittaa-ja-jaa sivutus + saddle-stitch imposition ----------
   Jakaa saman kootun vihkosisällön (#bookletOut) diskreeteiksi A5-sivuiksi mittaamalla todelliset
   korkeudet (pitkä linja/suunta jatkuu monelle A5:lle, ei leikkausta), ja asemoi ne A4-VAAKA-arkeille
   saddle-stitch-järjestyksessä. A4-vakiotuloste/julisteet/matriisi pysyvät ennallaan. */
const VK_PXMM = 96 / 25.4;                          // px per mm @96dpi
const vkMm = v => v * VK_PXMM;
const VK_A5_W = 148, VK_A5_H = 210, VK_PAD = 10;    // mm
const VK_CONTENT_H = VK_A5_H - 2 * VK_PAD;          // 190mm
const VK_CONTENT_W = VK_A5_W - 2 * VK_PAD;          // 128mm

// A5 on 128 mm leveä eikä siihen mahdu yhtä monta avainpysäkkisaraketta kuin A4:ään:
// oikea reuna leikkautui ja paperille jäi puolikkaita kellonaikoja (havaittu Vaasan
// ruotsinkielisestä vihosta 25.8.2026, taulukko 706 px / sivu 486 px). vkPaginate mittaa
// vain KORKEUDEN, joten liian leveä taulukko ei näkynyt sivutuksessa mitenkään.
//
// Raja on kiinteä eikä mitattu, koska mittaus pitäisi tehdä print-medialla: ruudulla sama
// taulukko on leveämpi (eri fontti ja min-leveydet), joten ruudulla mittaava karsinta
// tiivistäisi vihon turhaan minimiin. Kuusi on suurin arvo jolla pisimmätkin mitatut
// pysäkkinimet mahtuvat (Vaasa SV 485 px / 485 px). Vartija smokessa ja tuotanto-smokessa
// mittaa todellisen tuloksen, joten jos jokin kaupunki ei mahdu, se kaatuu eikä leikkaudu.
// Karsinta tehdään VIHKOA VARTEN kloonista samalla säännöllä kuin pickKeyStops (lähtö ja
// pääte aina, väliltä tasavälein), joten A4-vihko ja ruudun esikatselu pysyvät ennallaan.
const VK_MAX_COLS = 6;
function vkNarrowTable(table) {
  const clone = table.cloneNode(true);
  const n = clone.querySelector("tr")?.children.length || 0;
  if (n <= VK_MAX_COLS) return clone;
  const keep = new Set([0, n - 1]);
  for (let i = 0; i < VK_MAX_COLS; i++) keep.add(Math.round(i * (n - 1) / (VK_MAX_COLS - 1)));
  for (const tr of clone.querySelectorAll("tr"))
    [...tr.children].forEach((cell, i) => { if (!keep.has(i)) cell.remove(); });
  return clone;
}

// Pilko #bookletOut atomeiksi: otsikot (pidä seuraavan kanssa) + taulukot rivilistana (jaettavissa).
function vkCollectAtoms(out) {
  const atoms = [];
  const head = out.querySelector(".booklet-head");
  if (head) {
    const c = head.cloneNode(true);
    c.querySelectorAll(".no-print").forEach(n => n.remove());
    atoms.push({ html: `<div class="vk-cover">${c.innerHTML}</div>` });
  }
  for (const line of out.querySelectorAll(".booklet-line")) {
    let lineLabel = "", dirLabel = "";
    for (const node of line.children) {
      const tag = node.tagName;
      if (tag === "H2") { lineLabel = node.textContent.trim(); atoms.push({ html: `<div class="vk-h2">${node.innerHTML}</div>`, keepWithNext: true }); }
      else if (tag === "H3") { dirLabel = node.textContent.trim(); atoms.push({ html: `<div class="vk-h3">${node.innerHTML}</div>`, keepWithNext: true }); }
      else if (tag === "H4") atoms.push({ html: `<div class="vk-h4">${node.innerHTML}</div>`, keepWithNext: true });
      else {
        const src = tag === "TABLE" ? node : node.querySelector("table");
        const table = src ? vkNarrowTable(src) : null;
        const rows = table ? [...table.querySelectorAll("tbody tr")].map(tr => tr.outerHTML) : [];
        if (table && rows.length)
          atoms.push({ table: true, thead: table.querySelector("thead")?.outerHTML || "", rows,
                       cont: [lineLabel, dirLabel].filter(Boolean).join(" · ") });
        else atoms.push({ html: `<div class="vk-note">${esc(node.textContent.trim())}</div>` });
      }
    }
  }
  return atoms;
}

// Pakkaa atomit A5-korkuisiksi sivuiksi mittaamalla SIVUN TODELLINEN kumulatiivinen korkeus joka
// lisäyksen jälkeen (ei summata atomeja erikseen → ei marginaali-collapse-virhettä). Pitkä taulu
// jaetaan rivi riviltä; jokainen jatko-A5 toistaa otsikkorivin + "(jatkoa)". Ei leikkausta/pakkausta.
function vkPaginate(atoms) {
  const m = document.createElement("div");
  m.className = "vihko-page-content";
  m.style.cssText = `position:fixed;left:-9999px;top:0;width:${VK_CONTENT_W}mm;visibility:hidden`;
  document.body.appendChild(m);
  const maxH = vkMm(VK_CONTENT_H) - vkMm(6);        // 6mm varmuusvara (ruutu- vs. print-media-ero)
  const heightOf = html => { m.innerHTML = html; return m.getBoundingClientRect().height; };
  const fits = html => heightOf(html) <= maxH;
  const pages = [];
  let cur = "";
  const flush = () => { if (cur) { pages.push(cur); cur = ""; } };
  const tableHtml = (a, rows, cont) =>
    (cont ? `<div class="vk-cont">${esc(a.cont)} ${t("vihkoContinued")}</div>` : "")
    + `<table class="vk-tbl">${a.thead}<tbody>${rows.join("")}</tbody></table>`;  // EI booklet/stoptable-luokkaa: @media print -säännöt eivät saa muuttaa mitattua kokoa
  try {
    for (const a of atoms) {
      if (a.table) {
        let i = 0, first = true;
        while (i < a.rows.length) {
          let chunk = [];
          for (; i < a.rows.length; i++) {
            if (!fits(cur + tableHtml(a, chunk.concat(a.rows[i]), !first)) && (chunk.length || cur)) break;
            chunk.push(a.rows[i]);
          }
          if (!chunk.length) { flush(); continue; }   // ei mahtunut edes 1 riviä → uusi sivu, yritä uudelleen
          cur += tableHtml(a, chunk, !first);
          first = false;
          if (i < a.rows.length) flush();              // rivejä jäljellä → jatko seuraavalle A5:lle
        }
      } else {
        if (cur && !fits(cur + a.html)) flush();
        // orpouden esto: jos otsikolle ei jää sivulle tilaa ~12mm vertaa → uudelle sivulle
        else if (a.keepWithNext && cur && !fits(cur + a.html + `<div style="height:${vkMm(12)}px"></div>`)) flush();
        cur += a.html;
      }
    }
    flush();
  } finally {
    document.body.removeChild(m);
  }
  return pages;
}

// Saddle-stitch imposition (VAIHE 1:ssä todennettu): N→4:n monikerta, tyhjät loppuun;
// arkki i ETU [N−2i | 1+2i], TAKA [2+2i | N−1−2i]. PDF-järjestys: ETU, TAKA per arkki.
function vkImpose(pageHtmls) {
  const N0 = pageHtmls.length;
  const N = Math.max(4, Math.ceil(N0 / 4) * 4);
  const S = N / 4;
  const pg = k => (k >= 1 && k <= N0)
    ? `<div class="vihko-a5"><div class="vihko-page-content">${pageHtmls[k - 1]}</div></div>`
    : `<div class="vihko-a5 vihko-blank"></div>`;
  let html = "";
  for (let i = 0; i < S; i++) {
    html += `<div class="vihko-sheet">${pg(N - 2 * i)}${pg(1 + 2 * i)}</div>`;       // ETU
    html += `<div class="vihko-sheet">${pg(2 + 2 * i)}${pg(N - 1 - 2 * i)}</div>`;     // TAKA
  }
  return html;
}

// Tulosteen valmistelu-indikaattori (UX): ei estä tulostusta, piiloon printissä (.no-print) + afterprintissä.
function showPrintPrep(msg) {
  let el = document.getElementById("printPrep");
  if (!el) {
    el = document.createElement("div");
    el.id = "printPrep"; el.className = "no-print";
    el.setAttribute("role", "status"); el.setAttribute("aria-live", "polite");
    document.body.appendChild(el);
  }
  el.innerHTML = `<div class="pp-box">${icon("print")} ${esc(msg)}</div>`;
  el.hidden = false;
}
function hidePrintPrep() { const el = document.getElementById("printPrep"); if (el) el.hidden = true; }

// Näytä indikaattori ja aja synkroninen valmistelu + window.print() VASTA maalauksen jälkeen
// (2× requestAnimationFrame), jotta indikaattori ehtii näkyä ennen pääsäikeen lukitsevaa työtä.
function runPrintJob(prepMsg, prepare) {
  showPrintPrep(prepMsg);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    try {
      if (prepare() === false) { hidePrintPrep(); return; }  // ei tulostettavaa
    } catch (e) { hidePrintPrep(); return; }
    hidePrintPrep();                                          // window.print() palasi (dialogi suljettu / ei tuettu)
  }));
}

function printVihko() {
  const out = document.getElementById("bookletOut");
  if (!out || !out.querySelector(".booklet-line")) return;
  runPrintJob(t("vihkoPreparing"), () => {
    const pages = vkPaginate(vkCollectAtoms(out));
    if (!pages.length) return false;
    document.getElementById("vihkoPrint")?.remove();
    const wrap = document.createElement("div");
    wrap.id = "vihkoPrint";
    wrap.innerHTML = vkImpose(pages);
    document.body.appendChild(wrap);
    document.body.classList.add("vihko-printing");
    setPageOrientation("vihko");
    const cleanup = () => {
      document.body.classList.remove("vihko-printing");
      wrap.remove();
      setPageOrientation("portrait");
      hidePrintPrep();
      window.removeEventListener("afterprint", cleanup);
    };
    window.addEventListener("afterprint", cleanup);
    window.print();
  });
}

// Rinnakkaisajo rajatulla samanaikaisuudella (proxyn ~10 req/s suoja)
async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (i < items.length) { const idx = i++; out[idx] = await fn(items[idx], idx); }
  }));
  return out;
}

// Avainpysäkkien rajaus kun timepointeja on liikaa (esim. Vaasan feed merkitsee kaikki ~60
// pysäkkiä timepointeiksi → 60 saraketta = käyttökelvoton). Kandidaateista (timepoint || 1. ||
// viimeinen) valitaan ≤ raja → kaikki ennallaan; muuten 10: aina lähtö + pää, hubit (CONFIG.hubs
// nimimätch sananrajalla) sekä tasaväli sekvenssipositioista. Koskee A4:ää ja vihkoa (jaettu).
const KEY_STOP_LIMIT = 12, KEY_STOP_TARGET = 10;
function normHubName(s) { return (s || "").toLowerCase().replace(/[^a-zåäö0-9]+/g, " ").trim(); }
function stopMatchesHub(stopName, hubTokenLists) {
  const tokens = normHubName(stopName).split(" ").filter(Boolean);
  // sananrajamätch: hub esiintyy kokonaisena sana(jono)na ("Kauppatori E" ✓, "Kauppatorinkatu" ✗)
  return hubTokenLists.some(hs =>
    hs.length && tokens.some((_, i) => i + hs.length <= tokens.length && hs.every((w, j) => tokens[i + j] === w)));
}
function pickKeyStops(cand, target = KEY_STOP_TARGET, limit = KEY_STOP_LIMIT) {
  if (cand.length <= limit) return cand.map(c => c.stop);
  const chosen = new Set([cand[0].idx, cand[cand.length - 1].idx]);          // aina lähtö + pää
  for (let i = 0; i < target; i++)                                           // tasaväli (sis. päätepisteet)
    chosen.add(cand[Math.round(i * (cand.length - 1) / (target - 1))].idx);
  const hubTokens = (CONFIG.hubs || []).map(h => normHubName(h.name).split(" ").filter(Boolean)).filter(a => a.length);
  if (hubTokens.length) for (const c of cand) if (stopMatchesHub(c.stop.name, hubTokens)) chosen.add(c.idx);
  return cand.filter(c => chosen.has(c.idx)).map(c => c.stop);               // sekvenssijärjestyksessä
}

// Vihkotaulukko yhdelle suunnalle: sarakkeina isot pysäkit (timepoint +
// aina lähtö & pääte), riveinä päivän lähdöt. Rivi = yksi vuoro avainpysäkkien
// läpi (esim. Pilkekatu 13:05 · Matkakeskus 13:13 · …).
function bookletTableHtml(trips, keyOpts) {
  const valid = (trips || []).filter(tr => (tr.stoptimes || []).length);
  if (!valid.length) return `<p class="muted">${t("bookletNoData")}</p>`;
  const seq = valid[0].stoptimes;
  const last = seq.length - 1;
  const cand = seq
    .map((st, i) => (st.timepoint || i === 0 || i === last) ? { stop: st.stop, idx: i } : null)
    .filter(Boolean);
  const keyStops = pickKeyStops(cand, keyOpts?.target, keyOpts?.limit);
  const rows = valid.map(tr => {
    const m = {};
    for (const st of tr.stoptimes) if (m[st.stop.gtfsId] == null) m[st.stop.gtfsId] = st.scheduledDeparture;
    return m;
  }).sort((a, b) => (a[keyStops[0].gtfsId] ?? 1e9) - (b[keyStops[0].gtfsId] ?? 1e9));
  const head = keyStops.map(s => `<th scope="col">${esc(s.name)}</th>`).join("");
  let usedDot = false;
  const body = rows.map(m =>
    `<tr>${keyStops.map(s => `<td>${m[s.gtfsId] == null ? (usedDot = true, "·") : fmtSec(m[s.gtfsId])}</td>`).join("")}</tr>`).join("");
  return `<div class="matrix-wrap"><table class="stoptable booklet">
      <thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>` +
    (usedDot ? `<p class="matrix-legend">${t("legendSkipStop")}</p>` : "");
}

/* ---------- Yhdistetty suunta-aikataulu (käytävä): usean linjan lähdöt yhteen ----------
   Yleinen mekanismi: käytävä johdetaan DATASTA — linjojen patternien järjestyksessä säilyvä
   yhteinen pysäkkijakso, ja suunnat jaetun jakson kulkusuunnasta. directionId:tä EI vertailla
   linjojen yli (ei vertailukelpoinen eri linjojen välillä). CONFIG.corridors on vain
   valinnainen pikavalintataso (malli: LSL:n Laatukäytävät, esim. Ahtiala 4/14/24/34K). */

// Valittujen linjojen suunnittaiset ensisijaiset patternit + pysäkkisekvenssit.
// Sama proute-kysely ja tulevien vuorojen probe kuin vihossa → jaettu välimuisti.
async function corridorFetchLines(routeIds) {
  const probe = activeProbeDates();
  const probeAliases = probe.map((d, i) => `p${i}: tripsForDate(serviceDate: "${d}") { gtfsId }`).join(" ");
  const upcoming = p => probe.reduce((n, _, i) => n + ((p["p" + i] || []).length), 0);
  return (await mapLimit(routeIds, 4, async routeId => {
    try {
      const ids = await lineIds(routeId);
      const { data } = await cachedGql("proute:" + ids.join(","),
        `query ($ids: [String]) {
           routes(ids: $ids) {
             gtfsId shortName longName@L color textColor
             patterns { code name directionId ${probeAliases} stops { gtfsId name@L } }
           }
         }`, { ids });
      const arr = (data.routes || []).filter(Boolean);
      const route = arr.find(r => r.gtfsId === routeId) || arr[0];
      if (!route) return null;
      const patterns = arr.flatMap(r => r.patterns || []);
      const byDir = new Map();
      for (const p of patterns) {
        const k = p.directionId ?? 0;
        if (!byDir.has(k)) byDir.set(k, []);
        byDir.get(k).push(p);
      }
      const primaries = [...byDir.values()]
        .map(list => list.sort((a, b) => upcoming(b) - upcoming(a))[0]);
      return { route, byDir, primaries,
               upcoming: primaries.reduce((n, p) => n + upcoming(p), 0) };
    } catch (e) { return null; }
  })).filter(Boolean);
}

// Patternin yhteensopivuuspisteet referenssiketjuun: jaettujen pysäkkien määrä kun
// ensiesiintymät etenevät referenssillä pääosin kasvavasti; 0 jos jaettuja <2 tai
// järjestys pääosin käänteinen/sekava. Silmukka/toistuva pysäkki voi tuottaa
// yksittäisiä poikkeamia → selvä enemmistö riittää. HUOM: vastakkainen ajosuunta
// käyttää eri fyysisiä pysäkkejä (kadun toinen puoli, eri gtfsId) → suuntia EI
// tunnisteta käänteisjärjestyksestä vaan kummallakin suunnalla on oma referenssiketju.
function corridorOrientScore(refIdx, stops) {
  const pos = [];
  for (const s of stops || []) {
    const i = refIdx.get(s.gtfsId);
    if (i != null) pos.push(i);
  }
  if (pos.length < 2) return 0;
  let inc = 0, dec = 0;
  for (let i = 1; i < pos.length; i++) {
    if (pos[i] > pos[i - 1]) inc++;
    else if (pos[i] < pos[i - 1]) dec++;
  }
  return ((inc && !dec) || inc >= 3 * Math.max(1, dec)) ? pos.length : 0;
}

// Järjestyksessä säilyvä yhteinen pysäkkijakso: referenssiketju suodatettuna pysäkkeihin
// jotka esiintyvät KAIKILLA jäsenillä ja joiden ensiesiintymät etenevät jokaisella.
function corridorShared(refStops, memberStopLists) {
  const idx = memberStopLists.map(list => {
    const m = new Map();
    (list || []).forEach((s, i) => { if (!m.has(s.gtfsId)) m.set(s.gtfsId, i); });
    return m;
  });
  let shared = (refStops || []).filter(s => idx.every(m => m.has(s.gtfsId)));
  for (const m of idx) {
    let lastPos = -1;
    shared = shared.filter(s => {
      const p = m.get(s.gtfsId);
      if (p > lastPos) { lastPos = p; return true; }
      return false;
    });
  }
  return shared;
}

// Presetin näyttönimi: merkkijono tai kielikohtainen objekti ({ fi, sv, en } — esim.
// kaksikielinen Vaasa: "Palosaaren suunta" / "Riktning Brändö").
function corridorName(c) {
  return typeof c.name === "object" ? (c.name[lang] || c.name.fi || "") : (c.name || "");
}

// Näyttösarakkeet jaetusta jaksosta: ensimmäinen + keskikohta (hub etusijalla) + viimeinen.
function corridorKeyStops(shared) {
  if (shared.length <= 3) return shared;
  const hubTokens = (CONFIG.hubs || []).map(h => normHubName(h.name).split(" ").filter(Boolean)).filter(a => a.length);
  let mid = null;
  if (hubTokens.length) mid = shared.slice(1, -1).find(s => stopMatchesHub(s.name, hubTokens)) || null;
  if (!mid) mid = shared[Math.floor(shared.length / 2)];
  return [shared[0], mid, shared[shared.length - 1]];
}

// Koko käytävän kokoaminen: suunnat (A/B) → jaettu jakso → vuorot kaikilta linjoilta
// päivätyyppilohkoihin. Ryhmittely ajetaan PER LINJA (groupTripsByDaysin aikasignatuuri-
// dedup ei saa niputtaa eri linjojen identtisiä aikoja yhteen — sama periaate kuin
// pysäkkijulisteessa); lohkot yhdistetään dows+school-avaimella.
async function corridorBuild(routeIds, dateISO) {
  const lines = await corridorFetchLines(routeIds);
  if (lines.length < 2) return { dirs: [], excluded: lines.map(l => l.route.shortName || "") };
  const ref = lines.reduce((a, b) => (b.upcoming > a.upcoming ? b : a));
  // Referenssilinjan kummankin suunnan pysäkkiketjut = kahden suunnan referenssit.
  const refIdxes = ref.primaries.slice(0, 2).map(p => {
    const m = new Map();
    (p.stops || []).forEach((s, i) => { if (!m.has(s.gtfsId)) m.set(s.gtfsId, i); });
    return m;
  });
  const buckets = refIdxes.map(() => ({ members: [] }));
  const excluded = [];
  for (const L of lines) {
    let placed = false;
    for (const p of L.primaries) {
      // sijoitus paremman myötäsuunta-osuman mukaan; sama linja vain kerran per suunta
      // (silmukkalinjan molemmat suunnat voisivat muuten päätyä samaan ämpäriin)
      const scores = refIdxes.map(idx => corridorOrientScore(idx, p.stops));
      const best = scores.indexOf(Math.max(...scores));
      if (scores[best] < 2) continue;
      const b = buckets[best];
      if (!b.members.some(m => m.line === L)) { b.members.push({ line: L, pattern: p }); placed = true; }
    }
    if (!placed) excluded.push(L.route.shortName || "");
  }
  const dirs = [];
  for (const b of buckets) {
    if (b.members.length < 2) continue;
    const refMember = b.members.find(m => m.line === ref) || b.members[0];
    const shared = corridorShared(refMember.pattern.stops, b.members.map(m => m.pattern.stops));
    if (shared.length < 3) continue;
    const keyStops = corridorKeyStops(shared);
    const blocks = new Map();
    await mapLimit(b.members, 3, async m => {
      const dirPats = m.line.byDir.get(m.pattern.directionId ?? 0) || [m.pattern];
      let trips = [];
      try { trips = await dirTripsWithDays(dirPats); } catch (e) { trips = []; }
      for (const g of groupTripsByDays(trips, dateISO)) {
        const bk = [...g.dows].sort((x, y) => x - y).join(",") + "|" + g.school;
        if (!blocks.has(bk)) blocks.set(bk, { dows: g.dows, school: g.school, label: g.label, rows: [] });
        const blk = blocks.get(bk);
        for (const tr of g.trips) {
          // ensiesiintymä per pysäkki (käyntisemantiikka: 1. käynti = lähtöaika)
          const times = new Map();
          for (const st of tr.stoptimes || []) {
            const id = st.stop?.gtfsId;
            if (id && !times.has(id)) times.set(id, st.scheduledDeparture);
          }
          const sortSec = keyStops.map(s => times.get(s.gtfsId)).find(v => v != null);
          if (sortSec == null) continue; // vuoro ei kosketa näyttöpysäkkejä
          blk.rows.push({
            route: m.line.route,
            headsign: tr.tripHeadsign || tr.stoptimes?.[0]?.headsign || m.line.route.longName || "",
            times, sortSec,
          });
        }
      }
    });
    const groups = [...blocks.values()].filter(g => g.rows.length);
    if (!groups.length) continue;
    groups.forEach(g => g.rows.sort((x, y) => x.sortSec - y.sortSec));
    groups.sort((x, y) => {
      const am = Math.min(...x.dows), bm = Math.min(...y.dows);
      return am !== bm ? am - bm : y.dows.size - x.dows.size;
    });
    dirs.push({
      label: `${shared[0].name} → ${shared[shared.length - 1].name}`,
      sharedCount: shared.length, keyStops, groups,
      lines: b.members.map(m => m.line.route),
    });
  }
  return { dirs, excluded };
}

// Yhdistetyn suunnan taulukko: Klo (1. yhteinen pysäkki) | Linja | Määränpää | muut
// yhteiset pysäkit. Kaikki tekstiä (printtikärjen symbolilinja); "·" saa selitteen.
function corridorTableHtml(group, keyStops) {
  let usedDot = false;
  const cell = v => { if (v == null) { usedDot = true; return "·"; } return fmtSec(v); };
  const head = `<tr><th scope="col">${esc(keyStops[0].name)}</th>` +
    `<th scope="col">${t("corridorLineCol")}</th><th scope="col">${t("corridorDestCol")}</th>` +
    keyStops.slice(1).map(s => `<th scope="col">${esc(s.name)}</th>`).join("") + "</tr>";
  // data-sec = GTFS-sekunnit vuorokauden alusta, myös yli 24 h (24:04 = 86640).
  // Näkyvä teksti on kellonaika ("00:04"), josta ei voi päätellä onko lähtö saman
  // vai seuraavan vuorokauden puolella. Vartija tarvitsee sen tiedon: ilman sitä
  // aikajärjestyksen tarkistus joutuisi arvaamaan (12 h -heuristiikka petti
  // 24.8.2026 Hämeenlinnan perjantailohkossa jossa oli vain 06:11 ja 24:04).
  // Attribuutti ei näy tulosteessa eikä muuta ulkoasua.
  const body = group.rows.map(r =>
    `<tr><td${r.times.get(keyStops[0].gtfsId) != null ? ` data-sec="${r.times.get(keyStops[0].gtfsId)}"` : ""}>` +
    `${cell(r.times.get(keyStops[0].gtfsId))}</td>` +
    `<td>${badgeHtml(r.route)}</td><td class="corr-dest">${esc(r.headsign)}</td>` +
    keyStops.slice(1).map(s => `<td>${cell(r.times.get(s.gtfsId))}</td>`).join("") + "</tr>").join("");
  return `<div class="matrix-wrap"><table class="stoptable booklet corridor">
      <thead>${head}</thead><tbody>${body}</tbody></table></div>` +
    (usedDot ? `<p class="matrix-legend">${t("legendSkipStop")}</p>` : "");
}

/* ---------- Uusintapainatuslista: mitkä JO PAINETUT tulosteet ovat vanhentuneet ----------
   Kausivalidointi-vahti (CI) kertoo että FEED muuttui. Se ei kerro mitkä painetut tulosteet
   ovat sen takia väärin, ja juuri se on kysymys johon kunta tarvitsee vastauksen: Lahdessa
   10.8.2026 Tevi P → Trio F, jolloin jokainen vanhan nimen sisältänyt tuloste oli sinä aamuna
   väärässä eikä kukaan tiennyt mitkä ne olivat.
   Perustaso = sormenjälki siitä datasta josta tuloste painettiin. Se tallentuu selaimeen kun
   käyttäjä merkitsee tulosteen painetuksi. Vertailu tuottaa ihmisluettavan eron (lähtömäärä,
   ensimmäinen/viimeinen lähtö, päätepysäkki, päivätyyppilohkot) — ei pelkkää hash-eroa, koska
   "tiiviste muuttui" ei kerro painajalle mitään. */

const REPRINT_VER = 1;
function reprintKey() { return "reprintBase:" + cityKey; }
function reprintLoad() {
  try { const o = JSON.parse(localStorage.getItem(reprintKey()) || "{}"); return (o && typeof o === "object") ? o : {}; }
  catch (e) { return {}; }
}
function reprintSave(all) {
  try { localStorage.setItem(reprintKey(), JSON.stringify(all)); }
  catch (e) { /* kiintiö täynnä: vertailu jatkuu muistissa, vain säilyvyys menetetään */ }
}

// Vakaa pieni tiiviste (djb2). Sormenjälki ei saa kasvaa lähtömäärän mukana, koska
// koko kaupungin perustaso elää localStoragessa.
function reprintHash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}

// Lohkon sormenjälki. rows = [{ sec, key }]: sec järjestystä ja ensimmäinen/viimeinen
// -tietoa varten, key kaiken sen tunnistamiseen mikä tulosteessa näkyy.
function reprintGroupSig(label, rows) {
  const secs = rows.map(r => r.sec).filter(v => v != null).sort((a, b) => a - b);
  return {
    label, n: rows.length,
    first: secs.length ? fmtSec(secs[0]) : "",
    last: secs.length ? fmtSec(secs[secs.length - 1]) : "",
    h: reprintHash(rows.map(r => r.key).sort().join(";")),
  };
}

// Linjatulosteen sormenjälki. Sama patternivalinta kuin vihossa (ks. bindBookletTab):
// suunnittain se variantti jolla on eniten tulevia vuoroja, ja lohkot todellisten
// ajopäivien mukaan — muuten perustaso ja tuloste eivät vertaisi samaa asiaa.
async function reprintLineSnap(routeId, dateISO) {
  const probe = activeProbeDates();
  const probeAliases = probe.map((d, i) => `p${i}: tripsForDate(serviceDate: "${d}") { gtfsId }`).join(" ");
  const upcoming = p => probe.reduce((n, _, i) => n + ((p["p" + i] || []).length), 0);
  const ids = await lineIds(routeId);
  const { data } = await cachedGql("proute:" + ids.join(","),
    `query ($ids: [String]) {
       routes(ids: $ids) {
         gtfsId shortName longName@L color textColor
         patterns { code name directionId ${probeAliases} stops { gtfsId name@L } }
       }
     }`, { ids });
  const arr = (data.routes || []).filter(Boolean);
  const route = arr.find(r => r.gtfsId === routeId) || arr[0];
  if (!route) return null;
  const byDir = new Map();
  for (const p of arr.flatMap(r => r.patterns || [])) {
    const k = p.directionId ?? 0;
    if (!byDir.has(k)) byDir.set(k, []);
    byDir.get(k).push(p);
  }
  const primaries = [...byDir.values()].map(list => list.sort((a, b) => upcoming(b) - upcoming(a))[0]);
  const dirs = [];
  for (const p of primaries) {
    const stops = p.stops || [];
    const label = stops.length ? `${stops[0].name} → ${stops[stops.length - 1].name}` : (p.name || "");
    let groups = [];
    try { groups = groupTripsByDays(await dirTripsWithDays(byDir.get(p.directionId ?? 0) || [p]), dateISO); }
    catch (e) { groups = []; }
    dirs.push({
      label,
      groups: groups.map(g => reprintGroupSig(g.label, g.trips.map(tr => {
        const ts = (tr.stoptimes || []).map(s => s.scheduledDeparture);
        return { sec: ts[0], key: ts.join(",") };
      }))),
    });
  }
  return { v: REPRINT_VER, kind: "line", label: `${route.shortName || ""} ${route.longName || ""}`.trim(), dirs };
}

// Käytävätulosteen sormenjälki (CONFIG.corridors-pikavalinnat = ne arkit joita oikeasti
// painetaan). Käyttää samaa corridorBuildia kuin tuloste itse.
async function reprintCorridorSnap(c, dateISO, routes) {
  const want = new Set((c.lines || []).map(String));
  const ids = routes.filter(r => want.has(String(r.shortName || ""))).map(r => r.gtfsId);
  if (ids.length < 2) return null;
  const built = await corridorBuild(ids, dateISO);
  const dirs = (built.dirs || []).map(d => ({
    label: d.label,
    groups: (d.groups || []).map(g => reprintGroupSig(g.label, g.rows.map(r => ({
      sec: r.sortSec, key: `${r.route.shortName || ""}@${r.sortSec}→${r.headsign || ""}`,
    })))),
  }));
  return { v: REPRINT_VER, kind: "corridor", label: corridorName(c), dirs };
}

// Ihmisluettava ero perustason ja nykytilan välillä. Tyhjä lista = tuloste kelpaa yhä.
// Suunnat verrataan indeksillä eikä nimellä, koska juuri nimenmuutos (päätepysäkki)
// on se tapaus jonka pitää näkyä erona eikä kadota parittomana.
function reprintDiff(base, now) {
  const out = [];
  const bd = base?.dirs || [], nd = now?.dirs || [];
  if (bd.length !== nd.length) {
    out.push(t("reprintDiffDirCount", { a: bd.length, b: nd.length }));
  }
  const n = Math.min(bd.length, nd.length);
  for (let i = 0; i < n; i++) {
    const b = bd[i], c = nd[i];
    if (b.label !== c.label) out.push(t("reprintDiffDir", { a: b.label, b: c.label }));
    const bg = new Map((b.groups || []).map(g => [g.label, g]));
    const cg = new Map((c.groups || []).map(g => [g.label, g]));
    for (const [label, g] of cg) {
      const prev = bg.get(label);
      if (!prev) { out.push(t("reprintDiffAdded", { label })); continue; }
      if (prev.n !== g.n) out.push(t("reprintDiffTrips", { label, a: prev.n, b: g.n }));
      else if (prev.h !== g.h) out.push(t("reprintDiffTimes", { label }));
      if (prev.first !== g.first || prev.last !== g.last)
        out.push(t("reprintDiffSpan", { label, a: `${prev.first}–${prev.last}`, b: `${g.first}–${g.last}` }));
    }
    for (const [label] of bg) if (!cg.has(label)) out.push(t("reprintDiffRemoved", { label }));
  }
  return out;
}

async function viewReprint() {
  if (!PROXY_URL && !apiKey) { location.hash = "#/asetukset"; return; }
  setView(`<p class="muted">${t("loadingRoutes")}</p>`);
  const routes = await loadRoutes();
  const today = todayISO();
  const base = reprintLoad();

  // Seurattava yksikkö = painettava arkki: linjatuloste tai käytävätuloste.
  const units = [
    ...(CONFIG.corridors || []).map(c => ({ id: "corr:" + c.key, kind: "corridor", cfg: c, label: corridorName(c) })),
    ...routes.map(r => ({ id: r.gtfsId, kind: "line", route: r, label: `${r.shortName || ""} ${r.longName || ""}`.trim() })),
  ];
  const tracked = u => !!base[u.id];

  const unitRow = (u) => `<li><label class="item" style="cursor:pointer;align-items:center">
      <input type="checkbox" class="rpCb" value="${esc(u.id)}" ${tracked(u) ? "checked" : ""}
             style="width:1.4rem;height:1.4rem;flex:none">
      <span>${u.kind === "corridor" ? icon("route") : icon("print")} ${esc(u.label)}</span>
      ${tracked(u) ? `<span class="muted" style="margin-left:auto;font-size:0.85em">${esc(t("reprintPrintedAt", { date: fmtDateLong((base[u.id].printed || "").slice(0, 10)) }))}</span>` : ""}
    </label></li>`;

  const trackedUnits = units.filter(tracked);
  const otherUnits = units.filter(u => !tracked(u));

  setView(`
    <nav class="crumb"><a href="#/">← ${t("home")}</a></nav>
    <div class="card no-print">
      <h2>${icon("print")} ${t("reprintTitle")}</h2>
      <p class="muted">${t("reprintIntro")}</p>
      <div class="field">
        <label for="rpDate">${t("bookletDateLabel")}</label>
        <input type="date" id="rpDate" value="${esc(today)}">
      </div>
      <p class="buildbar"><button type="button" id="rpGo">${t("reprintCheck")}</button>
        <span id="rpStatus" class="muted" role="status"></span></p>
      ${trackedUnits.length ? `
        <h3>${t("reprintTracked")}</h3>
        <ul class="plain" id="rpTracked">${trackedUnits.map(unitRow).join("")}</ul>` :
        `<p class="muted">${t("reprintNoBaseline")}</p>`}
      <h3>${t("reprintAddMore")}</h3>
      <div class="row" style="flex-wrap:wrap;gap:0.4rem;margin:0.5rem 0">
        <input type="search" id="rpFilter" placeholder="${t("routeFilterPlaceholder")}" aria-label="${t("routeFilterAria")}">
      </div>
      <ul class="plain" id="rpOthers">${otherUnits.map(unitRow).join("")}</ul>
    </div>
    <div id="rpOut"></div>`);

  document.getElementById("rpFilter").addEventListener("input", e => {
    const f = e.target.value.toLowerCase();
    document.querySelectorAll("#rpOthers li").forEach(li => {
      li.hidden = f && !li.textContent.toLowerCase().includes(f);
    });
  });

  const byId = new Map(units.map(u => [u.id, u]));
  const snapOf = (u, date) => u.kind === "corridor"
    ? reprintCorridorSnap(u.cfg, date, routes)
    : reprintLineSnap(u.route.gtfsId, date);

  // Viimeisimmän tarkistuksen tulokset. Kuuntelija sidotaan KERRAN (ei joka ajolla),
  // muuten sama #rpOut keräisi kuuntelijan per tarkistus.
  let lastResults = [];
  document.getElementById("rpOut").addEventListener("click", (e) => {
    const b = e.target.closest(".rpMark");
    if (!b) return;
    const r = lastResults.find(x => x.u.id === b.dataset.id);
    if (!r || !r.snap) return;
    // Merkitse painetuksi = tallenna NYKYINEN sormenjälki uudeksi perustasoksi.
    const all = reprintLoad();
    all[r.u.id] = { label: r.u.label, printed: new Date().toISOString(), sig: r.snap };
    reprintSave(all);
    base[r.u.id] = all[r.u.id];
    b.replaceWith(Object.assign(document.createElement("span"), {
      className: "muted", textContent: t("reprintMarked"),
    }));
  });

  document.getElementById("rpGo").addEventListener("click", async () => {
    const mySeq = viewSeq;
    const status = document.getElementById("rpStatus");
    const picked = [...document.querySelectorAll(".rpCb:checked")].map(c => byId.get(c.value)).filter(Boolean);
    if (!picked.length) { status.textContent = t("reprintNonePicked"); return; }
    const date = document.getElementById("rpDate").value || today;
    let done = 0;
    const tick = () => { status.textContent = t("reprintChecking", { done, total: picked.length }); };
    tick();

    const results = await mapLimit(picked, 3, async (u) => {
      try {
        const snap = await snapOf(u, date);
        if (!snap) return null;
        const prev = base[u.id];
        return { u, snap, prev, diff: prev ? reprintDiff(prev.sig, snap) : null };
      } catch (e) {
        return { u, error: true };
      } finally {
        done++;
        if (mySeq === viewSeq) tick();
      }
    });
    if (mySeq !== viewSeq) return;

    const ok = results.filter(Boolean);
    const changed = ok.filter(r => r.diff && r.diff.length);
    const same = ok.filter(r => r.diff && !r.diff.length);
    const fresh = ok.filter(r => !r.error && !r.prev);
    const failed = ok.filter(r => r.error);

    const markBtn = (r) => `<button type="button" class="linkish rpMark" data-id="${esc(r.u.id)}">${t("reprintMark")}</button>`;
    const card = (titleKey, list, body) => list.length ? `
      <section class="card">
        <h2>${t(titleKey)} (${list.length})</h2>
        <ul class="plain">${list.map(body).join("")}</ul>
      </section>` : "";

    document.getElementById("rpOut").innerHTML =
      card("reprintChanged", changed, r => `<li class="item" style="align-items:flex-start">
        <div><strong>${esc(r.u.label)}</strong>
          <ul class="muted" style="margin:0.2rem 0 0">${r.diff.map(d => `<li>${esc(d)}</li>`).join("")}</ul>
        </div>
        <span style="margin-left:auto">${markBtn(r)}</span></li>`) +
      card("reprintNewUnits", fresh, r => `<li class="item">
        <span>${esc(r.u.label)}</span>
        <span class="muted" style="margin-left:auto">${t("reprintNoRef")} ${markBtn(r)}</span></li>`) +
      card("reprintSame", same, r => `<li class="item"><span>${esc(r.u.label)}</span></li>`) +
      card("reprintFailed", failed, r => `<li class="item"><span>${esc(r.u.label)}</span></li>`) +
      // "ei muutoksia" vain kun jotain oikeasti vertailtiin; pelkkä perustasoton lista ei ole hyvä uutinen
      (!changed.length && same.length ? `<p class="muted">${t("reprintEmpty")}</p>` : "");

    lastResults = ok;
    status.textContent = "";
    document.getElementById("rpOut").scrollIntoView({ behavior: "smooth", block: "start" });
  });
}

function bindBookletTab(routes, today) {

  const cbs = () => [...document.querySelectorAll(".lineCb")];
  document.getElementById("lineFilter").addEventListener("input", e => {
    const f = e.target.value.toLowerCase();
    document.querySelectorAll("#lineChecks li").forEach(li => {
      li.hidden = f && !li.textContent.toLowerCase().includes(f);
    });
  });
  document.getElementById("selAll").addEventListener("click", () =>
    cbs().forEach(c => { if (!c.closest("li").hidden) c.checked = true; }));
  document.getElementById("selNone").addEventListener("click", () =>
    cbs().forEach(c => { c.checked = false; }));

  // "Keskustan linjat": valitse linjat jotka kulkevat ydinkeskustan
  // solmupysäkkien (CONFIG.centerStopNames) kautta. Haetaan pysäkkien
  // linjat ja rajataan oman feedin BUS-linjoihin.
  const centerBtn = document.getElementById("selCenter");
  if (centerBtn) centerBtn.addEventListener("click", async () => {
    const status = document.getElementById("buildStatus");
    status.textContent = t("loadingCenter");
    centerBtn.disabled = true;
    try {
      const feedId = (routes[0]?.gtfsId || "").split(":")[0];
      const inFeed = id => !feedId || (id || "").startsWith(feedId + ":");
      const sets = await Promise.all((CONFIG.centerStopNames || []).map(n =>
        gql(`query ($n: String) { stops(name: $n) { gtfsId routes { gtfsId mode } } }`, { n })
          .then(d => d.stops || []).catch(() => [])));
      const ids = new Set();
      for (const stops of sets)
        for (const st of stops) {
          if (!inFeed(st.gtfsId)) continue;
          for (const r of st.routes || [])
            if (r.mode === "BUS" && inFeed(r.gtfsId)) ids.add(r.gtfsId);
        }
      cbs().forEach(c => { c.checked = ids.has(c.value); });
      status.textContent = t("selectedCount", { n: ids.size });
    } catch (e) {
      status.textContent = "";
    } finally { centerBtn.disabled = false; }
  });

  document.getElementById("buildBtn").addEventListener("click", async () => {
    const mySeq = viewSeq;
    const status = document.getElementById("buildStatus");
    const selected = cbs().filter(c => c.checked).map(c => c.value);
    if (!selected.length) { status.textContent = t("noLinesSelected"); return; }
    const date = document.getElementById("bookletDate").value || today;
    const dirChoice = document.getElementById("dirSel").value;
    let dayKeys = [...document.querySelectorAll(".dtCb:checked")].map(c => c.value);
    if (!dayKeys.length) dayKeys = ["weekday"];
    const dts = dayTypeDates(date).filter(d => dayKeys.includes(d.key)); // vain otsikkoyhteenvetoon
    // Kuuluuko ajopäivä-lohko (dows) valittuihin ämpäreihin? weekday=Ma–Pe, sat=La, sun=Su.
    const bucketMatch = (dows) => dayKeys.some(k =>
      k === "weekday" ? [...dows].some(d => d <= 4) : k === "sat" ? dows.has(5) : dows.has(6));
    let done = 0;
    const setStatus = () => { status.textContent = t("buildingBooklet", { done, total: selected.length }); };
    setStatus();

    // Pää-pattern per suunta TULEVIEN vuorojen mukaan (ei kaikkien aikojen) —
    // muuten vanha kausivariantti voisi tuottaa tyhjän vihon.
    const probe = activeProbeDates();
    const probeAliases = probe.map((d, i) => `p${i}: tripsForDate(serviceDate: "${d}") { gtfsId }`).join(" ");
    const upcoming = p => probe.reduce((n, _, i) => n + ((p["p" + i] || []).length), 0);

    const sections = await mapLimit(selected, 4, async (routeId) => {
      try {
        const ids = await lineIds(routeId);
        const { data } = await cachedGql("proute:" + ids.join(","),
          `query ($ids: [String]) {
             routes(ids: $ids) {
               gtfsId shortName longName@L color textColor
               patterns { code name directionId ${probeAliases} stops { gtfsId name@L } }
             }
           }`, { ids });
        const routesArr = (data.routes || []).filter(Boolean);
        const route = routesArr.find(r => r.gtfsId === routeId) || routesArr[0];
        if (!route) return null;
        const patterns = routesArr.flatMap(r => r.patterns || []);  // suunnat unioniin
        const byDir = new Map();
        for (const p of patterns) {
          const k = p.directionId ?? 0;
          if (!byDir.has(k)) byDir.set(k, []);
          byDir.get(k).push(p);
        }
        let primaries = [...byDir.values()]
          .map(list => list.sort((a, b) => upcoming(b) - upcoming(a))[0]);
        if (dirChoice !== "both")
          primaries = primaries.filter(p => String(p.directionId ?? 0) === dirChoice);
        if (!primaries.length) return null;
        const dirs = await Promise.all(primaries.map(async p => {
          const stops = p.stops || [];
          const label = stops.length
            ? `${stops[0].name} → ${stops[stops.length - 1].name}` : (p.name || "");
          // Vuorot ryhmiteltynä todellisten ajopäivien mukaan; suodata valittuihin
          // päivätyyppi-ämpäreihin (weekday=Ma–Pe, sat=La, sun=Su).
          // Suunnan kaikki variantit unioniin (monivarianttilinjat).
          const dirPats = byDir.get(p.directionId ?? 0) || [p];
          let groups = [];
          try { groups = groupTripsByDays(await dirTripsWithDays(dirPats), date); }
          catch (e) { groups = []; }
          groups = groups.filter(g => bucketMatch(g.dows));
          const dayTables = groups.length
            ? groups.map(g => `<h4 class="daytype">${esc(g.label)}</h4>${bookletTableHtml(g.trips)}`).join("")
            : `<p class="muted">${t("bookletNoData")}</p>`;
          return `<h3>${esc(label)}</h3>${dayTables}`;
        }));
        return {
          label: `${route.shortName || ""} ${route.longName}`.trim(),
          html: `<section class="card booklet-line">
            <h2>${badgeHtml(route)} ${esc(route.longName)}</h2>
            ${dirs.join("")}
          </section>`,
        };
      } catch (e) {
        return null;
      } finally {
        done++;
        if (mySeq === viewSeq) setStatus();
      }
    });
    if (mySeq !== viewSeq) return;
    const ok = sections.filter(Boolean);
    const toc = ok.map(s => `<li>${esc(s.label)}</li>`).join("");
    const out = document.getElementById("bookletOut");
    out.innerHTML = `
      <div class="card booklet-head">
        <h2>${esc(CONFIG.operator)} · ${t("bookletCoverTitle")}</h2>
        <p>${dts.map(d => esc(d.label)).join(" · ")}. ${t("bookletKeyStopsNote")}</p>
        <p class="muted">${t("bookletPeriodNote", { date: fmtDateLong(date) })}</p>
        <p class="muted">${t("printDaysNote")}</p>
        <p class="no-print buildbar"><button type="button" id="bookletPrint">${icon("print")} ${t("bookletPrintBtn")}</button>
          <button type="button" id="bookletPrintA5">${icon("print")} ${t("bookletPrintA5")}</button></p>
        <p class="no-print muted vihko-note">${t("vihkoDuplexNote")}</p>
        ${toc ? `<nav class="booklet-toc"><h3>${t("bookletToc")}</h3><ul>${toc}</ul></nav>` : ""}
      </div>
      ${ok.map(s => s.html).join("")}`;
    status.textContent = "";
    document.getElementById("bookletPrintA5")?.addEventListener("click", printVihko);
    document.getElementById("bookletPrint")?.addEventListener("click", () => {
      runPrintJob(t("printPreparing"), () => {
        setPageOrientation("portrait");
        const done = () => { hidePrintPrep(); window.removeEventListener("afterprint", done); };
        window.addEventListener("afterprint", done);
        window.print();
      });
    });
    out.scrollIntoView({ behavior: "smooth", block: "start" });
  });
}

async function route() {
  // Polkuosa "/"-jaettuna + valinnainen ?-kyselyosa (esim. #/tulosteet/vihko tai #/tulosteet?tab=vihko)
  const rawHash = location.hash.replace(/^#\/?/, "");
  const qi = rawHash.indexOf("?");
  const pathStr = qi >= 0 ? rawHash.slice(0, qi) : rawHash;
  const query = new URLSearchParams(qi >= 0 ? rawHash.slice(qi + 1) : "");
  const parts = pathStr.split("/").map(decodeURIComponent);
  if (parts[0] !== "monitori") exitMonitorMode(); // poistuttaessa kioskista palauta normaali ulkoasu
  if (parts[0] !== "palvelutiski") exitDeskMode(); // poistuttaessa palvelutiskistä palauta normaali ulkoasu
  const stripFeed = s => String(s || "").replace(/^[^:]+:/, ""); // "Lahti:3" → "3"
  track("view", parts[0] || "home");
  try {
    if (parts[0] === "asetukset") viewSettings();
    else if (parts[0] === "sahkoposti") viewEmailSub();
    else if (parts[0] === "palvelutiski") await viewServiceDesk();
    else if (parts[0] === "saavutettavuus") viewAccessibilityStatement();
    // Vanhat reitit ohjautuvat yhdistettyyn keskukseen oikealle välilehdelle (QR-yhteensopivuus):
    // #/tulosta = vihko-välilehti; bare #/tulosteet = julisteet (entinen sisältö); välilehti
    // myös polusta (#/tulosteet/<tab>) tai kyselystä (?tab=<tab>).
    else if (parts[0] === "uusintapainatus") await viewReprint();
    else if (parts[0] === "tulosta") await viewPrintCenter("vihko");
    else if (parts[0] === "tulosteet") await viewPrintCenter(query.get("tab") || parts[1] || "julisteet");
    else if (parts[0] === "reitti") await viewPlan(parts);
    else if (parts[0] === "linja" && parts[1]) { track("line", stripFeed(parts[1])); await viewRoute(parts[1], parts[2], parts[3]); }
    else if (parts[0] === "linjakartta" && parts[1]) { track("line", stripFeed(parts[1])); await viewRouteMap(parts[1]); }
    else if (parts[0] === "monitori" && parts[1]) await viewMonitor(parts[1]);
    else if (parts[0] === "kartta") await viewLiveMap();
    else if (parts[0] === "linjasto") await viewNetworkMap();
    else if (parts[0] === "laiturit") await viewHubs(parts);
    else if (parts[0] === "poikkeukset") viewExceptions();
    else if (parts[0] === "palaute") viewFeedback();
    else if (parts[0] === "liput") viewFares();
    else if (parts[0] === "junat") await viewTrains();
    else if (parts[0] === "pysakki" && parts[1]) { track("stop", stripFeed(parts[1])); await viewStop(parts[1]); }
    else await viewRoutes();
  } catch (err) {
    showError(err);
  }
}

window.addEventListener("hashchange", route);
updateChrome();
initHeaderControls();   // globaalit esteettömyys-/kielikontrollit ylätunnisteeseen (kerran)
route();

// Ilmoitukset käytössä: ensisijaisesti varmistetaan taustapush-tilaus (ja
// päivitetään seuratut linjat); jos selain ei tue pushia, käytetään etualapollausta.
if (localStorage.getItem("notifyAlerts") === "1" &&
    typeof Notification !== "undefined" && Notification.permission === "granted") {
  // Lykätään ensimaalauksen jälkeen, ettei kilpaile etusivun LCP:stä
  onIdle(() => {
    if (pushSupported()) syncPushSubscription();
    else { pollFavAlerts(false, false); startAlertPolling(); }
  });
}

// Taustalta palatessa lähtöajat päivittyvät heti, ei vasta 30 s ajastimella
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  try { refreshNow?.(); } catch (e) {}
  pollFavAlerts(false);
  // Kioskinäkymässä näytön valvelukko vapautuu taustalla → pyydä uudelleen
  if (document.body.classList.contains("monitor-mode") && !monitorWakeLock) requestWakeLock();
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

// Tulostuksen jälkeen sivun suunta takaisin pystyyn (vaaka on vain
// koko pysäkkimatriisin tulostusta varten)
window.addEventListener("afterprint", () => setPageOrientation("portrait"));
</script>

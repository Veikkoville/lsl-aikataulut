    <rect x="30.5" y="31" width="39" height="24" rx="5" fill="#0b3d91"/>
    <circle cx="34" cy="65.5" r="3.2" fill="#0b3d91"/>
    <circle cx="66" cy="65.5" r="3.2" fill="#0b3d91"/>
    <rect x="44" y="64" width="12" height="3" rx="1.5" fill="#0b3d91" opacity=".35"/>
    <rect x="29" y="76" width="11" height="8" rx="3" fill="#fff"/>

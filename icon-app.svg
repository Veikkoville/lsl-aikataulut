<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Täysreunainen (full-bleed) sovellusikoni: tausta täyttää koko neliön,
       bussi keskitetty maskable-turva-alueelle (~80 %). Käytetään PWA:n
       kotinäyttöikonina (any + maskable) ja iOS:n apple-touch-iconina. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d63cf"/>
      <stop offset="1" stop-color="#083d80"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <g transform="translate(50 50) scale(0.78) translate(-50 -50)">
    <rect x="20" y="20" width="60" height="50" rx="11" fill="#fff"/>
    <rect x="27" y="26" width="46" height="7" rx="3.5" fill="#9fc3ee"/>
    <rect x="27" y="38" width="21" height="15" rx="3" fill="#0a4ea3"/>
    <rect x="52" y="38" width="21" height="15" rx="3" fill="#0a4ea3"/>
    <circle cx="26.5" cy="62" r="2.6" fill="#f5b942"/>
    <circle cx="73.5" cy="62" r="2.6" fill="#f5b942"/>
    <circle cx="34" cy="73" r="8" fill="#10141c"/>
    <circle cx="66" cy="73" r="8" fill="#10141c"/>
    <circle cx="34" cy="73" r="3.4" fill="#9aa6bd"/>
    <circle cx="66" cy="73" r="3.4" fill="#9aa6bd"/>
  </g>
</svg>
